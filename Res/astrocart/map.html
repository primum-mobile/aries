  function postPerfSnapshot(reason) {
    if (!ACG_PERF_MODE) return;
    postToParent({ type: 'perf', reason: reason || 'snapshot', state: getPerfState() });
  }

  // Calibrated empirically on an M2 MacBook (1920×1080 logical), ~1040 px
  // map panel: at zoom 2.7 the visual sphere ≈ 1040 px, giving the scaling
  // relation  diameter_px ≈ 160 · 2^z  (not 256·2^z — MapLibre's globe
  // visual scale differs from its Mercator tile scale). So to target a
  // sphere that fills ``shrinkFactor`` of the shorter viewport dim:
  //     z = log2(shrinkFactor · min(W, H) / 160)
  // With minZoom: -2 on the Map so MapLibre doesn't clamp us back up.
  const GLOBE_VISUAL_SCALE = 160;
  function globeZoomForViewport(shrinkFactor = 0.96) {
    const W = window.innerWidth  || 800;
    const H = window.innerHeight || 600;
    const D = Math.min(W, H) * shrinkFactor;
    return Math.log2(D / GLOBE_VISUAL_SCALE);
  }

  function retainRuntimeOverlayStyle(previousStyle, nextStyle) {
    const retained = JSON.parse(JSON.stringify(nextStyle));
    retained.sources = Object.assign({}, retained.sources || {});
    retained.layers = Array.isArray(retained.layers) ? retained.layers.slice() : [];
    const nextLayerIds = new Set(retained.layers.map((layer) => layer && layer.id));
    for (const sourceId of RUNTIME_OVERLAY_SOURCE_IDS) {
      const source = previousStyle && previousStyle.sources && previousStyle.sources[sourceId];
      if (source && !retained.sources[sourceId]) retained.sources[sourceId] = source;
    }
    for (const layer of (previousStyle && previousStyle.layers) || []) {
      if (!layer || !RUNTIME_OVERLAY_SOURCE_IDS.has(layer.source) || nextLayerIds.has(layer.id)) continue;
      retained.layers.push(layer);
      nextLayerIds.add(layer.id);
    }
    return retained;
  }

  function replayRuntimeOverlays() {
    if (!map) return false;
    try {
      applyVectorBasemapStyle();
      ensureEclipseLayers();
      ensureAsterismLayer();
      ensureAcgLayers();
      const allSceneParts = { data: true, asterism: true, eclipse: true };
      if (runtimeOverlaySceneDeferred()) {
        deferRuntimeOverlayScene(allSceneParts, { fit: false });
        return true;
      }
      applyRuntimeOverlayScene(allSceneParts, {
        fit: false,
        reason: 'style-replay',
      });
      syncParanVisibility();
      syncAsterismVisibility();
      raiseAcgLayers();
      return !!(
        map.getLayer('acg-lines-solid') &&
        map.getLayer('acg-reference-asc') &&
        map.getLayer('acg-asterisms') &&
        map.getLayer('eclipse-path-center')
      );
    } catch (_) {
      return false;
    }
  }

  function scheduleRuntimeOverlayReplay(attempt = 0) {
    if (!mapHostActive) return;
    if (runtimeOverlayReplayTimer) window.clearTimeout(runtimeOverlayReplayTimer);
    runtimeOverlayReplayTimer = window.setTimeout(() => {
      runtimeOverlayReplayTimer = null;
      if (replayRuntimeOverlays()) return;
      if (attempt < 24) scheduleRuntimeOverlayReplay(attempt + 1);
    }, attempt === 0 ? 0 : Math.min(250, 20 * attempt));

    pendingOnlineBasemapStyle = null;

          setPerfTileSource('minimal');
          armFallbackTimer();
          try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        }
        return;
      }
      if (USE_LOCAL_BASEMAP && event && event.sourceId === 'protomaps') {
        USE_LOCAL_BASEMAP = false;
        USE_MINIMAL_BASEMAP = true;
        fallbackStylePending = true;
        setPerfTileSource('minimal');
        armFallbackTimer();
        try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        return;
      }
      if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP) {
        const sourceId = String(event && event.sourceId || '');
        // Once the online style has loaded, keep it. Individual tile/glyph
        // errors and style-validation warnings must never replace the online
        // design with the deliberately sparse emergency map. Only a confirmed
        // failure from one of the online basemap sources may trigger fallback.
        if (!mapReady && ONLINE_BASEMAP_SOURCE_IDS.has(sourceId)) switchToOfflineFallback();
      }
    });
    curveRefinement = window.createAriesCurveRefinement({
      createWorker: () => new Worker('curve-worker.js?revision=' + encodeURIComponent(URL_THEME.get('revision') || '')),
      publish: () => {
        if (!runtimeOverlaySceneDeferred()) applyRuntimeOverlayScene({ data: true }, { reason: 'curve-refinement' });
      },
    });
    mapRuler = window.createAriesMapRuler({
      map, pick: pickRulerLine, resolve: resolveRulerLine, project: projectRulerCoordinate,
      dragThreshold: MAP_CLICK_TOLERANCE,
      onDiagnostic: (detail) => postToParent({ type: 'ruler-diagnostic', detail }),
      onEnabledChange: (enabled) => {
        configureRuler({ enabled });
        postToParent({ type: 'ruler', enabled });
      },
    });
    configureRuler(rulerOptions);
    mapRuler.setActive(mapHostActive);
    map.on('contextmenu', onMapContextMenu);
    map.on('click', hideContextMenu);
    map.on('render', () => {
      if (ACG_PERF_MODE) recordRenderFrame();
      renderPolarOverlay();
    });
    map.on('movestart', () => {
      mapRuler?.setParanHover(false);
      beginMapMotion('move');
    });
    map.on('zoomstart', () => {
      beginMapMotion('zoom');
    });
    map.on('move', () => {
      if (ACG_PERF_MODE) perfState.moveEvents += 1;
    });
    map.on('zoom', () => {
      if (ACG_PERF_MODE) perfState.zoomEvents += 1;
    });
    map.on('resize', () => {
      if (ACG_PERF_MODE) perfState.resizeEvents += 1;
      scheduleCurveRefinement();
    });
    map.on('moveend', () => {
      const motionSettled = endMapMotion('move');
      if (motionSettled) flushRetainedRuntimeOverlayScene('moveend');
      if (motionSettled) postPerfSnapshot('moveend');
      if (motionSettled) scheduleCurveRefinement();
      if (motionSettled) scheduleAcgChipAnchors();
      scheduleViewStatePost('moveend');
    });
    map.on('zoomend', () => {
      const motionSettled = endMapMotion('zoom');
      if (motionSettled) flushRetainedRuntimeOverlayScene('zoomend');
      if (motionSettled) postPerfSnapshot('zoomend');
      if (motionSettled) scheduleCurveRefinement();
    });
    wireControlsOnce();
    setStatus('map ready');
  }

  function revealMapAfterStyledPaint() {
    const mapEl = document.getElementById('map');
    if (!mapEl || !mapEl.classList.contains('map-booting')) return;
    const reveal = () => {
      mapEl.classList.remove('map-booting');
      mapPresented = true;
      postToParent({ type: 'presented' });
    };
    if (map && typeof map.once === 'function') {
      let rendered = 0;
      const afterRender = () => {
        rendered += 1;
        if (rendered < 2) {
          map.once('render', afterRender);
          if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
          return;
        }
        window.requestAnimationFrame(reveal);
      };
      map.once('render', afterRender);
      if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
      return;
    }
    window.requestAnimationFrame(reveal);
  }

  function hideMapUntilStyledPaint() {
    const mapEl = document.getElementById('map');
    if (mapEl) mapEl.classList.add('map-booting');
  }

  function showMapUnavailable(message) {
    setPerfTileSource('none');
    postPerfSnapshot('map-unavailable');
    const container = document.getElementById('map');
    if (container) {
      container.classList.remove('map-booting');
      container.innerHTML = `<div style="padding:14px;color:var(--chrome-dim);font-size:12px">${message}</div>`;
    }
    mapPresented = true;
    postToParent({ type: 'presented' });
    setStatus(message);
  }

  function bootMap() {
    if (URL_THEME.get('offline') === '1') {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    // Fetch the provider style ourselves so its light default background never
    // reaches MapLibre. buildStyle() themes this cached object before the WebGL
    // map exists, keeping the first globe frame native to the active theme.
    USE_LOCAL_BASEMAP = false;
    USE_MINIMAL_BASEMAP = false;
    onlineBasemapAdopted = true;
    pendingOnlineBasemapStyle = null;
    setPerfTileSource('online');
    setStatus('loading map…');
    loadBaseVectorStyle(8000)
      .then(() => initMap())
      .catch(() => {
        USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
        USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
        onlineBasemapAdopted = false;
        setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
        setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
        initMap();
      });
  }

  function acgLineColorExpression(s) {
    return [
      'case',
      ['has', 'color'], ['get', 'color'],
      ['match', ['get', 'kind'],
        'MC', s.fallbackMcColor,
        'IC', s.fallbackIcColor,
        'ASC', s.fallbackAscColor,
        'DSC', s.fallbackDscColor,
        s.fallbackUnknownColor,
      ],
    ];
  }

  function scaledPointLineMetric(baseValue, property) {
    return ['*', baseValue, ['number', ['get', property], 1]];
  }

  function acgLayerOpacityScaleExpression(settings = currentDevSettings()) {
    return [
      'match',
      ['coalesce', ['get', 'astrocart_layer'], 'natal'],
      'transit', settings.transitLayerOpacity,
      'progression', settings.progressionLayerOpacity,
      1,
    ];
  }

  function acgLayerOpacityScale(properties) {
    const settings = currentDevSettings();
    const role = normalizedAcgLayerRole(properties);
    if (role === 'transit') return settings.transitLayerOpacity;
    if (role === 'progression') return settings.progressionLayerOpacity;
    return 1;
  }

  function scaledPointLayerOpacity(baseValue, property) {
    return [
      '*',
      baseValue,
      ['number', ['get', property], 1],
      acgLayerOpacityScaleExpression(),
    ];
  }

  function localizedTechniqueLabelExpression() {
    const labels = uiLabels.techniqueLabels && typeof uiLabels.techniqueLabels === 'object'
      ? uiLabels.techniqueLabels
      : {};
    const fallback = [
      'case',
      ['==', ['get', 'astrocart_layer'], 'transit'],
      String(uiLabels.transitLayer || ''),
      ['==', ['get', 'astrocart_layer'], 'progression'],
      String(uiLabels.progressionLayer || ''),
      '',
    ];
    const expression = ['match', ['coalesce', ['get', 'astrocart_technique'], '']];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(fallback);
    return expression.length > 3 ? expression : fallback;
  }

  function acgLayerPrefixExpression() {
    const techniqueLabel = localizedTechniqueLabelExpression();
    return [
      'case',
      ['!=', techniqueLabel, ''],
      ['concat', '[', techniqueLabel, '] '],
      [
        'all',
        ['has', 'layer_label'],
        ['!=', ['get', 'layer_label'], ''],
      ],
      ['concat', '[', ['get', 'layer_label'], '] '],
      '',
    ];
  }

  function localizedPointLabelExpression(pointProperty, labelProperty) {
    const labels = uiLabels.pointLabels && typeof uiLabels.pointLabels === 'object'
      ? uiLabels.pointLabels
      : {};
    const fallback = [
      'coalesce',
      ['get', labelProperty || 'label'],
      ['get', pointProperty || 'point'],
      '',
    ];
    const expression = ['match', ['coalesce', ['get', pointProperty || 'point'], '']];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(fallback);
    return expression.length > 3 ? expression : fallback;
  }

  function localizedPointLabel(properties, pointProperty = 'point', labelProperty = 'label') {
    const p = properties || {};
    const labels = uiLabels.pointLabels && typeof uiLabels.pointLabels === 'object'
      ? uiLabels.pointLabels
      : {};
    const pointId = String(p[pointProperty] || '');
    return String(labels[pointId] || p[labelProperty] || pointId || '').trim();
  }

  function localizedAspectLabelExpression() {
    const labels = uiLabels.aspectLabels && typeof uiLabels.aspectLabels === 'object'
      ? uiLabels.aspectLabels
      : {};
    const expression = [
      'match',
      ['coalesce', ['get', 'aspect_key'], ['get', 'aspect_id'], ''],
    ];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(['coalesce', ['get', 'aspect_name'], String(uiLabels.aspect || ''), '']);
    return expression.length > 3
      ? expression
      : ['coalesce', ['get', 'aspect_name'], String(uiLabels.aspect || ''), ''];
  }

  function localizedAspectLabel(properties) {
    const p = properties || {};
    const labels = uiLabels.aspectLabels && typeof uiLabels.aspectLabels === 'object'
      ? uiLabels.aspectLabels
      : {};
    const key = String(p.aspect_key || p.aspect_id || '');
    return String(labels[key] || labels[String(p.aspect_id || '')] || uiLabels.aspect || '');
  }

  // Line labels read "<point> <suffix>"; glyph mode (ACG Appearance) swaps the
  // point name for its Morinus glyph, drawn as an inline image.
  function acgLineLabelGlyphs() {
    return !!referenceBehavior().lineLabelGlyphs;
  }

  // ACG Appearance can show the bearing degrees on Local Space labels (off by default).
  function acgLocalSpaceBearings() {
    return referenceBehavior().localSpaceBearings === true;
  }

  function acgLineLabelSuffixExpression() {
    const bearing = acgLocalSpaceBearings()
      ? ['coalesce', ['get', 'bearing_label'], ['to-string', ['get', 'source_bearing']], '']
      : '';
    return [
      'case',
      ['any', ['==', ['get', 'kind'], 'LOCAL_SPACE'], ['==', ['get', 'kind'], 'LOCAL_SPACE_OPPOSITION']],
      bearing,
      ['==', ['get', 'kind'], 'ASPECT'],
      [
        'concat',
        localizedAspectLabelExpression(),
        ' ',
        ['coalesce', ['get', 'target_angle'], ''],
      ],
      ['get', 'kind'],
    ];
  }

  function acgNamedLabelExpression(suffix) {
    return [
      'concat',
      acgLayerPrefixExpression(),
      localizedPointLabelExpression('point', 'label'),
      ['case', ['==', suffix, ''], '', ['concat', ' ', suffix]],
    ];
  }

  // Local Space opposition labels end with the daemon-supplied Morinus
  // opposition glyph (aspect_glyph_morinus). The vector text font has no
  // Morinus face, so the glyph is an inline image in the label's text colour.
  function acgLineLabelExpression(print = false) {
    const named = acgNamedLabelExpression(acgLineLabelSuffixExpression());
    return [
      'case',
      acgHasGlyphExpression('aspect_glyph_morinus'),
      [
        'format',
        named, {},
        ' ', {},
        ['image', ['concat', acgInlineGlyphImagePrefix(print), ['get', 'aspect_glyph_morinus']]], {},
      ],
      ['format', named, {}],
    ];
  }

  const ACG_INLINE_GLYPH_PREFIX = 'acg-inline-glyph';

  function acgInlineGlyphImagePrefix(print) {
    const s = currentDevSettings();
    const t = currentThemeTokens();
    return [
      ACG_INLINE_GLYPH_PREFIX,
      s.labelSize,
      print ? PRINT_ATLAS_LABEL_COLOR : t.labelColor,
      print ? PRINT_ATLAS_OVERLAY_HALO : t.labelHalo,
      s.labelHaloOn ? s.labelHaloWidth : 0,
      acgChipToken('--chrome-font-symbols', "'Morinus', serif"),
    ].join(ACG_CHIP_SEPARATOR) + ACG_CHIP_SEPARATOR;
  }

  function drawAcgInlineGlyphImage(id, pixelRatio) {
    const parts = String(id || '').split(ACG_CHIP_SEPARATOR);
    if (parts.length !== 7 || parts[0] !== ACG_INLINE_GLYPH_PREFIX) return null;
    const [, sizeText, color, haloColor, haloText, fontSymbols, glyph] = parts;
    const size = Number(sizeText) * 1.2;
    const haloWidth = Number(haloText) || 0;
    if (!glyph || !Number.isFinite(size) || size <= 0) return null;
    const ratio = Math.max(1, Math.min(4, Number(pixelRatio) || 1));
    const box = Math.ceil((size + haloWidth * 2 + 2) * ratio);
    const canvas = document.createElement('canvas');
    canvas.width = box;
    canvas.height = box;
    const context = canvas.getContext('2d');
    if (!context) return null;
    context.font = `${size * ratio}px ${fontSymbols}`;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    if (haloWidth > 0) {
      context.lineJoin = 'round';
      context.strokeStyle = haloColor;
      context.lineWidth = haloWidth * 2 * ratio;
      context.strokeText(glyph, box / 2, box / 2);
    }
    context.fillStyle = color;
    context.fillText(glyph, box / 2, box / 2);
    return {
      image: { width: box, height: box, data: context.getImageData(0, 0, box, box).data },
      options: { pixelRatio: ratio },
    };
  }

  // Draw only with the real Morinus face; a fallback font would cache wrong
  // shapes under this id.
  function provideAcgInlineGlyphImage(targetMap, id, pixelRatio) {
    if (!targetMap || typeof id !== 'string' || !id.startsWith(ACG_INLINE_GLYPH_PREFIX + ACG_CHIP_SEPARATOR)) return;
    if (targetMap.hasImage(id)) return;
    const install = () => {
      if (targetMap.hasImage(id)) return;
      const drawn = drawAcgInlineGlyphImage(id, pixelRatio);
      if (drawn) targetMap.addImage(id, drawn.image, drawn.options);
    };
    if (document.fonts && !document.fonts.check('12px Morinus')) {
      document.fonts.load('12px Morinus').then(install, install);
      return;
    }
    install();
  }

  function acgZenithLabelExpression() {
    return acgNamedLabelExpression(String(uiLabels.zenith || '').trim());
  }

  // Glyph mode draws each label as an upright chip: a small card carrying the
  // point's Morinus glyph in its line colour beside the angle. Chips are
  // MapLibre icons drawn on demand (styleimagemissing), so the renderer keeps
  // collision, spacing and print capture; the image id carries everything the
  // drawing needs, so a restyle yields new ids instead of stale pixels.
  const ACG_CHIP_PREFIX = 'acg-chip';
  const ACG_CHIP_SEPARATOR = '\u001f';
  const ACG_CHIP_LAYER_IDS = ['acg-labels', 'acg-zenith-labels', 'acg-paran-labels'];
  // Line and paran chips are points on their own source: one per feature, at
  // half the line's longest on-screen run, recomputed when the camera settles.
  const ACG_CHIP_SOURCE_ID = 'acg-chip-anchors';
  const ACG_CHIP_ANCHOR_LAYERS = [
    ['acg-chip-labels', 'acg-labels'],
    ['acg-chip-paran-labels', 'acg-paran-labels'],
  ];
  const ACG_CHIP_ANCHOR_KINDS = new Set([
    'MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE', 'LOCAL_SPACE_OPPOSITION', 'ASPECT', 'PARAN',
  ]);
  const ACG_CHIP_MIN_RUN_PX = 48;

  // Chips wear the map chrome (the zoom, projection and legend controls):
  // chrome background, chrome hairline, chrome text. Only the glyph carries
  // the point's colour. Tokens live on body, where the style profile sets them.
  function acgChipToken(name, fallback) {
    try {
      const value = getComputedStyle(document.body).getPropertyValue(name).trim();
      if (value) return value;
    } catch (_) {}
    return fallback;
  }

  function acgChipTokens(print) {
    return {
      text: print ? PRINT_ATLAS_LABEL_COLOR : acgChipToken('--chrome-text', '#e2e3e6'),
      background: print ? PRINT_ATLAS_OVERLAY_HALO : acgChipToken('--chrome-bg', 'rgba(29,30,33,0.88)'),
      border: print ? 'rgba(0,0,0,0.12)' : acgChipToken('--chrome-border', 'rgba(255,255,255,0.10)'),
      radius: acgChipToken('--chrome-panel-radius', '6px'),
      fontUi: acgChipToken('--chrome-font-ui', 'sans-serif'),
      fontSymbols: acgChipToken('--chrome-font-symbols', "'Morinus', serif"),
    };
  }

  // Parans are the secondary tier: many more of them than planet lines, so
  // their chips run 2px smaller, lighter and a touch translucent.
  const ACG_PARAN_CHIP_SIZE_STEP = 2;
  const ACG_PARAN_CHIP_OPACITY = 0.85;

  function acgParanChipSize(settings) {
    return Math.max(8, (Number(settings.paranLabelSize) || 11) - ACG_PARAN_CHIP_SIZE_STEP);
  }

  // print: the atlas draws dark text on light cards whatever the screen theme.
  function acgChipStyleKey(kind, print) {
    const s = currentDevSettings();
    const tokens = acgChipTokens(print);
    const size = kind === 'paran' ? acgParanChipSize(s) : s.labelSize;
    return [
      ACG_CHIP_PREFIX,
      kind,
      size,
      tokens.text,
      tokens.background,
      tokens.border,
      tokens.radius,
      tokens.fontUi,
      tokens.fontSymbols,
    ].join(ACG_CHIP_SEPARATOR) + ACG_CHIP_SEPARATOR;
  }

  function acgHasGlyphExpression(property) {
    return ['all', ['has', property], ['!=', ['get', property], '']];
  }

  function acgLineChipExpression(suffix, print = false) {
    const s = currentDevSettings();
    const hasGlyph = acgHasGlyphExpression('glyph_morinus');
    return [
      'concat',
      acgChipStyleKey('line', print),
      ['to-string', acgLineColorExpression(s)],
      ACG_CHIP_SEPARATOR,
      ['case', hasGlyph, ['get', 'glyph_morinus'], ''],
      ACG_CHIP_SEPARATOR,
      acgLayerPrefixExpression(),
      ACG_CHIP_SEPARATOR,
      [
        'case',
        hasGlyph,
        suffix,
        ['concat', localizedPointLabelExpression('point', 'label'), ' ', suffix],
      ],
      ACG_CHIP_SEPARATOR,
      ['coalesce', ['get', 'aspect_glyph_morinus'], ''],
    ];
  }

  function acgParanChipExpression(print = false) {
    const t = currentThemeTokens();
    const side = (prefix) => [
      ['case', acgHasGlyphExpression(`${prefix}_glyph_morinus`), ['get', `${prefix}_glyph_morinus`], ''],
      ACG_CHIP_SEPARATOR,
      localizedPointLabelExpression(`${prefix}_point`, `${prefix}_label`),
      ACG_CHIP_SEPARATOR,
      ['coalesce', ['get', `${prefix}_color`], ''],
      ACG_CHIP_SEPARATOR,
      ['coalesce', ['get', `${prefix}_angle`], ''],
    ];
    return [
      'concat',
      acgChipStyleKey('paran', print),
      t.paranColor,
      ACG_CHIP_SEPARATOR,
      acgLayerPrefixExpression(),
      ACG_CHIP_SEPARATOR,
      ...side('a'),
      ACG_CHIP_SEPARATOR,
      ...side('b'),
    ];
  }

  function acgChipImageExpression(layerId, print = false) {
    if (layerId === 'acg-paran-labels') return acgParanChipExpression(print);
    return acgLineChipExpression(
      layerId === 'acg-zenith-labels'
        ? String(uiLabels.zenith || '').trim()
        : acgLineLabelSuffixExpression(),
      print,
    );
  }

  const acgChipColorCache = new Map();

  function acgChipRgba(value) {
    if (!atlasColorContext || typeof value !== 'string' || !value) return null;
    atlasColorContext.clearRect(0, 0, 1, 1);
    atlasColorContext.fillStyle = '#000';
    atlasColorContext.fillStyle = value;
    atlasColorContext.fillRect(0, 0, 1, 1);
    const data = atlasColorContext.getImageData(0, 0, 1, 1).data;
    return [data[0], data[1], data[2], data[3] / 255];
  }

  function acgChipLuminance([r, g, b]) {
    const channel = (value) => {
      const c = value / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
  }

  // Line colours are chosen for strokes on the basemap; on a chip they sit on
  // the card, so a dark navy glyph on a dark card (or yellow on a print card)
  // is mixed toward the readable side until it clears 3:1 contrast.
  function acgChipReadableColor(color, background) {
    const key = `${color}\u0000${background}`;
    if (acgChipColorCache.has(key)) return acgChipColorCache.get(key);
    const fg = acgChipRgba(color);
    const bg = acgChipRgba(background);
    let result = color;
    if (fg && bg) {
      const bgLuminance = acgChipLuminance(bg);
      const target = bgLuminance < 0.4 ? 255 : 0;
      const contrast = (rgb) => {
        const l = acgChipLuminance(rgb);
        return (Math.max(l, bgLuminance) + 0.05) / (Math.min(l, bgLuminance) + 0.05);
      };
      let rgb = fg.slice(0, 3);
      for (let step = 1; step <= 10 && contrast(rgb) < 3; step += 1) {
        const mix = step / 10;
        rgb = fg.slice(0, 3).map((channel) => Math.round(channel + (target - channel) * mix));
      }
      result = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    }
    acgChipColorCache.set(key, result);
    return result;
  }

  function acgChipSegments(kind, content, labelColor, background) {
    const segment = (text, color, options = {}) => ({ text, color, ...options });
    const readable = (color) => acgChipReadableColor(color, background);
    const segments = [];
    if (kind === 'line' && content.length === 5) {
      const [color, glyph, prefix, suffix, kindGlyph] = content;
      if (prefix.trim()) segments.push(segment(prefix.trim(), labelColor, { muted: true }));
      if (glyph) segments.push(segment(glyph, readable(color || labelColor), { glyph: true }));
      if (suffix.trim()) segments.push(segment(suffix.trim(), labelColor, { tight: !!glyph }));
      if (kindGlyph) segments.push(segment(kindGlyph, labelColor, { glyph: true }));
      return { segments };
    }
    if (kind === 'paran' && content.length === 10) {
      const [paranColor, prefix, ...sides] = content;
      if (prefix.trim()) segments.push(segment(prefix.trim(), labelColor, { muted: true }));
      for (let index = 0; index < 2; index += 1) {
        const [glyph, name, color, angle] = sides.slice(index * 4, index * 4 + 4);
        if (index === 1) segments.push(segment('×', labelColor, { muted: true }));
        segments.push(glyph
          ? segment(glyph, readable(color || paranColor), { glyph: true })
          : segment(name.trim(), labelColor));
        if (angle.trim()) segments.push(segment(angle.trim(), labelColor, { tight: true }));
      }
      return { segments };
    }
    return null;
  }

  function drawAcgChipImage(id, pixelRatio) {
    const parts = String(id || '').split(ACG_CHIP_SEPARATOR);
    if (parts.length < 9 || parts[0] !== ACG_CHIP_PREFIX) return null;
    const [, kind, sizeText, labelColor, background, border, radiusText, fontUi, fontSymbols, ...content] = parts;
    const size = Number(sizeText);
    const layout = acgChipSegments(kind, content, labelColor, background);
    if (!layout || !layout.segments.length || !Number.isFinite(size) || size <= 0) return null;
    const ratio = Math.max(1, Math.min(4, Number(pixelRatio) || 1));
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    if (!context) return null;
    const secondary = kind === 'paran';
    const glyphScale = secondary ? 1.2 : 1.3;
    const textWeight = secondary ? 500 : 600;
    const fontFor = (item) => (
      item.glyph
        ? `${size * glyphScale}px ${fontSymbols}`
        : `${item.muted ? 400 : textWeight} ${item.muted ? size * 0.88 : size}px ${fontUi}`
    );
    const widths = layout.segments.map((item) => {
      context.font = fontFor(item);
      return context.measureText(item.text).width;
    });
    const gap = size * (secondary ? 0.3 : 0.34);
    const tightGap = size * 0.16;
    const padX = size * (secondary ? 0.42 : 0.5);
    const height = Math.ceil(size * glyphScale + size * (secondary ? 0.4 : 0.5));
    const contentWidth = widths.reduce((total, width, index) => (
      total + width + (index ? (layout.segments[index].tight ? tightGap : gap) : 0)
    ), 0);
    const width = Math.ceil(contentWidth + padX * 2);
    canvas.width = Math.ceil((width + 2) * ratio);
    canvas.height = Math.ceil((height + 2) * ratio);
    context.scale(ratio, ratio);
    const radius = Math.min(Number.parseFloat(radiusText) || 0, height / 2);
    context.beginPath();
    context.roundRect(1.5, 1.5, width - 1, height - 1, radius);
    context.fillStyle = background;
    context.fill();
    context.lineWidth = 1;
    context.strokeStyle = border;
    context.stroke();
    context.textBaseline = 'middle';
    context.textAlign = 'left';
    let x = 1 + padX;
    const y = 1 + height / 2;
    layout.segments.forEach((item, index) => {
      if (index) x += item.tight ? tightGap : gap;
      context.globalAlpha = item.muted ? 0.72 : 1;
      context.font = fontFor(item);
      context.fillStyle = item.color;
      context.fillText(item.text, x, y + (item.glyph ? size * 0.04 : 0));
      x += widths[index];
    });
    return {
      image: {
        width: canvas.width,
        height: canvas.height,
        data: context.getImageData(0, 0, canvas.width, canvas.height).data,
      },
      options: { pixelRatio: ratio },
    };
  }

  function provideAcgChipImage(targetMap, id, pixelRatio) {
    if (!targetMap || typeof id !== 'string' || !id.startsWith(ACG_CHIP_PREFIX + ACG_CHIP_SEPARATOR)) return;
    if (targetMap.hasImage(id)) return;
    const drawn = drawAcgChipImage(id, pixelRatio);
    if (drawn) targetMap.addImage(id, drawn.image, drawn.options);
  }

  // Chips are drawn synchronously when MapLibre asks, so glyph mode is only
  // switched on once the Morinus face is ready; a fallback font would bake
  // wrong shapes into the image cache.
  function whenAcgChipFontsReady(callback) {
    if (!document.fonts || document.fonts.check('12px Morinus')) {
      callback();
      return;
    }
    document.fonts.load('12px Morinus').then(callback, callback);
  }

  function acgChipOpacity(sourceLayerId, settings) {
    return sourceLayerId === 'acg-paran-labels'
      ? scaledPointLayerOpacity(
        (Number.isFinite(Number(settings.paranLabelOpacity)) ? Number(settings.paranLabelOpacity) : 1) *
          ACG_PARAN_CHIP_OPACITY,
        'line_opacity',
      )
      : scaledPointLayerOpacity(settings.labelOpacity, 'line_opacity');
  }

  function acgChipIconLayout(imageLayerId, print = false) {
    return {
      'icon-image': acgChipImageExpression(imageLayerId, print),
      'icon-rotation-alignment': 'viewport',
      'icon-pitch-alignment': 'viewport',
      'icon-allow-overlap': false,
      'icon-padding': 4,
    };
  }

  // Glyph-mode layout of the three label layers. Zenith chips stay on their
  // points; line and paran text goes quiet because the anchored chip layers
  // (acgChipAnchorLayout) draw those labels.
  function acgChipLayout(layerId, print = false) {
    if (layerId === 'acg-zenith-labels') {
      return {
        ...acgChipIconLayout(layerId, print),
        'text-field': '',
        'icon-anchor': 'left',
        'icon-offset': [8, 0],
      };
    }
    return { ...acgNamedLabelLayout(layerId), 'text-field': '' };
  }

  function acgChipAnchorLayout(chipLayerId, print = false) {
    const [, sourceLayerId] = ACG_CHIP_ANCHOR_LAYERS.find(([id]) => id === chipLayerId);
    return acgChipIconLayout(sourceLayerId, print);
  }

  // Chip anchors are points standing in for lines, so the mirrored line
  // filter reads the stamped source geometry instead of the point's own.
  function acgChipAnchorFilter(filter) {
    if (!Array.isArray(filter)) return filter;
    if (filter.length === 1 && filter[0] === 'geometry-type') {
      return ['get', 'acg_anchor_geometry'];
    }
    return filter.map((entry) => acgChipAnchorFilter(entry));
  }

  function acgNamedLabelLayout(layerId) {
    return {
      'text-field': layerId === 'acg-paran-labels'
        ? acgParanLabelExpression()
        : layerId === 'acg-zenith-labels'
          ? acgZenithLabelExpression()
          : acgLineLabelExpression(),
      'icon-image': undefined,
      'icon-rotation-alignment': undefined,
      'icon-pitch-alignment': undefined,
      'icon-allow-overlap': undefined,
      'icon-padding': undefined,
      'icon-anchor': undefined,
      'icon-offset': undefined,
    };
  }

  function acgLabelPresentationLayout(layerId, print = false) {
    return acgLineLabelGlyphs()
      ? acgChipLayout(layerId, print)
      : acgNamedLabelLayout(layerId);
  }

  function applyAcgLabelPresentation() {
    const apply = () => {
      if (!map) return;
      for (const [chipLayerId, sourceLayerId] of ACG_CHIP_ANCHOR_LAYERS) {
        if (!map.getLayer(chipLayerId)) continue;
        for (const [property, value] of Object.entries(acgChipAnchorLayout(chipLayerId))) {
          map.setLayoutProperty(chipLayerId, property, value);
        }
        map.setPaintProperty(
          chipLayerId,
          'icon-opacity',
          acgChipOpacity(sourceLayerId, currentDevSettings()),
        );
      }
      scheduleAcgChipAnchors();
      for (const layerId of ACG_CHIP_LAYER_IDS) {
        if (!map.getLayer(layerId)) continue;
        for (const [property, value] of Object.entries(acgLabelPresentationLayout(layerId))) {
          map.setLayoutProperty(layerId, property, value);
        }
        map.setPaintProperty(
          layerId,
          'icon-opacity',
          scaledPointLayerOpacity(
            layerId === 'acg-paran-labels'
              ? currentDevSettings().paranLabelOpacity
              : currentDevSettings().labelOpacity,
            'line_opacity',
          ),
        );
      }
    };
    if (acgLineLabelGlyphs()) whenAcgChipFontsReady(apply);
    else apply();
  }

  function acgChipCameraWindow(targetMap) {
    const bounds = targetMap.getBounds();
    const center = targetMap.getCenter();
    const spanLat = Math.max(0.001, bounds.getNorth() - bounds.getSouth());
    const spanLon = Math.max(0.001, Math.min(360, bounds.getEast() - bounds.getWest()));
    const pad = Math.max(spanLat, spanLon) * 0.1;
    let globe = false;
    try {
      const projection = targetMap.getProjection && targetMap.getProjection();
      globe = !!projection && projection.type === 'globe';
    } catch (_) {}
    return {
      center,
      globe,
      west: bounds.getWest() - pad,
      east: bounds.getEast() + pad,
      south: bounds.getSouth() - pad,
      north: bounds.getNorth() + pad,
      // Sample finely enough that a line crossing only a corner of the view
      // still yields a run, without densifying off-screen stretches.
      step: Math.max(0.005, Math.min(1.5, Math.min(spanLat, spanLon) / 24)),
    };
  }

  // Screen rectangle chips may occupy: the live map keeps clear of the
  // titlebar, toolbar and mode bar; a print page uses its whole frame.
  function acgChipScreenRect(targetMap, print) {
    const container = targetMap.getContainer();
    const width = container.clientWidth || 1;
    const height = container.clientHeight || 1;
    if (print) return { left: 12, top: 12, right: width - 12, bottom: height - 12 };
    const safeTop = Number.parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--titlebar-safe-top'),
    ) || 0;
    return { left: 24, top: safeTop + 56, right: width - 24, bottom: height - 56 };
  }

  // Parameter interval [t0, t1] of segment a→b (raw lon/lat, linear in t)
  // inside the camera window, for each world copy near the view.
  function acgChipSegmentWindows(a, b, camera) {
    const windows = [];
    const dLon = b[0] - a[0];
    const dLat = b[1] - a[1];
    const axis = (start, delta, low, high) => {
      if (Math.abs(delta) < 1e-12) return start >= low && start <= high ? [0, 1] : null;
      const t0 = (low - start) / delta;
      const t1 = (high - start) / delta;
      return [Math.max(0, Math.min(t0, t1)), Math.min(1, Math.max(t0, t1))];
    };
    const latitude = axis(a[1], dLat, camera.south, camera.north);
    if (!latitude || latitude[0] > latitude[1]) return windows;
    for (const shift of [-360, 0, 360]) {
      const longitude = axis(a[0] + shift, dLon, camera.west, camera.east);
      if (!longitude) continue;
      const t0 = Math.max(latitude[0], longitude[0]);
      const t1 = Math.min(latitude[1], longitude[1]);
      if (t0 <= t1) windows.push({ shift, t0, t1 });
    }
    return windows.sort((left, right) => left.t0 - right.t0);
  }

  // Screen-space runs of the feature inside the chip rectangle. Segments are
  // read as drawn (a paran is one −180→180 segment), clipped to the view
  // before sampling so zoom level never starves a short visible stretch.
  function acgChipVisibleRuns(targetMap, feature, camera, rect) {
    const runs = [];
    let run = null;
    const close = () => {
      if (run && run.points.length >= 2) runs.push(run);
      run = null;
    };
    const jumpLimit = (rect.right - rect.left) / 2;
    for (const line of geometrySegments(feature.geometry)) {
      close();
      let continuation = null;
      for (let index = 1; index < line.length; index += 1) {
        const a = [Number(line[index - 1][0]), Number(line[index - 1][1])];
        const b = [Number(line[index][0]), Number(line[index][1])];
        if (!a.every(Number.isFinite) || !b.every(Number.isFinite)) {
          close();
          continuation = null;
          continue;
        }
        const windows = acgChipSegmentWindows(a, b, camera);
        if (!windows.length) {
          close();
          continuation = null;
          continue;
        }
        for (const window of windows) {
          if (!(continuation === window.shift && window.t0 === 0)) close();
          const span = Math.max(
            Math.abs(b[0] - a[0]),
            Math.abs(b[1] - a[1]),
          ) * (window.t1 - window.t0);
          const steps = Math.min(2000, Math.max(1, Math.ceil(span / camera.step)));
          for (let step = 0; step <= steps; step += 1) {
            const t = window.t0 + (window.t1 - window.t0) * (step / steps);
            const coordinate = [
              a[0] + window.shift + (b[0] - a[0]) * t,
              a[1] + (b[1] - a[1]) * t,
            ];
            if (camera.globe && !isPolarCoordinateVisible(coordinate, camera.center, targetMap)) {
              close();
              continue;
            }
            let point;
            try { point = targetMap.project(coordinate); } catch (_) { point = null; }
            if (
              !point || !Number.isFinite(point.x) || !Number.isFinite(point.y) ||
              point.x < rect.left || point.x > rect.right ||
              point.y < rect.top || point.y > rect.bottom
            ) {
              close();
              continue;
            }
            const last = run && run.points[run.points.length - 1];
            if (last && Math.hypot(point.x - last.x, point.y - last.y) > jumpLimit) close();
            if (!run) run = { points: [], length: 0 };
            else run.length += Math.hypot(point.x - last.x, point.y - last.y);
            run.points.push({ x: point.x, y: point.y });
          }
          continuation = window.t1 === 1 ? window.shift : null;
        }
      }
    }
    close();
    return runs;
  }

  function acgChipRunPosition(run, fraction) {
    const target = run.length * fraction;
    let walked = 0;
    for (let index = 1; index < run.points.length; index += 1) {
      const a = run.points[index - 1];
      const b = run.points[index];
      const segment = Math.hypot(b.x - a.x, b.y - a.y);
      if (walked + segment >= target && segment > 0) {
        const t = (target - walked) / segment;
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
      walked += segment;
    }
    return run.points[run.points.length - 1];
  }

  // Fraction along the run of the point nearest `point`, with its distance.
  function acgChipRunFraction(run, point) {
    let best = { distance: Infinity, fraction: 0 };
    let walked = 0;
    for (let index = 1; index < run.points.length; index += 1) {
      const a = run.points[index - 1];
      const b = run.points[index];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const segment = Math.hypot(dx, dy);
      const t = segment > 0
        ? Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (segment * segment)))
        : 0;
      const distance = Math.hypot(a.x + dx * t - point.x, a.y + dy * t - point.y);
      if (distance < best.distance) {
        best = { distance, fraction: run.length > 0 ? (walked + segment * t) / run.length : 0 };
      }
      walked += segment;
    }
    return best;
  }

  function acgChipLongestRun(targetMap, feature, camera, rect) {
    const run = acgChipVisibleRuns(targetMap, feature, camera, rect).reduce((best, current) => (
      !best || current.length > best.length ? current : best
    ), null);
    return run && run.length >= ACG_CHIP_MIN_RUN_PX ? run : null;
  }

  function acgChipAnchorKey(properties, index) {
    return String(properties.label_id || `feature:${index}`);
  }

  // Screen box a chip will occupy, estimated from its text so placement can
  // steer chips apart before MapLibre's collision pass would drop one.
  function acgChipEstimatedBox(properties, point) {
    const settings = currentDevSettings();
    const paran = properties.kind === 'PARAN';
    const size = Number(paran ? acgParanChipSize(settings) : settings.labelSize) || 11;
    const textWidth = (text) => String(text || '').trim().length * size * 0.62;
    const glyphWidth = size * (paran ? 1.2 : 1.3);
    let width = size + textWidth(acgLayerPrefixText(properties));
    if (paran) {
      for (const side of ['a', 'b']) {
        width += properties[`${side}_glyph_morinus`]
          ? glyphWidth
          : textWidth(localizedPointLabel(properties, `${side}_point`, `${side}_label`));
        width += textWidth(properties[`${side}_angle`]) + size * 0.5;
      }
      width += size;
    } else {
      const glyph = !!properties.glyph_morinus;
      width += (glyph ? glyphWidth : 0) +
        (properties.aspect_glyph_morinus ? glyphWidth + size * 0.34 : 0) +
        textWidth(acgFeatureLabelText(properties, glyph ? { glyphMode: true } : { withoutPrefix: true })) +
        size * 0.5;
    }
    const height = size * 1.8 + 2;
    return {
      left: point.x - width / 2,
      right: point.x + width / 2,
      top: point.y - height / 2,
      bottom: point.y + height / 2,
    };
  }

  function acgChipBoxesOverlap(a, b, margin = 4) {
    return a.left < b.right + margin && a.right + margin > b.left &&
      a.top < b.bottom + margin && a.bottom + margin > b.top;
  }

  const ACG_CHIP_FRACTIONS = [0.5, 0.38, 0.62, 0.26, 0.74, 0.14, 0.86];
  // Local Space lines radiate from the birthplace, so their chips ring it at
  // one screen radius; a crowded spoke steps along its own line, out or in,
  // so near-parallel spokes (a conjunction) offset their pills instead of
  // one hiding the other.
  const ACG_CHIP_RADIAL_KINDS = new Set(['LOCAL_SPACE', 'LOCAL_SPACE_OPPOSITION']);
  const ACG_CHIP_RADIAL_BANDS = [
    1, 1.24, 0.8, 1.48, 0.62, 1.72, 1.96, 0.5, 2.2, 2.44, 0.4, 2.68, 2.92, 3.2, 3.5,
  ];
  const ACG_CHIP_RADIUS_SHARE = 0.3;

  // Screen position of the birthplace when it is on screen, with the ring
  // radius the chips sit on.
  function acgChipRadialOrigin(targetMap, data, rect) {
    const coordinate = birthplaceCoordinates(data);
    if (!coordinate) return null;
    let center = null;
    try { center = targetMap.getCenter(); } catch (_) { return null; }
    let projection = null;
    try { projection = targetMap.getProjection && targetMap.getProjection(); } catch (_) {}
    if (
      projection && projection.type === 'globe' &&
      !isPolarCoordinateVisible(coordinate, center, targetMap)
    ) return null;
    let point = null;
    try { point = targetMap.project(coordinate); } catch (_) { return null; }
    if (
      !point || point.x < rect.left || point.x > rect.right ||
      point.y < rect.top || point.y > rect.bottom
    ) return null;
    const radius = ACG_CHIP_RADIUS_SHARE *
      Math.min(rect.right - rect.left, rect.bottom - rect.top);
    return { x: point.x, y: point.y, radius };
  }

  // First point along the run at `radius` screen pixels from the origin.
  function acgChipRunPointAtRadius(run, origin, radius) {
    let previous = run.points[0];
    let previousDistance = Math.hypot(previous.x - origin.x, previous.y - origin.y);
    for (let index = 1; index < run.points.length; index += 1) {
      const point = run.points[index];
      const distance = Math.hypot(point.x - origin.x, point.y - origin.y);
      if ((previousDistance - radius) * (distance - radius) <= 0 && distance !== previousDistance) {
        const t = (radius - previousDistance) / (distance - previousDistance);
        return {
          x: previous.x + (point.x - previous.x) * t,
          y: previous.y + (point.y - previous.y) * t,
        };
      }
      previous = point;
      previousDistance = distance;
    }
    return null;
  }

  // Candidate chip positions in preference order: the ring for spokes from
  // the birthplace, otherwise the middle of the visible run moving outward.
  function acgChipCandidatePoints(properties, run, origin) {
    const points = [];
    if (origin && ACG_CHIP_RADIAL_KINDS.has(properties.kind)) {
      for (const band of ACG_CHIP_RADIAL_BANDS) {
        const point = acgChipRunPointAtRadius(run, origin, origin.radius * band);
        if (point) points.push(point);
      }
      if (points.length) return points;
    }
    for (const fraction of ACG_CHIP_FRACTIONS) {
      points.push(acgChipRunPosition(run, fraction));
    }
    return points;
  }

  // options.shown(properties) says which chips will actually draw; only those
  // reserve room, so a hidden feature never pushes a visible chip aside.
  function computeAcgChipAnchors(targetMap, data, options = {}) {
    const features = [];
    if (!targetMap || !data || !Array.isArray(data.features)) return features;
    const camera = acgChipCameraWindow(targetMap);
    const rect = acgChipScreenRect(targetMap, !!options.print);
    const memory = options.memory || null;
    const shown = typeof options.shown === 'function' ? options.shown : () => true;
    const origin = acgChipRadialOrigin(targetMap, data, rect);
    const entries = [];
    data.features.forEach((feature, index) => {
      const properties = feature && feature.properties || {};
      if (!ACG_CHIP_ANCHOR_KINDS.has(properties.kind)) return;
      const run = acgChipLongestRun(targetMap, feature, camera, rect);
      if (!run) return;
      entries.push({
        properties,
        run,
        key: acgChipAnchorKey(properties, index),
        shown: shown(properties),
        rank: properties.kind === 'PARAN' ? 1 : 0,
      });
    });
    entries.sort((a, b) => (Number(b.shown) - Number(a.shown)) || (a.rank - b.rank));
    const placed = [];
    const seen = new Set();
    for (const entry of entries) {
      const candidates = [];
      const radial = !!origin && ACG_CHIP_RADIAL_KINDS.has(entry.properties.kind);
      // Ring chips follow the origin, so only mid-run chips keep a memory.
      const previous = memory && !radial ? memory.get(entry.key) : null;
      if (previous) {
        try {
          const point = targetMap.project(previous);
          const onRun = acgChipRunFraction(entry.run, point);
          if (onRun.distance <= 3 && onRun.fraction >= 0.3 && onRun.fraction <= 0.7) {
            candidates.push({ point, anchor: previous });
          }
        } catch (_) {}
      }
      for (const point of acgChipCandidatePoints(entry.properties, entry.run, origin)) {
        candidates.push({ point });
      }
      let choice = candidates[0];
      if (entry.shown) {
        for (const candidate of candidates) {
          const box = acgChipEstimatedBox(entry.properties, candidate.point);
          if (placed.some((other) => acgChipBoxesOverlap(box, other))) continue;
          choice = candidate;
          placed.push(box);
          break;
        }
      }
      let anchor = choice.anchor;
      if (!anchor) {
        const lngLat = targetMap.unproject([choice.point.x, choice.point.y]);
        anchor = [lngLat.lng, lngLat.lat];
      }
      seen.add(entry.key);
      if (memory) memory.set(entry.key, anchor);
      const anchoredProperties = { ...entry.properties, acg_anchor_geometry: 'LineString' };
      delete anchoredProperties.label_anchors;
      delete anchoredProperties.labelAnchors;
      delete anchoredProperties.curve;
      features.push({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: anchor },
        properties: anchoredProperties,
      });
    }
    if (memory) {
      for (const key of [...memory.keys()]) {
        if (!seen.has(key)) memory.delete(key);
      }
    }
    return features;
  }

  // Which chips draw, mirroring the label layers' kind groups and the
  // point/layer selection (an approximation is safe: it only steers spacing).
  function acgChipShownPredicate(visibility, linesVisible, paransVisible) {
    return (properties) => {
      if (properties.kind === 'PARAN') {
        return paransVisible && isAcgPropertiesVisible(properties, visibility);
      }
      if (!linesVisible) return false;
      if (properties.kind === 'LOCAL_SPACE_OPPOSITION' && !visibility.localSpaceOppositions) return false;
      if (properties.kind === 'ASPECT' && !visibility.aspects) return false;
      return isAcgPropertiesVisible(properties, visibility);
    };
  }

  const acgChipAnchorMemory = new Map();
  let acgChipAnchorFrame = 0;

  // Chip layers follow their text twins' filter and visibility, whichever
  // control changed them.
  function syncAcgChipLayers() {
    if (!map) return;
    const glyphs = acgLineLabelGlyphs();
    for (const [chipLayerId, sourceLayerId] of ACG_CHIP_ANCHOR_LAYERS) {
      if (!map.getLayer(chipLayerId) || !map.getLayer(sourceLayerId)) continue;
      const visibility = glyphs && map.getLayoutProperty(sourceLayerId, 'visibility') !== 'none'
        ? 'visible'
        : 'none';
      if (map.getLayoutProperty(chipLayerId, 'visibility') !== visibility) {
        map.setLayoutProperty(chipLayerId, 'visibility', visibility);
      }
      const filter = acgChipAnchorFilter(map.getFilter(sourceLayerId));
      if (JSON.stringify(filter) !== JSON.stringify(map.getFilter(chipLayerId))) {
        map.setFilter(chipLayerId, filter);
      }
    }
  }

  function updateAcgChipAnchors() {
    const source = map && map.getSource && map.getSource(ACG_CHIP_SOURCE_ID);
    if (!source) return;
    syncAcgChipLayers();
    const layerVisible = (id) => !!map.getLayer(id) &&
      map.getLayoutProperty(id, 'visibility') !== 'none';
    const features = acgLineLabelGlyphs()
      ? computeAcgChipAnchors(map, currentMapData, {
        memory: acgChipAnchorMemory,
        shown: acgChipShownPredicate(
          viewOptions,
          layerVisible('acg-labels'),
          layerVisible('acg-paran-labels'),
        ),
      })
      : [];
    if (!acgLineLabelGlyphs()) acgChipAnchorMemory.clear();
    source.setData({ type: 'FeatureCollection', features });
  }

  function scheduleAcgChipAnchors() {
    if (acgChipAnchorFrame) return;
    acgChipAnchorFrame = window.requestAnimationFrame(() => {
      acgChipAnchorFrame = 0;
      updateAcgChipAnchors();
    });
  }

  function acgParanLabelExpression() {
    return [
      'concat',
      acgLayerPrefixExpression(),
      localizedPointLabelExpression('a_point', 'a_label'),
      ' ',
      ['coalesce', ['get', 'a_angle'], ''],
      ' × ',
      localizedPointLabelExpression('b_point', 'b_label'),
      ' ',
      ['coalesce', ['get', 'b_angle'], ''],
    ];
  }

  function asterismStarRadiusExpression(settings) {
    return [
      'interpolate', ['exponential', 1.35],
      ['number', ['get', 'magnitude'], 6.7],
      -1.5, settings.asterismStarRadiusMax,
      6.7, settings.asterismStarRadiusMin,
    ];
  }

  function asterismStarRadius(magnitude, settings) {
    const value = typeof magnitude === 'number' && Number.isFinite(magnitude)
      ? magnitude
      : 6.7;
    const maximum = Number(settings.asterismStarRadiusMax);
    const minimum = Number(settings.asterismStarRadiusMin);
    if (value <= -1.5) return maximum;
    if (value >= 6.7) return minimum;
    const factor = (Math.pow(1.35, value + 1.5) - 1) / (Math.pow(1.35, 8.2) - 1);
    return maximum + (minimum - maximum) * factor;
  }

  function hideAsterismStarPopup(mode = '') {
    if (mode && asterismStarPopupMode !== mode) return;
    if (asterismStarPopup) asterismStarPopup.remove();
    asterismStarPopupMode = '';
    if (map) map.getCanvas().style.cursor = '';
  }

  function showAsterismStarPopup(name, coordinate, mode) {
    if (!map || !name) {
      hideAsterismStarPopup();
      return;
    }
    if (!asterismStarPopup) {
      asterismStarPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 9,
      });
    }
    asterismStarPopupMode = mode;
    asterismStarPopup
      .setLngLat(coordinate)
      .setText(name)
      .addTo(map);
    map.getCanvas().style.cursor = 'pointer';
  }

  function onAsterismStarEnter() {
    if (map) map.getCanvas().style.cursor = 'pointer';
  }

  function onAsterismStarLeave() {
    hideAsterismStarPopup('native');
  }

  function setAsterismHoverEnabled(enabled) {
    if (!map || asterismHoverEnabled === enabled) return;
    const action = enabled ? 'on' : 'off';
    map[action]('mousemove', 'acg-asterism-star-hit', onAsterismStarMove);
    map[action]('mouseenter', 'acg-asterism-star-hit', onAsterismStarEnter);
    map[action]('mouseleave', 'acg-asterism-star-hit', onAsterismStarLeave);
    map[action]('mousemove', onPolarAsterismStarMove);
    asterismHoverEnabled = enabled;
    if (!enabled) {
      hideAsterismStarPopup();
      map.getCanvas().style.cursor = '';
    }
  }

  function beginMapMotion(phase) {
    const burstStarted = activeMapMotionPhases.size === 0;
    activeMapMotionPhases.add(phase);
    if (burstStarted) {
      curveRefinement?.cancel();
      if (ACG_PERF_MODE) perfLastRenderAt = perfNow();
      setAsterismHoverEnabled(false);
    }
    return burstStarted;
  }

  function endMapMotion(phase) {
    const phaseEnded = activeMapMotionPhases.delete(phase);
    const burstSettled = phaseEnded && activeMapMotionPhases.size === 0;
    if (burstSettled) {
      if (ACG_PERF_MODE) perfLastRenderAt = 0;
      setAsterismHoverEnabled(true);
    }
    return burstSettled;
  }

  function onAsterismStarMove(event) {
    const feature = event.features && event.features[0];
    const name = String(feature && feature.properties && feature.properties.name || '').trim();
    showAsterismStarPopup(name, event.lngLat, 'native');
  }

  function onPolarAsterismStarMove(event) {
    if (
      !map || !mapHostActive || selectedProjection !== 'globe' ||
      activeMapMotionPhases.size > 0 ||
      !viewOptions.asterisms || !event || !event.point
    ) {
      hideAsterismStarPopup('polar');
      return;
    }
    let nearest = null;
    let nearestDistanceSquared = 64;
    for (const target of polarAsterismStarHitTargets) {
      const dx = Number(event.point.x) - target.point.x;
      const dy = Number(event.point.y) - target.point.y;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared <= nearestDistanceSquared) {
        nearest = target;
        nearestDistanceSquared = distanceSquared;
      }
    }
    if (!nearest) {
      hideAsterismStarPopup('polar');
      return;
    }
    const name = String(nearest.properties.name || '').trim();
    if (!name) {
      hideAsterismStarPopup('polar');
      return;
    }
    showAsterismStarPopup(name, nearest.coordinate, 'polar');
  }

  function referenceBehavior() {
    return ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.behavior || {};
  }

  function normalizedAcgLayerRole(properties) {
    const role = String(properties && properties.astrocart_layer || '').trim().toLowerCase();
    return role || 'natal';
  }

  function normalizedAcgTechnique(properties) {
    const technique = String(properties && properties.astrocart_technique || '').trim().toLowerCase();
    return technique || 'natal';
  }

  function normalizedVisibilitySelection(value) {
    if (value == null) return null;
    const raw = Array.isArray(value)
      ? value
      : (typeof value === 'object'
        ? Object.entries(value).filter((entry) => !!entry[1]).map((entry) => entry[0])
        : [value]);
    return [...new Set(raw.map((item) => String(item).trim().toLowerCase()).filter(Boolean))];
  }

  function visibilitySelectionMatches(selection, values) {
    if (selection == null) return true;
    const normalized = values
      .map((value) => String(value == null ? '' : value).trim().toLowerCase())
      .filter(Boolean);
    return normalized.some((value) => selection.includes(value));
  }

  function isAcgLayerRoleVisible(properties, options = viewOptions) {
    if (properties && properties.kind === 'PARAN') return !!options.parans;
    const role = normalizedAcgLayerRole(properties);
    if (role === 'transit') return !!options.layers.transit;
    if (role === 'progression') return !!options.layers.progression;
    if (role === 'natal' || role === 'current') return !!options.layers.natal;
    return false;
  }

  function acgSelectionFilter(propertyNames, selection, fallback = '') {
    if (selection == null) return null;
    if (!selection.length) return ['==', ['get', propertyNames[0]], '__aries_hidden_selection__'];
    const candidates = propertyNames.map((propertyName) => [
      'match',
      ['downcase', ['to-string', ['coalesce', ['get', propertyName], fallback]]],
      selection,
      true,
      false,
    ]);
    return candidates.length === 1 ? candidates[0] : ['any', ...candidates];
  }

  function acgAttributeVisibilityFilter(options = viewOptions) {
    const filters = [];
    if (options.filters.hiddenLayerIds && options.filters.hiddenLayerIds.length) {
      filters.push(['!', ['in',
        ['downcase', ['to-string', ['coalesce', ['get', 'astrocart_source_document_id'], '']]],
        ['literal', options.filters.hiddenLayerIds],
      ]]);
    }
    for (const filter of [
      acgSelectionFilter(['point', 'a_point', 'b_point'], options.filters.points),
      acgSelectionFilter(['kind'], options.filters.kinds),
      acgSelectionFilter(
        ['astrocart_technique'],
        options.filters.techniques,
        'natal',
      ),
    ]) {
      if (filter) filters.push(filter);
    }
    const aspectFilter = acgSelectionFilter(
      ['aspect_id', 'aspect_key', 'aspect_name', 'aspect_angle'],
      options.filters.aspects,
    );
    if (aspectFilter) {
      filters.push([
        'any',
        ['!=', ['get', 'kind'], 'ASPECT'],
        aspectFilter,
      ]);
    }
    if (!filters.length) return null;
    return ['all', ...filters];
  }

  function acgLayerRoleFilter(options = viewOptions) {
    const filters = [];
    if (options.layers.natal) {
      filters.push([
        'any',
        ['!', ['has', 'astrocart_layer']],
        ['==', ['get', 'astrocart_layer'], ''],
        ['==', ['get', 'astrocart_layer'], 'natal'],
        ['==', ['get', 'astrocart_layer'], 'current'],
      ]);
    }
    if (options.layers.transit) {
      filters.push(['==', ['get', 'astrocart_layer'], 'transit']);
    }
    if (options.layers.progression) {
      filters.push(['==', ['get', 'astrocart_layer'], 'progression']);
    }
    if (!filters.length) return ['==', ['get', 'astrocart_layer'], '__aries_hidden_layer__'];
    if (filters.length === 1) return filters[0];
    return ['any', ...filters];
  }

  function acgKindFilter(geometryType, kinds, options = viewOptions) {
    const kindFilter = kinds.length
      ? ['match', ['get', 'kind'], kinds, true, false]
      : ['==', ['get', 'kind'], '__aries_hidden_kind__'];
    const filters = [
      'all',
      ['==', ['geometry-type'], geometryType],
      kindFilter,
      acgLayerRoleFilter(options),
    ];
    const attributeFilter = acgAttributeVisibilityFilter(options);
    if (attributeFilter) filters.push(attributeFilter);
    return filters;
  }

  function ascendantOverlayFilter(baseFilter) {
    if (referenceBehavior().showAscCircle) return baseFilter;
    return [
      'all',
      baseFilter,
      ['!=', ['get', 'point'], NATAL_ASC_POINT_ID],
    ];
  }

  function acgCasingFilter(options = viewOptions) {
    const kinds = ['MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE'];
    if (options.localSpaceOppositions) kinds.push('LOCAL_SPACE_OPPOSITION');
    if (options.aspects) kinds.push('ASPECT');
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgSolidFilter(options = viewOptions) {
    return ascendantOverlayFilter(
      acgKindFilter('LineString', ['MC', 'ASC', 'LOCAL_SPACE'], options),
    );
  }

  function acgDashedFilter(options = viewOptions) {
    return ascendantOverlayFilter(
      acgKindFilter('LineString', ['IC', 'DSC'], options),
    );
  }

  function acgLocalSpaceOppositionFilter(options = viewOptions) {
    const kinds = options.localSpaceOppositions ? ['LOCAL_SPACE_OPPOSITION'] : [];
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgAspectFilter(options = viewOptions) {
    const kinds = options.aspects ? ['ASPECT'] : [];
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgParanFilter(options = viewOptions) {
    // Paran visibility belongs to its layer layout, independently of natal
    // line visibility. Keeping this filter stable makes its toggle a paint
    // operation instead of reparsing every ACG line layer.
    const filters = [
      'all',
      ['==', ['geometry-type'], 'LineString'],
      ['==', ['get', 'kind'], 'PARAN'],
    ];
    const attributes = acgAttributeVisibilityFilter(options);
    if (attributes) filters.push(attributes);
    return filters;
  }

  function acgZenithFilter(options = viewOptions) {
    const kinds = options.zeniths ? ['ZENITH'] : [];
    return acgKindFilter('Point', kinds, options);
  }

  function acgLabelFilter(options = viewOptions) {
    const kinds = ['MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE'];
    if (options.localSpaceOppositions) kinds.push('LOCAL_SPACE_OPPOSITION');
    if (options.aspects) kinds.push('ASPECT');
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function isAcgPropertiesVisible(props, options = viewOptions) {
    if (!isAcgLayerRoleVisible(props, options)) return false;
    if (options.filters.hiddenLayerIds && options.filters.hiddenLayerIds.includes(
      String(props.astrocart_source_document_id || '').toLowerCase()
    )) return false;
    if (!visibilitySelectionMatches(
      options.filters.points,
      [props.point, props.a_point, props.b_point],
    )) return false;
    if (!visibilitySelectionMatches(options.filters.kinds, [props.kind])) return false;
    if (
      props.kind === 'ASPECT' &&
      !visibilitySelectionMatches(
        options.filters.aspects,
        [props.aspect_id, props.aspect_key, props.aspect_name, props.aspect_angle],
      )
    ) return false;
    if (!visibilitySelectionMatches(
      options.filters.techniques,
      [normalizedAcgTechnique(props)],
    )) return false;
    if (props.point === NATAL_ASC_POINT_ID && !referenceBehavior().showAscCircle) return false;
    if (props.kind === 'LOCAL_SPACE_OPPOSITION') return !!options.localSpaceOppositions;
    if (props.kind === 'ASPECT') return !!options.aspects;
    if (props.kind === 'ZENITH') return !!options.zeniths;
    return true;
  }

  function isAcgFeatureVisible(feature, options = viewOptions) {
    const props = feature && feature.properties || {};
    return isAcgPropertiesVisible(props, options);
  }

  function syncAcgLineVisibility() {
    if (!map) return;
    for (const [id, filter] of [
      ['acg-casing', acgCasingFilter()],
      ['acg-lines-solid', acgSolidFilter()],
      ['acg-lines-dashed', acgDashedFilter()],
      ['acg-local-space-oppositions', acgLocalSpaceOppositionFilter()],
      ['acg-aspects', acgAspectFilter()],
      ['acg-parans', acgParanFilter()],
      ['acg-zeniths', acgZenithFilter()],
      ['acg-labels', acgLabelFilter()],
      ['acg-zenith-labels', acgZenithFilter()],
      ['acg-paran-labels', acgParanFilter()],
    ]) {
      if (!map.getLayer(id)) continue;
      if (map.getFilter && JSON.stringify(map.getFilter(id)) === JSON.stringify(filter)) continue;
      map.setFilter(id, filter);
    }
    for (const [id, visible] of [
      ['acg-local-space-oppositions', viewOptions.localSpaceOppositions],
      ['acg-aspects', viewOptions.aspects],
      ['acg-zeniths', viewOptions.zeniths],
      ['acg-zenith-labels', viewOptions.zeniths && currentDevSettings().labelsOn],
    ]) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
    }
  }

  function zodiacReferenceColor(sign, settings) {
    const style = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
      ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${sign}`];
    return style && style.color || settings.referenceZodiacGridColor;
  }

  function houseReferenceColor(house, settings) {
    if (house === 1 || house === 7) return settings.referenceAscColor;
    if (house === 4 || house === 10) return settings.referenceMcColor;
    return settings.referenceHouseGridColor;
  }

  function zodiacGridColorExpression(settings) {
    const expression = ['match', ['number', ['get', 'sign'], -1]];
    for (let sign = 0; sign < 12; sign += 1) {
      expression.push(sign, zodiacReferenceColor(sign, settings));
    }
    expression.push(settings.referenceZodiacGridColor);
    return expression;
  }

  function houseGridColorExpression(settings) {
    return [
      'match', ['number', ['get', 'house'], -1],
      1, settings.referenceAscColor,
      7, settings.referenceAscColor,
      4, settings.referenceMcColor,
      10, settings.referenceMcColor,
      settings.referenceHouseGridColor,
    ];
  }

  function houseGridOpacityExpression(settings) {
    return [
      'case',
      ['boolean', ['get', 'angle'], false],
      Math.min(1, settings.referenceGridLineOpacity * 1.45),
      settings.referenceGridLineOpacity,
    ];
  }

  function clearReferenceSignMarkers() {
    for (const marker of referenceSignMarkers) marker.remove();
    referenceSignMarkers = [];
  }

  function ensureReferenceSignFont(size) {
    if (referenceSignFontReady) return true;
    if (!referenceSignFontPromise) {
      referenceSignFontPromise = document.fonts.load(`${Math.max(12, size)}px 'Morinus'`, 'a')
        .then(() => {
          referenceSignFontReady = true;
          syncReferenceLabelMarkers();
        })
        .catch((error) => console.error('[acg-reference-font]', error));
    }
    return false;
  }

  function syncReferenceLabelMarkers() {
    clearReferenceSignMarkers();
    if (!map) return;
    const behavior = referenceBehavior();
    const s = currentDevSettings();
    if (!ensureReferenceSignFont(Math.max(s.referenceSignSize, s.referencePoleSignSize))) return;
    for (const feature of currentAsterismData.features || []) {
      const props = feature && feature.properties || {};
      const geometry = feature && feature.geometry || {};
      const coordinates = geometry.coordinates;
      const isEclipticSign = props.kind === 'REFERENCE_ZODIAC_SIGN' && !!behavior.showEcliptic;
      const isPoleSign = props.kind === 'REFERENCE_ZODIAC_POLE_SIGN' && !!behavior.showZodiacLines;
      const isHouseNumber = props.kind === 'REFERENCE_HOUSE_POLE_LABEL' && !!behavior.showHouseLines;
      if (
        !(isEclipticSign || isPoleSign || isHouseNumber) ||
        geometry.type !== 'Point' ||
        !Array.isArray(coordinates) ||
        coordinates.length < 2 ||
        !Number.isFinite(coordinates[0]) ||
        !Number.isFinite(coordinates[1])
      ) continue;
      const element = document.createElement('span');
      let halo = s.referenceSignHaloWidth;
      if (isHouseNumber) {
        element.className = 'acg-reference-house-number';
        element.textContent = String(props.label || props.house || '');
        element.style.fontSize = `${s.referencePoleHouseSize}px`;
        element.style.color = houseReferenceColor(Number(props.house), s);
        element.style.opacity = String(s.referencePoleLabelOpacity);
        halo = s.referencePoleLabelHaloWidth;
      } else {
        const signStyle = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
          ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${props.sign}`];
        const glyph = signStyle && signStyle.glyphMorinus || props.glyph;
        if (!glyph) continue;
        element.className = isPoleSign ? 'acg-reference-pole-sign' : 'acg-reference-sign';
        element.textContent = String(glyph);
        element.style.fontSize = `${isPoleSign ? s.referencePoleSignSize : s.referenceSignSize}px`;
        element.style.color = zodiacReferenceColor(Number(props.sign), s);
        element.style.opacity = String(isPoleSign ? s.referencePoleLabelOpacity : s.referenceSignOpacity);
        halo = isPoleSign ? s.referencePoleLabelHaloWidth : s.referenceSignHaloWidth;
      }
      halo = Math.max(0.5, Number(halo) || 0.5);
      element.style.textShadow = `0 0 ${halo}px ${s.labelHalo}, 0 0 ${halo * 3}px ${s.labelHalo}`;
      const visibleOpacity = element.style.opacity || '1';
      // A newly attached DOM marker is painted before MapLibre's first globe
      // occlusion pass. Start transparent so far-side replacements cannot flash
      // through the sphere while a house-system refresh rebuilds this payload.
      element.style.opacity = '0';
      const marker = new maplibregl.Marker({
        element,
        anchor: 'center',
        opacity: visibleOpacity,
        opacityWhenCovered: '0',
      })
        .setLngLat(coordinates)
        .addTo(map);
      // Force the first occlusion decision synchronously after attachment;
      // otherwise MapLibre defers it until its next marker update.
      marker.setOpacity(visibleOpacity, '0');
      referenceSignMarkers.push(marker);
    }
  }

  function syncReferenceVisibility() {
    const behavior = referenceBehavior();
    const visibility = {
      'acg-reference-house-lines': !!behavior.showHouseLines,
      'acg-reference-zodiac-lines': !!behavior.showZodiacLines,
      'acg-reference-ecliptic': !!behavior.showEcliptic,
      'acg-reference-zodiac-ticks': !!behavior.showEcliptic,
      'acg-reference-equator': !!behavior.showEquator,
      'acg-reference-asc': !!behavior.showAscCircle,
      'acg-reference-mc': !!behavior.showMcCircle,
    };
    for (const [id, visible] of Object.entries(visibility)) {
      if (map && map.getLayer(id)) {
        map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
      }
    }
    syncAcgLineVisibility();
    syncReferenceLabelMarkers();
  }

  function ensureAsterismLayer() {
    if (!map.getSource(ASTERISM_SOURCE_ID)) {
      map.addSource(ASTERISM_SOURCE_ID, { type: 'geojson', data: currentMapAsterismData });
    }
    const s = currentDevSettings();
    const visibility = viewOptions.asterisms ? 'visible' : 'none';
    const behavior = referenceBehavior();
    const addReferenceLine = (
      id, kind, color, visible, dash, widthScale = 1.0,
      baseWidth = s.referenceLineWidth, opacity = s.referenceLineOpacity,
    ) => {
      if (map.getLayer(id)) return;
      const paint = {
        'line-color': color,
        'line-width': baseWidth * widthScale,
        'line-opacity': opacity,
      };
      if (dash) paint['line-dasharray'] = dash;
      map.addLayer({

    if (!map.getLayer('acg-asterism-shadow')) {

  function ensureAcgLayers() {

    // Line labels use a parallel source. Attaching a line-placed symbol layer
    // to the shared source can blank the lines themselves.
    if (!map.getSource(ACG_LABEL_SOURCE_ID)) {
      map.addSource(ACG_LABEL_SOURCE_ID, { type: 'geojson', data: currentMapData, tolerance: 0, maxzoom: 22 });
    }
    // Thin neutral outline so colored lines stay readable without looking heavy.
    // Filter excludes parans — they have their own (off-by-default) style.
    const t = currentThemeTokens();
    const s = currentDevSettings();
    const colorExpr = acgLineColorExpression(s);
    if (!map.getLayer('acg-casing')) {
      map.addLayer({
        id: 'acg-casing',

        source: ACG_SOURCE_ID,

        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(s.dashedWidth, 'line_width_scale'),
          'line-opacity': scaledPointLayerOpacity(s.dashedOpacity, 'line_opacity'),
          'line-dasharray': [s.dashedOn, s.dashedOff],
        },
      });
    }
    if (!map.getLayer('acg-local-space-oppositions')) {
      map.addLayer({
        id: 'acg-local-space-oppositions',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgLocalSpaceOppositionFilter(),
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          'visibility': viewOptions.localSpaceOppositions ? 'visible' : 'none',
        },
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(
            s.dashedWidth * s.localSpaceOppositionWidthScale,
            'line_width_scale'
          ),
          'line-opacity': scaledPointLayerOpacity(
            s.dashedOpacity * s.localSpaceOppositionOpacityScale,

          ),

            s.dashedOn * s.localSpaceOppositionDashOnScale,
            s.dashedOff * s.localSpaceOppositionDashOffScale,

      });

    if (!map.getLayer('acg-aspects')) {
      map.addLayer({
        id: 'acg-aspects',

        source: ACG_SOURCE_ID,
        filter: acgAspectFilter(),
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          'visibility': viewOptions.aspects ? 'visible' : 'none',
        },
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(
            s.solidWidth * s.aspectLineWidthScale,
            'line_width_scale'
          ),
          'line-opacity': scaledPointLayerOpacity(
            s.solidOpacity * s.aspectLineOpacityScale,
            'line_opacity'
          ),

    if (!map.getLayer('acg-parans')) {

    if (!map.getLayer('acg-zeniths')) {

          ),

          'circle-stroke-color': t.casing,
          'circle-stroke-width': Math.max(s.zenithStrokeWidthMin, s.casingWidth),
          'circle-stroke-opacity': scaledPointLayerOpacity(s.casingOpacity, 'line_opacity'),
        },
      });
    }
    if (!map.getLayer('acg-labels')) {
      map.addLayer({
        id: 'acg-labels',
        type: 'symbol',

          'symbol-placement': 'line',

          'text-size': s.labelSize,
          'text-letter-spacing': s.labelSpacing,
          'text-keep-upright': true,
          'visibility': s.labelsOn ? 'visible' : 'none',
        },
        paint: {
          'text-color': t.labelColor,
          'text-halo-color': t.labelHalo,
          'text-halo-width': s.labelHaloOn ? s.labelHaloWidth : 0.0,
          'text-opacity': scaledPointLayerOpacity(s.labelOpacity, 'line_opacity'),
        },
      });
    }
    if (!map.getLayer('acg-zenith-labels')) {
      map.addLayer({
        id: 'acg-zenith-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgZenithFilter(),
        layout: {
          'text-field': acgZenithLabelExpression(),

      });
    }
    if (!map.getLayer('acg-paran-labels')) {
      map.addLayer({
        id: 'acg-paran-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgParanFilter(),
        layout: {
          'symbol-placement': 'line-center',
          'text-font': ['Noto Sans Regular'],
          'text-field': acgParanLabelExpression(),
          'text-size': s.paranLabelSize,

          'text-max-angle': 0,

        },
