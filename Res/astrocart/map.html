<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morinus Astrocartography</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1d21">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preload" href="../Morinus.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Bundled Morinus font — loaded from Res/Morinus.ttf via a relative URL. */
  @font-face {
    font-family: 'Morinus';
    src: url('../Morinus.ttf') format('truetype');
    font-display: block;
  }
  html {
    background:#1a1d21;
    color-scheme:dark;
  }
  /* Dark theme (Midnight / Nocturne Mono) — the boot default so embedded
     webviews and iframes never expose a light browser canvas while the host
     theme is still loading. */
  :root {
    --page-bg:     #1a1d21;
    --titlebar-safe-top: 0px;
    --chrome-bg:   rgba(29,30,33,0.88);
    --chrome-bg-thin: rgba(29,30,33,0.84);
    --chrome-border:  rgba(255,255,255,0.10);
    --chrome-rule:    rgba(255,255,255,0.08);
    --chrome-text:    #e2e3e6;
    --chrome-dim:     #b0b3b8;
    --chrome-soft:    #c4c6ca;
    --btn-active-bg:  rgba(255,255,255,0.12);
    --btn-hover-bg:   rgba(255,255,255,0.05);
    --btn-active-fg:  #ffffff;
    --key-line:       #d0d2d6;
    --key-paran:      #e59246;
    --popup-bg:       #23262c;
    --menu-bg:        rgba(37,39,44,0.88);
    --menu-border:    rgba(255,255,255,0.14);
    --menu-shadow:    rgba(0,0,0,0.45);
    --menu-hover-bg:  #0a84ff;
    --menu-hover-fg:  #ffffff;
  }
  /* Light theme (Daylight / Paper Mono / Classic Morinus) — explicit opt-in. */
  body.theme-light {
    --page-bg:     #d9dde1;
    --chrome-bg:   rgba(255,255,255,0.88);
    --chrome-bg-thin: rgba(255,255,255,0.84);
    --chrome-border:  rgba(0,0,0,0.12);
    --chrome-rule:    rgba(0,0,0,0.08);
    --chrome-text:    #2d3136;
    --chrome-dim:     #43484e;
    --chrome-soft:    #34383d;
    --btn-active-bg:  rgba(0,0,0,0.09);
    --btn-hover-bg:   rgba(0,0,0,0.04);
    --btn-active-fg:  #1a1d21;
    --key-line:       #2d3136;
    --key-paran:      #b35800;
    --popup-bg:       #ffffff;
    --menu-bg:        rgba(246,246,246,0.88);
    --menu-border:    rgba(0,0,0,0.18);
    --menu-shadow:    rgba(0,0,0,0.24);
    --menu-hover-bg:  #0a84ff;
    --menu-hover-fg:  #ffffff;
    color-scheme:light;
  }
  html, body, #map { margin:0; padding:0; width:100%; height:100%; background:var(--page-bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color:var(--chrome-text); }
  .maplibregl-map,
  .maplibregl-canvas-container,
  .maplibregl-canvas {
    background:var(--page-bg) !important;
  }
  #map.map-booting .maplibregl-canvas,
  #map.map-booting .maplibregl-control-container {
    opacity:0;
    visibility:hidden;
  }
  #polar-line-overlay {
    position:absolute; inset:0; pointer-events:none;
    width:100%; height:100%;
  }
  #map.map-booting #polar-line-overlay {
    opacity:0;
    visibility:hidden;
  }
  #place-labels {
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    z-index:3;
    font-size:11px; line-height:1; color:var(--chrome-soft);
  }
  #acg-dom-labels {
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    z-index:3;
    font-size:11px; line-height:1; color:var(--chrome-text);
  }
  #acg-dom-labels.is-moving {
    opacity:0;
    transition:opacity 80ms linear;
  }
  .place-label, .acg-dom-label {
    position:absolute; transform:translate(-50%, -50%);
    text-shadow:0 0 3px var(--popup-bg), 0 0 6px var(--popup-bg);
    white-space:nowrap; opacity:0.82;
  }
  .place-label.major { font-weight:600; color:var(--chrome-text); opacity:0.92; }
  .acg-dom-label { font-weight:600; }
  .maplibregl-ctrl-top-left { top:var(--titlebar-safe-top); }
  .maplibregl-ctrl-group {
    background:var(--chrome-bg);
    border:1px solid var(--chrome-border);
    box-shadow:none;
    overflow:hidden;
  }
  .maplibregl-ctrl-group button {
    width:28px; height:28px;
    background:transparent;
  }
  .maplibregl-ctrl-group button + button {
    border-top:1px solid var(--chrome-rule);
  }
  .maplibregl-ctrl-group button:hover:not(:disabled) {
    background:var(--btn-hover-bg);
  }
  body:not(.terrain-relief) .maplibregl-ctrl-compass { display:none; }
  body:not(.theme-light) .maplibregl-ctrl button .maplibregl-ctrl-icon {
    filter:invert(1);
    opacity:0.88;
  }
  .maplibregl-ctrl-attrib,
  .maplibregl-ctrl-attrib.maplibregl-compact {
    background:var(--chrome-bg-thin);
    color:var(--chrome-dim);
    border:1px solid var(--chrome-border);
    box-shadow:none;
  }
  .maplibregl-ctrl-attrib a {
    color:var(--chrome-text);
  }
  .maplibregl-ctrl-attrib-button {
    background-color:transparent;
    background-image:none !important;
  }
  .maplibregl-ctrl-attrib-button:hover {
    background-color:var(--btn-hover-bg);
  }
  .maplibregl-ctrl-attrib-button::before {
    content:"i";
    display:block;
    width:18px; height:18px;
    margin:auto;
    border:2px solid var(--chrome-text);
    border-radius:50%;
    color:var(--chrome-text);
    font:700 14px/18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align:center;
  }
  .place-dot {
    display:inline-block; width:3px; height:3px; border-radius:50%;
    background:currentColor; margin-right:4px; vertical-align:middle;
  }
  #legend {
    position:absolute; top:calc(var(--titlebar-safe-top) + 8px); right:8px;
    z-index:7;
    background:var(--chrome-bg);
    border-radius:6px; font-size:11px;
    max-width:210px; line-height:1.4; pointer-events:auto;
    border:1px solid var(--chrome-border);
    color:var(--chrome-text);
    overflow:hidden;
  }
  #legend-toggle {
    width:100%; display:flex; align-items:center; gap:8px;
    border:0; background:transparent; color:var(--chrome-soft);
    padding:6px 9px; cursor:pointer; border-radius:5px;
    font:inherit; font-size:10px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  #legend-toggle:hover { background:var(--btn-hover-bg); }
  #legend-toggle .legend-state {
    margin-left:auto; color:var(--chrome-dim); font-size:12px; line-height:1;
  }
  #legend-body { padding:0 10px 8px 10px; }
  #legend.collapsed { max-width:none; }
  #legend.collapsed #legend-body { display:none; }
  #legend.collapsed #legend-toggle { padding:5px 9px; }
  #legend h4 { margin:0 0 6px 0; font-size:10px; font-weight:600; color:var(--chrome-soft); opacity:0.75; text-transform:uppercase; letter-spacing:0.08em; }
  #legend section + section { margin-top:8px; padding-top:8px; border-top:1px solid var(--chrome-rule); }
  #legend .row { display:flex; align-items:center; gap:6px; }
  #legend .sw { width:18px; height:2px; flex-shrink:0; }
  #legend .glyph { font-family:'Morinus', serif; font-size:14px; width:16px; text-align:center; display:inline-block; }
  #legend .kind-row { display:flex; align-items:center; gap:6px; color:var(--chrome-dim); font-size:10px; }
  #legend .kind-row .sw { width:24px; }
  #legend .kind-row .ks { border-top:1.8px solid var(--key-line); width:24px; height:0; }
  #legend .kind-row .kd { border-top:1.8px dashed var(--key-line); width:24px; height:0; }
  #legend .kind-row .kp { border-top:1.2px dashed var(--key-paran); width:24px; height:0; }
  #status {
    position:absolute; bottom:8px; left:8px;
    background:var(--chrome-bg-thin); padding:4px 8px;
    border-radius:4px; font-size:10px; color:var(--chrome-dim);
    border:1px solid var(--chrome-border);
  }
  .maplibregl-popup-content {
    background:var(--popup-bg) !important; color:var(--chrome-text) !important;
    border:1px solid var(--chrome-border);
    font-size:11px; padding:6px 8px;
  }
  .maplibregl-popup-tip { border-top-color:var(--popup-bg) !important; }
  #top-controls {
    position:absolute; top:calc(var(--titlebar-safe-top) + 8px); left:88px;
    z-index:7; display:flex; align-items:flex-start; gap:4px;
  }
  #proj, #overlays {
    background:var(--chrome-bg);
    border:1px solid var(--chrome-border);
    border-radius:5px; padding:2px;
    font-size:11px; display:flex; gap:1px;
  }
  #proj button, #overlays button {
    background:transparent; color:var(--chrome-dim); border:0;
    min-height:24px; padding:3px 9px; cursor:pointer; border-radius:3px;
    font: inherit; line-height:16px; letter-spacing:0;
  }
  #proj button.on, #overlays button.on {
    background:var(--btn-active-bg); color:var(--btn-active-fg); font-weight:600;
  }
  #proj button:hover:not(.on), #overlays button:hover:not(.on) { background:var(--btn-hover-bg); }
  #place-search {
    position:relative; width:208px;
  }
  #place-search-input {
    width:100%; box-sizing:border-box;
    height:28px; padding:0 9px;
    background:var(--chrome-bg); color:var(--chrome-text);
    border:1px solid var(--chrome-border); border-radius:5px;
    font: inherit; font-size:11px; line-height:26px;
    outline:none; -webkit-appearance:none;
  }
  #place-search-input::placeholder {
    color:var(--chrome-dim); opacity:0.7;
  }
  #place-search-input::-webkit-search-cancel-button {
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px; margin-right:-2px; cursor:default;
    background:var(--chrome-dim); opacity:0.55;
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 3l6 6M9 3l-6 6' stroke='black' stroke-width='1.6' stroke-linecap='round'/></svg>");
    mask-repeat:no-repeat; mask-position:center;
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 3l6 6M9 3l-6 6' stroke='black' stroke-width='1.6' stroke-linecap='round'/></svg>");
    -webkit-mask-repeat:no-repeat; -webkit-mask-position:center;
  }
  #place-search-input:focus { border-color:var(--chrome-soft); }
  #place-search-results {
    display:none; margin-top:4px;
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:6px;
    box-shadow:0 16px 36px var(--menu-shadow);
    padding:4px; max-height:300px; overflow-y:auto;
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
  }
  .place-search-result {
    display:flex; align-items:baseline; gap:8px;
    width:100%; padding:5px 9px;
    border:0; background:transparent;
    color:inherit; text-align:left; border-radius:4px;
    font:inherit; font-size:12px; line-height:1.25;
    cursor:default;
  }
  .place-search-result:hover,
  .place-search-result.active {
    background:var(--menu-hover-bg); color:var(--menu-hover-fg);
  }
  .place-search-result .name {
    flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .place-search-result .name .secondary {
    display:block; font-size:10px; opacity:0.55;
    line-height:1.2; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .place-search-result:hover .name .secondary,
  .place-search-result.active .name .secondary { opacity:0.85; }
  .place-search-result .country {
    flex:0 0 auto; font-size:10px; opacity:0.6; letter-spacing:0.04em;
  }
  .place-search-result:hover .country,
  .place-search-result.active .country { opacity:0.85; }
  .place-search-section {
    padding:6px 9px 3px;
    font-size:9px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--chrome-dim); opacity:0.62;
  }
  .place-search-section.divider {
    border-top:1px solid var(--menu-border);
    margin-top:4px; padding-top:7px;
  }
  .place-search-loading {
    display:flex; align-items:center; gap:7px;
    padding:6px 9px; color:var(--chrome-dim); font-size:11px;
  }
  .place-search-loading::before {
    content:''; display:inline-block;
    width:9px; height:9px; border-radius:50%;
    border:1.5px solid currentColor; border-top-color:transparent;
    animation:place-search-spin 0.8s linear infinite;
  }
  @keyframes place-search-spin { to { transform: rotate(360deg); } }
  .place-search-empty {
    padding:6px 9px; color:var(--chrome-dim); font-size:11px;
  }
  #acg-menu {
    position:absolute; z-index:8; min-width:190px; display:none;
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:7px;
    box-shadow:0 16px 36px var(--menu-shadow);
    padding:5px; font-size:14px;
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
  }
  #acg-menu button {
    width:100%; display:block; border:0; background:transparent;
    color:inherit; text-align:left; border-radius:4px;
    padding:6px 23px 6px 12px; font:inherit; line-height:1.25;
    cursor:default;
  }
  #acg-menu button:hover {
    background:var(--menu-hover-bg); color:var(--menu-hover-fg);
  }
  #acg-menu hr {
    margin:4px 6px; border:0; border-top:1px solid var(--menu-border); opacity:0.55;
  }
  /* Context-aware menu visibility — items marked data-context="X" only
     show when window.ACG.setContext('X') is active. Default mode is
     'chart'; setting a focused host mode surfaces only the matching
     location-pick action and hides chart-bound items that don't make sense in
     that flow. */
  #acg-menu[data-mode="chart"] [data-context]:not([data-context~="chart"]) { display:none; }
  #acg-menu[data-mode="chart"] hr[data-context~="default_location"] { display:none; }
  #acg-menu[data-mode="chart"] hr[data-context~="ascensional_event_place"] { display:none; }
  #acg-menu[data-mode="default_location"] [data-context]:not([data-context~="default_location"]) { display:none; }
  #acg-menu[data-mode="default_location"] hr[data-context~="chart"] { display:none; }
  #acg-menu[data-mode="default_location"] hr[data-context~="ascensional_event_place"] { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] [data-context]:not([data-context~="ascensional_event_place"]) { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] hr[data-context~="chart"] { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] hr[data-context~="default_location"] { display:none; }
  #acg-hint {
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:7px;
    box-shadow:0 12px 28px var(--menu-shadow);
    padding:8px 14px; font-size:12.5px; letter-spacing:0.01em;
    pointer-events:none; opacity:0; transition:opacity 220ms ease-in-out;
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    z-index:12;
  }
  #acg-hint.on { opacity:0.94; }
  .acg-birthplace-marker {
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .acg-birthplace-marker-glyph {
    color:var(--chrome-text);
    font:700 15px/16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-shadow:0 0 2px var(--popup-bg), 0 0 5px var(--popup-bg);
    transform-origin:50% 60%;
    transition:transform 90ms ease, color 90ms ease;
  }
  .acg-birthplace-marker.dragging {
    cursor:grabbing;
  }
  .acg-birthplace-marker.dragging .acg-birthplace-marker-glyph {
    color:#0a84ff;
    transform:translateY(-3px) scale(1.2);
  }
  .acg-reference-sign {
    width:1.45em;
    height:1.45em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:'Morinus', serif;
    font-style:normal;
    font-weight:400;
    line-height:1;
    z-index:4;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .acg-reference-pole-sign,
  .acg-reference-house-number {
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1;
    z-index:4;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .acg-reference-pole-sign {
    width:1.35em;
    height:1.35em;
    font-family:'Morinus', serif;
    font-style:normal;
    font-weight:400;
  }
  .acg-reference-house-number {
    width:1.55em;
    height:1.25em;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:600;
  }
</style>
</head>
<body>
<div id="map" class="map-booting"></div>
<div id="place-labels"></div>
<div id="acg-dom-labels"></div>
<div id="acg-menu" data-mode="chart">
  <button data-action="relocation" data-context="chart">Relocation chart</button>
  <button data-action="solar_return" data-context="chart">Solar revolution here</button>
  <button data-action="transit" data-context="chart">Transit here</button>
  <hr data-context="chart">
  <button data-action="set_pob" data-context="chart">Set place of birth</button>
  <button data-action="set_default_loc" data-context="default_location">Set default location</button>
  <button data-action="set_ascensional_event_place" data-context="ascensional_event_place">Set event place</button>
</div>
<div id="acg-hint"></div>
<div id="legend">
  <button id="legend-toggle" type="button" aria-expanded="true" aria-label="Collapse legend">
    <span>Legend</span><span class="legend-state">-</span>
  </button>
  <div id="legend-body">
    <section>
      <h4>Bodies</h4>
      <div id="legend-rows"></div>
    </section>
    <section>
      <h4>Line Key</h4>
      <div id="legend-acg-key">
        <div class="kind-row"><span class="ks"></span><span>MC — culminating</span></div>
        <div class="kind-row"><span class="kd"></span><span>IC — lower meridian</span></div>
        <div class="kind-row"><span class="ks"></span><span>ASC — rising</span></div>
        <div class="kind-row"><span class="kd"></span><span>DSC — setting</span></div>
      </div>
      <div class="kind-row" id="legend-local-space-row" style="display:none"><span class="ks"></span><span>Local Space — bearing from origin</span></div>
      <div class="kind-row" id="legend-paran-row" style="display:none"><span class="kp"></span><span>Paran — A × B co-angular</span></div>
    </section>
  </div>
</div>
<div id="top-controls">
  <div id="proj">
    <button type="button" data-proj="mercator" aria-pressed="false">Flat</button>
    <button type="button" data-proj="globe" class="on" aria-pressed="true">Globe</button>
  </div>
  <div id="overlays">
    <button type="button" data-overlay="parans" aria-pressed="false">Parans</button>
    <button type="button" data-overlay="asterisms" aria-pressed="false" hidden></button>
  </div>
  <div id="place-search">
    <input id="place-search-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search a place…" aria-label="Search place" />
    <div id="place-search-results" role="listbox"></div>
  </div>
</div>
<div id="status">waiting for chart…</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
(function () {
  let DEV_SETTINGS = {};
  let ACTIVE_ASTROCART_STYLE = null;
  const ASTROCART_STYLE_SCHEMA_VERSION = 8;
  const ASTROCART_CHROME_CSS_FIELDS = Object.freeze({
    pageBg: '--page-bg',
    chromeBg: '--chrome-bg',
    chromeBgThin: '--chrome-bg-thin',
    chromeBorder: '--chrome-border',
    chromeRule: '--chrome-rule',
    chromeText: '--chrome-text',
    chromeDim: '--chrome-dim',
    chromeSoft: '--chrome-soft',
    buttonActiveBg: '--btn-active-bg',
    buttonHoverBg: '--btn-hover-bg',
    buttonActiveFg: '--btn-active-fg',
    keyLine: '--key-line',
    keyParan: '--key-paran',
    popupBg: '--popup-bg',
    menuBg: '--menu-bg',
    menuBorder: '--menu-border',
    menuShadow: '--menu-shadow',
    menuHoverBg: '--menu-hover-bg',
    menuHoverFg: '--menu-hover-fg',
  });
  const ASTROCART_RENDERER_STRING_FIELDS = Object.freeze([
    'casing', 'labelColor', 'labelHalo', 'paranColor', 'paranHalo',
    'pageBg', 'oceanColor', 'landColor', 'borderColor',
    'countryLabelColor', 'countryLabelHalo', 'cityLabelColor', 'cityLabelHalo',
    'minorPlaceLabelColor', 'minorPlaceLabelHalo', 'waterLabelColor', 'waterLabelHalo',
    'hospitalLabelColor', 'hospitalLabelHalo', 'hospitalFillColor', 'roadColor',
    'streetNameColor', 'streetNameHalo', 'buildingColor', 'buildingOutlineColor',
    'terrainShadowColor', 'terrainHighlightColor',

    if (!window.fetch) return Promise.reject(new Error('fetch unavailable'));
    const controller = window.AbortController ? new AbortController() : null;
    let timedOut = false;
    const timeout = timeoutMs > 0 ? window.setTimeout(() => {
      timedOut = true;
      if (controller) controller.abort();
    }, timeoutMs) : null;
    return fetch(BASE_VECTOR_STYLE_URL, {
      cache: 'default',
      signal: controller ? controller.signal : undefined,
    })
      .then((response) => {
        if (!response.ok) throw new Error(`style fetch failed: ${response.status}`);
        return response.json();
      })
      .then((style) => {
        BASE_VECTOR_STYLE = style;
        return style;
      })
      .catch((error) => {
        if (timedOut) throw new Error('style fetch timed out');
        throw error;

      .finally(() => {

      visitor(coords);

  function minimalWrappedLongitudeBounds(longitudes) {
    const values = (Array.isArray(longitudes) ? longitudes : [])
      .map((value) => ((Number(value) % 360) + 360) % 360)
      .filter(Number.isFinite)
      .sort((a, b) => a - b);
    if (!values.length) return null;
    if (values.length === 1) {
      const lon = values[0] > 180 ? values[0] - 360 : values[0];
      return [lon, lon];
    }
    let largestGap = -1;
    let gapIndex = 0;
    for (let index = 0; index < values.length; index += 1) {
      const next = index + 1 < values.length ? values[index + 1] : values[0] + 360;
      const gap = next - values[index];
      if (gap > largestGap) {
        largestGap = gap;
        gapIndex = index;
      }
    }
    const startIndex = (gapIndex + 1) % values.length;
    let west = values[startIndex];
    let east = values[gapIndex];
    if (east < west) east += 360;
    if (west > 180) {
      west -= 360;
      east -= 360;
    }
    return [west, east];
  }

  function fitFeatureCollection(geojson) {
    if (!map || !geojson || !(geojson.features || []).length) return;
    const longitudes = [];
    let minLat = Infinity, maxLat = -Infinity;
    let focus = null;
    for (const feature of geojson.features || []) {
      if (!feature.geometry) continue;
      const properties = feature.properties || {};
      if (
        properties.kind === 'ECLIPSE_MAX' &&
        feature.geometry.type === 'Point' &&
        Array.isArray(feature.geometry.coordinates)
      ) {
        const lon = Number(feature.geometry.coordinates[0]);
        const lat = Number(feature.geometry.coordinates[1]);
        if (Number.isFinite(lon) && Number.isFinite(lat)) focus = [lon, lat];
      }
      forEachGeojsonCoord(feature.geometry.coordinates, (coord) => {
        const lon = Number(coord[0]);
        const lat = Number(coord[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
        longitudes.push(lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
    }
    const longitudeBounds = minimalWrappedLongitudeBounds(longitudes);
    if (!longitudeBounds || !Number.isFinite(minLat)) return;
    const [minLon, maxLon] = longitudeBounds;
    if ((maxLon - minLon) > 300) {
      map.easeTo({
        center: focus || [((minLon + maxLon + 540) % 360) - 180, (minLat + maxLat) / 2],
        zoom: globeZoomForViewport(),
        duration: 400,
      });
      return;
    }
    try {
      const bounds = [[minLon, minLat], [maxLon, maxLat]];
      const fitOptions = {
        padding: 72,
        maxZoom: 4.5,
      };
      const camera = typeof map.cameraForBounds === 'function'
        ? map.cameraForBounds(bounds, fitOptions)
        : null;
      if (focus && camera && Number.isFinite(camera.zoom)) {
        map.easeTo({ center: focus, zoom: camera.zoom, duration: 500 });
      } else {
        map.fitBounds(bounds, { ...fitOptions, duration: 500 });
      }
    } catch (_) {}
  }

  function perfNow() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function percentile(values, p) {
    if (!values.length) return 0;
    const sorted = values.slice().sort((a, b) => a - b);
    const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
    return sorted[index];
  }

  function setPerfTileSource(source) {
    perfState.tileSource = source;
  }

  function recordRenderFrame() {
    if (!ACG_PERF_MODE) return;
    const now = perfNow();
    if (perfLastRenderAt > 0) {
      const delta = now - perfLastRenderAt;
      perfState.lastFrameMs = delta;
      perfState.maxFrameMs = Math.max(perfState.maxFrameMs, delta);
      if (delta > 34) perfState.longFrames += 1;
      perfState.frameSamples.push(delta);
      if (perfState.frameSamples.length > 240) perfState.frameSamples.shift();
    }
    perfLastRenderAt = now;
    perfState.renderFrames += 1;
  }

  function recordDomLabelPerf(ms, count, reason) {
    if (!ACG_PERF_MODE) return;
    perfState.domLabelRebuilds += 1;
    if (reason === 'moveend' || reason === 'zoomend') {
      perfState.domLabelSettleRebuilds += 1;
    }
    perfState.domLabelLastCount = count;
    perfState.domLabelLastMs = ms;
    perfState.domLabelTotalMs += ms;
    perfState.domLabelMaxMs = Math.max(perfState.domLabelMaxMs, ms);
  }

  function getPerfState() {
    const frames = perfState.frameSamples;
    const frameTotal = frames.reduce((acc, value) => acc + value, 0);
    const avgFrameMs = frames.length ? frameTotal / frames.length : 0;
    return {
      enabled: perfState.enabled,
      hasLocalTiles: perfState.hasLocalTiles,
      forceLocalTiles: perfState.forceLocalTiles,
      tileSource: perfState.tileSource,
      mapLoadMs: perfState.mapLoadMs,
      moveEvents: perfState.moveEvents,
      zoomEvents: perfState.zoomEvents,
      resizeEvents: perfState.resizeEvents,
      renderFrames: perfState.renderFrames,
      longFrames: perfState.longFrames,
      lastFrameMs: perfState.lastFrameMs,
      avgFrameMs,
      p95FrameMs: percentile(frames, 95),
      maxFrameMs: perfState.maxFrameMs,
      domLabelRebuilds: perfState.domLabelRebuilds,
      domLabelSettleRebuilds: perfState.domLabelSettleRebuilds,
      domLabelSkippedWhileMoving: perfState.domLabelSkippedWhileMoving,
      domLabelLastCount: perfState.domLabelLastCount,
      domLabelLastMs: perfState.domLabelLastMs,
      domLabelAvgMs: perfState.domLabelRebuilds ? perfState.domLabelTotalMs / perfState.domLabelRebuilds : 0,
      domLabelMaxMs: perfState.domLabelMaxMs,
      placeLabelFetches: perfState.placeLabelFetches,
      placeLabelAborts: perfState.placeLabelAborts,
      placeLabelLastCount: perfState.placeLabelLastCount,
      placeLabelLastFetchMs: perfState.placeLabelLastFetchMs,
      placeLabelLastRenderMs: perfState.placeLabelLastRenderMs,
      placeLabelMaxRenderMs: perfState.placeLabelMaxRenderMs,
      placeLabelSource: perfState.placeLabelSource,
      polarOverlayPathCount: perfState.polarOverlayPathCount,
      polarOverlayDraws: perfState.polarOverlayDraws,
      polarOverlayLastMs: perfState.polarOverlayLastMs,
      polarOverlayMaxMs: perfState.polarOverlayMaxMs,
      lineFeatureCount: (currentData.features || []).length,
      elapsedMs: perfNow() - perfStartedAt,
    };
  }

  function postPerfSnapshot(reason) {
    if (!ACG_PERF_MODE) return;
    postToParent({ type: 'perf', reason: reason || 'snapshot', state: getPerfState() });
  }

  // Calibrated empirically on an M2 MacBook (1920×1080 logical), ~1040 px
  // map panel: at zoom 2.7 the visual sphere ≈ 1040 px, giving the scaling
  // relation  diameter_px ≈ 160 · 2^z  (not 256·2^z — MapLibre's globe
  // visual scale differs from its Mercator tile scale). So to target a
  // sphere that fills ``shrinkFactor`` of the shorter viewport dim:
  //     z = log2(shrinkFactor · min(W, H) / 160)
  // With minZoom: -2 on the Map so MapLibre doesn't clamp us back up.
  const GLOBE_VISUAL_SCALE = 160;
  function globeZoomForViewport(shrinkFactor = 0.96) {
    const W = window.innerWidth  || 800;
    const H = window.innerHeight || 600;
    const D = Math.min(W, H) * shrinkFactor;
    return Math.log2(D / GLOBE_VISUAL_SCALE);
  }

  function retainRuntimeOverlayStyle(previousStyle, nextStyle) {
    const retained = JSON.parse(JSON.stringify(nextStyle));
    retained.sources = Object.assign({}, retained.sources || {});
    retained.layers = Array.isArray(retained.layers) ? retained.layers.slice() : [];
    const nextLayerIds = new Set(retained.layers.map((layer) => layer && layer.id));
    for (const sourceId of RUNTIME_OVERLAY_SOURCE_IDS) {
      const source = previousStyle && previousStyle.sources && previousStyle.sources[sourceId];
      if (source && !retained.sources[sourceId]) retained.sources[sourceId] = source;
    }
    for (const layer of (previousStyle && previousStyle.layers) || []) {
      if (!layer || !RUNTIME_OVERLAY_SOURCE_IDS.has(layer.source) || nextLayerIds.has(layer.id)) continue;
      retained.layers.push(layer);
      nextLayerIds.add(layer.id);
    }
    return retained;
  }

  function replayRuntimeOverlays() {
    if (!map) return false;
    try {
      applyVectorBasemapStyle();
      ensureEclipseLayers();
      ensureAsterismLayer();
      ensureAcgLayers();
      const acgSource = map.getSource(ACG_SOURCE_ID);
      const acgLabelSource = map.getSource(ACG_LABEL_SOURCE_ID);
      const asterismSource = map.getSource(ASTERISM_SOURCE_ID);
      const eclipseSource = map.getSource(ECLIPSE_SOURCE_ID);
      if (acgSource) acgSource.setData(currentMapData);
      if (acgLabelSource) acgLabelSource.setData(currentMapData);
      if (asterismSource) asterismSource.setData(currentMapAsterismData);
      if (eclipseSource) eclipseSource.setData(currentMapEclipseData);
      syncBirthplaceMarker();
      syncParanVisibility();
      syncAsterismVisibility();
      syncReferenceVisibility();
      syncTerrainRelief();
      raiseAcgLayers();
      renderDomAcgLabels('style-replay');
      updateLegend();
      return !!(
        map.getLayer('acg-lines-solid') &&
        map.getLayer('acg-reference-asc') &&
        map.getLayer('acg-asterisms') &&
        map.getLayer('eclipse-path-center')
      );
    } catch (_) {
      return false;
    }
  }

  function scheduleRuntimeOverlayReplay(attempt = 0) {
    if (!mapHostActive) return;
    if (runtimeOverlayReplayTimer) window.clearTimeout(runtimeOverlayReplayTimer);
    runtimeOverlayReplayTimer = window.setTimeout(() => {
      runtimeOverlayReplayTimer = null;
      if (replayRuntimeOverlays()) return;
      if (attempt < 24) scheduleRuntimeOverlayReplay(attempt + 1);
    }, attempt === 0 ? 0 : Math.min(250, 20 * attempt));
  }

  function adoptOnlineBasemap(style) {
    if (!style || onlineBasemapAdopted) return;
    if (!map || !mapReady) {
      pendingOnlineBasemapStyle = style;
      return;
    }
    const wasLocal = USE_LOCAL_BASEMAP;
    const wasMinimal = USE_MINIMAL_BASEMAP;
    USE_LOCAL_BASEMAP = false;
    USE_MINIMAL_BASEMAP = false;
    pendingOnlineBasemapStyle = null;
    onlineBasemapAdopted = true;
    setPerfTileSource('online');
    try {
      map.setStyle(prepareBaseStyleForTheme(style, IS_DARK), {
        diff: true,
        transformStyle: retainRuntimeOverlayStyle,
      });
      scheduleRuntimeOverlayReplay();
    } catch (_) {
      onlineBasemapAdopted = false;
      USE_LOCAL_BASEMAP = wasLocal;
      USE_MINIMAL_BASEMAP = wasMinimal;
      setPerfTileSource(wasLocal ? 'local' : 'minimal');
    }
  }

  function scheduleOnlineBasemapAdoption() {
    if (
      !mapHostActive ||
      !mapReady ||
      !pendingOnlineBasemapStyle ||
      onlineBasemapAdopted ||
      onlineBasemapAdoptionScheduled
    ) return;
    onlineBasemapAdoptionScheduled = true;
    window.setTimeout(() => {
      onlineBasemapAdoptionScheduled = false;
      adoptOnlineBasemap(pendingOnlineBasemapStyle);
    }, 0);
  }

  function initMap() {
    if (!window.maplibregl || !window.maplibregl.Map) {
      showMapUnavailable('Map renderer unavailable offline');
      return;
    }
    ensureViewOptionDefaults();
    if (window.pmtiles && maplibregl.addProtocol) {
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
    }
    map = new maplibregl.Map({
      container: 'map',
      style: buildStyle(IS_DARK),
      center: [0, 20],
      zoom: globeZoomForViewport(),
      minZoom: -2,                        // let the sphere shrink below MapLibre's auto clamp
      maxPitch: 85,
      projection: { type: selectedProjection },
      attributionControl: { compact: true },
    });
    ensurePolarOverlayCanvas();
    let fallbackStylePending = false;
    let startupFallbackTimer = window.setTimeout(() => {
      if (mapReady) return;
      if (USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP) {
        USE_LOCAL_BASEMAP = false;
        USE_MINIMAL_BASEMAP = true;
        fallbackStylePending = true;
        setPerfTileSource('minimal');
        armFallbackTimer();
        try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {
          showMapUnavailable('Map tiles unavailable');
        }
        return;
      }
      if (!USE_MINIMAL_BASEMAP) {
        switchToOfflineFallback();
        return;
      }
      showMapUnavailable('Map tiles unavailable');
    }, 8000);
    const armFallbackTimer = () => {
      window.clearTimeout(startupFallbackTimer);
      startupFallbackTimer = window.setTimeout(() => {
        if (!fallbackStylePending) return;
        if (USE_LOCAL_BASEMAP) {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          fallbackStylePending = true;
          setPerfTileSource('minimal');
          try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {
            showMapUnavailable('Map tiles unavailable');
          }
          return;
        }
        showMapUnavailable('Map tiles unavailable');
      }, 5000);
    };
    const switchToOfflineFallback = () => {
      if (!map || fallbackStylePending || USE_LOCAL_BASEMAP || USE_MINIMAL_BASEMAP) return;
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      fallbackStylePending = true;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      armFallbackTimer();
      try {
        map.setStyle(buildStyle(IS_DARK));
      } catch (_) {
        if (USE_LOCAL_BASEMAP) {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          setPerfTileSource('minimal');
          map.setStyle(buildMinimalOfflineStyle(IS_DARK));
        }
      }
    };
    // Re-fit globe zoom on container resize so the sphere keeps matching the
    // viewport. Mercator mode stays put (user may have panned).
    // Intentionally no auto zoom-reset on resize: once the user (or apply_state)
    // has set a viewport we must not clobber it. Use window.ACG.fitGlobe()
    // explicitly if you want to re-centre the sphere in the current viewport.
    map.addControl(new maplibregl.NavigationControl({
      showCompass: true,
      visualizePitch: true,
    }), 'top-left');
    map.on('style.load', () => {
      const firstStyleLoad = !mapReady;
      window.clearTimeout(startupFallbackTimer);
      fallbackStylePending = false;
      applyVectorBasemapStyle();
      ensureEclipseLayers();
      ensureAsterismLayer();
      ensureAcgLayers();
      loadPlaceLabels();
      if (map && typeof map.once === 'function') {
        map.once('idle', () => {
          schedulePlaceLabelsRender('idle');
          scheduleCityLabelsRefresh('idle');
        });
      }
      if (firstStyleLoad) {
        // Force-apply the currently selected projection at first render.
        // Some environments initialise MapLibre in an interim projection;
        // this must not overwrite a user click made while the style loads.
        try { map.setProjection({ type: selectedProjection }); } catch (_) {}
        if (selectedProjection === 'globe') {
          map.jumpTo({ zoom: globeZoomForViewport() });
        }
      }
      applyPendingCamera();
      if (pendingData) { currentData = pendingData; pendingData = null; }
      if (ACTIVE_ASTROCART_STYLE) {
        applyDisplayStyle(ACTIVE_ASTROCART_STYLE, false);
      }
      let fitPendingEclipse = false;
      if (pendingEclipseData) {
        currentEclipseData = pendingEclipseData;
        pendingEclipseData = null;
        fitPendingEclipse = true;
      }
      if (pendingAsterismData) {
        currentAsterismData = pendingAsterismData;
        pendingAsterismData = null;
      }
      pushData();
      pushAsterismData();
      pushEclipseData({ fit: fitPendingEclipse });
      syncTerrainRelief();
      mapReady = true;
      postToParent({ type: 'ready' });
      if (firstStyleLoad) {
        perfState.mapLoadMs = perfNow() - perfStartedAt;
        postPerfSnapshot('map-ready');
      }
      revealMapAfterStyledPaint();
      setStatus(`${(currentData.features || []).length} lines loaded`);
      if (firstStyleLoad) scheduleOnlineBasemapAdoption();
    });
    for (const layer of ['acg-lines-solid', 'acg-lines-dashed']) {
      map.on('click', layer, onLineClick);
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    }
    for (const layer of ['eclipse-path-shadow', 'eclipse-path-fill', 'eclipse-path-limits', 'eclipse-path-center', 'eclipse-path-max']) {
      map.on('click', layer, onEclipseClick);
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    }
    map.on('mousemove', 'acg-asterism-star-hit', onAsterismStarMove);
    map.on('mouseenter', 'acg-asterism-star-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'acg-asterism-star-hit', () => hideAsterismStarPopup('native'));
    map.on('mousemove', onPolarAsterismStarMove);
    map.on('mouseleave', () => hideAsterismStarPopup());
    map.on('error', (event) => {
      if (fallbackStylePending) {
        // Ignore late errors from the abandoned online style. A confirmed
        // failure from our PMTiles source falls through to the bundled-data
        // minimal style; the timer covers source-less/ambiguous failures.
        if (USE_LOCAL_BASEMAP && event && event.sourceId === 'protomaps') {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          setPerfTileSource('minimal');
          armFallbackTimer();
          try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        }
        return;
      }
      if (USE_LOCAL_BASEMAP && event && event.sourceId === 'protomaps') {
        USE_LOCAL_BASEMAP = false;
        USE_MINIMAL_BASEMAP = true;
        fallbackStylePending = true;
        setPerfTileSource('minimal');
        armFallbackTimer();
        try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        return;
      }
      if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP) {
        const sourceId = String(event && event.sourceId || '');
        // Once the online style has loaded, keep it. Individual tile/glyph
        // errors and style-validation warnings must never replace the online
        // design with the deliberately sparse emergency map. Only a confirmed
        // failure from one of the online basemap sources may trigger fallback.
        if (!mapReady && ONLINE_BASEMAP_SOURCE_IDS.has(sourceId)) switchToOfflineFallback();
      }
    });
    map.on('contextmenu', onMapContextMenu);
    map.on('click', hideContextMenu);
    map.on('render', () => {
      if (ACG_PERF_MODE) recordRenderFrame();
      renderPolarOverlay();
    });
    map.on('movestart', () => beginDomAcgMovement('move'));
    map.on('zoomstart', () => beginDomAcgMovement('zoom'));
    map.on('move', () => {
      if (ACG_PERF_MODE) perfState.moveEvents += 1;
      scheduleDomAcgLabels('move');
    });
    map.on('zoom', () => {
      if (ACG_PERF_MODE) perfState.zoomEvents += 1;
      scheduleDomAcgLabels('zoom');
    });
    map.on('resize', () => {
      if (ACG_PERF_MODE) perfState.resizeEvents += 1;
      scheduleCityLabelsRefresh('resize');
      scheduleDomAcgLabels('resize');
    });
    map.on('moveend', () => {
      endDomAcgMovement('moveend');
      scheduleCityLabelsRefresh('moveend');
      scheduleViewStatePost('moveend');
    });
    map.on('zoomend', () => {
      endDomAcgMovement('zoomend');
      scheduleCityLabelsRefresh('zoomend');
    });
    wireControlsOnce();
    setStatus('map ready');
  }

  function revealMapAfterStyledPaint() {
    const mapEl = document.getElementById('map');
    if (!mapEl || !mapEl.classList.contains('map-booting')) return;
    const reveal = () => mapEl.classList.remove('map-booting');
    if (map && typeof map.once === 'function') {
      let rendered = 0;
      const afterRender = () => {
        rendered += 1;
        if (rendered < 2) {
          map.once('render', afterRender);
          if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
          return;
        }
        window.requestAnimationFrame(reveal);
      };
      map.once('render', afterRender);
      if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
      return;
    }
    window.requestAnimationFrame(reveal);
  }

  function hideMapUntilStyledPaint() {
    const mapEl = document.getElementById('map');
    if (mapEl) mapEl.classList.add('map-booting');
  }

  function showMapUnavailable(message) {
    setPerfTileSource('none');
    postPerfSnapshot('map-unavailable');
    const container = document.getElementById('map');
    if (container) {
      container.classList.remove('map-booting');
      container.innerHTML = `<div style="padding:14px;color:var(--chrome-dim);font-size:12px">${message}</div>`;
    }
    setStatus(message);
  }

  function bootMap() {
    if (URL_THEME.get('offline') === '1') {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    // Paint from local resources immediately. The online Liberty style is a
    // progressive enhancement, never a gate for ACG/eclipses/asterisms. When
    // it arrives, transformStyle retains the live overlay sources and layers
    // while MapLibre swaps only the basemap beneath them.
    USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
    USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
    setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
    setStatus(USE_LOCAL_BASEMAP ? 'loading map…' : 'map ready');
    initMap();
    loadBaseVectorStyle(8000).then(
      (style) => {
        pendingOnlineBasemapStyle = style;
        scheduleOnlineBasemapAdoption();
      },
      () => {},
    );
  }

  function ensureEclipseLayers() {

  function acgLineColorExpression(s) {
    return [
      'case',
      ['has', 'color'], ['get', 'color'],
      ['match', ['get', 'kind'],
        'MC', s.fallbackMcColor,
        'IC', s.fallbackIcColor,
        'ASC', s.fallbackAscColor,
        'DSC', s.fallbackDscColor,
        s.fallbackUnknownColor,
      ],
    ];
  }

  function scaledPointLineMetric(baseValue, property) {
    return ['*', baseValue, ['number', ['get', property], 1]];
  }

  function asterismStarRadiusExpression(settings) {
    return [
      'interpolate', ['exponential', 1.35],
      ['number', ['get', 'magnitude'], 6.7],
      -1.5, settings.asterismStarRadiusMax,
      6.7, settings.asterismStarRadiusMin,
    ];
  }

  function asterismStarRadius(magnitude, settings) {
    const value = typeof magnitude === 'number' && Number.isFinite(magnitude)
      ? magnitude
      : 6.7;
    const maximum = Number(settings.asterismStarRadiusMax);
    const minimum = Number(settings.asterismStarRadiusMin);
    if (value <= -1.5) return maximum;
    if (value >= 6.7) return minimum;
    const factor = (Math.pow(1.35, value + 1.5) - 1) / (Math.pow(1.35, 8.2) - 1);
    return maximum + (minimum - maximum) * factor;
  }

  function hideAsterismStarPopup(mode = '') {
    if (mode && asterismStarPopupMode !== mode) return;
    if (asterismStarPopup) asterismStarPopup.remove();
    asterismStarPopupMode = '';
    if (map) map.getCanvas().style.cursor = '';
  }

  function showAsterismStarPopup(name, coordinate, mode) {
    if (!map || !name) {
      hideAsterismStarPopup();
      return;
    }
    if (!asterismStarPopup) {
      asterismStarPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 9,
      });
    }
    asterismStarPopupMode = mode;
    asterismStarPopup
      .setLngLat(coordinate)
      .setText(name)
      .addTo(map);
    map.getCanvas().style.cursor = 'pointer';
  }

  function onAsterismStarMove(event) {
    const feature = event.features && event.features[0];
    const name = String(feature && feature.properties && feature.properties.name || '').trim();
    showAsterismStarPopup(name, event.lngLat, 'native');
  }

  function onPolarAsterismStarMove(event) {
    if (
      !map || !mapHostActive || selectedProjection !== 'globe' ||
      !viewOptions.asterisms || !event || !event.point
    ) {
      hideAsterismStarPopup('polar');
      return;
    }
    let nearest = null;
    let nearestDistanceSquared = 64;
    for (const target of polarAsterismStarHitTargets) {
      const dx = Number(event.point.x) - target.point.x;
      const dy = Number(event.point.y) - target.point.y;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared <= nearestDistanceSquared) {
        nearest = target;
        nearestDistanceSquared = distanceSquared;
      }
    }
    if (!nearest) {
      hideAsterismStarPopup('polar');
      return;
    }
    const name = String(nearest.properties.name || '').trim();
    if (!name) {
      hideAsterismStarPopup('polar');
      return;
    }
    showAsterismStarPopup(name, nearest.coordinate, 'polar');
  }

  function referenceBehavior() {
    return ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.behavior || {};
  }

  function ascendantOverlayFilter(baseFilter) {
    if (referenceBehavior().showAscCircle) return baseFilter;
    return [
      'all',
      baseFilter,
      ['!=', ['get', 'point'], NATAL_ASC_POINT_ID],
    ];
  }

  function acgCasingFilter() {
    return ascendantOverlayFilter(['!=', ['get', 'kind'], 'PARAN']);
  }

  function acgSolidFilter() {
    return ascendantOverlayFilter(
      ['match', ['get', 'kind'], ['MC', 'ASC', 'LOCAL_SPACE'], true, false],
    );
  }

  function acgDashedFilter() {
    return ascendantOverlayFilter(
      ['match', ['get', 'kind'], ['IC', 'DSC'], true, false],
    );
  }

  function acgLabelFilter() {
    return ascendantOverlayFilter(['!=', ['get', 'kind'], 'PARAN']);
  }

  function isAcgFeatureVisible(feature) {
    const props = feature && feature.properties || {};
    return props.point !== NATAL_ASC_POINT_ID || !!referenceBehavior().showAscCircle;
  }

  function syncAcgLineVisibility() {
    if (!map) return;
    for (const [id, filter] of [
      ['acg-casing', acgCasingFilter()],
      ['acg-lines-solid', acgSolidFilter()],
      ['acg-lines-dashed', acgDashedFilter()],
      ['acg-labels', acgLabelFilter()],
    ]) {
      if (map.getLayer(id)) map.setFilter(id, filter);
    }
  }

  function zodiacReferenceColor(sign, settings) {
    const style = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
      ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${sign}`];
    return style && style.color || settings.referenceZodiacGridColor;
  }

  function houseReferenceColor(house, settings) {
    if (house === 1 || house === 7) return settings.referenceAscColor;
    if (house === 4 || house === 10) return settings.referenceMcColor;
    return settings.referenceHouseGridColor;
  }

  function zodiacGridColorExpression(settings) {
    const expression = ['match', ['number', ['get', 'sign'], -1]];
    for (let sign = 0; sign < 12; sign += 1) {
      expression.push(sign, zodiacReferenceColor(sign, settings));
    }
    expression.push(settings.referenceZodiacGridColor);
    return expression;
  }

  function houseGridColorExpression(settings) {
    return [
      'match', ['number', ['get', 'house'], -1],
      1, settings.referenceAscColor,
      7, settings.referenceAscColor,
      4, settings.referenceMcColor,
      10, settings.referenceMcColor,
      settings.referenceHouseGridColor,
    ];
  }

  function houseGridOpacityExpression(settings) {
    return [
      'case',
      ['boolean', ['get', 'angle'], false],
      Math.min(1, settings.referenceGridLineOpacity * 1.45),
      settings.referenceGridLineOpacity,
    ];
  }

  function clearReferenceSignMarkers() {
    for (const marker of referenceSignMarkers) marker.remove();
    referenceSignMarkers = [];
  }

  function ensureReferenceSignFont(size) {
    if (referenceSignFontReady) return true;
    if (!referenceSignFontPromise) {
      referenceSignFontPromise = document.fonts.load(`${Math.max(12, size)}px 'Morinus'`, 'a')
        .then(() => {
          referenceSignFontReady = true;
          syncReferenceLabelMarkers();
        })
        .catch((error) => console.error('[acg-reference-font]', error));
    }
    return false;
  }

  function syncReferenceLabelMarkers() {
    clearReferenceSignMarkers();
    if (!map) return;
    const behavior = referenceBehavior();
    const s = currentDevSettings();
    if (!ensureReferenceSignFont(Math.max(s.referenceSignSize, s.referencePoleSignSize))) return;
    for (const feature of currentAsterismData.features || []) {
      const props = feature && feature.properties || {};
      const geometry = feature && feature.geometry || {};
      const coordinates = geometry.coordinates;
      const isEclipticSign = props.kind === 'REFERENCE_ZODIAC_SIGN' && !!behavior.showEcliptic;
      const isPoleSign = props.kind === 'REFERENCE_ZODIAC_POLE_SIGN' && !!behavior.showZodiacLines;
      const isHouseNumber = props.kind === 'REFERENCE_HOUSE_POLE_LABEL' && !!behavior.showHouseLines;
      if (
        !(isEclipticSign || isPoleSign || isHouseNumber) ||
        geometry.type !== 'Point' ||
        !Array.isArray(coordinates) ||
        coordinates.length < 2 ||
        !Number.isFinite(coordinates[0]) ||
        !Number.isFinite(coordinates[1])
      ) continue;
      const element = document.createElement('span');
      let halo = s.referenceSignHaloWidth;
      if (isHouseNumber) {
        element.className = 'acg-reference-house-number';
        element.textContent = String(props.label || props.house || '');
        element.style.fontSize = `${s.referencePoleHouseSize}px`;
        element.style.color = houseReferenceColor(Number(props.house), s);
        element.style.opacity = String(s.referencePoleLabelOpacity);
        halo = s.referencePoleLabelHaloWidth;
      } else {
        const signStyle = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
          ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${props.sign}`];
        const glyph = signStyle && signStyle.glyphMorinus || props.glyph;
        if (!glyph) continue;
        element.className = isPoleSign ? 'acg-reference-pole-sign' : 'acg-reference-sign';
        element.textContent = String(glyph);
        element.style.fontSize = `${isPoleSign ? s.referencePoleSignSize : s.referenceSignSize}px`;
        element.style.color = zodiacReferenceColor(Number(props.sign), s);
        element.style.opacity = String(isPoleSign ? s.referencePoleLabelOpacity : s.referenceSignOpacity);
        halo = isPoleSign ? s.referencePoleLabelHaloWidth : s.referenceSignHaloWidth;
      }
      halo = Math.max(0.5, Number(halo) || 0.5);
      element.style.textShadow = `0 0 ${halo}px ${s.labelHalo}, 0 0 ${halo * 3}px ${s.labelHalo}`;
      const visibleOpacity = element.style.opacity || '1';
      // A newly attached DOM marker is painted before MapLibre's first globe
      // occlusion pass. Start transparent so far-side replacements cannot flash
      // through the sphere while a house-system refresh rebuilds this payload.
      element.style.opacity = '0';
      const marker = new maplibregl.Marker({
        element,
        anchor: 'center',
        opacity: visibleOpacity,
        opacityWhenCovered: '0',
      })
        .setLngLat(coordinates)
        .addTo(map);
      // Force the first occlusion decision synchronously after attachment;
      // otherwise MapLibre defers it until its next marker update.
      marker.setOpacity(visibleOpacity, '0');
      referenceSignMarkers.push(marker);
    }
  }

  function syncReferenceVisibility() {
    const behavior = referenceBehavior();
    const visibility = {
      'acg-reference-house-lines': !!behavior.showHouseLines,
      'acg-reference-zodiac-lines': !!behavior.showZodiacLines,
      'acg-reference-ecliptic': !!behavior.showEcliptic,
      'acg-reference-zodiac-ticks': !!behavior.showEcliptic,
      'acg-reference-equator': !!behavior.showEquator,
      'acg-reference-asc': !!behavior.showAscCircle,
      'acg-reference-mc': !!behavior.showMcCircle,
    };
    for (const [id, visible] of Object.entries(visibility)) {
      if (map && map.getLayer(id)) {
        map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
      }
    }
    syncAcgLineVisibility();
    syncReferenceLabelMarkers();
  }

  function ensureAsterismLayer() {
    if (!map.getSource(ASTERISM_SOURCE_ID)) {
      map.addSource(ASTERISM_SOURCE_ID, { type: 'geojson', data: currentMapAsterismData });
    }
    const s = currentDevSettings();
    const visibility = viewOptions.asterisms ? 'visible' : 'none';
    const behavior = referenceBehavior();
    const addReferenceLine = (
      id, kind, color, visible, dash, widthScale = 1.0,
      baseWidth = s.referenceLineWidth, opacity = s.referenceLineOpacity,
    ) => {
      if (map.getLayer(id)) return;
      const paint = {
        'line-color': color,
        'line-width': baseWidth * widthScale,
        'line-opacity': opacity,
      };
      if (dash) paint['line-dasharray'] = dash;
      map.addLayer({
        id,
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], kind],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility: visible ? 'visible' : 'none',
        },
        paint,
      });
    };
    // Establish the simple angle circles first. A malformed optional grid
    // expression must never prevent the independently enabled ASC/DSC horizon
    // or MC/IC meridian from being created during a style replay.
    addReferenceLine(
      'acg-reference-ecliptic', 'REFERENCE_ECLIPTIC',
      s.referenceEclipticColor, !!behavior.showEcliptic, null, 1.25,
    );
    addReferenceLine(
      'acg-reference-zodiac-ticks', 'REFERENCE_ZODIAC_TICK',
      s.referenceEclipticColor, !!behavior.showEcliptic, null, 0.8,
    );
    addReferenceLine(
      'acg-reference-equator', 'REFERENCE_EQUATOR',
      s.referenceEquatorColor, !!behavior.showEquator, [2, 2],
    );
    addReferenceLine(
      'acg-reference-asc', 'REFERENCE_ASC',
      s.referenceAscColor, !!behavior.showAscCircle,
    );
    addReferenceLine(
      'acg-reference-mc', 'REFERENCE_MC',
      s.referenceMcColor, !!behavior.showMcCircle,
    );
    addReferenceLine(
      'acg-reference-house-lines', 'REFERENCE_HOUSE_LINE',
      houseGridColorExpression(s), !!behavior.showHouseLines,
      null, 1.0, s.referenceGridLineWidth, houseGridOpacityExpression(s),
    );
    addReferenceLine(
      'acg-reference-zodiac-lines', 'REFERENCE_ZODIAC_LINE',
      zodiacGridColorExpression(s), !!behavior.showZodiacLines,
      null, 1.0, s.referenceGridLineWidth, s.referenceGridLineOpacity,
    );
    if (!map.getLayer('acg-asterism-shadow')) {
      map.addLayer({
        id: 'acg-asterism-shadow',
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility,
        },
        paint: {
          'line-color': s.asterismShadowColor,
          'line-width': s.asterismLineWidth + (s.asterismShadowSpread * 2),
          'line-opacity': s.asterismShadowOpacity,
          'line-blur': s.asterismShadowBlur,
        },
      });
    }
    if (!map.getLayer('acg-asterisms')) {
      map.addLayer({
        id: 'acg-asterisms',
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility,
        },
        paint: {
          'line-color': s.asterismHighlightColor,
          'line-width': s.asterismLineWidth,
          'line-opacity': s.asterismLineOpacity,
        },
      });
    }
    if (!map.getLayer('acg-asterism-star-shadow')) {
      map.addLayer({
        id: 'acg-asterism-star-shadow',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': s.asterismShadowColor,
          'circle-radius': ['+', asterismStarRadiusExpression(s), s.asterismShadowSpread],
          'circle-opacity': s.asterismShadowOpacity,
          'circle-blur': s.asterismShadowBlur,
        },
      });
    }
    if (!map.getLayer('acg-asterism-stars')) {
      map.addLayer({
        id: 'acg-asterism-stars',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': s.asterismHighlightColor,
          'circle-radius': asterismStarRadiusExpression(s),
          'circle-opacity': s.asterismStarOpacity,
          'circle-stroke-color': s.asterismShadowColor,
          'circle-stroke-width': s.asterismShadowSpread,
          'circle-stroke-opacity': s.asterismStarOpacity,
        },
      });
    }
    if (!map.getLayer('acg-asterism-star-hit')) {
      map.addLayer({
        id: 'acg-asterism-star-hit',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': 'rgba(0,0,0,0)',
          'circle-radius': 8,
        },
      });
    }
    if (!map.getLayer('acg-asterism-labels')) {
      map.addLayer({
        id: 'acg-asterism-labels',
        type: 'symbol',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_LABEL'],
        layout: {
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Regular'],
          'text-size': s.asterismLabelSize,
          'text-letter-spacing': s.asterismLabelSpacing,
          'text-anchor': 'center',
          'text-padding': 2,
          'symbol-sort-key': ['get', 'rank'],
          visibility,
        },
        paint: {
          'text-color': s.asterismHighlightColor,
          'text-halo-color': s.asterismShadowColor,
          'text-halo-width': s.asterismLabelHaloWidth,
          'text-halo-blur': s.asterismShadowBlur,
          'text-opacity': s.asterismLabelOpacity,
        },
      });
    }
  }

  function ensureAcgLayers() {
    if (!map.getSource(ACG_SOURCE_ID)) {
      map.addSource(ACG_SOURCE_ID, { type: 'geojson', data: currentMapData });
    }
    // Keep online line labels on the parallel source used by HEAD. Attaching a
    // line-placed symbol layer to the shared source can blank Liberty's lines.
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getSource(ACG_LABEL_SOURCE_ID)) {
      map.addSource(ACG_LABEL_SOURCE_ID, { type: 'geojson', data: currentMapData });
    }
    // Thin neutral outline so colored lines stay readable without looking heavy.
    // Filter excludes parans — they have their own (off-by-default) style.
    const t = currentThemeTokens();
    const s = currentDevSettings();
    const colorExpr = acgLineColorExpression(s);
    if (!map.getLayer('acg-casing')) {
      map.addLayer({
        id: 'acg-casing',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgCasingFilter(),
        paint: {
          'line-color': t.casing,
          'line-width': scaledPointLineMetric(s.casingWidth, 'line_width_scale'),
          'line-opacity': scaledPointLineMetric(s.casingOpacity, 'line_opacity'),
        },
      });
    }
    if (!map.getLayer('acg-lines-solid')) {
      map.addLayer({
        id: 'acg-lines-solid',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgSolidFilter(),
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(s.solidWidth, 'line_width_scale'),
          'line-opacity': scaledPointLineMetric(s.solidOpacity, 'line_opacity'),
        },
      });
    }
    if (!map.getLayer('acg-lines-dashed')) {
      map.addLayer({
        id: 'acg-lines-dashed',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgDashedFilter(),
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(s.dashedWidth, 'line_width_scale'),
          'line-opacity': scaledPointLineMetric(s.dashedOpacity, 'line_opacity'),
          'line-dasharray': [s.dashedOn, s.dashedOff],
        },
      });
    }
    if (!map.getLayer('acg-parans')) {
      map.addLayer({
        id: 'acg-parans',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'PARAN'],
        layout: {
          'visibility': viewOptions.parans ? 'visible' : 'none',
        },
        paint: {
          'line-color': t.paranColor,
          'line-width': s.paranWidth,
          'line-opacity': s.paranOpacity,
          'line-dasharray': [s.paranDashOn, s.paranDashOff],
        },
      });
    }
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getLayer('acg-labels')) {
      map.addLayer({
        id: 'acg-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgLabelFilter(),
        layout: {
          'symbol-placement': 'line',
          'text-font': ['Noto Sans Regular'],

  function birthplaceCoordinates(data) {
    const meta = data && data.meta || {};
    const origin = meta.origin || {};
    const lon = Number(origin.lon != null ? origin.lon : meta.lon);
    const lat = Number(origin.lat != null ? origin.lat : meta.lat);
    if (!Number.isFinite(lon) || !Number.isFinite(lat) || lat < -90 || lat > 90) return null;
    return [lon, lat];
  }

  function applyBirthplaceMarkerLabel() {
    if (!birthplaceMarkerElement) return;
    const label = String(uiLabels.birthplaceMarker || '');
    if (label) {
      birthplaceMarkerElement.setAttribute('aria-label', label);
      birthplaceMarkerElement.setAttribute('title', label);
    } else {
      birthplaceMarkerElement.removeAttribute('aria-label');
      birthplaceMarkerElement.removeAttribute('title');
    }
  }

  function updateBirthplaceDragPosition(event) {
    if (!map || !birthplaceMarker || !event) return;
    const rect = map.getContainer().getBoundingClientRect();
    const point = [event.clientX - rect.left, event.clientY - rect.top];
    try { birthplaceMarker.setLngLat(map.unproject(point)); } catch (_) {}
  }

  function finishBirthplaceDrag(event, commit) {
    const state = birthplaceDrag;
    if (!state) return;
    birthplaceDrag = null;
    if (state.timer) window.clearTimeout(state.timer);
    if (commit && state.dragging) {
      state.moved = state.moved || Math.hypot(
        event.clientX - state.startX,
        event.clientY - state.startY,
      ) > 1;
      updateBirthplaceDragPosition(event);
    }
    if (birthplaceMarkerElement) birthplaceMarkerElement.classList.remove('dragging');
    if (state.dragPanWasEnabled && map && map.dragPan) {
      try { map.dragPan.enable(); } catch (_) {}
    }
    if (birthplaceMarkerElement && state.pointerId != null) {
      try {
        if (birthplaceMarkerElement.hasPointerCapture(state.pointerId)) {
          birthplaceMarkerElement.releasePointerCapture(state.pointerId);
        }
      } catch (_) {}
    }
    if (commit && state.dragging && state.moved && birthplaceMarker) {
      const lngLat = birthplaceMarker.getLngLat();
      sendHereRequest('set_pob', lngLat, '');
    }
  }

  function wireBirthplaceMarker(element) {
    element.addEventListener('pointerdown', (event) => {
      if (event.button != null && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      hideContextMenu();
      if (birthplaceDrag) finishBirthplaceDrag(event, false);
      const state = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        dragging: false,
        moved: false,
        dragPanWasEnabled: false,
        timer: null,
      };
      birthplaceDrag = state;
      try { element.setPointerCapture(event.pointerId); } catch (_) {}
      state.timer = window.setTimeout(() => {
        if (birthplaceDrag !== state) return;
        state.dragging = true;
        state.dragPanWasEnabled = !!(map && map.dragPan && map.dragPan.isEnabled());
        if (state.dragPanWasEnabled) {
          try { map.dragPan.disable(); } catch (_) {}
        }
        element.classList.add('dragging');
        updateBirthplaceDragPosition(event);
      }, BIRTHPLACE_LONG_PRESS_MS);
    });
    element.addEventListener('pointermove', (event) => {
      const state = birthplaceDrag;
      if (!state || state.pointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      if (!state.dragging) {
        const distance = Math.hypot(event.clientX - state.startX, event.clientY - state.startY);
        if (distance > BIRTHPLACE_PRESS_MOVE_TOLERANCE_PX && state.timer) {
          window.clearTimeout(state.timer);
          state.timer = null;
        }
        return;
      }
      state.moved = true;
      updateBirthplaceDragPosition(event);
    });
    element.addEventListener('pointerup', (event) => {
      event.preventDefault();
      event.stopPropagation();
      finishBirthplaceDrag(event, true);
    });
    element.addEventListener('pointercancel', (event) => finishBirthplaceDrag(event, false));
    for (const type of ['click', 'dblclick', 'contextmenu']) {
      element.addEventListener(type, (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
    }
  }

  function syncBirthplaceMarker() {
    const coordinates = birthplaceCoordinates(currentData);
    if (!coordinates || !map || !window.maplibregl || !window.maplibregl.Marker) {
      if (birthplaceMarker) {
        try { birthplaceMarker.remove(); } catch (_) {}
      }
      birthplaceMarker = null;
      birthplaceMarkerElement = null;
      return;
    }
    if (!birthplaceMarker) {
      const element = document.createElement('div');
      element.className = 'acg-birthplace-marker';
      const glyph = document.createElement('span');
      glyph.className = 'acg-birthplace-marker-glyph';
      glyph.textContent = '*';
      element.appendChild(glyph);
      element.setAttribute('role', 'img');
      wireBirthplaceMarker(element);
      birthplaceMarkerElement = element;
      applyBirthplaceMarkerLabel();
      birthplaceMarker = new maplibregl.Marker({ element, anchor: 'center' })
        .setLngLat(coordinates)
        .addTo(map);
      return;
    }
    birthplaceMarker.setLngLat(coordinates);
  }

  function applyDisplayStyle(payload, shouldPush = true) {
    const pointStyles = payload && payload.points || {};
    for (const feature of currentData.features || []) {
      const props = feature && feature.properties || {};
      if (props.point && pointStyles[props.point]) {
        const style = pointStyles[props.point];
        if (style.label) props.label = style.label;
        if (style.color) props.color = style.color;
        else delete props.color;
        if (style.glyphMorinus != null) props.glyph_morinus = style.glyphMorinus;
        props.line_width_scale = style.lineWidthScale;
        props.line_opacity = style.lineOpacity;
      }
      if (props.kind === 'PARAN') {
        const a = pointStyles[props.a_point] || {};
        const b = pointStyles[props.b_point] || {};
        if (a.glyphMorinus != null) props.a_glyph_morinus = a.glyphMorinus;
        if (b.glyphMorinus != null) props.b_glyph_morinus = b.glyphMorinus;
        if (a.label || b.label) {
          props.label = `${a.label || props.a_point || ''} ${props.a_angle || ''} × ${b.label || props.b_point || ''} ${props.b_angle || ''}`.trim();

    if (payload && payload.behavior) {
