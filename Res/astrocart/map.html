          'text-color': t.paranColor,
          'text-halo-color': t.paranHalo,
          'text-halo-width': s.paranLabelHaloOn ? s.paranLabelHaloWidth : 0.0,
          'text-opacity': scaledPointLayerOpacity(s.paranLabelOpacity, 'line_opacity'),
        },
      });
    }
    if (!map.getSource(ACG_CHIP_SOURCE_ID)) {
      map.addSource(ACG_CHIP_SOURCE_ID, {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
        maxzoom: 22,
      });
    }
    for (const [chipLayerId, sourceLayerId] of ACG_CHIP_ANCHOR_LAYERS) {
      if (map.getLayer(chipLayerId)) continue;
      map.addLayer({
        id: chipLayerId,
        type: 'symbol',
        source: ACG_CHIP_SOURCE_ID,
        filter: acgChipAnchorFilter(map.getFilter(sourceLayerId) || ['boolean', true]),
        layout: {
          ...acgChipAnchorLayout(chipLayerId),
          'visibility': 'none',
        },
        paint: {
          'icon-opacity': acgChipOpacity(sourceLayerId, s),
        },
      });
    }
    if (acgLineLabelGlyphs()) applyAcgLabelPresentation();
    raiseAcgLayers();
  }

  function birthplaceCoordinates(data) {
    const meta = data && data.meta || {};
    const origin = meta.origin || {};
    const lon = Number(origin.lon != null ? origin.lon : meta.lon);
    const lat = Number(origin.lat != null ? origin.lat : meta.lat);
    if (!Number.isFinite(lon) || !Number.isFinite(lat) || lat < -90 || lat > 90) return null;
    return [lon, lat];
  }

  function applyBirthplaceMarkerLabel() {
    if (!birthplaceMarkerElement) return;
    const label = String(uiLabels.birthplaceMarker || '');
    if (label) {
      birthplaceMarkerElement.setAttribute('aria-label', label);
      birthplaceMarkerElement.setAttribute('title', label);
    } else {
      birthplaceMarkerElement.removeAttribute('aria-label');
      birthplaceMarkerElement.removeAttribute('title');
    }
  }

  function updateBirthplaceDragPosition(event) {
    if (!map || !birthplaceMarker || !event) return;
    const rect = map.getContainer().getBoundingClientRect();
    const point = [event.clientX - rect.left, event.clientY - rect.top];
    try { birthplaceMarker.setLngLat(map.unproject(point)); } catch (_) {}
  }

  function finishBirthplaceDrag(event, commit) {
    const state = birthplaceDrag;
    if (!state) return;
    birthplaceDrag = null;
    if (state.timer) window.clearTimeout(state.timer);
    if (commit && state.dragging) {
      state.moved = state.moved || Math.hypot(
        event.clientX - state.startX,
        event.clientY - state.startY,
      ) > 1;
      updateBirthplaceDragPosition(event);
    }
    if (birthplaceMarkerElement) birthplaceMarkerElement.classList.remove('dragging');
    if (state.dragPanWasEnabled && map && map.dragPan) {
      try { map.dragPan.enable(); } catch (_) {}
    }
    if (birthplaceMarkerElement && state.pointerId != null) {
      try {
        if (birthplaceMarkerElement.hasPointerCapture(state.pointerId)) {
          birthplaceMarkerElement.releasePointerCapture(state.pointerId);
        }
      } catch (_) {}
    }
    if (commit && state.dragging && state.moved && birthplaceMarker) {
      const lngLat = birthplaceMarker.getLngLat();
      sendHereRequest('set_pob', lngLat, '');
    }
  }

  function wireBirthplaceMarker(element) {
    element.addEventListener('pointerdown', (event) => {
      if (event.button != null && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      hideContextMenu();
      if (birthplaceDrag) finishBirthplaceDrag(event, false);
      const state = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        dragging: false,
        moved: false,
        dragPanWasEnabled: false,
        timer: null,
      };
      birthplaceDrag = state;
      try { element.setPointerCapture(event.pointerId); } catch (_) {}
      state.timer = window.setTimeout(() => {
        if (birthplaceDrag !== state) return;
        state.dragging = true;
        state.dragPanWasEnabled = !!(map && map.dragPan && map.dragPan.isEnabled());
        if (state.dragPanWasEnabled) {
          try { map.dragPan.disable(); } catch (_) {}
        }
        element.classList.add('dragging');
        updateBirthplaceDragPosition(event);
      }, BIRTHPLACE_LONG_PRESS_MS);
    });
    element.addEventListener('pointermove', (event) => {
      const state = birthplaceDrag;
      if (!state || state.pointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      if (!state.dragging) {
        const distance = Math.hypot(event.clientX - state.startX, event.clientY - state.startY);
        if (distance > BIRTHPLACE_PRESS_MOVE_TOLERANCE_PX && state.timer) {
          window.clearTimeout(state.timer);
          state.timer = null;
        }
        return;
      }
      state.moved = true;
      updateBirthplaceDragPosition(event);
    });
    element.addEventListener('pointerup', (event) => {
      event.preventDefault();
      event.stopPropagation();
      finishBirthplaceDrag(event, true);
    });
    element.addEventListener('pointercancel', (event) => finishBirthplaceDrag(event, false));
    for (const type of ['click', 'dblclick', 'contextmenu']) {
      element.addEventListener(type, (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
    }
  }

  function syncBirthplaceMarker() {
    const coordinates = birthplaceCoordinates(currentData);
    if (!coordinates || !map || !window.maplibregl || !window.maplibregl.Marker) {
      if (birthplaceMarker) {
        try { birthplaceMarker.remove(); } catch (_) {}
      }
      birthplaceMarker = null;
      birthplaceMarkerElement = null;
      return;
    }
    if (!birthplaceMarker) {
      const element = document.createElement('div');
      element.className = 'acg-birthplace-marker';
      const glyph = document.createElement('span');
      glyph.className = 'acg-birthplace-marker-glyph';
      glyph.textContent = '*';
      element.appendChild(glyph);
      element.setAttribute('role', 'img');
      wireBirthplaceMarker(element);
      birthplaceMarkerElement = element;
      applyBirthplaceMarkerLabel();
      birthplaceMarker = new maplibregl.Marker({ element, anchor: 'center' })
        .setLngLat(coordinates)
        .addTo(map);
      return;
    }
    birthplaceMarker.setLngLat(coordinates);
  }

  function runtimeOverlaySceneDeferred() {
    return !mapHostActive || isMapMotionActive();
  }

  function deferRuntimeOverlayScene(parts, options = {}) {
    const next = parts || {};
    if (next.data) retainedDataDirty = true;
    if (next.asterism) retainedAsterismDirty = true;
    if (next.eclipse) {
      retainedEclipseDirty = true;
      // The latest eclipse intent owns whether its eventual coherent swap
      // should reframe. Hidden maps intentionally preserve their prior camera.
      retainedEclipseFitPending = mapHostActive && !!options.fit;
    }
    if (ACG_PERF_MODE && isMapMotionActive()) {
      perfState.runtimeSceneDeferredPushes += 1;
    }
    return false;
  }

  function applyRuntimeOverlayScene(parts, options = {}) {
    const next = parts || {};
    if (!next.data && !next.asterism && !next.eclipse) return false;
    rebuildPolarOverlayPaths();

    if (map && typeof map.isStyleLoaded === 'function' && map.isStyleLoaded()) {
      if (next.data) ensureAcgLayers();
      if (next.asterism) ensureAsterismLayer();
      if (next.eclipse) ensureEclipseLayers();
    }

    if (next.asterism) {
      polarAsterismStarHitTargets = [];
      hideAsterismStarPopup('polar');
    }

    if (next.data) {
      const source = map && map.getSource && map.getSource(ACG_SOURCE_ID);
      const labelSource = map && map.getSource && map.getSource(ACG_LABEL_SOURCE_ID);
      if (source) source.setData(currentMapData);
      if (labelSource) labelSource.setData(currentMapData);
      scheduleAcgChipAnchors();
    }
    if (next.asterism) {
      const source = map && map.getSource && map.getSource(ASTERISM_SOURCE_ID);
      if (source) source.setData(currentMapAsterismData);
    }
    if (next.eclipse) {
      const source = map && map.getSource && map.getSource(ECLIPSE_SOURCE_ID);
      if (source) source.setData(currentMapEclipseData);
    }

    if (next.data) {
      syncBirthplaceMarker();
      updateLegend();
    }
    if (next.asterism) {
      syncReferenceVisibility();
      if (map && (
        !map.getLayer('acg-reference-asc') ||
        !map.getLayer('acg-asterisms')
      )) scheduleRuntimeOverlayReplay();
    }
    if (next.eclipse && options.fit) fitFeatureCollection(currentEclipseData);
    if (next.data || next.eclipse || next.asterism) mapRuler?.refresh();
    if (map && typeof map.triggerRepaint === 'function') map.triggerRepaint();
    if (next.data && options.reason !== 'curve-refinement') scheduleCurveRefinement();
    return true;
  }

  function flushRetainedRuntimeOverlayScene(reason) {
    if (runtimeOverlaySceneDeferred()) return false;
    const parts = {
      data: retainedDataDirty,
      asterism: retainedAsterismDirty,
      eclipse: retainedEclipseDirty,
    };
    if (!parts.data && !parts.asterism && !parts.eclipse) return false;
    const fitEclipse = parts.eclipse && retainedEclipseFitPending;
    retainedDataDirty = false;
    retainedAsterismDirty = false;
    retainedEclipseDirty = false;
    retainedEclipseFitPending = false;
    if (parts.data && ACTIVE_ASTROCART_STYLE) {
      applyDisplayStyle(ACTIVE_ASTROCART_STYLE, false);
    }
    const applied = applyRuntimeOverlayScene(parts, {
      fit: fitEclipse,
      reason: reason || 'scene-flush',
    });
    if (!applied) return false;
    if (ACG_PERF_MODE) perfState.runtimeSceneCoherentFlushes += 1;
    if (parts.data) {
      setStatus(`${(currentData.features || []).length} lines loaded`);
    }
    if (parts.eclipse) {
      const count = (currentEclipseData.features || []).length;
      if (count) setStatus(`${count} eclipse path features loaded`);
    }
    postPerfSnapshot(reason || 'scene-flush');
    return true;
  }

  function pushData() {
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene({ data: true });
    }
    retainedDataDirty = false;
    return applyRuntimeOverlayScene({ data: true }, { reason: 'data' });
  }

  function pushAsterismData() {
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene({ asterism: true });
    }
    retainedAsterismDirty = false;
    return applyRuntimeOverlayScene({ asterism: true }, { reason: 'asterism-data' });
  }

  function refreshPolarProjectionData() {
    const allSources = { data: true, asterism: true, eclipse: true };
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene(allSources, { fit: false });
    }
    return applyRuntimeOverlayScene(allSources, {
      fit: false,
      reason: 'projection-data',
    });
  }

  function applyDisplayStyleToData(data, payload) {
    const pointStyles = payload && payload.points || {};
    for (const feature of data && data.features || []) {
      const props = feature && feature.properties || {};
      if (props.point && pointStyles[props.point]) {
        const style = pointStyles[props.point];
        if (style.label) props.label = style.label;
        if (style.color) props.color = style.color;
        else delete props.color;
        if (style.glyphMorinus != null) props.glyph_morinus = style.glyphMorinus;
        props.line_width_scale = style.lineWidthScale;
        props.line_opacity = style.lineOpacity;
      }
      if (props.kind === 'PARAN') {
        const a = pointStyles[props.a_point] || {};
        const b = pointStyles[props.b_point] || {};
        if (a.glyphMorinus != null) props.a_glyph_morinus = a.glyphMorinus;
        if (b.glyphMorinus != null) props.b_glyph_morinus = b.glyphMorinus;
        // Paran chips key each glyph to its body's line colour.
        if (a.color) props.a_color = a.color;
        else delete props.a_color;
        if (b.color) props.b_color = b.color;
        else delete props.b_color;
        if (a.label || b.label) {
          props.label = `${a.label || props.a_point || ''} ${props.a_angle || ''} × ${b.label || props.b_point || ''} ${props.b_angle || ''}`.trim();

      }
    }
    return data;
  }

  function updateLegend() {
    if (!mapHostActive) return;
    const rows = document.getElementById('legend-rows');
    if (!rows) return;
    const t = currentThemeTokens();
    const seen = new Map();
    let hasParan = false;
    let hasLocalSpace = false;
    let hasAcgAngles = false;
    let hasLocalSpaceOpposition = false;
    let localSpaceOppositionGlyph = '';
    let hasAspect = false;
    let hasZenith = false;
    for (const f of currentData.features || []) {
      if (!isAcgFeatureVisible(f)) continue;
      if (f.properties.kind === 'PARAN') { hasParan = true; continue; }
      if (f.properties.kind === 'LOCAL_SPACE') hasLocalSpace = true;
      if (f.properties.kind === 'LOCAL_SPACE_OPPOSITION') {
        hasLocalSpaceOpposition = true;
        localSpaceOppositionGlyph ||= String(f.properties.aspect_glyph_morinus || '');
      }
      if (f.properties.kind === 'ASPECT') hasAspect = true;
      if (f.properties.kind === 'ZENITH') hasZenith = true;
      if (['MC', 'IC', 'ASC', 'DSC'].includes(f.properties.kind)) hasAcgAngles = true;
      const pt = f.properties.point;
      if (!seen.has(pt)) {
        seen.set(pt, {
          label: f.properties.label || pt,
          color: f.properties.color || t.labelColor,
          glyph: f.properties.glyph_morinus || '',
        });
      }
    }
    rows.innerHTML = '';
    for (const [, info] of seen) {
      const row = document.createElement('div');
      row.className = 'row';
      const glyph = info.glyph
        ? `<span class="glyph" style="color:${info.color}">${info.glyph}</span>`
        : `<span class="glyph"></span>`;
      row.innerHTML = `${glyph}<span class="sw" style="background:${info.color}"></span><span>${info.label}</span>`;
      rows.appendChild(row);
    }
    const acgKey = document.getElementById('legend-acg-key');
    if (acgKey) acgKey.style.display = hasAcgAngles ? '' : 'none';
    const localRow = document.getElementById('legend-local-space-row');
    if (localRow) localRow.style.display = hasLocalSpace ? '' : 'none';
    const paranRow = document.getElementById('legend-paran-row');
    if (paranRow) paranRow.style.display = hasParan ? '' : 'none';
    // The opposition row pairs the glyph its line labels carry with the word.
    for (const [id, present, label, glyph] of [
      ['legend-local-space-opposition-row', hasLocalSpaceOpposition, uiLabels.localSpaceOpposition, localSpaceOppositionGlyph],
      ['legend-aspect-row', hasAspect, uiLabels.aspect, ''],
      ['legend-zenith-row', hasZenith, uiLabels.zenith, ''],
    ]) {
      const row = document.getElementById(id);
      const text = String(label || '').trim();
      if (!row) continue;
      const labelElement = row.querySelector('.localized-kind-label');
      if (labelElement) labelElement.textContent = text;
      const glyphElement = row.querySelector('.legend-kind-glyph');
      if (glyphElement) {
        glyphElement.textContent = glyph;
        glyphElement.style.display = glyph ? '' : 'none';
      }
      row.style.display = present && text ? '' : 'none';
    }
  }

  function normalizePlaceFeature(f) {
    const c = f && f.geometry && f.geometry.coordinates || [];
    const p = f && f.properties || {};
    return {
      lon: Number(c[0]),
      lat: Number(c[1]),
      name: p.name || p.ascii || '',
      ascii: p.ascii || '',
      country: p.country || '',
      population: Number(p.population || 0),
      level: Number(p.level == null ? 4 : p.level),
      feature: p.feature || '',

  // bundled file through their own MapLibre source.
  function loadPlaceSearchCatalog() {
    if (placesLoaded || placesLoading || !window.fetch) return;
    placesLoading = true;
    fetch(PLACES_URL, { cache: 'force-cache' })
      .then((r) => {
        if (!r || !r.ok) throw new Error(`static places failed: ${r ? r.status : 'no response'}`);
        return r.json();
      })
      .then((data) => {
        placesData = (data && data.features || [])
          .map(normalizePlaceFeature)
          .filter((p) => Number.isFinite(p.lon) && Number.isFinite(p.lat) && p.name);
        placesLoaded = true;
        placesLoading = false;
        refreshSearchResults();
      })
      .catch(() => {
        placesLoading = false;
      });
  }

  function acgLayerDisplayLabel(properties) {
    const technique = normalizedAcgTechnique(properties);
    const techniqueLabels = uiLabels.techniqueLabels &&
      typeof uiLabels.techniqueLabels === 'object'

      : {};
    const techniqueLabel = String(techniqueLabels[technique] || '').trim();

    if (explicit) return explicit;

    if (role === 'transit') return String(uiLabels.transitLayer || '').trim();

    return prefix ? `${prefix} ${text}` : text;

  // glyphMode: the glyph replaces the point name and the layer prefix is laid
  // out before it (see acgChipSegments).
  function acgFeatureLabelText(properties, options) {
    const p = properties || {};
    const glyphMode = !!(options && options.glyphMode);
    const pointLabel = glyphMode ? '' : localizedPointLabel(p);
    const kind = String(p.kind || '');
    let text = pointLabel;
    if (kind === 'LOCAL_SPACE' || kind === 'LOCAL_SPACE_OPPOSITION') {
      const bearing = acgLocalSpaceBearings()
        ? String(p.bearing_label ?? p.source_bearing ?? '').trim()
        : '';
      text = `${pointLabel} ${bearing}`.trim();
    } else if (kind === 'ASPECT') {
      text = `${pointLabel} ${localizedAspectLabel(p)} ${p.target_angle || ''}`.trim();
    } else if (kind === 'ZENITH') {
      text = `${pointLabel} ${String(uiLabels.zenith || '').trim()}`.trim();
    } else if (['MC', 'IC', 'ASC', 'DSC'].includes(kind)) {
      text = `${pointLabel} ${kind}`.trim();
    }
    return glyphMode || (options && options.withoutPrefix)
      ? text.trim()
      : prefixedAcgLabel(p, text);
  }

  function angularDistanceDeg(lon1, lat1, lon2, lat2) {
    const r = Math.PI / 180;
    const p1 = Number(lat1) * r;
    const p2 = Number(lat2) * r;
    const dLon = ((Number(lon2) - Number(lon1) + 540) % 360 - 180) * r;
    const cosD = Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dLon);
    const clamped = Math.max(-1, Math.min(1, cosD));
    return Math.acos(clamped) / r;
  }

  function interpolateWrappedCoordinate(a, b, t) {
    const startLon = Number(a[0]);
    const endLon = Number(b[0]);
    const lonDelta = ((endLon - startLon + 540) % 360) - 180;
    const lon = ((startLon + lonDelta * t + 540) % 360) - 180;
    return [lon, Number(a[1]) + (Number(b[1]) - Number(a[1])) * t];
  }

  function clipLineToPolarCap(coordinates, cutoff = POLAR_OVERLAY_LATITUDE) {
    const runs = [];
    for (const poleSign of [1, -1]) {
      let run = [];
      let previous = null;
      let previousInside = false;
      const flush = () => {
        if (run.length >= 2) runs.push(run);
        run = [];
      };
      for (const rawCoordinate of Array.isArray(coordinates) ? coordinates : []) {
        const lon = Number(rawCoordinate && rawCoordinate[0]);
        const lat = Number(rawCoordinate && rawCoordinate[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
          flush();
          previous = null;
          previousInside = false;
          continue;
        }
        const current = [lon, lat];
        const currentInside = poleSign * lat >= cutoff;
        if (previous) {
          if (previousInside && currentInside) {
            if (!run.length) run.push(previous);
            run.push(current);
          } else if (previousInside) {
            if (!run.length) run.push(previous);
            const boundaryLat = poleSign * cutoff;
            const t = (boundaryLat - previous[1]) / (current[1] - previous[1]);
            run.push(interpolateWrappedCoordinate(previous, current, t));
            flush();
          } else if (currentInside) {
            const boundaryLat = poleSign * cutoff;
            const t = (boundaryLat - previous[1]) / (current[1] - previous[1]);
            run = [interpolateWrappedCoordinate(previous, current, t), current];
          }
        } else if (currentInside) {
          run = [current];
        }
        previous = current;
        previousInside = currentInside;
      }
      flush();
    }
    return runs;
  }

  function clipLineToMapBand(coordinates, cutoff = POLAR_OVERLAY_LATITUDE) {
    const runs = [];
    let run = [];
    const flush = () => {
      if (run.length >= 2) runs.push(run);
      run = [];
    };
    const sameCoordinate = (a, b) => (
      Math.abs(Number(a[0]) - Number(b[0])) < 1e-9 &&
      Math.abs(Number(a[1]) - Number(b[1])) < 1e-9
    );
    let previous = null;
    for (const rawCoordinate of Array.isArray(coordinates) ? coordinates : []) {
      const lon = Number(rawCoordinate && rawCoordinate[0]);
      const lat = Number(rawCoordinate && rawCoordinate[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
        flush();
        previous = null;
        continue;
      }
      const current = [lon, lat];
      if (previous) {
        const deltaLat = current[1] - previous[1];
        let start = 0;
        let end = 1;
        if (Math.abs(deltaLat) < 1e-12) {
          if (Math.abs(previous[1]) > cutoff) {
            flush();
            previous = current;
            continue;
          }
        } else {
          const south = (-cutoff - previous[1]) / deltaLat;
          const north = (cutoff - previous[1]) / deltaLat;
          start = Math.max(0, Math.min(south, north));
          end = Math.min(1, Math.max(south, north));
        }
        if (start <= end) {
          const coordinateAt = (t) => {
            if (t <= 0) return previous.slice();
            if (t >= 1) return current.slice();
            return interpolateWrappedCoordinate(previous, current, t);
          };
          const segmentStart = coordinateAt(start);
          const segmentEnd = coordinateAt(end);
          if (!sameCoordinate(segmentStart, segmentEnd)) {
            if (!run.length || !sameCoordinate(run[run.length - 1], segmentStart)) {
              flush();
              run = [segmentStart];
            }
            run.push(segmentEnd);
          }
        } else {
          flush();
        }
      }
      previous = current;
    }
    flush();
    return runs;
  }

  function geometryLineStrings(geometry) {
    if (!geometry || !Array.isArray(geometry.coordinates)) return [];
    if (geometry.type === 'LineString') return [geometry.coordinates];
    if (geometry.type === 'MultiLineString') return geometry.coordinates;
    return [];
  }

  function geometryPolygonOuterRings(geometry) {
    if (!geometry || !Array.isArray(geometry.coordinates)) return [];
    if (geometry.type === 'Polygon') {
      return Array.isArray(geometry.coordinates[0]) ? [geometry.coordinates[0]] : [];
    }
    if (geometry.type === 'MultiPolygon') {
      return geometry.coordinates
        .map((polygon) => Array.isArray(polygon && polygon[0]) ? polygon[0] : null)
        .filter(Boolean);
    }
    return [];
  }

  function clipRingToPolarCap(coordinates, cutoff) {
    const input = (Array.isArray(coordinates) ? coordinates : [])
      .map((coordinate) => [Number(coordinate && coordinate[0]), Number(coordinate && coordinate[1])])
      .filter((coordinate) => Number.isFinite(coordinate[0]) && Number.isFinite(coordinate[1]));
    if (input.length > 1) {
      const first = input[0];
      const last = input[input.length - 1];
      if (Math.abs(first[0] - last[0]) < 1e-9 && Math.abs(first[1] - last[1]) < 1e-9) input.pop();
    }
    if (input.length < 3) return [];
    const rings = [];
    for (const poleSign of [1, -1]) {
      const boundaryLat = poleSign * cutoff;
      const output = [];
      let previous = input[input.length - 1];
      let previousInside = poleSign * previous[1] >= cutoff;
      for (const current of input) {
        const currentInside = poleSign * current[1] >= cutoff;
        if (currentInside !== previousInside) {
          const denominator = current[1] - previous[1];
          if (Math.abs(denominator) > 1e-12) {
            const t = (boundaryLat - previous[1]) / denominator;
            output.push(interpolateWrappedCoordinate(previous, current, t));
          }
        }
        if (currentInside) output.push(current);
        previous = current;
        previousInside = currentInside;
      }
      if (output.length >= 3) {
        output.push(output[0].slice());
        rings.push(output);
      }
    }
    return rings;
  }

  function isPolarOverlayPoint(feature, cutoff = POLAR_OVERLAY_LATITUDE) {
    const geometry = feature && feature.geometry;
    const properties = feature && feature.properties || {};
    if (
      !geometry || geometry.type !== 'Point' ||
      !['ASTERISM_STAR', 'ZENITH'].includes(properties.kind) ||
      !Array.isArray(geometry.coordinates)
    ) return false;
    const lon = Number(geometry.coordinates[0]);
    const lat = Number(geometry.coordinates[1]);
    return Number.isFinite(lon) && Number.isFinite(lat) && Math.abs(lat) >= cutoff;
  }

  function clipFeatureCollectionToMapBand(data, options = {}) {
    const features = [];
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      if (Array.isArray(options.omitKinds) && options.omitKinds.includes(properties.kind)) continue;
      const lines = geometryLineStrings(feature && feature.geometry);
      if (!lines.length) {
        if (options.omitPolarPoints && isPolarOverlayPoint(feature)) continue;
        features.push(feature);
        continue;
      }
      const coordinates = lines.flatMap((line) => clipLineToMapBand(line));
      if (!coordinates.length) continue;
      features.push(Object.assign({}, feature, {
        geometry: { type: 'MultiLineString', coordinates },
      }));
    }
    return Object.assign({}, data || {}, { type: 'FeatureCollection', features });
  }

  function appendPolarOverlayPaths(data, source, target) {
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      for (const line of geometryLineStrings(feature && feature.geometry)) {
        for (const coordinates of clipLineToPolarCap(line)) {
          target.push({ source, properties, coordinates });
        }
      }
    }
  }

  function appendPolarOverlayPoints(data, source, target) {
    for (const feature of data && data.features || []) {
      if (!isPolarOverlayPoint(feature)) continue;
      target.push({
        source,
        properties: feature.properties || {},
        coordinate: feature.geometry.coordinates.slice(0, 2),
      });
    }
  }

  function appendPolarOverlayPolygons(data, source, target) {
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      if (properties.kind !== 'ECLIPSE_POLAR_PATH') continue;
      const cutoff = Number(properties.polar_fill_lat_limit);
      if (!Number.isFinite(cutoff)) continue;
      for (const ring of geometryPolygonOuterRings(feature && feature.geometry)) {
        for (const coordinates of clipRingToPolarCap(ring, cutoff)) {
          target.push({ source, properties, coordinates });
        }
      }
    }
  }

  function buildRuntimeOverlayScene(
    data,
    asterismData,
    eclipseData,
    projectionName = selectedProjection,
  ) {
    const acgData = data || { type: 'FeatureCollection', features: [] };
    const starsAndReferences =
      asterismData || { type: 'FeatureCollection', features: [] };
    const eclipsePaths =
      eclipseData || { type: 'FeatureCollection', features: [] };
    const paths = [];
    const polygons = [];
    const points = [];
    appendPolarOverlayPaths(starsAndReferences, 'asterism', paths);
    appendPolarOverlayPaths(eclipsePaths, 'eclipse', paths);
    appendPolarOverlayPaths(acgData, 'acg', paths);
    appendPolarOverlayPolygons(eclipsePaths, 'eclipse', polygons);
    appendPolarOverlayPoints(starsAndReferences, 'asterism', points);
    appendPolarOverlayPoints(acgData, 'acg', points);
    return {
      data: acgData,
      asterismData: starsAndReferences,
      eclipseData: eclipsePaths,
      mapData: clipFeatureCollectionToMapBand(acgData, {
        omitPolarPoints: projectionName === 'globe',
      }),
      mapAsterismData: clipFeatureCollectionToMapBand(starsAndReferences, {
        omitPolarPoints: projectionName === 'globe',
      }),
      mapEclipseData: clipFeatureCollectionToMapBand(eclipsePaths, {
        omitKinds: ['ECLIPSE_POLAR_PATH'],
      }),
      polarPaths: paths,
      polarPolygons: polygons,
      polarPoints: points,
    };
  }

  function scheduleCurveRefinement() {
    if (!curveRefinement || !mapReady || !map || runtimeOverlaySceneDeferred()) return;
    const bounds = map.getBounds();
    const west = bounds.getWest(), east = bounds.getEast();
    const south = bounds.getSouth(), north = bounds.getNorth();
    const dx = Math.max(0.001, (east - west) * 0.25);
    const dy = Math.max(0.001, (north - south) * 0.25);
    curveRefinement.request(currentData, {
      zoom: map.getZoom(), projection: selectedProjection,
      bounds: [west - dx, Math.max(-90, south - dy), east + dx, Math.min(90, north + dy)],
    });
  }

  function rebuildPolarOverlayPaths() {
    const scene = buildRuntimeOverlayScene(
      curveRefinement?.getData(currentData) || currentData,
      currentAsterismData,
      currentEclipseData,
      selectedProjection,
    );
    polarOverlayPaths = scene.polarPaths;
    polarOverlayPolygons = scene.polarPolygons;
    polarOverlayPoints = scene.polarPoints;
    currentMapAsterismData = scene.mapAsterismData;
    currentMapEclipseData = scene.mapEclipseData;
    currentMapData = scene.mapData;
    if (ACG_PERF_MODE) {
      perfState.polarOverlayPathCount = scene.polarPaths.length;
    }
  }

  function ensurePolarOverlayCanvas(targetMap = map) {
    if (targetMap !== map) return null;
    let canvas = document.getElementById('polar-line-overlay');
    if (
      canvas ||
      !targetMap ||
      typeof targetMap.getCanvasContainer !== 'function'
    ) return canvas;
    const container = targetMap.getCanvasContainer();
    if (!container) return null;
    canvas = document.createElement('canvas');
    canvas.id = 'polar-line-overlay';
    canvas.setAttribute('aria-hidden', 'true');
    container.appendChild(canvas);
    return canvas;
  }

  function clearPolarOverlay() {
    polarAsterismStarHitTargets = [];
    hideAsterismStarPopup('polar');
    const canvas = document.getElementById('polar-line-overlay');
    const context = canvas && canvas.getContext('2d');
    if (!context) return;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, canvas.width, canvas.height);
  }

  function preparePolarOverlayCanvas(targetMap = map, targetCanvas = null) {
    const canvas = targetCanvas || ensurePolarOverlayCanvas(targetMap);
    const mapCanvas = targetMap && targetMap.getCanvas && targetMap.getCanvas();
    if (!canvas || !mapCanvas) return null;
    // Transform dimensions are already MapLibre's logical CSS-pixel size and
    // avoid a forced layout read in this per-render path.
    const width = Math.max(
      0,
      Number(targetMap.transform && targetMap.transform.width) ||
        parseFloat(mapCanvas.style.width) ||
        0,
    );
    const height = Math.max(
      0,
      Number(targetMap.transform && targetMap.transform.height) ||
        parseFloat(mapCanvas.style.height) ||
        0,
    );
    if (!width || !height) return null;
    const pixelWidth = Math.max(1, Number(mapCanvas.width) || Math.round(width));
    const pixelHeight = Math.max(1, Number(mapCanvas.height) || Math.round(height));
    if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
    if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
    const context = canvas.getContext('2d');
    if (!context) return null;
    context.setTransform(pixelWidth / width, 0, 0, pixelHeight / height, 0, 0);
    context.clearRect(0, 0, width, height);
    return { canvas, context, width, height };
  }

  function isPolarCoordinateVisible(coordinate, center, targetMap = map) {
    if (!targetMap) return false;
    try {
      if (
        targetMap === map &&
        map.transform &&
        typeof map.transform.isLocationOccluded === 'function' &&
        window.maplibregl && maplibregl.LngLat
      ) {
        const lngLat = maplibregl.LngLat.convert(coordinate);
        return !map.transform.isLocationOccluded(lngLat);
      }
      if (
        targetMap.transform &&
        typeof targetMap.transform.isLocationOccluded === 'function' &&
        window.maplibregl && maplibregl.LngLat
      ) {
        const lngLat = maplibregl.LngLat.convert(coordinate);
        return !targetMap.transform.isLocationOccluded(lngLat);
      }
    } catch (_) {}
    return angularDistanceDeg(
      center.lng, center.lat, Number(coordinate[0]), Number(coordinate[1]),
    ) <= 90.0;
  }

  function polarHorizonCoordinate(a, b, center, aVisible, targetMap = map) {
    let low = 0;
    let high = 1;
    for (let index = 0; index < 18; index += 1) {
      const middle = (low + high) / 2;
      const middleCoordinate = interpolateWrappedCoordinate(a, b, middle);
      if (
        isPolarCoordinateVisible(middleCoordinate, center, targetMap) === aVisible
      ) low = middle;
      else high = middle;
    }
    return interpolateWrappedCoordinate(a, b, (low + high) / 2);
  }

  function projectPolarCoordinate(coordinate, targetMap = map) {
    const lat = Math.max(
      -POLAR_OVERLAY_MAX_LATITUDE,
      Math.min(POLAR_OVERLAY_MAX_LATITUDE, Number(coordinate[1])),
    );
    try {
      const point = targetMap.project([Number(coordinate[0]), lat]);
      return Number.isFinite(point && point.x) && Number.isFinite(point && point.y)
        ? point
        : null;
    } catch (_) {
      return null;
    }
  }

  function tracePolarOverlayPath(
    context,
    coordinates,
    center,
    targetMap = map,
  ) {
    if (!Array.isArray(coordinates) || coordinates.length < 2) return false;
    let traced = false;
    let pathOpen = false;
    let previous = coordinates[0];
    let previousVisible = isPolarCoordinateVisible(previous, center, targetMap);
    for (let index = 1; index < coordinates.length; index += 1) {
      const current = coordinates[index];
      const currentVisible = isPolarCoordinateVisible(current, center, targetMap);
      if (previousVisible && currentVisible) {
        const previousPoint = projectPolarCoordinate(previous, targetMap);
        const currentPoint = projectPolarCoordinate(current, targetMap);
        if (previousPoint && currentPoint) {
          if (!pathOpen) context.moveTo(previousPoint.x, previousPoint.y);
          context.lineTo(currentPoint.x, currentPoint.y);
          pathOpen = true;
          traced = true;
        } else {
          pathOpen = false;
        }
      } else if (previousVisible !== currentVisible) {
        const horizon = polarHorizonCoordinate(
          previous,
          current,
          center,
          previousVisible,
          targetMap,
        );
        const horizonPoint = projectPolarCoordinate(horizon, targetMap);
        if (previousVisible) {
          const previousPoint = projectPolarCoordinate(previous, targetMap);
          if (previousPoint && horizonPoint) {
            if (!pathOpen) context.moveTo(previousPoint.x, previousPoint.y);
            context.lineTo(horizonPoint.x, horizonPoint.y);
            traced = true;
          }
          pathOpen = false;
        } else {
          const currentPoint = projectPolarCoordinate(current, targetMap);
          if (horizonPoint && currentPoint) {
            context.moveTo(horizonPoint.x, horizonPoint.y);
            context.lineTo(currentPoint.x, currentPoint.y);
            pathOpen = true;
            traced = true;
          } else {
            pathOpen = false;
          }
        }
      } else {
        pathOpen = false;
      }
      previous = current;
      previousVisible = currentVisible;
    }
    return traced;
  }

  function visiblePolarRing(coordinates, center, targetMap = map) {
    const input = Array.isArray(coordinates) ? coordinates.slice() : [];
    if (input.length > 1) {
      const first = input[0];
      const last = input[input.length - 1];
      if (
        Math.abs(Number(first[0]) - Number(last[0])) < 1e-9 &&
        Math.abs(Number(first[1]) - Number(last[1])) < 1e-9
      ) input.pop();
    }
    if (input.length < 3) return [];
    const output = [];
    let previous = input[input.length - 1];
    let previousVisible = isPolarCoordinateVisible(previous, center, targetMap);
    for (const current of input) {
      const currentVisible = isPolarCoordinateVisible(current, center, targetMap);
      if (currentVisible !== previousVisible) {
        output.push(
          polarHorizonCoordinate(
            previous,
            current,
            center,
            previousVisible,
            targetMap,
          ),
        );
      }
      if (currentVisible) output.push(current);
      previous = current;
      previousVisible = currentVisible;
    }
    return output.length >= 3 ? output : [];
  }

  function polarMetric(value, fallback) {
    if (value == null) return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }

  function resolvedAcgLineColor(properties, settings) {
    if (properties.color) return properties.color;
    if (properties.kind === 'MC') return settings.fallbackMcColor;
    if (properties.kind === 'IC') return settings.fallbackIcColor;
    if (properties.kind === 'ASC') return settings.fallbackAscColor;
    if (properties.kind === 'DSC') return settings.fallbackDscColor;
    return settings.fallbackUnknownColor;
  }

  function unchangedPolarColor(color) {
    return color;
  }

  function polarReferenceStroke(
    path,
    settings,
    behavior,
    colorTransform = unchangedPolarColor,
  ) {
    if (path.source !== 'asterism') return null;
    const properties = path.properties;
    switch (properties.kind) {
      case 'REFERENCE_HOUSE_LINE':
        if (!behavior.showHouseLines) return null;
        return {
          color: colorTransform(
            houseReferenceColor(Number(properties.house), settings),
          ),
          width: settings.referenceGridLineWidth,
          opacity: Math.min(1, settings.referenceGridLineOpacity * (properties.angle ? 1.45 : 1)),
          lineCap: 'round',
        };
      case 'REFERENCE_ZODIAC_LINE':
        if (!behavior.showZodiacLines) return null;
        return {
          color: colorTransform(
            zodiacReferenceColor(Number(properties.sign), settings),
          ),
          width: settings.referenceGridLineWidth,
          opacity: settings.referenceGridLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_ECLIPTIC':
        if (!behavior.showEcliptic) return null;
        return {
          color: colorTransform(settings.referenceEclipticColor),
          width: settings.referenceLineWidth * 1.25,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_ZODIAC_TICK':
        if (!behavior.showEcliptic) return null;
        return {
          color: colorTransform(settings.referenceEclipticColor),
          width: settings.referenceLineWidth * 0.8,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_EQUATOR':
        if (!behavior.showEquator) return null;
        return {
          color: colorTransform(settings.referenceEquatorColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          dash: [settings.referenceLineWidth * 2, settings.referenceLineWidth * 2],
          lineCap: 'round',
        };
      case 'REFERENCE_ASC':
        if (!behavior.showAscCircle) return null;
        return {
          color: colorTransform(settings.referenceAscColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_MC':
        if (!behavior.showMcCircle) return null;
        return {
          color: colorTransform(settings.referenceMcColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      default:
        return null;
    }
  }

  function polarAsterismStroke(
    path,
    settings,
    shadow,
    visibility = viewOptions,
  ) {
    if (
      path.source !== 'asterism' ||
      path.properties.kind !== 'ASTERISM' ||
      !visibility.asterisms
    ) return null;
    if (shadow) {
      return {
        color: settings.asterismShadowColor,
        width: settings.asterismLineWidth + settings.asterismShadowSpread * 2,
        opacity: settings.asterismShadowOpacity,
        blur: settings.asterismShadowBlur,
        lineCap: 'round',
      };
    }
    return {
      color: settings.asterismHighlightColor,
      width: settings.asterismLineWidth,
      opacity: settings.asterismLineOpacity,
      lineCap: 'round',
    };
  }

  function polarEclipseStroke(path, settings, shadow) {
    if (path.source !== 'eclipse') return null;
    const kind = path.properties.kind;
    if (shadow) {
      if (kind !== 'ECLIPSE_SHADOW') return null;
      return {
        color: settings.eclipseShadowColor,
        width: settings.eclipseShadowWidth,
        opacity: settings.eclipseShadowOpacity,
        blur: settings.eclipseShadowBlur,
        lineCap: 'round',
      };
    }
    if (kind === 'ECLIPSE_LIMIT') {
      return {
        color: settings.eclipseOutlineColor,
        width: settings.eclipseLimitWidth,
        opacity: settings.eclipseLimitOpacity,
        dash: [
          settings.eclipseLimitDashOn * settings.eclipseLimitWidth,
          settings.eclipseLimitDashOff * settings.eclipseLimitWidth,
        ],
        lineCap: 'round',
      };
    }
    if (kind === 'ECLIPSE_CENTER') {
      return {
        color: settings.eclipseCenterColor,
        width: settings.eclipseCenterWidth,
        opacity: settings.eclipseCenterOpacity,
        lineCap: 'round',
      };
    }
    return null;
  }

  function isPolarAcgPathVisible(path, visibility = viewOptions) {
    return (
      path.source === 'acg' &&
      isAcgPropertiesVisible(path.properties || {}, visibility)
    );
  }

  function polarAcgCasingStroke(
    path,
    settings,
    tokens,
    visibility = viewOptions,
  ) {
    if (
      !isPolarAcgPathVisible(path, visibility) ||
      ![
        'MC',
        'IC',
        'ASC',
        'DSC',
        'LOCAL_SPACE',
        'LOCAL_SPACE_OPPOSITION',
        'ASPECT',
      ].includes(path.properties.kind)
    ) return null;
    return {
      color: tokens.casing,
      width: settings.casingWidth * polarMetric(path.properties.line_width_scale, 1),
      opacity: settings.casingOpacity *
        polarMetric(path.properties.line_opacity, 1) *
        acgLayerOpacityScale(path.properties),
    };
  }

  function polarAcgLineStroke(
    path,
    settings,
    tokens,
    visibility = viewOptions,
  ) {
    if (!isPolarAcgPathVisible(path, visibility)) return null;
    const properties = path.properties;
    if (properties.kind === 'PARAN') {
      if (!visibility.parans) return null;
      return {
        color: tokens.paranColor,
        width: settings.paranWidth,
        opacity: settings.paranOpacity * acgLayerOpacityScale(properties),
        dash: [settings.paranDashOn * settings.paranWidth, settings.paranDashOff * settings.paranWidth],
      };
    }
    if (properties.kind === 'LOCAL_SPACE_OPPOSITION') {
      const width = settings.dashedWidth *
        settings.localSpaceOppositionWidthScale *
        polarMetric(properties.line_width_scale, 1);
      return {
        color: resolvedAcgLineColor(properties, settings),
        width,
        opacity: settings.dashedOpacity *
          settings.localSpaceOppositionOpacityScale *
          polarMetric(properties.line_opacity, 1) *
          acgLayerOpacityScale(properties),
        dash: [
          settings.dashedOn * settings.localSpaceOppositionDashOnScale * width,
          settings.dashedOff * settings.localSpaceOppositionDashOffScale * width,
        ],
        lineCap: 'round',
      };
    }
    if (properties.kind === 'ASPECT') {
      const width = settings.solidWidth *
        settings.aspectLineWidthScale *
        polarMetric(properties.line_width_scale, 1);
      return {
        color: resolvedAcgLineColor(properties, settings),
        width,
        opacity: settings.solidOpacity *
          settings.aspectLineOpacityScale *
          polarMetric(properties.line_opacity, 1) *
          acgLayerOpacityScale(properties),
        dash: [
          settings.aspectLineDashOn * width,
          settings.aspectLineDashOff * width,
        ],
        lineCap: 'round',
      };
    }
    const solid = ['MC', 'ASC', 'LOCAL_SPACE'].includes(properties.kind);
    const dashed = ['IC', 'DSC'].includes(properties.kind);
    if (!solid && !dashed) return null;
    const baseWidth = dashed ? settings.dashedWidth : settings.solidWidth;
    const width = baseWidth * polarMetric(properties.line_width_scale, 1);
    return {
      color: resolvedAcgLineColor(properties, settings),
      width,
      opacity: (dashed ? settings.dashedOpacity : settings.solidOpacity) *
        polarMetric(properties.line_opacity, 1) *
        acgLayerOpacityScale(properties),
      dash: dashed ? [settings.dashedOn * width, settings.dashedOff * width] : null,
    };
  }

  function projectPolarOverlayPaths(paths, center, targetMap = map) {
    const projected = [];
    for (const path of paths) {
      const geometry = new Path2D();
      if (!tracePolarOverlayPath(geometry, path.coordinates, center, targetMap)) {
        continue;
      }
      projected.push({ path, geometry });
    }
    return projected;
  }

  function strokePolarOverlayPaths(context, styleForPath, projectedPaths) {
    for (const projected of projectedPaths) {
      const path = projected.path;
      const style = styleForPath(path);
      if (!style) continue;
      const width = Math.max(0, polarMetric(style.width, 0));
      const opacity = Math.max(0, Math.min(1, polarMetric(style.opacity, 1)));
      if (!width || !opacity || !style.color) continue;
      context.save();
      context.globalAlpha = opacity;
      context.strokeStyle = style.color;
      context.lineWidth = width;
      context.lineCap = style.lineCap || 'butt';
      context.lineJoin = style.lineCap || 'miter';
      context.setLineDash(Array.isArray(style.dash) ? style.dash : []);
      context.filter = style.blur ? `blur(${Math.max(0, style.blur)}px)` : 'none';
      context.stroke(projected.geometry);
      context.restore();
    }
  }

  function drawPolarAsterismStars(
    context,
    center,
    settings,
    targetMap = map,
    visibility = viewOptions,
    points = polarOverlayPoints,
    updateHitTargets = true,
  ) {
    const hitTargets = [];
    if (!visibility.asterisms) {
      if (updateHitTargets) polarAsterismStarHitTargets = hitTargets;
      return;
    }
    for (const polarPoint of points) {
      if (polarPoint.source !== 'asterism') continue;
      const coordinateVisible = targetMap === map
        ? isPolarCoordinateVisible(polarPoint.coordinate, center)
        : isPolarCoordinateVisible(polarPoint.coordinate, center, targetMap);
      if (!coordinateVisible) continue;
      const point = targetMap === map
        ? projectPolarCoordinate(polarPoint.coordinate)
        : projectPolarCoordinate(polarPoint.coordinate, targetMap);
      if (!point) continue;
      const properties = polarPoint.properties || {};
      const radius = Math.max(0, asterismStarRadius(properties.magnitude, settings));
      const spread = Math.max(0, polarMetric(settings.asterismShadowSpread, 0));
      if (!radius) continue;

      context.save();
      context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.asterismShadowOpacity, 1)));
      context.fillStyle = settings.asterismShadowColor;
      context.filter = `blur(${Math.max(0, polarMetric(settings.asterismShadowBlur, 0))}px)`;
      context.beginPath();
      context.arc(point.x, point.y, radius + spread, 0, Math.PI * 2);
      context.fill();
      context.restore();

      context.save();
      context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.asterismStarOpacity, 1)));
      context.fillStyle = settings.asterismHighlightColor;
      context.strokeStyle = settings.asterismShadowColor;
      context.lineWidth = spread;
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
      if (spread) {
        // MapLibre's circle stroke sits outside circle-radius rather than
        // straddling the fill boundary.
        context.beginPath();
        context.arc(point.x, point.y, radius + spread / 2, 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();

      hitTargets.push({
        coordinate: polarPoint.coordinate,
        properties,
        point,
      });
    }
    if (updateHitTargets) polarAsterismStarHitTargets = hitTargets;
  }

  function drawPolarZenithPoints(
    context,
    center,
    settings,
    tokens,
    targetMap = map,
    visibility = viewOptions,
    points = polarOverlayPoints,
  ) {
    if (!visibility.zeniths) return;
    for (const polarPoint of points) {
      const properties = polarPoint.properties || {};
      const propertiesVisible = visibility === viewOptions
        ? isAcgPropertiesVisible(properties)
        : isAcgPropertiesVisible(properties, visibility);
      const coordinateVisible = targetMap === map
        ? isPolarCoordinateVisible(polarPoint.coordinate, center)
        : isPolarCoordinateVisible(polarPoint.coordinate, center, targetMap);
      if (
        polarPoint.source !== 'acg' ||
        properties.kind !== 'ZENITH' ||
        !propertiesVisible ||
        !coordinateVisible
      ) continue;
      const point = targetMap === map
        ? projectPolarCoordinate(polarPoint.coordinate)
        : projectPolarCoordinate(polarPoint.coordinate, targetMap);
      if (!point) continue;
      const layerOpacity = acgLayerOpacityScale(properties);
      const radius = Math.max(
        settings.zenithRadiusMin,
        settings.solidWidth * settings.zenithRadiusWidthScale
      );
      const color = resolvedAcgLineColor(properties, settings);

      context.save();
      context.globalAlpha = settings.casingOpacity * layerOpacity;
      context.fillStyle = tokens.casing;
      context.beginPath();
      context.arc(
        point.x,
        point.y,
        radius + Math.max(settings.zenithStrokeWidthMin, settings.casingWidth),
        0,
        Math.PI * 2
      );
      context.fill();
      context.restore();

      context.save();
      context.globalAlpha = settings.solidOpacity * layerOpacity;
      context.fillStyle = color;
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
      context.restore();

      if (!settings.labelsOn) continue;
      let labelX = point.x + radius + 4;
      const labelY = point.y + settings.labelSize * 0.35;
      const glyph = String(properties.glyph_morinus || '');
      context.save();
      context.globalAlpha = settings.labelOpacity * layerOpacity;
      context.textAlign = 'left';
      if (glyph) {
        context.font = `${Math.max(10, settings.labelSize * 1.2)}px 'Morinus', serif`;
        context.strokeStyle = tokens.labelHalo;
        context.lineWidth = settings.labelHaloOn ? settings.labelHaloWidth * 2 : 0;
        if (context.lineWidth) context.strokeText(glyph, labelX, labelY);
        context.fillStyle = color;
        context.fillText(glyph, labelX, labelY);
        labelX += context.measureText(glyph).width + 4;
      }
      const label = acgFeatureLabelText(properties);
      if (label) {
        context.font = `600 ${settings.labelSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
        context.strokeStyle = tokens.labelHalo;
        context.lineWidth = settings.labelHaloOn ? settings.labelHaloWidth * 2 : 0;
        if (context.lineWidth) context.strokeText(label, labelX, labelY);
        context.fillStyle = color;
        context.fillText(label, labelX, labelY);
      }
      context.restore();
    }
  }

  function drawPolarEclipseShadows(
    context,
    center,
    settings,
    targetMap = map,
    polygons = polarOverlayPolygons,
  ) {
    context.save();
    context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.eclipseFillOpacity, 1)));
    context.fillStyle = settings.eclipseShadowColor;
    context.beginPath();
    let traced = false;
    for (const polygon of polygons) {
      if (polygon.source !== 'eclipse') continue;
      const visibleRing = targetMap === map
        ? visiblePolarRing(polygon.coordinates, center)
        : visiblePolarRing(polygon.coordinates, center, targetMap);
      if (!visibleRing.length) continue;
      const projected = visibleRing.map(
        (coordinate) => projectPolarCoordinate(coordinate, targetMap),
      );
      if (projected.length < 3 || projected.some((point) => !point)) continue;
      context.moveTo(projected[0].x, projected[0].y);
      for (const point of projected.slice(1)) context.lineTo(point.x, point.y);
      context.closePath();
      traced = true;
    }
    if (traced) context.fill();
    context.restore();
  }

  function renderPolarOverlay(targetMap = map, options = {}) {
    const liveTarget = targetMap === map && !options.canvas;
    const started = ACG_PERF_MODE && liveTarget ? perfNow() : 0;
    let projectionType = selectedProjection;
    try {
      const projection =
        targetMap && targetMap.getProjection && targetMap.getProjection();
      projectionType = projection && projection.type || projectionType;
    } catch (_) {}
    if (
      !targetMap ||
      (liveTarget && !mapHostActive) ||
      projectionType !== 'globe'
    ) {
      if (liveTarget) clearPolarOverlay();
      return null;
    }
    const prepared = preparePolarOverlayCanvas(
      targetMap,
      options.canvas || null,
    );
    if (!prepared) return null;
    const settings = options.settings || currentDevSettings();
    const tokens = options.tokens || currentThemeTokens();
    const behavior = options.behavior || referenceBehavior();
    const visibility = options.visibility || viewOptions;
    const paths = options.paths || polarOverlayPaths;
    const points = options.points || polarOverlayPoints;
    const polygons = options.polygons || polarOverlayPolygons;
    const referenceColorTransform =
      options.referenceColorTransform || unchangedPolarColor;
    const updateHitTargets = Object.prototype.hasOwnProperty.call(
      options,
      'updateHitTargets',
    )
      ? !!options.updateHitTargets
      : liveTarget;
    const center = targetMap.getCenter();
    const projectedPaths = projectPolarOverlayPaths(paths, center, targetMap);
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarReferenceStroke(
        path,
        settings,
        behavior,
        referenceColorTransform,
      ),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAsterismStroke(path, settings, true, visibility),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAsterismStroke(path, settings, false, visibility),
      projectedPaths,
    );
    drawPolarAsterismStars(
      prepared.context,
      center,
      settings,
      targetMap,
      visibility,
      points,
      updateHitTargets,
    );
    drawPolarZenithPoints(
      prepared.context,
      center,
      settings,
      tokens,
      targetMap,
      visibility,
      points,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarEclipseStroke(path, settings, true),
      projectedPaths,
    );
    drawPolarEclipseShadows(
      prepared.context,
      center,
      settings,
      targetMap,
      polygons,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarEclipseStroke(path, settings, false),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAcgCasingStroke(
        path,
        settings,
        tokens,
        visibility,
      ),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAcgLineStroke(
        path,
        settings,
        tokens,
        visibility,
      ),
      projectedPaths,
    );
    if (ACG_PERF_MODE && liveTarget) {
      const elapsed = perfNow() - started;
      perfState.polarOverlayDraws += 1;
      perfState.polarOverlayLastMs = elapsed;
      perfState.polarOverlayMaxMs = Math.max(perfState.polarOverlayMaxMs, elapsed);
    }
    return prepared.canvas;
  }

  function rulerLineKey(source, feature) {
    const p = feature.properties || {};
    const fields = ['point', 'kind', 'astrocart_mode', 'astrocart_layer', 'astrocart_layer_id',
      'aspect_id', 'target_angle', 'branch', 'bearing_role', 'a_point', 'a_angle',
      'b_point', 'b_angle', 'house', 'sign', 'name', 'id', 'event_id', 'side', 'limit'];
    return JSON.stringify([source, ...fields.map((key) => p[key] ?? '')]);
  }

  function rulerCollections() {
    return [[ACG_SOURCE_ID, currentData], [ECLIPSE_SOURCE_ID, currentEclipseData],
      [ASTERISM_SOURCE_ID, currentAsterismData]];
  }

  function rulerFeatureVisible(source, feature) {
    const properties = feature.properties || {};
    const path = { source: source === ASTERISM_SOURCE_ID ? 'asterism' :
      source === ECLIPSE_SOURCE_ID ? 'eclipse' : 'acg', properties };
    const settings = currentDevSettings();
    const stroke = source === ACG_SOURCE_ID
      ? polarAcgLineStroke(path, settings, currentThemeTokens())
      : source === ECLIPSE_SOURCE_ID
        ? polarEclipseStroke(path, settings, false)
        : (polarReferenceStroke(path, settings, referenceBehavior()) ||
           polarAsterismStroke(path, settings, false, viewOptions));
    return !!stroke && stroke.width > 0 && stroke.opacity > 0;
  }

  function resolveRulerLine(selection) {
    const collection = rulerCollections().find(([source]) => source === selection.source)?.[1];
    const features = (collection?.features || []).filter((feature) =>
      window.AriesRulerGeometry.paths(feature.geometry).length &&
      rulerLineKey(selection.source, feature) === selection.key &&
      rulerFeatureVisible(selection.source, feature));
    return { ...selection, features };
  }

  function projectRulerCoordinate(coordinate) {
    if (!map || !coordinate) return null;
    const globe = map.getProjection()?.type === 'globe';
    if (globe && !isPolarCoordinateVisible(coordinate, map.getCenter())) return null;
    const center = map.getCenter().lng;
    const lon = center + ((coordinate[0] - center + 540) % 360 + 360) % 360 - 180;
    const point = map.project([lon, coordinate[1]]);
    return Number.isFinite(point.x) && Number.isFinite(point.y)
      ? { x: point.x, y: point.y, longitude: lon } : null;
  }

  function pickRulerLine(point, { direct = false } = {}) {
    const zoom = map.getZoom?.() ?? 4;
    // At a world view the lines crowd together. Automatic measurement should
    // begin on a visible stroke; explicit ruler mode keeps a larger target.
    const lineHitRadius = direct ? 7 : Math.max(1, Math.min(3, Math.round(zoom - 1)));
    const paranHitRadius = direct ? 7 : Math.max(1, Math.min(3, Math.round(zoom - 2)));
    const sources = new Set(rulerCollections().map(([source]) => source));
    const layers = (map.getStyle()?.layers || []).filter((layer) =>
      layer.type === 'line' && sources.has(layer.source) &&
      layer.layout?.visibility !== 'none' &&
      (direct || (layer.id !== 'acg-casing' && layer.id !== 'acg-asterism-shadow' &&
        layer.id !== 'eclipse-path-shadow'))).map((layer) => layer.id);
    const hits = map.queryRenderedFeatures([[point.x - lineHitRadius, point.y - lineHitRadius],
      [point.x + lineHitRadius, point.y + lineHitRadius]], { layers });
    let closeParans = null;
    for (const feature of hits) {
      const source = feature.source;
      if (feature.properties?.kind === 'PARAN') {
        // A latitude line crosses the whole map. Require a near-exact press
        // before it can take an automatic measurement gesture from map pan.
        if (paranHitRadius < lineHitRadius && closeParans === null) {
          closeParans = new Set(map.queryRenderedFeatures(
            [[point.x - paranHitRadius, point.y - paranHitRadius],
              [point.x + paranHitRadius, point.y + paranHitRadius]],
            { layers },
          ).filter((hit) => hit.properties?.kind === 'PARAN')
            .map((hit) => rulerLineKey(hit.source, hit)));
        }
        if (closeParans && !closeParans.has(rulerLineKey(source, feature))) continue;
      }
      const selected = resolveRulerLine({ source, key: rulerLineKey(source, feature) });
      if (selected.features.length) return selected;
    }
    // MapLibre's tiled geometry ends at 85 degrees. The existing polar canvas
    // uses original geographic coordinates, so offer the same ruler there.
    if (map.getProjection()?.type !== 'globe') return null;
    let best = null;
    let bestDistance = lineHitRadius;
    for (const [source, collection] of rulerCollections()) {
      const rendered = source === ACG_SOURCE_ID
        ? curveRefinement?.getData(collection) || collection : collection;
      for (const feature of rendered.features || []) {
        if (!rulerFeatureVisible(source, feature)) continue;
        for (const path of window.AriesRulerGeometry.paths(feature.geometry)) {
          for (let i = 1; i < path.length; i++) {
            if (Math.max(Math.abs(path[i - 1][1]), Math.abs(path[i][1])) < POLAR_OVERLAY_LATITUDE) continue;
            const a = projectRulerCoordinate(path[i - 1]);
            const b = projectRulerCoordinate(path[i]);
            if (!a || !b) continue;
            const dx = b.x - a.x, dy = b.y - a.y;
            const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / (dx * dx + dy * dy || 1)));
            const distance = Math.hypot(point.x - a.x - t * dx, point.y - a.y - t * dy);
            if (distance >= (feature.properties?.kind === 'PARAN'
              ? paranHitRadius : lineHitRadius)) continue;
            if (distance < bestDistance) {
              bestDistance = distance;
              best = { source, key: rulerLineKey(source, feature) };
            }
          }
        }
      }
    }
    return best ? resolveRulerLine(best) : null;
  }

  function onLineClick(e) {
    if (!e.features || !e.features.length) return;
    const f = e.features[0];
    const label = localizedPointLabel(f.properties);
    const kind = f.properties.kind;
    const kindLabel = kind === 'LOCAL_SPACE_OPPOSITION'
      ? (uiLabels.localSpaceOpposition || '')
      : (kind === 'ASPECT'
        ? localizedAspectLabel(f.properties)
        : (kind === 'ZENITH' ? (uiLabels.zenith || '') : kind));
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${label}</strong> ${kindLabel}<br><span style="opacity:0.7">${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({ type: 'click', point: f.properties.point, kind: kind,
                 lon: e.lngLat.lng, lat: e.lngLat.lat });
  }

  function onEclipseClick(e) {
    if (!e.features || !e.features.length) return;
    if (e.originalEvent && e.originalEvent._eclipsePopupHandled) return;
    if (e.originalEvent) e.originalEvent._eclipsePopupHandled = true;
    const f = e.features[0];
    const p = f.properties || {};
    const title = p.label || `${(p.event_type || 'Solar').replace(/^\w/, (c) => c.toUpperCase())} solar eclipse`;
    const date = p.utc || '';
    const detail = p.kind === 'ECLIPSE_MAX' ? 'maximum eclipse' :
      (p.kind === 'ECLIPSE_CENTER' ? 'centerline' :
       (p.kind === 'ECLIPSE_LIMIT' ? 'path limit' : 'shadow path'));
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${title}</strong><br><span>${date}</span><br><span style="opacity:0.7">${detail} · ${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({
      type: 'click',
      point: 'eclipse',
      kind: p.kind || 'ECLIPSE',
      lon: e.lngLat.lng,
      lat: e.lngLat.lat,
    });
  }

  function featurePlaceName(f) {
    const p = (f && f.properties) || {};
    return p.name_en || p['name:en'] || p.name || p.name_int || '';
  }

  function placeFeatureAtPoint(point) {
    const layers = PLACE_LABEL_LAYER_IDS.filter((id) => map && map.getLayer(id));
    if (!layers.length) return null;
    const r = 10;
    const features = map.queryRenderedFeatures(
      [[point.x - r, point.y - r], [point.x + r, point.y + r]],
      { layers }
    );
    return features.find((f) => featurePlaceName(f)) || null;
  }

  function sendHereRequest(action, lngLat, placeName) {
    sendToHost({
      type: 'here',
      action: action,
      lon: lngLat.lng,
      lat: lngLat.lat,
      placeName: placeName || '',
    });
  }

  function configureRuler(options) {
    rulerOptions = Object.assign({}, rulerOptions, options || {});
    mapRuler?.configure(rulerOptions);
    const button = document.querySelector('#acg-menu button[data-action="ruler"]');
    if (button) {
      button.textContent = rulerOptions.title || '';
      button.setAttribute('aria-checked', String(!!rulerOptions.enabled));
    }
    const control = document.getElementById('ruler-control');
    if (control) {
      control.title = rulerOptions.title || '';
      control.setAttribute('aria-label', rulerOptions.title || '');
      control.setAttribute('aria-pressed', String(!!rulerOptions.enabled));
      control.disabled = !mapRuler || !rulerOptions.ready;
    }
  }

  function toggleRuler() {
    const enabled = !mapRuler?.enabled;
    configureRuler({ enabled });
    postToParent({ type: 'ruler', enabled });
  }

  function wireContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    // The map exposes its own Aries menu. Never fall through to WKWebView's
    // Back/Reload/Inspect website menu elsewhere in the embedded document.
    document.addEventListener('contextmenu', (event) => event.preventDefault(), true);
    menu.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn || !contextMenuTarget) return;
      if (btn.dataset.action === 'ruler') {
        toggleRuler();
        hideContextMenu();
        return;
      }
      sendHereRequest(btn.dataset.action, contextMenuTarget.lngLat, contextMenuTarget.placeName);
      hideContextMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') hideContextMenu();
    });
  }

  function wireAmbientInput() {
    const forward = (event, eventType) => {
      const target = event.target;
      const targetIsEditable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
      const isShiftSignal = event.key === 'Shift' || event.shiftKey;
      const isAmbientDigit =
        !targetIsEditable &&
        eventType === 'keydown' &&
        !event.repeat &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.altKey &&
        /^[0-9]$/.test(event.key);
      if (!isShiftSignal && !isAmbientDigit) return;
      if (isAmbientDigit) {
        event.preventDefault();
        event.stopPropagation();
      }
      postToParent({
        type: 'ambient-key',
        eventType: eventType,
        key: event.key,
        metaKey: event.metaKey,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        repeat: event.repeat,
      });
    };
    window.addEventListener('keydown', (event) => forward(event, 'keydown'), true);
    window.addEventListener('keyup', (event) => forward(event, 'keyup'), true);
  }

  function routeHostKeyCommand(event) {
    if (event.defaultPrevented || event.altKey) return;
    const target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable)) {
      return;
    }
    const key = event.key || '';
    if ((event.metaKey || event.ctrlKey) && key.toLowerCase() === 'a' && !event.shiftKey) {
      event.preventDefault();
      event.stopPropagation();
      if (!event.repeat) sendToHost({ type: 'shortcut', key: key, metaKey: event.metaKey, ctrlKey: event.ctrlKey });
      return;
    }
    if (event.ctrlKey || event.metaKey) return;
    const isLetter = key.length === 1 && /^[a-z]$/i.test(key);
    const isEscape = key === 'Escape';
    if (isEscape && mapRuler?.enabled) return;
    if (!isLetter && !isEscape) return;

    const menu = document.getElementById('acg-menu');
    if (isEscape && menu && menu.style.display !== 'none') {
      hideContextMenu();
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    if (!event.repeat) sendToHost({ type: 'shortcut', key: key });
  }

  // The map is an iframe, so arrow events focused here never reach the chart
  // shortcut listener in the parent window. Forward them only while a linked
  // chart owns the map keyboard; otherwise MapLibre keeps its arrow panning.
  let chartKeyboardNavigationEnabled = false;
  function routeChartNavigationKey(event, eventType) {
    if (!chartKeyboardNavigationEnabled || window.parent === window || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
      target.tagName === 'SELECT' || target.isContentEditable)) return;
    const keys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    const key = keys[event.key];
    if (!key) return;
    event.preventDefault();
    event.stopPropagation();
    postToParent({
      type: 'navigation-key', eventType, key,
      shiftKey: event.shiftKey, altKey: event.altKey,
    });
  }

  window.addEventListener('keydown', (event) => routeChartNavigationKey(event, 'keydown'), true);
  window.addEventListener('keyup', (event) => routeChartNavigationKey(event, 'keyup'), true);
  window.addEventListener('blur', () => {
    if (chartKeyboardNavigationEnabled) postToParent({ type: 'navigation-blur' });
  });

  function onMapContextMenu(e) {
    if (e.preventDefault) e.preventDefault();
    if (e.originalEvent) e.originalEvent.preventDefault();
    const place = placeFeatureAtPoint(e.point);
    const placeName = place ? featurePlaceName(place) : '';
    showContextMenu(e.point, e.lngLat, placeName);
  }

  function showContextMenu(point, lngLat, placeName) {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    contextMenuTarget = { lngLat: lngLat, placeName: placeName || '' };
    menu.style.display = 'block';
    const margin = 6;
    const rect = menu.getBoundingClientRect();
    const x = Math.min(point.x, window.innerWidth - rect.width - margin);
    const y = Math.min(point.y, window.innerHeight - rect.height - margin);
    menu.style.left = Math.max(margin, x) + 'px';
    menu.style.top = Math.max(margin, y) + 'px';
  }

  function hideContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (menu) menu.style.display = 'none';
  }

  function sendToHost(payload) {
    // wx host: navigation to morinus://acg/<json> is intercepted by
    // EVT_WEBVIEW_NAVIGATING (astrocartframe.py:534). This is a top-level page
    // under wx, so window.parent === window and the postMessage below is a
    // harmless self-post that wx never listens for — its bridge path is the
    // navigation, untouched.
    const url = 'morinus://acg/' + encodeURIComponent(JSON.stringify(payload));
    window.location.href = url;
    // webapp host: the React shell embeds this page in an <iframe> and CANNOT
    // intercept the morinus:// navigation. When embedded (parent !== self) we
    // ALSO postMessage the same payload UP to the parent so the React surface
    // receives the line-click / here / shortcut intents. Tagged with a source
    // marker so the parent can distinguish it from the inbound aries.* channel.
    try {
      if (window.parent && window.parent !== window) {

  // ---- Place search ---------------------------------------------------
  //
  // Two-tier search:
  //   1. Offline city-list: filters the `placesData` array already loaded
  //      for the on-globe labels (~16k cities from places.geojson). Instant.
  //   2. Nominatim (https://nominatim.openstreetmap.org/): debounced fetch

  //      ship in the bundled list. Online-only; if the API is unreachable
  //      the local section keeps working unchanged.
  //

  // the wxWebView (see astrocartframe._aries_user_agent), debouncing input
  // to one query per ~350ms, aborting stale requests, and caching results.

  let activeSearchIndex = -1;
  let currentSearchMatches = [];

  let nominatimQueryToken = 0;
  let nominatimDebounceTimer = null;
  const nominatimCache = new Map();
  const NOMINATIM_DEBOUNCE_MS = 350;
  const NOMINATIM_MIN_QUERY = 3;
