      })
      .catch((err) => {
        if (err && err.name === 'AbortError') return;
        cityLabelsRequestKey = '';
        // Keep the last useful labels visible until the bundled static fallback
        // is ready; never replace them with an error-shaped empty response.
        loadStaticPlaceLabels({ useForOverlay: true });
      })
      .finally(() => {
        if (cityLabelsController === controller) cityLabelsController = null;
      });
  }

  function boxesOverlap(a, b, padding = 0) {
    return !(
      a.right + padding <= b.left ||
      a.left >= b.right + padding ||
      a.bottom + padding <= b.top ||
      a.top >= b.bottom + padding
    );
  }

  function estimatedLabelBox(x, y, text, fontSize, extraWidth = 0) {
    const width = Math.max(18, String(text || '').length * fontSize * 0.56 + extraWidth);
    const height = Math.max(12, fontSize * 1.25);
    return {
      left: x - width / 2,
      right: x + width / 2,
      top: y - height / 2,
      bottom: y + height / 2,
    };
  }

  function schedulePlaceLabelsRender(reason) {
    placeLabelsDirty = true;
    domLabelLayoutReason = reason || domLabelLayoutReason;
    if (isDomLabelMovementActive()) {
      if (ACG_PERF_MODE) perfState.placeLabelSkippedWhileMoving += 1;
      return;
    }
    requestDomLabelLayout();
  }

  function isDomLabelMovementActive() {
    return activeMapMotionPhases.size > 0;
  }

  function requestDomLabelLayout(reason) {
    if (reason) domLabelLayoutReason = reason;
    if (isDomLabelMovementActive() || domLabelLayoutRaf) return;
    if (!domAcgLabelsDirty && !placeLabelsDirty) return;
    domLabelLayoutRaf = window.requestAnimationFrame(() => {
      domLabelLayoutRaf = 0;
      if (isDomLabelMovementActive()) return;
      const rebuildAcgLabels = domAcgLabelsDirty;
      const rebuildPlaceLabels = placeLabelsDirty;
      const authoritativeReason = domLabelLayoutReason || 'raf';
      domAcgLabelsDirty = false;
      placeLabelsDirty = false;
      domLabelLayoutReason = '';
      if (rebuildAcgLabels) renderDomAcgLabels(authoritativeReason);
      if (rebuildPlaceLabels) renderPlaceLabels(authoritativeReason);
    });
  }

  function beginDomAcgMovement(burstStarted) {
    if (!burstStarted) return;
    if (domLabelLayoutRaf) {
      window.cancelAnimationFrame(domLabelLayoutRaf);
      domLabelLayoutRaf = 0;
    }
    // Retain the last coherent label scene during the gesture. The map canvas
    // remains free to animate; DOM labels are authoritatively placed once the
    // complete move/zoom burst has settled.
    domAcgLabelsDirty = true;
    placeLabelsDirty = true;
    const layer = document.getElementById('acg-dom-labels');
    if (layer) layer.classList.remove('is-moving');
  }

  function endDomAcgMovement(reason, burstSettled) {
    if (!burstSettled) return;
    if (ACG_PERF_MODE) perfState.domLabelBurstSettles += 1;
    requestDomLabelLayout(reason || 'settle');
    postPerfSnapshot(reason || 'settle');
  }

  function scheduleDomAcgLabels(reason) {
    domAcgLabelsDirty = true;
    // Place labels share the ACG collision boxes, so both layouts belong to
    // one authoritative frame whenever the ACG label scene changes.
    placeLabelsDirty = true;
    domLabelLayoutReason = reason || domLabelLayoutReason;
    if (isDomLabelMovementActive()) {
      if (ACG_PERF_MODE) {
        perfState.domLabelSkippedWhileMoving += 1;
        perfState.placeLabelSkippedWhileMoving += 1;
      }
      return;
    }
    requestDomLabelLayout();
  }

  function renderPlaceLabels(reason) {
    if (isDomLabelMovementActive()) {
      placeLabelsDirty = true;
      if (ACG_PERF_MODE) perfState.placeLabelSkippedWhileMoving += 1;
      return;
    }
    const layer = document.getElementById('place-labels');
    if (!layer) return;
    const started = perfNow();
    for (const el of placeLabelElements.values()) el.style.display = 'none';
    if (!map || !shouldRenderPlaceOverlay() || !Array.isArray(placeLabelData)) {
      perfState.placeLabelLastRenderMs = perfNow() - started;
      return;
    }
    const source = placeLabelData;
    if (!source.length) {
      perfState.placeLabelLastRenderMs = perfNow() - started;
      return;
    }
    const zoom = map.getZoom ? map.getZoom() : 0;
    const maxLevel = zoom < 1.7 ? 0 : (zoom < 2.3 ? 1 : (zoom < 3.0 ? 2 : (zoom < 4.0 ? 3 : 4)));
    const minPop = zoom < 1.7 ? 4000000 : (zoom < 2.3 ? 1000000 : (zoom < 3.0 ? 250000 : (zoom < 4.0 ? 100000 : 0)));
    const maxLabels = zoom < 1.7 ? 60 : (zoom < 2.3 ? 110 : (zoom < 3.0 ? 180 : (zoom < 4.0 ? 260 : 420)));
    const bounds = map.getBounds ? map.getBounds() : null;
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;
    const labels = [];
    for (const place of source) {
      if (place.level > maxLevel && place.population < minPop) continue;
      if (bounds && !bounds.contains([place.lon, place.lat])) continue;
      if (!isCoordinateVisibleOnCurrentProjection([place.lon, place.lat])) continue;
      let pt;
      try {
        pt = map.project([place.lon, place.lat]);
      } catch (_) {
        continue;
      }
      if (!pt || pt.x < 8 || pt.x > w - 8 || pt.y < 8 || pt.y > h - 8) continue;
      labels.push({ place, x: pt.x, y: pt.y });
    }
    labels.sort((a, b) => (a.place.level - b.place.level) || (b.place.population - a.place.population));
    const occupied = acgLabelCollisionBoxes.slice();
    let rendered = 0;
    const visibleKeys = new Set();
    for (const item of labels) {
      if (rendered >= maxLabels) break;
      const box = estimatedLabelBox(item.x, item.y, item.place.name, 11, 9);
      if (occupied.some((other) => boxesOverlap(box, other, 3))) continue;
      occupied.push(box);
      const key = `${item.place.lon.toFixed(5)}:${item.place.lat.toFixed(5)}:${item.place.name}`;
      visibleKeys.add(key);
      let el = placeLabelElements.get(key);
      if (!el) {
        el = document.createElement('div');
        const dot = document.createElement('span');
        dot.className = 'place-dot';
        el.append(dot, document.createTextNode(item.place.name));
        placeLabelElements.set(key, el);
        layer.appendChild(el);
      }
      el.className = `place-label${item.place.level <= 1 || item.place.population >= 1500000 ? ' major' : ''}`;
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      el.style.display = '';
      rendered += 1;
    }
    // Dynamic viewport payloads are small.  Bound the fallback cache too so a
    // long pan session cannot retain one DOM node for every static catalog row.
    if (placeLabelElements.size > 700) {
      for (const [key, el] of placeLabelElements) {
        if (visibleKeys.has(key)) continue;
        el.remove();
        placeLabelElements.delete(key);
      }
    }
    const elapsed = perfNow() - started;
    perfState.placeLabelLastCount = rendered;
    perfState.placeLabelLastRenderMs = elapsed;
    perfState.placeLabelMaxRenderMs = Math.max(perfState.placeLabelMaxRenderMs, elapsed);
  }

  function geometrySegments(geom) {
    if (!geom) return [];
    if (geom.type === 'LineString') return [geom.coordinates || []];
    if (geom.type === 'MultiLineString') return geom.coordinates || [];
    return [];
  }

  function geometryLatitudeAnchors(geom) {
    const segments = geometrySegments(geom);
    if (!segments.length) return [];
    let centerLat = 0;
    try { centerLat = Number(map.getCenter().lat) || 0; } catch (_) {}
    const targets = [centerLat, 0, -30, 30, -60, 60]
      .map((lat) => Math.max(-75, Math.min(75, Number(lat) || 0)))
      .filter((lat, index, all) => all.findIndex((other) => Math.abs(other - lat) < 0.01) === index);
    const out = [];
    for (const target of targets) {
      for (const line of segments) {
        for (let index = 1; index < line.length; index += 1) {
          const a = line[index - 1];
          const b = line[index];
          if (!a || !b) continue;
          const latA = Number(a[1]);
          const latB = Number(b[1]);
          if (!Number.isFinite(latA) || !Number.isFinite(latB)) continue;
          if (target < Math.min(latA, latB) || target > Math.max(latA, latB)) continue;
          const span = latB - latA;
          const fraction = Math.abs(span) < 1e-9 ? 0 : (target - latA) / span;
          const lonA = Number(a[0]);
          let lonB = Number(b[0]);
          if (!Number.isFinite(lonA) || !Number.isFinite(lonB)) continue;
          while (lonB - lonA > 180) lonB -= 360;
          while (lonB - lonA < -180) lonB += 360;
          const lon = ((lonA + (lonB - lonA) * fraction + 540) % 360) - 180;
          out.push([lon, target]);
          break;
        }
      }
    }
    return out;
  }

  function fallbackLineAnchors(geom) {
    const fromLatitudes = geometryLatitudeAnchors(geom);
    if (fromLatitudes.length) return fromLatitudes;
    const line = geometrySegments(geom).reduce(
      (best, current) => current && (!best || current.length > best.length) ? current : best,
      null,
    );
    if (!line || !line.length) return [];
    return [0.25, 0.5, 0.75]
      .map((fraction) => line[Math.min(line.length - 1, Math.round((line.length - 1) * fraction))])
      .filter(Boolean);
  }

  function featureLabelAnchors(feature) {
    const p = feature && feature.properties || {};
    const declared = p.label_anchors || p.labelAnchors;
    if (Array.isArray(declared) && declared.length) return declared;
    if (p.kind === 'PARAN') {
      const line = geometrySegments(feature.geometry)[0] || [];
      const latitude = line.length ? Number(line[0][1]) : NaN;
      if (!Number.isFinite(latitude)) return [];
      let centerLon = 0;
      try { centerLon = Number(map.getCenter().lng) || 0; } catch (_) {}
      return [0, -55, 55, -110, 110].map((offset) => [((centerLon + offset + 540) % 360) - 180, latitude]);
    }
    if (feature.geometry && feature.geometry.type === 'Point') {
      return [feature.geometry.coordinates];
    }
    return fallbackLineAnchors(feature.geometry);
  }

  function acgLayerDisplayLabel(properties) {
    const technique = normalizedAcgTechnique(properties);
    const techniqueLabels = uiLabels.techniqueLabels &&
      typeof uiLabels.techniqueLabels === 'object'
      ? uiLabels.techniqueLabels
      : {};
    const techniqueLabel = String(techniqueLabels[technique] || '').trim();
    if (techniqueLabel) return techniqueLabel;
    const explicit = String(properties && properties.layer_label || '').trim();
    if (explicit) return explicit;
    const role = normalizedAcgLayerRole(properties);
    if (role === 'transit') return String(uiLabels.transitLayer || '').trim();
    if (role === 'progression') return String(uiLabels.progressionLayer || '').trim();
    return '';
  }

  function prefixedAcgLabel(properties, text) {
    const layerLabel = acgLayerDisplayLabel(properties);
    return layerLabel ? `[${layerLabel}] ${text}` : text;
  }

  function acgFeatureLabelText(properties) {
    const p = properties || {};
    const pointLabel = localizedPointLabel(p);
    const kind = String(p.kind || '');
    let text = pointLabel;
    if (kind === 'LOCAL_SPACE' || kind === 'LOCAL_SPACE_OPPOSITION') {
      const bearing = String(p.bearing_label ?? p.source_bearing ?? '').trim();
      const opposition = kind === 'LOCAL_SPACE_OPPOSITION'
        ? String(uiLabels.localSpaceOpposition || '').trim()
        : '';
      text = `${pointLabel} ${bearing} ${opposition}`.trim();
    } else if (kind === 'ASPECT') {
      text = `${pointLabel} ${localizedAspectLabel(p)} ${p.target_angle || ''}`.trim();
    } else if (kind === 'ZENITH') {
      text = `${pointLabel} ${String(uiLabels.zenith || '').trim()}`.trim();
    } else if (['MC', 'IC', 'ASC', 'DSC'].includes(kind)) {
      text = `${pointLabel} ${kind}`.trim();
    }
    return prefixedAcgLabel(p, text);
  }

  function labelDescriptor(feature, source) {
    if (source === 'acg' && !isAcgFeatureVisible(feature)) return null;
    const p = feature && feature.properties || {};
    const kind = p.kind || '';
    const modeKey = `${p.astrocart_mode || ''}:${normalizedAcgLayerRole(p)}:`;
    const settings = currentDevSettings();
    const theme = currentThemeTokens();
    if (source === 'eclipse') {
      if (kind !== 'ECLIPSE_MAX' || !p.label) return null;
      return {
        id: p.label_id || `eclipse:${p.utc || ''}:${p.label}`,
        text: String(p.label),
        color: settings.eclipseCenterColor,
        fontSize: settings.eclipseLabelSize,
        letterSpacing: settings.eclipseLabelSpacing,
        haloColor: settings.eclipseHaloColor,
        haloWidth: settings.eclipseLabelHaloWidth,
        opacity: settings.eclipseLabelOpacity * settings.domLabelOpacityScale,
        priority: 0,
        yOffset: 16,
      };
    }
    if (kind === 'PARAN') {
      if (!viewOptions.parans || !settings.paranLabelsOn) return null;
      const line = geometrySegments(feature.geometry)[0] || [];
      const latitudeKey = line.length && Number.isFinite(Number(line[0][1])) ? Number(line[0][1]).toFixed(6) : '';
      return {
        id: p.label_id || `${modeKey}paran:${p.a_point || ''}:${p.a_angle || ''}:${p.b_point || ''}:${p.b_angle || ''}:${latitudeKey}`,
        text: prefixedAcgLabel(
          p,
          `${localizedPointLabel(p, 'a_point', 'a_label')} ${p.a_angle || ''} × ${localizedPointLabel(p, 'b_point', 'b_label')} ${p.b_angle || ''}`.trim(),
        ),
        color: theme.paranColor,
        fontSize: settings.paranLabelSize,
        letterSpacing: settings.paranLabelSpacing,
        haloColor: theme.paranHalo,
        haloWidth: settings.paranLabelHaloOn ? settings.paranLabelHaloWidth : 0,
        opacity: settings.paranLabelOpacity * settings.domLabelOpacityScale * acgLayerOpacityScale(p),
        priority: 3,
        yOffset: 0,
      };
    }
    if (
      !settings.labelsOn ||
      ![
        'MC',
        'IC',
        'ASC',
        'DSC',
        'LOCAL_SPACE',
        'LOCAL_SPACE_OPPOSITION',
        'ASPECT',
        'ZENITH',
      ].includes(kind)
    ) return null;
    const text = acgFeatureLabelText(p);
    return {
      id: p.label_id || `${modeKey}${kind}:${p.point || p.label || ''}`,
      text,
      glyph: kind === 'ZENITH' ? String(p.glyph_morinus || '') : '',
      className: kind === 'ZENITH' ? 'zenith' : '',
      color: p.color || theme.labelColor,
      fontSize: settings.labelSize,
      letterSpacing: settings.labelSpacing,
      haloColor: theme.labelHalo,
      haloWidth: settings.labelHaloOn ? settings.labelHaloWidth : 0,
      opacity: settings.labelOpacity * settings.domLabelOpacityScale * acgLayerOpacityScale(p),
      priority: kind === 'ZENITH' ? 0 : (kind === 'LOCAL_SPACE' ? 2 : 1),
      yOffset: kind === 'ZENITH' ? -10 : 0,
    };
  }

  function applyDomAcgLabelContent(element, descriptor) {
    const glyph = String(descriptor.glyph || '');
    const contentKey = `${glyph}\u0000${descriptor.text}`;
    if (element.dataset.contentKey === contentKey) return;
    element.dataset.contentKey = contentKey;
    if (!glyph) {
      element.textContent = descriptor.text;
      return;
    }
    const glyphElement = document.createElement('span');
    glyphElement.className = 'acg-dom-label-glyph';
    glyphElement.textContent = glyph;
    const textElement = document.createElement('span');
    textElement.textContent = descriptor.text;
    element.replaceChildren(glyphElement, textElement);
  }

  function renderDomAcgLabels(reason) {
    if (isDomLabelMovementActive()) {
      domAcgLabelsDirty = true;
      placeLabelsDirty = true;
      if (ACG_PERF_MODE) perfState.domLabelSkippedWhileMoving += 1;
      return;
    }
    if (!mapHostActive) return;
    const layer = document.getElementById('acg-dom-labels');
    if (!layer) return;
    const offlineRenderer = USE_LOCAL_BASEMAP || USE_MINIMAL_BASEMAP;
    if (!offlineRenderer) {
      domLabelRendererMode = 'online';
      layer.replaceChildren();
      acgLabelElements.clear();
      acgLabelAnchorChoices.clear();
      acgLabelCollisionBoxes = [];
      recordDomLabelPerf(0, 0, reason);
      return;
    }
    if (domLabelRendererMode !== 'offline') {
      layer.replaceChildren();
      acgLabelElements.clear();
      acgLabelAnchorChoices.clear();
    }
    domLabelRendererMode = 'offline';
    const started = perfNow();
    let renderedCount = 0;
    for (const el of acgLabelElements.values()) el.style.display = 'none';
    acgLabelCollisionBoxes = [];
    if (!ACG_DOM_LABELS || !map || !currentData || !currentData.features) {
      recordDomLabelPerf(perfNow() - started, renderedCount, reason);
      return;
    }
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;
    const safeTop = Math.max(12, Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--titlebar-safe-top')) + 12 || 12);
    const screenCenter = { x: w / 2, y: h / 2 };
    const features = (currentData.features || [])
      .map((feature) => ({ feature, source: 'acg' }));
    for (const feature of currentEclipseData.features || []) features.push({ feature, source: 'eclipse' });
    const descriptors = features
      .map((entry) => ({ ...entry, descriptor: labelDescriptor(entry.feature, entry.source) }))
      .filter((entry) => entry.descriptor && entry.descriptor.text)
      .sort((a, b) => (a.descriptor.priority - b.descriptor.priority) || a.descriptor.id.localeCompare(b.descriptor.id));
    const currentDescriptorIds = new Set(descriptors.map((entry) => entry.descriptor.id));
    for (const [id, el] of acgLabelElements) {
      if (currentDescriptorIds.has(id)) continue;
      el.remove();
      acgLabelElements.delete(id);
      acgLabelAnchorChoices.delete(id);
    }
    const featureLimit = 120;
    for (const entry of descriptors) {
      if (renderedCount >= featureLimit) break;
      const descriptor = entry.descriptor;
      const candidates = [];
      for (const coord of featureLabelAnchors(entry.feature)) {
        if (!Array.isArray(coord) || coord.length < 2 || !isCoordinateVisibleOnCurrentProjection(coord)) continue;
        let pt;
        try { pt = map.project(coord); } catch (_) { continue; }
        const x = Number(pt && pt.x);
        const y = Number(pt && pt.y) + descriptor.yOffset;
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        if (x < 12 || x > w - 12 || y < safeTop || y > h - 42) continue;
        const box = estimatedLabelBox(x, y, descriptor.text, descriptor.fontSize, 8);
        if (acgLabelCollisionBoxes.some((other) => boxesOverlap(box, other, 3))) continue;
        const score = Math.hypot(x - screenCenter.x, y - screenCenter.y);
        const anchorKey = `${Number(coord[0]).toFixed(6)}:${Number(coord[1]).toFixed(6)}`;
        candidates.push({ x, y, box, score, anchorKey });
      }
      candidates.sort((a, b) => a.score - b.score);
      const previousAnchor = acgLabelAnchorChoices.get(descriptor.id);
      const item = candidates.find((candidate) => candidate.anchorKey === previousAnchor) || candidates[0];
      if (!item) continue;
      acgLabelAnchorChoices.set(descriptor.id, item.anchorKey);
      acgLabelCollisionBoxes.push(item.box);
      let el = acgLabelElements.get(descriptor.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'acg-dom-label';
        acgLabelElements.set(descriptor.id, el);
        layer.appendChild(el);
      }
      applyDomAcgLabelContent(el, descriptor);
      el.className = `acg-dom-label${descriptor.className ? ` ${descriptor.className}` : ''}`;
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      el.style.color = descriptor.color;
      el.style.opacity = String(descriptor.opacity);
      el.style.fontSize = `${descriptor.fontSize}px`;
      el.style.letterSpacing = `${descriptor.letterSpacing || 0}em`;
      el.style.textShadow = descriptor.haloWidth > 0
        ? `0 0 ${Math.max(2, descriptor.haloWidth * 2)}px ${descriptor.haloColor}`
        : 'none';
      el.style.display = '';
      renderedCount += 1;
    }
    recordDomLabelPerf(perfNow() - started, renderedCount, reason);
  }

  function isCoordinateVisibleOnCurrentProjection(coord) {
    if (!map || !coord) return true;
    let projType = 'mercator';
    try {
      const proj = map.getProjection && map.getProjection();
      projType = (proj && proj.type) || projType;
    } catch (_) {}
    if (projType !== 'globe') return true;
    let center;
    try {
      center = map.getCenter();
    } catch (_) {
      return true;
    }
    return angularDistanceDeg(center.lng, center.lat, Number(coord[0]), Number(coord[1])) <= 92.0;
  }

  function angularDistanceDeg(lon1, lat1, lon2, lat2) {
    const r = Math.PI / 180;
    const p1 = Number(lat1) * r;
    const p2 = Number(lat2) * r;
    const dLon = ((Number(lon2) - Number(lon1) + 540) % 360 - 180) * r;
    const cosD = Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dLon);
    const clamped = Math.max(-1, Math.min(1, cosD));
    return Math.acos(clamped) / r;
  }

  function interpolateWrappedCoordinate(a, b, t) {
    const startLon = Number(a[0]);
    const endLon = Number(b[0]);
    const lonDelta = ((endLon - startLon + 540) % 360) - 180;
    const lon = ((startLon + lonDelta * t + 540) % 360) - 180;
    return [lon, Number(a[1]) + (Number(b[1]) - Number(a[1])) * t];
  }

  function clipLineToPolarCap(coordinates, cutoff = POLAR_OVERLAY_LATITUDE) {
    const runs = [];
    for (const poleSign of [1, -1]) {
      let run = [];
      let previous = null;
      let previousInside = false;
      const flush = () => {
        if (run.length >= 2) runs.push(run);
        run = [];
      };
      for (const rawCoordinate of Array.isArray(coordinates) ? coordinates : []) {
        const lon = Number(rawCoordinate && rawCoordinate[0]);
        const lat = Number(rawCoordinate && rawCoordinate[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
          flush();
          previous = null;
          previousInside = false;
          continue;
        }
        const current = [lon, lat];
        const currentInside = poleSign * lat >= cutoff;
        if (previous) {
          if (previousInside && currentInside) {
            if (!run.length) run.push(previous);
            run.push(current);
          } else if (previousInside) {
            if (!run.length) run.push(previous);
            const boundaryLat = poleSign * cutoff;
            const t = (boundaryLat - previous[1]) / (current[1] - previous[1]);
            run.push(interpolateWrappedCoordinate(previous, current, t));
            flush();
          } else if (currentInside) {
            const boundaryLat = poleSign * cutoff;
            const t = (boundaryLat - previous[1]) / (current[1] - previous[1]);
            run = [interpolateWrappedCoordinate(previous, current, t), current];
          }
        } else if (currentInside) {
          run = [current];
        }
        previous = current;
        previousInside = currentInside;
      }
      flush();
    }
    return runs;
  }

  function clipLineToMapBand(coordinates, cutoff = POLAR_OVERLAY_LATITUDE) {
    const runs = [];
    let run = [];
    const flush = () => {
      if (run.length >= 2) runs.push(run);
      run = [];
    };
    const sameCoordinate = (a, b) => (
      Math.abs(Number(a[0]) - Number(b[0])) < 1e-9 &&
      Math.abs(Number(a[1]) - Number(b[1])) < 1e-9
    );
    let previous = null;
    for (const rawCoordinate of Array.isArray(coordinates) ? coordinates : []) {
      const lon = Number(rawCoordinate && rawCoordinate[0]);
      const lat = Number(rawCoordinate && rawCoordinate[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
        flush();
        previous = null;
        continue;
      }
      const current = [lon, lat];
      if (previous) {
        const deltaLat = current[1] - previous[1];
        let start = 0;
        let end = 1;
        if (Math.abs(deltaLat) < 1e-12) {
          if (Math.abs(previous[1]) > cutoff) {
            flush();
            previous = current;
            continue;
          }
        } else {
          const south = (-cutoff - previous[1]) / deltaLat;
          const north = (cutoff - previous[1]) / deltaLat;
          start = Math.max(0, Math.min(south, north));
          end = Math.min(1, Math.max(south, north));
        }
        if (start <= end) {
          const coordinateAt = (t) => {
            if (t <= 0) return previous.slice();
            if (t >= 1) return current.slice();
            return interpolateWrappedCoordinate(previous, current, t);
          };
          const segmentStart = coordinateAt(start);
          const segmentEnd = coordinateAt(end);
          if (!sameCoordinate(segmentStart, segmentEnd)) {
            if (!run.length || !sameCoordinate(run[run.length - 1], segmentStart)) {
              flush();
              run = [segmentStart];
            }
            run.push(segmentEnd);
          }
        } else {
          flush();
        }
      }
      previous = current;
    }
    flush();
    return runs;
  }

  function geometryLineStrings(geometry) {
    if (!geometry || !Array.isArray(geometry.coordinates)) return [];
    if (geometry.type === 'LineString') return [geometry.coordinates];
    if (geometry.type === 'MultiLineString') return geometry.coordinates;
    return [];
  }

  function geometryPolygonOuterRings(geometry) {
    if (!geometry || !Array.isArray(geometry.coordinates)) return [];
    if (geometry.type === 'Polygon') {
      return Array.isArray(geometry.coordinates[0]) ? [geometry.coordinates[0]] : [];
    }
    if (geometry.type === 'MultiPolygon') {
      return geometry.coordinates
        .map((polygon) => Array.isArray(polygon && polygon[0]) ? polygon[0] : null)
        .filter(Boolean);
    }
    return [];
  }

  function clipRingToPolarCap(coordinates, cutoff) {
    const input = (Array.isArray(coordinates) ? coordinates : [])
      .map((coordinate) => [Number(coordinate && coordinate[0]), Number(coordinate && coordinate[1])])
      .filter((coordinate) => Number.isFinite(coordinate[0]) && Number.isFinite(coordinate[1]));
    if (input.length > 1) {
      const first = input[0];
      const last = input[input.length - 1];
      if (Math.abs(first[0] - last[0]) < 1e-9 && Math.abs(first[1] - last[1]) < 1e-9) input.pop();
    }
    if (input.length < 3) return [];
    const rings = [];
    for (const poleSign of [1, -1]) {
      const boundaryLat = poleSign * cutoff;
      const output = [];
      let previous = input[input.length - 1];
      let previousInside = poleSign * previous[1] >= cutoff;
      for (const current of input) {
        const currentInside = poleSign * current[1] >= cutoff;
        if (currentInside !== previousInside) {
          const denominator = current[1] - previous[1];
          if (Math.abs(denominator) > 1e-12) {
            const t = (boundaryLat - previous[1]) / denominator;
            output.push(interpolateWrappedCoordinate(previous, current, t));
          }
        }
        if (currentInside) output.push(current);
        previous = current;
        previousInside = currentInside;
      }
      if (output.length >= 3) {
        output.push(output[0].slice());
        rings.push(output);
      }
    }
    return rings;
  }

  function isPolarOverlayPoint(feature, cutoff = POLAR_OVERLAY_LATITUDE) {
    const geometry = feature && feature.geometry;
    const properties = feature && feature.properties || {};
    if (
      !geometry || geometry.type !== 'Point' ||
      !['ASTERISM_STAR', 'ZENITH'].includes(properties.kind) ||
      !Array.isArray(geometry.coordinates)
    ) return false;
    const lon = Number(geometry.coordinates[0]);
    const lat = Number(geometry.coordinates[1]);
    return Number.isFinite(lon) && Number.isFinite(lat) && Math.abs(lat) >= cutoff;
  }

  function clipFeatureCollectionToMapBand(data, options = {}) {
    const features = [];
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      if (Array.isArray(options.omitKinds) && options.omitKinds.includes(properties.kind)) continue;
      const lines = geometryLineStrings(feature && feature.geometry);
      if (!lines.length) {
        if (options.omitPolarPoints && isPolarOverlayPoint(feature)) continue;
        features.push(feature);
        continue;
      }
      const coordinates = lines.flatMap((line) => clipLineToMapBand(line));
      if (!coordinates.length) continue;
      features.push(Object.assign({}, feature, {
        geometry: { type: 'MultiLineString', coordinates },
      }));
    }
    return Object.assign({}, data || {}, { type: 'FeatureCollection', features });
  }

  function appendPolarOverlayPaths(data, source, target) {
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      for (const line of geometryLineStrings(feature && feature.geometry)) {
        for (const coordinates of clipLineToPolarCap(line)) {
          target.push({ source, properties, coordinates });
        }
      }
    }
  }

  function appendPolarOverlayPoints(data, source, target) {
    for (const feature of data && data.features || []) {
      if (!isPolarOverlayPoint(feature)) continue;
      target.push({
        source,
        properties: feature.properties || {},
        coordinate: feature.geometry.coordinates.slice(0, 2),
      });
    }
  }

  function appendPolarOverlayPolygons(data, source, target) {
    for (const feature of data && data.features || []) {
      const properties = feature && feature.properties || {};
      if (properties.kind !== 'ECLIPSE_POLAR_PATH') continue;
      const cutoff = Number(properties.polar_fill_lat_limit);
      if (!Number.isFinite(cutoff)) continue;
      for (const ring of geometryPolygonOuterRings(feature && feature.geometry)) {
        for (const coordinates of clipRingToPolarCap(ring, cutoff)) {
          target.push({ source, properties, coordinates });
        }
      }
    }
  }

  function buildRuntimeOverlayScene(
    data,
    asterismData,
    eclipseData,
    projectionName = selectedProjection,
  ) {
    const acgData = data || { type: 'FeatureCollection', features: [] };
    const starsAndReferences =
      asterismData || { type: 'FeatureCollection', features: [] };
    const eclipsePaths =
      eclipseData || { type: 'FeatureCollection', features: [] };
    const paths = [];
    const polygons = [];
    const points = [];
    appendPolarOverlayPaths(starsAndReferences, 'asterism', paths);
    appendPolarOverlayPaths(eclipsePaths, 'eclipse', paths);
    appendPolarOverlayPaths(acgData, 'acg', paths);
    appendPolarOverlayPolygons(eclipsePaths, 'eclipse', polygons);
    appendPolarOverlayPoints(starsAndReferences, 'asterism', points);
    appendPolarOverlayPoints(acgData, 'acg', points);
    return {
      data: acgData,
      asterismData: starsAndReferences,
      eclipseData: eclipsePaths,
      mapData: clipFeatureCollectionToMapBand(acgData, {
        omitPolarPoints: projectionName === 'globe',
      }),
      mapAsterismData: clipFeatureCollectionToMapBand(starsAndReferences, {
        omitPolarPoints: projectionName === 'globe',
      }),
      mapEclipseData: clipFeatureCollectionToMapBand(eclipsePaths, {
        omitKinds: ['ECLIPSE_POLAR_PATH'],
      }),
      polarPaths: paths,
      polarPolygons: polygons,
      polarPoints: points,
    };
  }

  function rebuildPolarOverlayPaths() {
    const scene = buildRuntimeOverlayScene(
      currentData,
      currentAsterismData,
      currentEclipseData,
      selectedProjection,
    );
    polarOverlayPaths = scene.polarPaths;
    polarOverlayPolygons = scene.polarPolygons;
    polarOverlayPoints = scene.polarPoints;
    currentMapAsterismData = scene.mapAsterismData;
    currentMapEclipseData = scene.mapEclipseData;
    currentMapData = scene.mapData;
    if (ACG_PERF_MODE) {
      perfState.polarOverlayPathCount = scene.polarPaths.length;
    }
  }

  function ensurePolarOverlayCanvas(targetMap = map) {
    if (targetMap !== map) return null;
    let canvas = document.getElementById('polar-line-overlay');
    if (
      canvas ||
      !targetMap ||
      typeof targetMap.getCanvasContainer !== 'function'
    ) return canvas;
    const container = targetMap.getCanvasContainer();
    if (!container) return null;
    canvas = document.createElement('canvas');
    canvas.id = 'polar-line-overlay';
    canvas.setAttribute('aria-hidden', 'true');
    container.appendChild(canvas);
    return canvas;
  }

  function clearPolarOverlay() {
    polarAsterismStarHitTargets = [];
    hideAsterismStarPopup('polar');
    const canvas = document.getElementById('polar-line-overlay');
    const context = canvas && canvas.getContext('2d');
    if (!context) return;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, canvas.width, canvas.height);
  }

  function preparePolarOverlayCanvas(targetMap = map, targetCanvas = null) {
    const canvas = targetCanvas || ensurePolarOverlayCanvas(targetMap);
    const mapCanvas = targetMap && targetMap.getCanvas && targetMap.getCanvas();
    if (!canvas || !mapCanvas) return null;
    // Transform dimensions are already MapLibre's logical CSS-pixel size and
    // avoid a forced layout read in this per-render path.
    const width = Math.max(
      0,
      Number(targetMap.transform && targetMap.transform.width) ||
        parseFloat(mapCanvas.style.width) ||
        0,
    );
    const height = Math.max(
      0,
      Number(targetMap.transform && targetMap.transform.height) ||
        parseFloat(mapCanvas.style.height) ||
        0,
    );
    if (!width || !height) return null;
    const pixelWidth = Math.max(1, Number(mapCanvas.width) || Math.round(width));
    const pixelHeight = Math.max(1, Number(mapCanvas.height) || Math.round(height));
    if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
    if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
    const context = canvas.getContext('2d');
    if (!context) return null;
    context.setTransform(pixelWidth / width, 0, 0, pixelHeight / height, 0, 0);
    context.clearRect(0, 0, width, height);
    return { canvas, context, width, height };
  }

  function isPolarCoordinateVisible(coordinate, center, targetMap = map) {
    if (!targetMap) return false;
    try {
      if (
        targetMap === map &&
        map.transform &&
        typeof map.transform.isLocationOccluded === 'function' &&
        window.maplibregl && maplibregl.LngLat
      ) {
        const lngLat = maplibregl.LngLat.convert(coordinate);
        return !map.transform.isLocationOccluded(lngLat);
      }
      if (
        targetMap.transform &&
        typeof targetMap.transform.isLocationOccluded === 'function' &&
        window.maplibregl && maplibregl.LngLat
      ) {
        const lngLat = maplibregl.LngLat.convert(coordinate);
        return !targetMap.transform.isLocationOccluded(lngLat);
      }
    } catch (_) {}
    return angularDistanceDeg(
      center.lng, center.lat, Number(coordinate[0]), Number(coordinate[1]),
    ) <= 90.0;
  }

  function polarHorizonCoordinate(a, b, center, aVisible, targetMap = map) {
    let low = 0;
    let high = 1;
    for (let index = 0; index < 18; index += 1) {
      const middle = (low + high) / 2;
      const middleCoordinate = interpolateWrappedCoordinate(a, b, middle);
      if (
        isPolarCoordinateVisible(middleCoordinate, center, targetMap) === aVisible
      ) low = middle;
      else high = middle;
    }
    return interpolateWrappedCoordinate(a, b, (low + high) / 2);
  }

  function projectPolarCoordinate(coordinate, targetMap = map) {
    const lat = Math.max(
      -POLAR_OVERLAY_MAX_LATITUDE,
      Math.min(POLAR_OVERLAY_MAX_LATITUDE, Number(coordinate[1])),
    );
    try {
      const point = targetMap.project([Number(coordinate[0]), lat]);
      return Number.isFinite(point && point.x) && Number.isFinite(point && point.y)
        ? point
        : null;
    } catch (_) {
      return null;
    }
  }

  function tracePolarOverlayPath(
    context,
    coordinates,
    center,
    targetMap = map,
  ) {
    if (!Array.isArray(coordinates) || coordinates.length < 2) return false;
    let traced = false;
    let pathOpen = false;
    let previous = coordinates[0];
    let previousVisible = isPolarCoordinateVisible(previous, center, targetMap);
    for (let index = 1; index < coordinates.length; index += 1) {
      const current = coordinates[index];
      const currentVisible = isPolarCoordinateVisible(current, center, targetMap);
      if (previousVisible && currentVisible) {
        const previousPoint = projectPolarCoordinate(previous, targetMap);
        const currentPoint = projectPolarCoordinate(current, targetMap);
        if (previousPoint && currentPoint) {
          if (!pathOpen) context.moveTo(previousPoint.x, previousPoint.y);
          context.lineTo(currentPoint.x, currentPoint.y);
          pathOpen = true;
          traced = true;
        } else {
          pathOpen = false;
        }
      } else if (previousVisible !== currentVisible) {
        const horizon = polarHorizonCoordinate(
          previous,
          current,
          center,
          previousVisible,
          targetMap,
        );
        const horizonPoint = projectPolarCoordinate(horizon, targetMap);
        if (previousVisible) {
          const previousPoint = projectPolarCoordinate(previous, targetMap);
          if (previousPoint && horizonPoint) {
            if (!pathOpen) context.moveTo(previousPoint.x, previousPoint.y);
            context.lineTo(horizonPoint.x, horizonPoint.y);
            traced = true;
          }
          pathOpen = false;
        } else {
          const currentPoint = projectPolarCoordinate(current, targetMap);
          if (horizonPoint && currentPoint) {
            context.moveTo(horizonPoint.x, horizonPoint.y);
            context.lineTo(currentPoint.x, currentPoint.y);
            pathOpen = true;
            traced = true;
          } else {
            pathOpen = false;
          }
        }
      } else {
        pathOpen = false;
      }
      previous = current;
      previousVisible = currentVisible;
    }
    return traced;
  }

  function visiblePolarRing(coordinates, center, targetMap = map) {
    const input = Array.isArray(coordinates) ? coordinates.slice() : [];
    if (input.length > 1) {
      const first = input[0];
      const last = input[input.length - 1];
      if (
        Math.abs(Number(first[0]) - Number(last[0])) < 1e-9 &&
        Math.abs(Number(first[1]) - Number(last[1])) < 1e-9
      ) input.pop();
    }
    if (input.length < 3) return [];
    const output = [];
    let previous = input[input.length - 1];
    let previousVisible = isPolarCoordinateVisible(previous, center, targetMap);
    for (const current of input) {
      const currentVisible = isPolarCoordinateVisible(current, center, targetMap);
      if (currentVisible !== previousVisible) {
        output.push(
          polarHorizonCoordinate(
            previous,
            current,
            center,
            previousVisible,
            targetMap,
          ),
        );
      }
      if (currentVisible) output.push(current);
      previous = current;
      previousVisible = currentVisible;
    }
    return output.length >= 3 ? output : [];
  }

  function polarMetric(value, fallback) {
    if (value == null) return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }

  function resolvedAcgLineColor(properties, settings) {
    if (properties.color) return properties.color;
    if (properties.kind === 'MC') return settings.fallbackMcColor;
    if (properties.kind === 'IC') return settings.fallbackIcColor;
    if (properties.kind === 'ASC') return settings.fallbackAscColor;
    if (properties.kind === 'DSC') return settings.fallbackDscColor;
    return settings.fallbackUnknownColor;
  }

  function unchangedPolarColor(color) {
    return color;
  }

  function polarReferenceStroke(
    path,
    settings,
    behavior,
    colorTransform = unchangedPolarColor,
  ) {
    if (path.source !== 'asterism') return null;
    const properties = path.properties;
    switch (properties.kind) {
      case 'REFERENCE_HOUSE_LINE':
        if (!behavior.showHouseLines) return null;
        return {
          color: colorTransform(
            houseReferenceColor(Number(properties.house), settings),
          ),
          width: settings.referenceGridLineWidth,
          opacity: Math.min(1, settings.referenceGridLineOpacity * (properties.angle ? 1.45 : 1)),
          lineCap: 'round',
        };
      case 'REFERENCE_ZODIAC_LINE':
        if (!behavior.showZodiacLines) return null;
        return {
          color: colorTransform(
            zodiacReferenceColor(Number(properties.sign), settings),
          ),
          width: settings.referenceGridLineWidth,
          opacity: settings.referenceGridLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_ECLIPTIC':
        if (!behavior.showEcliptic) return null;
        return {
          color: colorTransform(settings.referenceEclipticColor),
          width: settings.referenceLineWidth * 1.25,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_ZODIAC_TICK':
        if (!behavior.showEcliptic) return null;
        return {
          color: colorTransform(settings.referenceEclipticColor),
          width: settings.referenceLineWidth * 0.8,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_EQUATOR':
        if (!behavior.showEquator) return null;
        return {
          color: colorTransform(settings.referenceEquatorColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          dash: [settings.referenceLineWidth * 2, settings.referenceLineWidth * 2],
          lineCap: 'round',
        };
      case 'REFERENCE_ASC':
        if (!behavior.showAscCircle) return null;
        return {
          color: colorTransform(settings.referenceAscColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      case 'REFERENCE_MC':
        if (!behavior.showMcCircle) return null;
        return {
          color: colorTransform(settings.referenceMcColor),
          width: settings.referenceLineWidth,
          opacity: settings.referenceLineOpacity,
          lineCap: 'round',
        };
      default:
        return null;
    }
  }

  function polarAsterismStroke(
    path,
    settings,
    shadow,
    visibility = viewOptions,
  ) {
    if (
      path.source !== 'asterism' ||
      path.properties.kind !== 'ASTERISM' ||
      !visibility.asterisms
    ) return null;
    if (shadow) {
      return {
        color: settings.asterismShadowColor,
        width: settings.asterismLineWidth + settings.asterismShadowSpread * 2,
        opacity: settings.asterismShadowOpacity,
        blur: settings.asterismShadowBlur,
        lineCap: 'round',
      };
    }
    return {
      color: settings.asterismHighlightColor,
      width: settings.asterismLineWidth,
      opacity: settings.asterismLineOpacity,
      lineCap: 'round',
    };
  }

  function polarEclipseStroke(path, settings, shadow) {
    if (path.source !== 'eclipse') return null;
    const kind = path.properties.kind;
    if (shadow) {
      if (kind !== 'ECLIPSE_SHADOW') return null;
      return {
        color: settings.eclipseShadowColor,
        width: settings.eclipseShadowWidth,
        opacity: settings.eclipseShadowOpacity,
        blur: settings.eclipseShadowBlur,
        lineCap: 'round',
      };
    }
    if (kind === 'ECLIPSE_LIMIT') {
      return {
        color: settings.eclipseOutlineColor,
        width: settings.eclipseLimitWidth,
        opacity: settings.eclipseLimitOpacity,
        dash: [
          settings.eclipseLimitDashOn * settings.eclipseLimitWidth,
          settings.eclipseLimitDashOff * settings.eclipseLimitWidth,
        ],
        lineCap: 'round',
      };
    }
    if (kind === 'ECLIPSE_CENTER') {
      return {
        color: settings.eclipseCenterColor,
        width: settings.eclipseCenterWidth,
        opacity: settings.eclipseCenterOpacity,
        lineCap: 'round',
      };
    }
    return null;
  }

  function isPolarAcgPathVisible(path, visibility = viewOptions) {
    return (
      path.source === 'acg' &&
      isAcgPropertiesVisible(path.properties || {}, visibility)
    );
  }

  function polarAcgCasingStroke(
    path,
    settings,
    tokens,
    visibility = viewOptions,
  ) {
    if (
      !isPolarAcgPathVisible(path, visibility) ||
      ![
        'MC',
        'IC',
        'ASC',
        'DSC',
        'LOCAL_SPACE',
        'LOCAL_SPACE_OPPOSITION',
        'ASPECT',
      ].includes(path.properties.kind)
    ) return null;
    return {
      color: tokens.casing,
      width: settings.casingWidth * polarMetric(path.properties.line_width_scale, 1),
      opacity: settings.casingOpacity *
        polarMetric(path.properties.line_opacity, 1) *
        acgLayerOpacityScale(path.properties),
    };
  }

  function polarAcgLineStroke(
    path,
    settings,
    tokens,
    visibility = viewOptions,
  ) {
    if (!isPolarAcgPathVisible(path, visibility)) return null;
    const properties = path.properties;
    if (properties.kind === 'PARAN') {
      if (!visibility.parans) return null;
      return {
        color: tokens.paranColor,
        width: settings.paranWidth,
        opacity: settings.paranOpacity * acgLayerOpacityScale(properties),
        dash: [settings.paranDashOn * settings.paranWidth, settings.paranDashOff * settings.paranWidth],
      };
    }
    if (properties.kind === 'LOCAL_SPACE_OPPOSITION') {
      const width = settings.dashedWidth *
        settings.localSpaceOppositionWidthScale *
        polarMetric(properties.line_width_scale, 1);
      return {
        color: resolvedAcgLineColor(properties, settings),
        width,
        opacity: settings.dashedOpacity *
          settings.localSpaceOppositionOpacityScale *
          polarMetric(properties.line_opacity, 1) *
          acgLayerOpacityScale(properties),
        dash: [
          settings.dashedOn * settings.localSpaceOppositionDashOnScale * width,
          settings.dashedOff * settings.localSpaceOppositionDashOffScale * width,
        ],
        lineCap: 'round',
      };
    }
    if (properties.kind === 'ASPECT') {
      const width = settings.solidWidth *
        settings.aspectLineWidthScale *
        polarMetric(properties.line_width_scale, 1);
      return {
        color: resolvedAcgLineColor(properties, settings),
        width,
        opacity: settings.solidOpacity *
          settings.aspectLineOpacityScale *
          polarMetric(properties.line_opacity, 1) *
          acgLayerOpacityScale(properties),
        dash: [
          settings.aspectLineDashOn * width,
          settings.aspectLineDashOff * width,
        ],
        lineCap: 'round',
      };
    }
    const solid = ['MC', 'ASC', 'LOCAL_SPACE'].includes(properties.kind);
    const dashed = ['IC', 'DSC'].includes(properties.kind);
    if (!solid && !dashed) return null;
    const baseWidth = dashed ? settings.dashedWidth : settings.solidWidth;
    const width = baseWidth * polarMetric(properties.line_width_scale, 1);
    return {
      color: resolvedAcgLineColor(properties, settings),
      width,
      opacity: (dashed ? settings.dashedOpacity : settings.solidOpacity) *
        polarMetric(properties.line_opacity, 1) *
        acgLayerOpacityScale(properties),
      dash: dashed ? [settings.dashedOn * width, settings.dashedOff * width] : null,
    };
  }

  function projectPolarOverlayPaths(paths, center, targetMap = map) {
    const projected = [];
    for (const path of paths) {
      const geometry = new Path2D();
      if (!tracePolarOverlayPath(geometry, path.coordinates, center, targetMap)) {
        continue;
      }
      projected.push({ path, geometry });
    }
    return projected;
  }

  function strokePolarOverlayPaths(context, styleForPath, projectedPaths) {
    for (const projected of projectedPaths) {
      const path = projected.path;
      const style = styleForPath(path);
      if (!style) continue;
      const width = Math.max(0, polarMetric(style.width, 0));
      const opacity = Math.max(0, Math.min(1, polarMetric(style.opacity, 1)));
      if (!width || !opacity || !style.color) continue;
      context.save();
      context.globalAlpha = opacity;
      context.strokeStyle = style.color;
      context.lineWidth = width;
      context.lineCap = style.lineCap || 'butt';
      context.lineJoin = style.lineCap || 'miter';
      context.setLineDash(Array.isArray(style.dash) ? style.dash : []);
      context.filter = style.blur ? `blur(${Math.max(0, style.blur)}px)` : 'none';
      context.stroke(projected.geometry);
      context.restore();
    }
  }

  function drawPolarAsterismStars(
    context,
    center,
    settings,
    targetMap = map,
    visibility = viewOptions,
    points = polarOverlayPoints,
    updateHitTargets = true,
  ) {
    const hitTargets = [];
    if (!visibility.asterisms) {
      if (updateHitTargets) polarAsterismStarHitTargets = hitTargets;
      return;
    }
    for (const polarPoint of points) {
      if (polarPoint.source !== 'asterism') continue;
      const coordinateVisible = targetMap === map
        ? isPolarCoordinateVisible(polarPoint.coordinate, center)
        : isPolarCoordinateVisible(polarPoint.coordinate, center, targetMap);
      if (!coordinateVisible) continue;
      const point = targetMap === map
        ? projectPolarCoordinate(polarPoint.coordinate)
        : projectPolarCoordinate(polarPoint.coordinate, targetMap);
      if (!point) continue;
      const properties = polarPoint.properties || {};
      const radius = Math.max(0, asterismStarRadius(properties.magnitude, settings));
      const spread = Math.max(0, polarMetric(settings.asterismShadowSpread, 0));
      if (!radius) continue;

      context.save();
      context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.asterismShadowOpacity, 1)));
      context.fillStyle = settings.asterismShadowColor;
      context.filter = `blur(${Math.max(0, polarMetric(settings.asterismShadowBlur, 0))}px)`;
      context.beginPath();
      context.arc(point.x, point.y, radius + spread, 0, Math.PI * 2);
      context.fill();
      context.restore();

      context.save();
      context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.asterismStarOpacity, 1)));
      context.fillStyle = settings.asterismHighlightColor;
      context.strokeStyle = settings.asterismShadowColor;
      context.lineWidth = spread;
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
      if (spread) {
        // MapLibre's circle stroke sits outside circle-radius rather than
        // straddling the fill boundary.
        context.beginPath();
        context.arc(point.x, point.y, radius + spread / 2, 0, Math.PI * 2);
        context.stroke();
      }
      context.restore();

      hitTargets.push({
        coordinate: polarPoint.coordinate,
        properties,
        point,
      });
    }
    if (updateHitTargets) polarAsterismStarHitTargets = hitTargets;
  }

  function drawPolarZenithPoints(
    context,
    center,
    settings,
    tokens,
    targetMap = map,
    visibility = viewOptions,
    points = polarOverlayPoints,
  ) {
    if (!visibility.zeniths) return;
    for (const polarPoint of points) {
      const properties = polarPoint.properties || {};
      const propertiesVisible = visibility === viewOptions
        ? isAcgPropertiesVisible(properties)
        : isAcgPropertiesVisible(properties, visibility);
      const coordinateVisible = targetMap === map
        ? isPolarCoordinateVisible(polarPoint.coordinate, center)
        : isPolarCoordinateVisible(polarPoint.coordinate, center, targetMap);
      if (
        polarPoint.source !== 'acg' ||
        properties.kind !== 'ZENITH' ||
        !propertiesVisible ||
        !coordinateVisible
      ) continue;
      const point = targetMap === map
        ? projectPolarCoordinate(polarPoint.coordinate)
        : projectPolarCoordinate(polarPoint.coordinate, targetMap);
      if (!point) continue;
      const layerOpacity = acgLayerOpacityScale(properties);
      const radius = Math.max(
        settings.zenithRadiusMin,
        settings.solidWidth * settings.zenithRadiusWidthScale
      );
      const color = resolvedAcgLineColor(properties, settings);

      context.save();
      context.globalAlpha = settings.casingOpacity * layerOpacity;
      context.fillStyle = tokens.casing;
      context.beginPath();
      context.arc(
        point.x,
        point.y,
        radius + Math.max(settings.zenithStrokeWidthMin, settings.casingWidth),
        0,
        Math.PI * 2
      );
      context.fill();
      context.restore();

      context.save();
      context.globalAlpha = settings.solidOpacity * layerOpacity;
      context.fillStyle = color;
      context.beginPath();
      context.arc(point.x, point.y, radius, 0, Math.PI * 2);
      context.fill();
      context.restore();

      if (!settings.labelsOn) continue;
      let labelX = point.x + radius + 4;
      const labelY = point.y + settings.labelSize * 0.35;
      const glyph = String(properties.glyph_morinus || '');
      context.save();
      context.globalAlpha = settings.labelOpacity * layerOpacity;
      context.textAlign = 'left';
      if (glyph) {
        context.font = `${Math.max(10, settings.labelSize * 1.2)}px 'Morinus', serif`;
        context.strokeStyle = tokens.labelHalo;
        context.lineWidth = settings.labelHaloOn ? settings.labelHaloWidth * 2 : 0;
        if (context.lineWidth) context.strokeText(glyph, labelX, labelY);
        context.fillStyle = color;
        context.fillText(glyph, labelX, labelY);
        labelX += context.measureText(glyph).width + 4;
      }
      const label = acgFeatureLabelText(properties);
      if (label) {
        context.font = `600 ${settings.labelSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
        context.strokeStyle = tokens.labelHalo;
        context.lineWidth = settings.labelHaloOn ? settings.labelHaloWidth * 2 : 0;
        if (context.lineWidth) context.strokeText(label, labelX, labelY);
        context.fillStyle = color;
        context.fillText(label, labelX, labelY);
      }
      context.restore();
    }
  }

  function drawPolarEclipseShadows(
    context,
    center,
    settings,
    targetMap = map,
    polygons = polarOverlayPolygons,
  ) {
    context.save();
    context.globalAlpha = Math.max(0, Math.min(1, polarMetric(settings.eclipseFillOpacity, 1)));
    context.fillStyle = settings.eclipseShadowColor;
    context.beginPath();
    let traced = false;
    for (const polygon of polygons) {
      if (polygon.source !== 'eclipse') continue;
      const visibleRing = targetMap === map
        ? visiblePolarRing(polygon.coordinates, center)
        : visiblePolarRing(polygon.coordinates, center, targetMap);
      if (!visibleRing.length) continue;
      const projected = visibleRing.map(
        (coordinate) => projectPolarCoordinate(coordinate, targetMap),
      );
      if (projected.length < 3 || projected.some((point) => !point)) continue;
      context.moveTo(projected[0].x, projected[0].y);
      for (const point of projected.slice(1)) context.lineTo(point.x, point.y);
      context.closePath();
      traced = true;
    }
    if (traced) context.fill();
    context.restore();
  }

  function renderPolarOverlay(targetMap = map, options = {}) {
    const liveTarget = targetMap === map && !options.canvas;
    const started = ACG_PERF_MODE && liveTarget ? perfNow() : 0;
    let projectionType = selectedProjection;
    try {
      const projection =
        targetMap && targetMap.getProjection && targetMap.getProjection();
      projectionType = projection && projection.type || projectionType;
    } catch (_) {}
    if (
      !targetMap ||
      (liveTarget && !mapHostActive) ||
      projectionType !== 'globe'
    ) {
      if (liveTarget) clearPolarOverlay();
      return null;
    }
    const prepared = preparePolarOverlayCanvas(
      targetMap,
      options.canvas || null,
    );
    if (!prepared) return null;
    const settings = options.settings || currentDevSettings();
    const tokens = options.tokens || currentThemeTokens();
    const behavior = options.behavior || referenceBehavior();
    const visibility = options.visibility || viewOptions;
    const paths = options.paths || polarOverlayPaths;
    const points = options.points || polarOverlayPoints;
    const polygons = options.polygons || polarOverlayPolygons;
    const referenceColorTransform =
      options.referenceColorTransform || unchangedPolarColor;
    const updateHitTargets = Object.prototype.hasOwnProperty.call(
      options,
      'updateHitTargets',
    )
      ? !!options.updateHitTargets
      : liveTarget;
    const center = targetMap.getCenter();
    const projectedPaths = projectPolarOverlayPaths(paths, center, targetMap);
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarReferenceStroke(
        path,
        settings,
        behavior,
        referenceColorTransform,
      ),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAsterismStroke(path, settings, true, visibility),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAsterismStroke(path, settings, false, visibility),
      projectedPaths,
    );
    drawPolarAsterismStars(
      prepared.context,
      center,
      settings,
      targetMap,
      visibility,
      points,
      updateHitTargets,
    );
    drawPolarZenithPoints(
      prepared.context,
      center,
      settings,
      tokens,
      targetMap,
      visibility,
      points,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarEclipseStroke(path, settings, true),
      projectedPaths,
    );
    drawPolarEclipseShadows(
      prepared.context,
      center,
      settings,
      targetMap,
      polygons,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarEclipseStroke(path, settings, false),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAcgCasingStroke(
        path,
        settings,
        tokens,
        visibility,
      ),
      projectedPaths,
    );
    strokePolarOverlayPaths(
      prepared.context,
      (path) => polarAcgLineStroke(
        path,
        settings,
        tokens,
        visibility,
      ),
      projectedPaths,
    );
    if (ACG_PERF_MODE && liveTarget) {
      const elapsed = perfNow() - started;
      perfState.polarOverlayDraws += 1;
      perfState.polarOverlayLastMs = elapsed;
      perfState.polarOverlayMaxMs = Math.max(perfState.polarOverlayMaxMs, elapsed);
    }
    return prepared.canvas;
  }

  function onLineClick(e) {
    if (!e.features || !e.features.length) return;
    const f = e.features[0];
    const label = localizedPointLabel(f.properties);
    const kind = f.properties.kind;
    const kindLabel = kind === 'LOCAL_SPACE_OPPOSITION'
      ? (uiLabels.localSpaceOpposition || '')
      : (kind === 'ASPECT'
        ? localizedAspectLabel(f.properties)
        : (kind === 'ZENITH' ? (uiLabels.zenith || '') : kind));
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${label}</strong> ${kindLabel}<br><span style="opacity:0.7">${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({ type: 'click', point: f.properties.point, kind: kind,
                 lon: e.lngLat.lng, lat: e.lngLat.lat });
  }

  function onEclipseClick(e) {
    if (!e.features || !e.features.length) return;
    if (e.originalEvent && e.originalEvent._eclipsePopupHandled) return;
    if (e.originalEvent) e.originalEvent._eclipsePopupHandled = true;
    const f = e.features[0];
    const p = f.properties || {};
    const title = p.label || `${(p.event_type || 'Solar').replace(/^\w/, (c) => c.toUpperCase())} solar eclipse`;
    const date = p.utc || '';
    const detail = p.kind === 'ECLIPSE_MAX' ? 'maximum eclipse' :
      (p.kind === 'ECLIPSE_CENTER' ? 'centerline' :
       (p.kind === 'ECLIPSE_LIMIT' ? 'path limit' : 'shadow path'));
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${title}</strong><br><span>${date}</span><br><span style="opacity:0.7">${detail} · ${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({
      type: 'click',
      point: 'eclipse',
      kind: p.kind || 'ECLIPSE',
      lon: e.lngLat.lng,
      lat: e.lngLat.lat,
    });
  }

  function featurePlaceName(f) {
    const p = (f && f.properties) || {};
    return p.name_en || p['name:en'] || p.name || p.name_int || '';
  }

  function placeFeatureAtPoint(point) {
    const layers = PLACE_LABEL_LAYER_IDS.filter((id) => map && map.getLayer(id));
    if (!layers.length) return null;
    const r = 10;
    const features = map.queryRenderedFeatures(
      [[point.x - r, point.y - r], [point.x + r, point.y + r]],
      { layers }
    );
    return features.find((f) => featurePlaceName(f)) || null;
  }

  function domPlaceNameAtPoint(point) {
    if (!map || !Array.isArray(placeLabelData)) return '';
    let nearest = null;
    for (const place of placeLabelData) {
      if (!isCoordinateVisibleOnCurrentProjection([place.lon, place.lat])) continue;
      let projected;
      try { projected = map.project([place.lon, place.lat]); } catch (_) { continue; }
      const distance = Math.hypot(projected.x - point.x, projected.y - point.y);
      if (distance > 20 || (nearest && distance >= nearest.distance)) continue;
      nearest = { distance, name: place.name };
    }
    return nearest ? nearest.name : '';
  }

  function sendHereRequest(action, lngLat, placeName) {
    sendToHost({
      type: 'here',
      action: action,
      lon: lngLat.lng,
      lat: lngLat.lat,
      placeName: placeName || '',
    });
  }

  function wireContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    // The map exposes its own Aries menu. Never fall through to WKWebView's
    // Back/Reload/Inspect website menu elsewhere in the embedded document.
    document.addEventListener('contextmenu', (event) => event.preventDefault(), true);
    menu.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn || !contextMenuTarget) return;
      sendHereRequest(btn.dataset.action, contextMenuTarget.lngLat, contextMenuTarget.placeName);
      hideContextMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') hideContextMenu();
    });
  }

  function wireAmbientInput() {
    const forward = (event, eventType) => {
      const target = event.target;
      const targetIsEditable = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable);
      const isShiftSignal = event.key === 'Shift' || event.shiftKey;
      const isAmbientDigit =
        !targetIsEditable &&
        eventType === 'keydown' &&
        !event.repeat &&
        !event.metaKey &&
        !event.ctrlKey &&
        !event.altKey &&
        /^[0-9]$/.test(event.key);
      if (!isShiftSignal && !isAmbientDigit) return;
      if (isAmbientDigit) {
        event.preventDefault();
        event.stopPropagation();
      }
      postToParent({
        type: 'ambient-key',
        eventType: eventType,
        key: event.key,
        metaKey: event.metaKey,
        ctrlKey: event.ctrlKey,
        altKey: event.altKey,
        repeat: event.repeat,
      });
    };
    window.addEventListener('keydown', (event) => forward(event, 'keydown'), true);
    window.addEventListener('keyup', (event) => forward(event, 'keyup'), true);
  }

  function routeHostKeyCommand(event) {
    if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
    const target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
      return;
    }
    const key = event.key || '';
    const isLetter = key.length === 1 && /^[a-z]$/i.test(key);
    const isEscape = key === 'Escape';
    if (!isLetter && !isEscape) return;

    const menu = document.getElementById('acg-menu');
    if (isEscape && menu && menu.style.display !== 'none') {
      hideContextMenu();
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    if (!event.repeat) sendToHost({ type: 'shortcut', key: key });
  }

  function onMapContextMenu(e) {
    if (e.preventDefault) e.preventDefault();
    if (e.originalEvent) e.originalEvent.preventDefault();
    const place = placeFeatureAtPoint(e.point);
    const placeName = place ? featurePlaceName(place) : domPlaceNameAtPoint(e.point);
    showContextMenu(e.point, e.lngLat, placeName);
  }

  function showContextMenu(point, lngLat, placeName) {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    contextMenuTarget = { lngLat: lngLat, placeName: placeName || '' };
    menu.style.display = 'block';
    const margin = 6;
    const rect = menu.getBoundingClientRect();
    const x = Math.min(point.x, window.innerWidth - rect.width - margin);
    const y = Math.min(point.y, window.innerHeight - rect.height - margin);
    menu.style.left = Math.max(margin, x) + 'px';
    menu.style.top = Math.max(margin, y) + 'px';
  }

  function hideContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (menu) menu.style.display = 'none';
  }

  function sendToHost(payload) {
    // wx host: navigation to morinus://acg/<json> is intercepted by
    // EVT_WEBVIEW_NAVIGATING (astrocartframe.py:534). This is a top-level page
    // under wx, so window.parent === window and the postMessage below is a
    // harmless self-post that wx never listens for — its bridge path is the
    // navigation, untouched.
    const url = 'morinus://acg/' + encodeURIComponent(JSON.stringify(payload));
    window.location.href = url;
    // webapp host: the React shell embeds this page in an <iframe> and CANNOT
    // intercept the morinus:// navigation. When embedded (parent !== self) we
    // ALSO postMessage the same payload UP to the parent so the React surface
    // receives the line-click / here / shortcut intents. Tagged with a source
    // marker so the parent can distinguish it from the inbound aries.* channel.
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'aries-acg', payload: payload }, '*');
      }
    } catch (_) {}
  }

  function postToParent(payload) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'aries-acg', payload: payload }, '*');
      }
    } catch (_) {}
  }

  function postViewState(reason, options) {
    const opts = options || {};
    if (!viewStatePersistenceEnabled && !opts.force) return;
    const acg = window.ACG;
    if (!acg || typeof acg.getState !== 'function') return;
    const state = acg.getState();
    if (!state) return;
    postToParent({ type: 'state', reason: reason || 'state', state: state });
  }

  function scheduleViewStatePost(reason, options) {
    const opts = options || {};
    if (!viewStatePersistenceEnabled && !opts.force) return;
    if (viewStatePostTimer) window.clearTimeout(viewStatePostTimer);
    viewStatePostTimer = window.setTimeout(() => {
      viewStatePostTimer = null;
      postViewState(reason, opts);
    }, 120);
  }

  function setViewStatePersistenceEnabled(enabled) {
    viewStatePersistenceEnabled = !!enabled;
    if (!viewStatePersistenceEnabled && viewStatePostTimer) {
      window.clearTimeout(viewStatePostTimer);
      viewStatePostTimer = null;
    }
  }

  function setStatus(s) {
    const el = document.getElementById('status');
    if (el) el.textContent = s;
  }

  function ensureViewOptionDefaults() {
    if (viewOptionsInitialized) return;
    setParansVisible(false);
    setAsterismsVisible(false);
  }

  function syncParanVisibility() {
    const visible = !!viewOptions.parans;
    const s = currentDevSettings();
    if (map && map.getLayer('acg-parans')) {
      map.setFilter('acg-parans', acgParanFilter());
      map.setLayoutProperty('acg-parans', 'visibility', visible ? 'visible' : 'none');
    }
    if (map && map.getLayer('acg-paran-labels')) {
      map.setFilter('acg-paran-labels', acgParanFilter());
      map.setLayoutProperty('acg-paran-labels', 'visibility', (visible && s.paranLabelsOn) ? 'visible' : 'none');
    }
    const btn = document.querySelector('#overlays button[data-overlay="parans"]');
    if (btn) {
      btn.classList.toggle('on', visible);
      btn.setAttribute('aria-pressed', visible ? 'true' : 'false');
    }
    scheduleDomAcgLabels('parans');
  }

  function setParansVisible(visible) {
    viewOptions.parans = !!visible;
    viewOptionsInitialized = true;
    syncParanVisibility();
  }

  function syncAsterismVisibility() {
    const visible = !!viewOptions.asterisms;
    for (const id of ['acg-asterism-shadow', 'acg-asterisms', 'acg-asterism-star-shadow', 'acg-asterism-stars', 'acg-asterism-star-hit', 'acg-asterism-labels']) {
      if (map && map.getLayer(id)) {
        map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
      }
    }
    if (!visible) hideAsterismStarPopup();
    const btn = document.querySelector('#overlays button[data-overlay="asterisms"]');
    if (btn) {
      btn.classList.toggle('on', visible);
      btn.setAttribute('aria-pressed', visible ? 'true' : 'false');
    }
  }

  function setAsterismsVisible(visible) {
    viewOptions.asterisms = !!visible;
    viewOptionsInitialized = true;
    syncAsterismVisibility();
  }

  function syncVisibilityFilters() {
    syncAcgLineVisibility();
    scheduleDomAcgLabels('visibility-filters');
    updateLegend();
    if (map && typeof map.triggerRepaint === 'function') map.triggerRepaint();
  }

  function setVisibilityFilters(filters) {
    const next = filters && typeof filters === 'object' ? filters : {};
    const attributes = next.filters && typeof next.filters === 'object'
      ? next.filters
      : next;
    if (typeof next.parans === 'boolean') setParansVisible(next.parans);
    if (typeof next.aspects === 'boolean') viewOptions.aspects = next.aspects;
    if (typeof next.zeniths === 'boolean') viewOptions.zeniths = next.zeniths;
    if (typeof next.localSpaceOppositions === 'boolean') {
      viewOptions.localSpaceOppositions = next.localSpaceOppositions;
    }

    const layerInput = next.layers && typeof next.layers === 'object'
      ? next.layers
      : (next.dynamicLayers && typeof next.dynamicLayers === 'object' ? next.dynamicLayers : null);
    if (Array.isArray(next.layers)) {
      const selectedLayers = normalizedVisibilitySelection(next.layers) || [];
      for (const role of ['natal', 'transit', 'progression']) {
        viewOptions.layers[role] = selectedLayers.includes(role);
      }
    } else {
      for (const role of ['natal', 'transit', 'progression']) {
        if (layerInput && typeof layerInput[role] === 'boolean') {
          viewOptions.layers[role] = layerInput[role];
        } else if (typeof next[role] === 'boolean') {
          viewOptions.layers[role] = next[role];
        }
      }
    }

    for (const [filterName, aliases] of Object.entries({
      points: ['points', 'pointIds', 'point'],
      kinds: ['kinds', 'featureKinds', 'kind'],
      aspects: ['aspectNames', 'aspectTypes', 'aspect'],
      techniques: ['techniques', 'techniqueIds', 'technique'],
    })) {
      const alias = aliases.find((name) => Object.prototype.hasOwnProperty.call(attributes, name));
      if (alias) {
        viewOptions.filters[filterName] = normalizedVisibilitySelection(attributes[alias]);
      } else if (
        filterName === 'aspects' &&
        Object.prototype.hasOwnProperty.call(attributes, 'aspects') &&
        typeof attributes.aspects !== 'boolean'
      ) {
        viewOptions.filters.aspects = normalizedVisibilitySelection(attributes.aspects);
      }
    }

    syncVisibilityFilters();
  }

  function firstSymbolLayerId() {
    const style = map && map.getStyle && map.getStyle();
    const layer = style && Array.isArray(style.layers)
      ? style.layers.find((candidate) => candidate && candidate.type === 'symbol')
      : null;
    return layer && layer.id || undefined;
  }

  function applyAsterismButtonLabel() {
    const btn = document.querySelector('#overlays button[data-overlay="asterisms"]');
    if (!btn) return;
    const label = String(uiLabels.asterisms || '').trim();
    btn.textContent = label;
    btn.hidden = !label;
    if (label) btn.setAttribute('aria-label', label);
    else btn.removeAttribute('aria-label');
  }

  function setLegendCollapsed(collapsed) {
    legendCollapsed = !!collapsed;
    const legend = document.getElementById('legend');
    const btn = document.getElementById('legend-toggle');
    if (legend) legend.classList.toggle('collapsed', legendCollapsed);
    if (btn) {
      btn.setAttribute('aria-expanded', legendCollapsed ? 'false' : 'true');
      btn.setAttribute('aria-label', legendCollapsed ? 'Expand legend' : 'Collapse legend');
      const state = btn.querySelector('.legend-state');
      if (state) state.textContent = legendCollapsed ? '+' : '-';
    }
  }

  function restoredLegendState(state) {
    const hasNestedLegend = !!(
      state &&
      Object.prototype.hasOwnProperty.call(state, 'legend')
    );
    const nested = hasNestedLegend && state.legend && typeof state.legend === 'object'
      ? state.legend
      : null;
    if (
      nested &&
      nested.userSet === true &&
      Object.prototype.hasOwnProperty.call(nested, 'collapsed')
    ) {
      return { collapsed: !!nested.collapsed, userSet: true };
    }
    if (hasNestedLegend) {
      return { collapsed: true, userSet: false };
    }
    const hasLegacyLegendState = !!(
      state &&
      (
        Object.prototype.hasOwnProperty.call(state, 'legendCollapsed') ||
        Object.prototype.hasOwnProperty.call(state, 'legendUserSet')
      )
    );
    if (!hasLegacyLegendState) return null;
    // The top-level fields predate the nested shape. Only restore them when a
    // caller also supplies the new explicit marker; old implicit false values
    // must migrate to the new collapsed default.
    if (
      state &&
      state.legendUserSet === true &&
      Object.prototype.hasOwnProperty.call(state, 'legendCollapsed')
    ) {
      return { collapsed: !!state.legendCollapsed, userSet: true };
    }
    return { collapsed: true, userSet: false };
  }

  function applyChromeState(state) {
    if (!state) return;
    const overlays = state.overlays || state.viewOptions || {};
    if (Object.prototype.hasOwnProperty.call(overlays, 'parans')) {
      setParansVisible(overlays.parans);
    } else if (Object.prototype.hasOwnProperty.call(state, 'paransVisible')) {
      setParansVisible(state.paransVisible);
    }
    if (Object.prototype.hasOwnProperty.call(overlays, 'asterisms')) {
      setAsterismsVisible(overlays.asterisms);
    }
    setVisibilityFilters({
      aspects: Object.prototype.hasOwnProperty.call(overlays, 'aspects')
        ? overlays.aspects
        : viewOptions.aspects,
      zeniths: Object.prototype.hasOwnProperty.call(overlays, 'zeniths')
        ? overlays.zeniths
        : viewOptions.zeniths,
      localSpaceOppositions: Object.prototype.hasOwnProperty.call(overlays, 'localSpaceOppositions')
        ? overlays.localSpaceOppositions
        : viewOptions.localSpaceOppositions,
      layers: overlays.layers || viewOptions.layers,
      points: overlays.filters && Object.prototype.hasOwnProperty.call(overlays.filters, 'points')
        ? overlays.filters.points
        : viewOptions.filters.points,
      kinds: overlays.filters && Object.prototype.hasOwnProperty.call(overlays.filters, 'kinds')
        ? overlays.filters.kinds
        : viewOptions.filters.kinds,
      aspectNames: overlays.filters && Object.prototype.hasOwnProperty.call(overlays.filters, 'aspects')
        ? overlays.filters.aspects
        : viewOptions.filters.aspects,
      techniques: overlays.filters && Object.prototype.hasOwnProperty.call(overlays.filters, 'techniques')
        ? overlays.filters.techniques
        : viewOptions.filters.techniques,
    });
    const restoredLegend = restoredLegendState(state);
    if (restoredLegend) {
      legendUserSet = restoredLegend.userSet;
      setLegendCollapsed(restoredLegend.collapsed);
    }
  }

  function setProjection(name) {
    if (!map) return;
    if (name !== 'globe' && name !== 'mercator') return;
    selectedProjection = name;
    setProjectionButtonState(name);
    hideMapUntilStyledPaint();
    try {
      map.setProjection({ type: name });
      refreshPolarProjectionData();
    } catch (err) {
      revealMapAfterStyledPaint();
      setStatus('projection pending: ' + name);
      return;
    }
    // Round-trip-safe zoom targets so each projection shows a useful view.
    if (name === 'globe') {
      map.easeTo({ zoom: globeZoomForViewport(), duration: 400 });
    } else if (name === 'mercator') {
      map.easeTo({ zoom: 1.3, duration: 400 });
    }
    postViewState('projection', { force: true });
    revealMapAfterStyledPaint();
  }

  function setProjectionButtonState(name) {
    if (name === 'globe' || name === 'mercator') selectedProjection = name;
    for (const btn of document.querySelectorAll('#proj button')) {
      btn.classList.toggle('on', btn.dataset.proj === name);
      btn.setAttribute('aria-pressed', btn.dataset.proj === name ? 'true' : 'false');
    }
  }

  function applyViewStateNow(state) {
    if (!map || !state) return false;
    applyChromeState(state);
    try {
      if (state.projection) {
        map.setProjection({ type: state.projection });
        setProjectionButtonState(state.projection);
        refreshPolarProjectionData();
      }
      // Chrome-only updates and old/incomplete saved states must not pass
      // explicit undefined values into MapLibre. WKWebView can turn those
      // values into a NaN camera, leaving the globe present but unpainted.
      const camera = {};
      const c = state.center || {};
      if (Number.isFinite(c.lng) && Number.isFinite(c.lat)) {
        camera.center = [c.lng, c.lat];
      }
      for (const key of ['zoom', 'bearing', 'pitch']) {
        if (Number.isFinite(state[key])) camera[key] = state[key];
      }
      if (Object.keys(camera).length) map.jumpTo(camera);
      return true;
    } catch (_) {
      return false;
    }
  }

  function applyPendingCamera() {
    if (!map) return;
    if (pendingViewState) {
      const state = pendingViewState;
      pendingViewState = null;
      pendingCenter = null;
      applyViewStateNow(state);
    } else if (pendingCenter) {
      const center = pendingCenter;
      pendingCenter = null;
      try { map.jumpTo({ center }); } catch (_) {}
    }
  }

  function wireProjectionButtons() {
    for (const btn of document.querySelectorAll('#proj button')) {
