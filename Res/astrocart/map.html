        letterSpacing: settings.paranLabelSpacing,
        haloColor: theme.paranHalo,
        haloWidth: settings.paranLabelHaloOn ? settings.paranLabelHaloWidth : 0,
        priority: 3,
        yOffset: 0,
      };
    }
    if (!settings.labelsOn || !['MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE'].includes(kind)) return null;
    const text = kind === 'LOCAL_SPACE'
      ? `${p.label || p.point || ''} ${p.bearing_label || ''}`.trim()
      : `${p.label || p.point || ''} ${kind}`.trim();
    return {
      id: p.label_id || `${modeKey}${kind}:${p.point || p.label || ''}`,
      text,
      color: p.color || theme.labelColor,
      fontSize: settings.labelSize,
      letterSpacing: settings.labelSpacing,
      haloColor: theme.labelHalo,
      haloWidth: settings.labelHaloOn ? settings.labelHaloWidth : 0,
      priority: kind === 'LOCAL_SPACE' ? 2 : 1,
      yOffset: 0,
    };
  }

  function representativeCoordinate(geom) {
    if (!geom) return null;
    let line = null;
    if (geom.type === 'LineString') {
      line = geom.coordinates;
    } else if (geom.type === 'MultiLineString') {
      line = (geom.coordinates || []).reduce((best, current) => {
        if (!best || (current && current.length > best.length)) return current;
        return best;
      }, null);
    }
    if (!line || !line.length) return null;
    return line[Math.floor(line.length / 2)];
  }

  function renderOnlineDomAcgLabels(layer, reason) {
    const started = perfNow();
    let renderedCount = 0;
    layer.replaceChildren();
    acgLabelElements.clear();
    acgLabelAnchorChoices.clear();
    acgLabelCollisionBoxes = [];
    if (!ACG_DOM_LABELS || !map || !currentData || !currentData.features) {
      recordDomLabelPerf(perfNow() - started, renderedCount, reason);
      return;
    }
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;
    const used = [];
    const out = [];
    const featureLimit = 80;
    for (const f of currentData.features) {
      const p = f.properties || {};
      if (p.kind === 'PARAN') continue;
      if (!['MC', 'IC', 'ASC', 'DSC'].includes(p.kind)) continue;
      const coord = representativeCoordinate(f.geometry);
      if (!coord || !isCoordinateVisibleOnCurrentProjection(coord)) continue;
      let pt;
      try { pt = map.project(coord); } catch (_) { continue; }
      if (!pt || pt.x < 12 || pt.x > w - 12 || pt.y < 12 || pt.y > h - 12) continue;
      if (used.some((item) => Math.abs(item.x - pt.x) < 36 && Math.abs(item.y - pt.y) < 14)) continue;
      used.push({ x: pt.x, y: pt.y });
      out.push({
        x: pt.x,
        y: pt.y,
        color: p.color || '#d0d2d6',
        label: `${p.label || p.point || ''} ${p.kind}`,
      });
      if (out.length >= featureLimit) break;
    }
    for (const item of out) {
      const el = document.createElement('div');
      el.className = 'acg-dom-label';
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      el.style.color = item.color;
      el.textContent = item.label;
      layer.appendChild(el);
      renderedCount += 1;
    }
    recordDomLabelPerf(perfNow() - started, renderedCount, reason);
  }

  function renderDomAcgLabels(reason) {
    const layer = document.getElementById('acg-dom-labels');
    if (!layer) return;
    const offlineRenderer = USE_LOCAL_BASEMAP || USE_MINIMAL_BASEMAP;
    if (!offlineRenderer) {
      domLabelRendererMode = 'online';
      renderOnlineDomAcgLabels(layer, reason);
      return;
    }
    if (domLabelRendererMode !== 'offline') {
      layer.replaceChildren();
      acgLabelElements.clear();
      acgLabelAnchorChoices.clear();
    }
    domLabelRendererMode = 'offline';
    const started = perfNow();
    let renderedCount = 0;
    for (const el of acgLabelElements.values()) el.style.display = 'none';
    acgLabelCollisionBoxes = [];
    if (!ACG_DOM_LABELS || !map || !currentData || !currentData.features) {
      recordDomLabelPerf(perfNow() - started, renderedCount, reason);
      renderPlaceLabels('acg-empty');
      return;
    }
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;
    const safeTop = Math.max(12, Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--titlebar-safe-top')) + 12 || 12);
    const screenCenter = { x: w / 2, y: h / 2 };
    const features = (currentData.features || []).map((feature) => ({ feature, source: 'acg' }));
    for (const feature of currentEclipseData.features || []) features.push({ feature, source: 'eclipse' });
    const descriptors = features
      .map((entry) => ({ ...entry, descriptor: labelDescriptor(entry.feature, entry.source) }))
      .filter((entry) => entry.descriptor && entry.descriptor.text)
      .sort((a, b) => (a.descriptor.priority - b.descriptor.priority) || a.descriptor.id.localeCompare(b.descriptor.id));
    const currentDescriptorIds = new Set(descriptors.map((entry) => entry.descriptor.id));
    for (const [id, el] of acgLabelElements) {
      if (currentDescriptorIds.has(id)) continue;
      el.remove();
      acgLabelElements.delete(id);
      acgLabelAnchorChoices.delete(id);
    }
    const featureLimit = 120;
    for (const entry of descriptors) {
      if (renderedCount >= featureLimit) break;
      const descriptor = entry.descriptor;
      const candidates = [];
      for (const coord of featureLabelAnchors(entry.feature)) {
        if (!Array.isArray(coord) || coord.length < 2 || !isCoordinateVisibleOnCurrentProjection(coord)) continue;
        let pt;
        try { pt = map.project(coord); } catch (_) { continue; }
        const x = Number(pt && pt.x);
        const y = Number(pt && pt.y) + descriptor.yOffset;
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        if (x < 12 || x > w - 12 || y < safeTop || y > h - 42) continue;
        const box = estimatedLabelBox(x, y, descriptor.text, descriptor.fontSize, 8);
        if (acgLabelCollisionBoxes.some((other) => boxesOverlap(box, other, 3))) continue;
        const score = Math.hypot(x - screenCenter.x, y - screenCenter.y);
        const anchorKey = `${Number(coord[0]).toFixed(6)}:${Number(coord[1]).toFixed(6)}`;
        candidates.push({ x, y, box, score, anchorKey });
      }
      candidates.sort((a, b) => a.score - b.score);
      const previousAnchor = acgLabelAnchorChoices.get(descriptor.id);
      const item = candidates.find((candidate) => candidate.anchorKey === previousAnchor) || candidates[0];
      if (!item) continue;
      acgLabelAnchorChoices.set(descriptor.id, item.anchorKey);
      acgLabelCollisionBoxes.push(item.box);
      let el = acgLabelElements.get(descriptor.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'acg-dom-label';
        acgLabelElements.set(descriptor.id, el);
        layer.appendChild(el);
      }
      if (el.textContent !== descriptor.text) el.textContent = descriptor.text;
      el.className = 'acg-dom-label';
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      el.style.color = descriptor.color;
      el.style.fontSize = `${descriptor.fontSize}px`;
      el.style.letterSpacing = `${descriptor.letterSpacing || 0}em`;
      el.style.textShadow = descriptor.haloWidth > 0
        ? `0 0 ${Math.max(2, descriptor.haloWidth * 2)}px ${descriptor.haloColor}`
        : 'none';
      el.style.display = '';
      renderedCount += 1;
    }
    recordDomLabelPerf(perfNow() - started, renderedCount, reason);
    renderPlaceLabels('acg-layout');
  }

  function isCoordinateVisibleOnCurrentProjection(coord) {
    if (!map || !coord) return true;
    let projType = 'mercator';
    try {
      const proj = map.getProjection && map.getProjection();
      projType = (proj && proj.type) || projType;
    } catch (_) {}
    if (projType !== 'globe') return true;
    let center;
    try {
      center = map.getCenter();
    } catch (_) {
      return true;
    }
    return angularDistanceDeg(center.lng, center.lat, Number(coord[0]), Number(coord[1])) <= 92.0;
  }

  function angularDistanceDeg(lon1, lat1, lon2, lat2) {
    const r = Math.PI / 180;
    const p1 = Number(lat1) * r;
    const p2 = Number(lat2) * r;
    const dLon = ((Number(lon2) - Number(lon1) + 540) % 360 - 180) * r;
    const cosD = Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dLon);
    const clamped = Math.max(-1, Math.min(1, cosD));
    return Math.acos(clamped) / r;
  }

  function onLineClick(e) {
    if (!e.features || !e.features.length) return;
    const f = e.features[0];
    const label = f.properties.label || f.properties.point;
    const kind = f.properties.kind;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${label}</strong> ${kind}<br><span style="opacity:0.7">${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({ type: 'click', point: f.properties.point, kind: kind,
                 lon: e.lngLat.lng, lat: e.lngLat.lat });
  }

  function onEclipseClick(e) {
    if (!e.features || !e.features.length) return;
    if (e.originalEvent && e.originalEvent._eclipsePopupHandled) return;
    if (e.originalEvent) e.originalEvent._eclipsePopupHandled = true;
    const f = e.features[0];
    const p = f.properties || {};
    const title = p.label || `${(p.event_type || 'Solar').replace(/^\w/, (c) => c.toUpperCase())} solar eclipse`;
    const date = p.utc || '';
    const detail = p.kind === 'ECLIPSE_MAX' ? 'maximum eclipse' :
      (p.kind === 'ECLIPSE_CENTER' ? 'centerline' :
       (p.kind === 'ECLIPSE_LIMIT' ? 'path limit' : 'shadow path'));
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<strong>${title}</strong><br><span>${date}</span><br><span style="opacity:0.7">${detail} · ${e.lngLat.lng.toFixed(2)}°, ${e.lngLat.lat.toFixed(2)}°</span>`)
      .addTo(map);
    sendToHost({
      type: 'click',
      point: 'eclipse',
      kind: p.kind || 'ECLIPSE',
      lon: e.lngLat.lng,
      lat: e.lngLat.lat,
    });
  }

  function featurePlaceName(f) {
    const p = (f && f.properties) || {};
    return p.name_en || p['name:en'] || p.name || p.name_int || '';
  }

  function placeFeatureAtPoint(point) {
    const layers = PLACE_LABEL_LAYER_IDS.filter((id) => map && map.getLayer(id));
    if (!layers.length) return null;
    const r = 10;
    const features = map.queryRenderedFeatures(
      [[point.x - r, point.y - r], [point.x + r, point.y + r]],
      { layers }
    );
    return features.find((f) => featurePlaceName(f)) || null;
  }

  function domPlaceNameAtPoint(point) {
    if (!map || !Array.isArray(placeLabelData)) return '';
    let nearest = null;
    for (const place of placeLabelData) {
      if (!isCoordinateVisibleOnCurrentProjection([place.lon, place.lat])) continue;
      let projected;
      try { projected = map.project([place.lon, place.lat]); } catch (_) { continue; }
      const distance = Math.hypot(projected.x - point.x, projected.y - point.y);
      if (distance > 20 || (nearest && distance >= nearest.distance)) continue;
      nearest = { distance, name: place.name };
    }
    return nearest ? nearest.name : '';
  }

  function sendHereRequest(action, lngLat, placeName) {
    sendToHost({
      type: 'here',
      action: action,
      lon: lngLat.lng,
      lat: lngLat.lat,
      placeName: placeName || '',
    });
  }

  function wireContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    menu.addEventListener('click', (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn || !contextMenuTarget) return;
      sendHereRequest(btn.dataset.action, contextMenuTarget.lngLat, contextMenuTarget.placeName);
      hideContextMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') hideContextMenu();
    });
  }

  function routeHostKeyCommand(event) {
    if (event.defaultPrevented || event.ctrlKey || event.metaKey || event.altKey) return;
    const target = event.target;
    if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
      return;
    }
    const key = event.key || '';
    const isLetter = key.length === 1 && /^[a-z]$/i.test(key);
    const isEscape = key === 'Escape';
    if (!isLetter && !isEscape) return;

    const menu = document.getElementById('acg-menu');
    if (isEscape && menu && menu.style.display !== 'none') {
      hideContextMenu();
      event.preventDefault();
      event.stopPropagation();
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    if (!event.repeat) sendToHost({ type: 'shortcut', key: key });
  }

  function onMapContextMenu(e) {
    if (e.preventDefault) e.preventDefault();
    if (e.originalEvent) e.originalEvent.preventDefault();
    const place = placeFeatureAtPoint(e.point);
    const placeName = place ? featurePlaceName(place) : domPlaceNameAtPoint(e.point);
    showContextMenu(e.point, e.lngLat, placeName);
  }

  function showContextMenu(point, lngLat, placeName) {
    const menu = document.getElementById('acg-menu');
    if (!menu) return;
    contextMenuTarget = { lngLat: lngLat, placeName: placeName || '' };
    menu.style.display = 'block';
    const margin = 6;
    const rect = menu.getBoundingClientRect();
    const x = Math.min(point.x, window.innerWidth - rect.width - margin);
    const y = Math.min(point.y, window.innerHeight - rect.height - margin);
    menu.style.left = Math.max(margin, x) + 'px';
    menu.style.top = Math.max(margin, y) + 'px';
  }

  function hideContextMenu() {
    const menu = document.getElementById('acg-menu');
    if (menu) menu.style.display = 'none';
  }

  function sendToHost(payload) {
    // wx host: navigation to morinus://acg/<json> is intercepted by
    // EVT_WEBVIEW_NAVIGATING (astrocartframe.py:534). This is a top-level page
    // under wx, so window.parent === window and the postMessage below is a
    // harmless self-post that wx never listens for — its bridge path is the
    // navigation, untouched.
    const url = 'morinus://acg/' + encodeURIComponent(JSON.stringify(payload));
    window.location.href = url;
    // webapp host: the React shell embeds this page in an <iframe> and CANNOT
    // intercept the morinus:// navigation. When embedded (parent !== self) we
    // ALSO postMessage the same payload UP to the parent so the React surface
    // receives the line-click / here / shortcut intents. Tagged with a source
    // marker so the parent can distinguish it from the inbound aries.* channel.
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'aries-acg', payload: payload }, '*');
      }
    } catch (_) {}
  }

  function postToParent(payload) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'aries-acg', payload: payload }, '*');
      }
    } catch (_) {}
  }

  function postViewState(reason, options) {
    const opts = options || {};
    if (!viewStatePersistenceEnabled && !opts.force) return;
    const acg = window.ACG;
    if (!acg || typeof acg.getState !== 'function') return;
    const state = acg.getState();
    if (!state) return;
    postToParent({ type: 'state', reason: reason || 'state', state: state });
  }

  function scheduleViewStatePost(reason, options) {
    const opts = options || {};
    if (!viewStatePersistenceEnabled && !opts.force) return;
    if (viewStatePostTimer) window.clearTimeout(viewStatePostTimer);
    viewStatePostTimer = window.setTimeout(() => {
      viewStatePostTimer = null;
      postViewState(reason, opts);
    }, 120);
  }

  function setViewStatePersistenceEnabled(enabled) {
    viewStatePersistenceEnabled = !!enabled;
    if (!viewStatePersistenceEnabled && viewStatePostTimer) {
      window.clearTimeout(viewStatePostTimer);
      viewStatePostTimer = null;
    }
  }

  function setStatus(s) {
    const el = document.getElementById('status');
    if (el) el.textContent = s;
  }

  function ensureViewOptionDefaults() {
    if (viewOptionsInitialized) return;
    setParansVisible(false);
  }

  function syncParanVisibility() {
    const visible = !!viewOptions.parans;
    const s = currentDevSettings();
    if (map && map.getLayer('acg-parans')) {
      map.setLayoutProperty('acg-parans', 'visibility', visible ? 'visible' : 'none');
    }
    if (map && map.getLayer('acg-paran-labels')) {
      map.setLayoutProperty('acg-paran-labels', 'visibility', (visible && s.paranLabelsOn) ? 'visible' : 'none');
    }
    const btn = document.querySelector('#overlays button[data-overlay="parans"]');
    if (btn) {
      btn.classList.toggle('on', visible);
      btn.setAttribute('aria-pressed', visible ? 'true' : 'false');
    }
    scheduleDomAcgLabels('parans');
  }

  function setParansVisible(visible) {
    viewOptions.parans = !!visible;
    viewOptionsInitialized = true;
    syncParanVisibility();
  }

  function setLegendCollapsed(collapsed) {
    legendCollapsed = !!collapsed;
    const legend = document.getElementById('legend');
    const btn = document.getElementById('legend-toggle');
    if (legend) legend.classList.toggle('collapsed', legendCollapsed);
    if (btn) {
      btn.setAttribute('aria-expanded', legendCollapsed ? 'false' : 'true');
      btn.setAttribute('aria-label', legendCollapsed ? 'Expand legend' : 'Collapse legend');
      const state = btn.querySelector('.legend-state');
      if (state) state.textContent = legendCollapsed ? '+' : '-';
    }
  }

  function applyChromeState(state) {
    if (!state) return;
    const overlays = state.overlays || state.viewOptions || {};
    if (Object.prototype.hasOwnProperty.call(overlays, 'parans')) {
      setParansVisible(overlays.parans);
    } else if (Object.prototype.hasOwnProperty.call(state, 'paransVisible')) {
      setParansVisible(state.paransVisible);
    }
    if (state.legend && Object.prototype.hasOwnProperty.call(state.legend, 'collapsed')) {
      setLegendCollapsed(state.legend.collapsed);
    } else if (Object.prototype.hasOwnProperty.call(state, 'legendCollapsed')) {
      setLegendCollapsed(state.legendCollapsed);
    }
  }

  function setProjection(name) {
    if (!map) return;
    if (name !== 'globe' && name !== 'mercator') return;
    selectedProjection = name;
    setProjectionButtonState(name);
    hideMapUntilStyledPaint();
    try {
      map.setProjection({ type: name });
    } catch (err) {
      revealMapAfterStyledPaint();
      setStatus('projection pending: ' + name);
      return;
    }
    // Round-trip-safe zoom targets so each projection shows a useful view.
    if (name === 'globe') {
      map.easeTo({ zoom: globeZoomForViewport(), duration: 400 });
    } else if (name === 'mercator') {
      map.easeTo({ zoom: 1.3, duration: 400 });
    }
    scheduleViewStatePost('projection');
    revealMapAfterStyledPaint();
  }

  function setProjectionButtonState(name) {
    if (name === 'globe' || name === 'mercator') selectedProjection = name;
    for (const btn of document.querySelectorAll('#proj button')) {
      btn.classList.toggle('on', btn.dataset.proj === name);
      btn.setAttribute('aria-pressed', btn.dataset.proj === name ? 'true' : 'false');
    }
  }

  function applyViewStateNow(state) {
    if (!map || !state) return false;
    applyChromeState(state);
    try {
      if (state.projection) {
        map.setProjection({ type: state.projection });
        setProjectionButtonState(state.projection);
      }
      const c = state.center || {};
      map.jumpTo({
        center: (c.lng != null && c.lat != null) ? [c.lng, c.lat] : undefined,
        zoom: state.zoom,
        bearing: state.bearing,
        pitch: state.pitch,
      });
      return true;
    } catch (_) {
      return false;
    }
  }

  function applyPendingCamera() {
    if (!map) return;
    if (pendingViewState) {
      const state = pendingViewState;
      pendingViewState = null;
      pendingCenter = null;
      applyViewStateNow(state);
    } else if (pendingCenter) {
      const center = pendingCenter;
      pendingCenter = null;
      try { map.jumpTo({ center }); } catch (_) {}
    }
  }

  function wireProjectionButtons() {
    for (const btn of document.querySelectorAll('#proj button')) {
      wireChromeButton(btn, () => setProjection(btn.dataset.proj));
    }
  }

  function toggleOverlay(name) {
    if (name === 'parans') {
      setParansVisible(!viewOptions.parans);
      scheduleViewStatePost('overlay');
    }
  }

  function wireOverlayButtons() {
    for (const btn of document.querySelectorAll('#overlays button')) {
      wireChromeButton(btn, () => toggleOverlay(btn.dataset.overlay));
    }
  }

  function wireLegendToggle() {
    const btn = document.getElementById('legend-toggle');
    if (!btn) return;
    wireChromeButton(btn, () => {
      setLegendCollapsed(!legendCollapsed);
      scheduleViewStatePost('legend');
    });
    setLegendCollapsed(legendCollapsed);
  }

  function shieldChromeEvent(event) {
    event.stopPropagation();
  }

  function wireChromeButton(btn, action) {
    for (const type of ['pointerdown', 'mousedown', 'touchstart']) {
      btn.addEventListener(type, shieldChromeEvent, { passive: true });
    }
    btn.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      action(event);
    });
  }

  function wireControlsOnce() {
    if (controlsWired) return;
    controlsWired = true;
    wireContextMenu();
    wireProjectionButtons();
    wireOverlayButtons();
    wireLegendToggle();
    wireSearchInput();
  }

  // ---- Place search ---------------------------------------------------
  //
  // Two-tier search:
  //   1. Offline city-list: filters the `placesData` array already loaded
  //      for the on-globe labels (~16k cities from places.geojson). Instant.
  //   2. Nominatim (https://nominatim.openstreetmap.org/): debounced fetch
  //      for everything else \u2014 addresses, landmarks, villages too small to
  //      ship in the bundled list. Online-only; if the API is unreachable
  //      the local section keeps working unchanged.
  //
  // We respect Nominatim's usage policy by setting a real User-Agent on
  // the wxWebView (see astrocartframe._aries_user_agent), debouncing input
  // to one query per ~350ms, aborting stale requests, and caching results.

  let activeSearchIndex = -1;
  let currentSearchMatches = [];
  let nominatimController = null;
  let nominatimQueryToken = 0;
  let nominatimDebounceTimer = null;
  const nominatimCache = new Map();
  const NOMINATIM_DEBOUNCE_MS = 350;
  const NOMINATIM_MIN_QUERY = 3;
  const NOMINATIM_TIMEOUT_MS = 5500;
  const NOMINATIM_CACHE_MAX = 32;

  function normalizeSearchString(s) {
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function searchPlaces(query, limit) {
    const q = normalizeSearchString(query);
    if (q.length < 2 || !placesData.length) return [];
    const starts = [];
    const contains = [];
    for (const p of placesData) {
      const n = normalizeSearchString(p.name);
      const a = normalizeSearchString(p.ascii);
      if (n.startsWith(q) || (a && a.startsWith(q))) starts.push(p);
      else if (n.includes(q) || (a && a.includes(q))) contains.push(p);
      if (starts.length >= 200 && contains.length >= 200) break;
    }
    const byPop = (a, b) => (b.population || 0) - (a.population || 0);
    starts.sort(byPop);
    contains.sort(byPop);
    return starts.concat(contains).slice(0, limit || 6).map((p) => ({
      lon: p.lon, lat: p.lat,
      name: p.name, country: p.country || '',
      secondary: '', source: 'local',
    }));
  }

  function nominatimRowFromHit(hit) {
    const lon = Number(hit.lon);
    const lat = Number(hit.lat);
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) return null;
    const display = String(hit.display_name || '');
    const addr = hit.address || {};
    const name = (hit.name && String(hit.name)) || display.split(',')[0].trim();
    const country = String(addr.country_code || '').toUpperCase();
    const rest = display.split(',').slice(1).map((s) => s.trim()).filter(Boolean);
    const secondary = rest.join(', ') || addr.country || '';
    return { lon, lat, name, country, secondary, source: 'osm' };
  }

  async function searchNominatim(query) {
    const q = (query || '').trim();
    if (q.length < NOMINATIM_MIN_QUERY) return [];
    if (nominatimCache.has(q)) {
      // refresh LRU order
      const cached = nominatimCache.get(q);
      nominatimCache.delete(q);
      nominatimCache.set(q, cached);
      return cached;
    }
    if (nominatimController) {
      try { nominatimController.abort(); } catch (_) {}
    }
    const controller = new AbortController();
    nominatimController = controller;
    const timer = window.setTimeout(() => {
      try { controller.abort(); } catch (_) {}
    }, NOMINATIM_TIMEOUT_MS);
    const params = new URLSearchParams({
      q: q,
      format: 'jsonv2',
      limit: '8',
      addressdetails: '1',
    });
    const url = `https://nominatim.openstreetmap.org/search?${params.toString()}`;
    try {
      const res = await fetch(url, {
        signal: controller.signal,
        headers: { 'Accept': 'application/json' },
        cache: 'default',
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const rows = (Array.isArray(data) ? data : [])
        .map(nominatimRowFromHit).filter(Boolean);
      nominatimCache.set(q, rows);
      if (nominatimCache.size > NOMINATIM_CACHE_MAX) {
        const oldest = nominatimCache.keys().next().value;
        nominatimCache.delete(oldest);
      }
      return rows;
    } catch (err) {
      if (err && err.name === 'AbortError') return null;
      return [];
    } finally {
      window.clearTimeout(timer);
      if (nominatimController === controller) nominatimController = null;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => (
      { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
    ));
  }

  function setActiveSearchResult(idx) {
    const list = document.getElementById('place-search-results');
    if (!list) return;
    const buttons = list.querySelectorAll('.place-search-result');
    activeSearchIndex = Math.max(-1, Math.min(buttons.length - 1, idx));
    buttons.forEach((b, i) => b.classList.toggle('active', i === activeSearchIndex));
    if (activeSearchIndex >= 0) {
      const el = buttons[activeSearchIndex];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }
  }

  function appendSearchRow(list, item, idx) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'place-search-result';
    if (item.source === 'osm') btn.classList.add('osm');
    btn.setAttribute('role', 'option');
    const secondaryHtml = item.secondary
      ? `<span class="secondary">${escapeHtml(item.secondary)}</span>`
      : '';
    btn.innerHTML =
      `<span class="name">${escapeHtml(item.name)}${secondaryHtml}</span>` +
      `<span class="country">${escapeHtml(item.country || '')}</span>`;
    btn.addEventListener('mousedown', (event) => {
      event.preventDefault();
      acceptSearchResult(item);
    });
    btn.addEventListener('mouseenter', () => setActiveSearchResult(idx));
    list.appendChild(btn);
  }

  function renderSearchResults(state) {
    const list = document.getElementById('place-search-results');
    if (!list) return;
    const local = (state && state.local) || [];
    const osm = (state && state.osm) || [];
    const loading = !!(state && state.loading);
    const input = document.getElementById('place-search-input');
    const q = (input && input.value || '').trim();

    list.replaceChildren();
    const flat = [];

    if (local.length) {
      local.forEach((it) => {
        flat.push(it);
        appendSearchRow(list, it, flat.length - 1);
      });
    }
    if (osm.length || loading) {
      const sec = document.createElement('div');
      sec.className = 'place-search-section' + (local.length ? ' divider' : '');
      sec.textContent = 'OpenStreetMap';
      list.appendChild(sec);
      if (loading && !osm.length) {
        const ld = document.createElement('div');
        ld.className = 'place-search-loading';
        ld.textContent = 'Searching online\u2026';
        list.appendChild(ld);
      } else {
        osm.forEach((it) => {
          flat.push(it);
          appendSearchRow(list, it, flat.length - 1);
        });
      }
    }

    currentSearchMatches = flat;

    if (!flat.length && !loading) {
      list.replaceChildren();
      if (q.length >= 2) {
        const empty = document.createElement('div');
        empty.className = 'place-search-empty';
        empty.textContent = 'No matches';
        list.appendChild(empty);
        list.style.display = 'block';
      } else {
        list.style.display = 'none';
      }
      activeSearchIndex = -1;
      return;
    }

    list.style.display = 'block';
    setActiveSearchResult(flat.length ? 0 : -1);
  }

  function refreshSearchResults() {
    const input = document.getElementById('place-search-input');
    if (!input) return;
    const q = input.value;
    const trimmed = q.trim();
    const local = searchPlaces(q, 6);
    const willHitOsm = trimmed.length >= NOMINATIM_MIN_QUERY;
    const cached = willHitOsm ? nominatimCache.get(trimmed) : null;
    renderSearchResults({
      local,
      osm: cached || [],
      loading: willHitOsm && !cached,
    });

    if (nominatimDebounceTimer) {
      window.clearTimeout(nominatimDebounceTimer);
      nominatimDebounceTimer = null;
    }
    if (!willHitOsm) {
      if (nominatimController) {
        try { nominatimController.abort(); } catch (_) {}
      }
      return;
    }
    if (cached) return;  // already rendered above

    const token = ++nominatimQueryToken;
    nominatimDebounceTimer = window.setTimeout(() => {
      searchNominatim(trimmed).then((osm) => {
        if (osm === null) return; // aborted by a newer query
        if (token !== nominatimQueryToken) return;
        const liveInput = document.getElementById('place-search-input');
        if (!liveInput || liveInput.value.trim() !== trimmed) return;
        renderSearchResults({
          local: searchPlaces(liveInput.value, 6),
          osm: osm,
          loading: false,
        });
      });
    }, NOMINATIM_DEBOUNCE_MS);
  }

  // The persistent pin dropped by the search box. One at a time — a new
  // accept replaces the previous marker/popup. Implemented with MapLibre's
  // own ``maplibregl.Marker`` + ``maplibregl.Popup``: the marker is a
  // teardrop SVG with the chrome accent fill, the popup inherits the
  // theme-aware CSS already overriding ``.maplibregl-popup-content``.
  let searchMarker = null;
  let searchPopup = null;

  function disposeSearchPin() {
    if (searchPopup) {
      try { searchPopup.remove(); } catch (_) {}
      searchPopup = null;
    }
    if (searchMarker) {
      try { searchMarker.remove(); } catch (_) {}
      searchMarker = null;
    }
  }

  function dropSearchPin(place) {
    if (!map || !window.maplibregl || !place) return;
    disposeSearchPin();
    const lngLat = [place.lon, place.lat];
    const countryHtml = place.country
      ? `<span style="opacity:0.55;margin-left:6px;font-size:10px;letter-spacing:0.04em">${escapeHtml(place.country)}</span>`
      : '';
    const secondaryHtml = place.secondary
      ? `<div style="margin-top:4px;opacity:0.7;font-size:10px;line-height:1.35;max-width:240px;white-space:normal">${escapeHtml(place.secondary)}</div>`
      : '';
    const html = `<strong>${escapeHtml(place.name)}</strong>${countryHtml}${secondaryHtml}`;
    searchPopup = new maplibregl.Popup({
      offset: 28,
      closeButton: true,
      closeOnClick: false,
      maxWidth: '280px',
    }).setLngLat(lngLat).setHTML(html);
    // setPopup binds toggle-on-marker-click; addTo opens the popup
    // immediately so the user sees the detail without an extra interaction.
    searchMarker = new maplibregl.Marker({ color: '#0a84ff' })
      .setLngLat(lngLat)
      .setPopup(searchPopup)
      .addTo(map);
    searchPopup.addTo(map);
  }

  function acceptSearchResult(place) {
    if (!place || !map) return;
    const input = document.getElementById('place-search-input');
    if (input) { input.value = ''; input.blur(); }
    const list = document.getElementById('place-search-results');
    if (list) { list.replaceChildren(); list.style.display = 'none'; }
    activeSearchIndex = -1;
    currentSearchMatches = [];
    if (nominatimDebounceTimer) {
      window.clearTimeout(nominatimDebounceTimer);
      nominatimDebounceTimer = null;
    }
    if (nominatimController) {
      try { nominatimController.abort(); } catch (_) {}
    }
    // Zoom levels picked for context: OSM hits are typically street/address
    // grain so we go to 13 (≈ city neighborhood); local-list hits are city
    // centroids so 9 (≈ regional context, surrounding suburbs visible).
    const targetZoom = place.source === 'osm' ? 13 : 9;
    try {
      map.flyTo({
        center: [place.lon, place.lat],
        zoom: targetZoom,
        duration: 900,
        essential: true,
      });
    } catch (_) {
      map.jumpTo({ center: [place.lon, place.lat], zoom: targetZoom });
    }
    dropSearchPin(place);
    postToParent({
      type: 'place-selection',
      lon: Number(place.lon),
      lat: Number(place.lat),
      placeName: String(place.name || ''),
    });
  }

  function wireSearchInput() {
    const input = document.getElementById('place-search-input');
    const list = document.getElementById('place-search-results');
    if (!input || !list) return;
    for (const type of ['pointerdown', 'mousedown', 'touchstart', 'click', 'wheel', 'dblclick']) {
      input.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
      list.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
    }
    input.addEventListener('input', () => {
      if (!placesLoaded) loadStaticPlaceLabels({ forceStatic: true });
      refreshSearchResults();
    });
    input.addEventListener('focus', () => {
      if (!placesLoaded) loadStaticPlaceLabels({ forceStatic: true });
      if (input.value) refreshSearchResults();
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        const pick = activeSearchIndex >= 0
          ? currentSearchMatches[activeSearchIndex]
          : currentSearchMatches[0];
        if (pick) acceptSearchResult(pick);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        input.value = '';
        list.replaceChildren();
        list.style.display = 'none';
        activeSearchIndex = -1;
        currentSearchMatches = [];
        if (nominatimDebounceTimer) {
          window.clearTimeout(nominatimDebounceTimer);
          nominatimDebounceTimer = null;
        }
        if (nominatimController) {
          try { nominatimController.abort(); } catch (_) {}
        }
        input.blur();
        return;
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (currentSearchMatches.length) setActiveSearchResult(activeSearchIndex + 1);
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (currentSearchMatches.length) setActiveSearchResult(activeSearchIndex - 1);
      }
    });
    input.addEventListener('blur', () => {
      window.setTimeout(() => {
        if (document.activeElement !== input) {
          list.style.display = 'none';
        }
      }, 140);
    });
  }

  // ---- Public API for the Python host ---------------------------------
  window.ACG = {
    setData(geojson) {
      try {
        const data = geojson || { type: 'FeatureCollection', features: [] };
        if (!mapReady) { pendingData = data; return; }
        currentData = data;
        pushData();
        setStatus(`${(currentData.features || []).length} lines loaded`);
        postPerfSnapshot('set-data');
      } catch (err) { setStatus('error: ' + err.message); }
    },
    setEclipseData(geojson) {
      try {
        const data = geojson || { type: 'FeatureCollection', features: [] };
        if (!mapReady) { pendingEclipseData = data; return; }
        currentEclipseData = data;
        pushEclipseData({ fit: true });
        const count = (currentEclipseData.features || []).length;
        if (count) setStatus(`${count} eclipse path features loaded`);
      } catch (err) { setStatus('eclipse error: ' + err.message); }
    },
    setStyle(url) {
      if (!map) return;
      const state = this.getState();
      map.setStyle(url);
      map.once('style.load', () => {
        applyViewStateNow(state);
        applyVectorBasemapStyle();
        ensureEclipseLayers();
        ensureAcgLayers();
        applyDevColors();
        pushData();
        pushEclipseData({ fit: false });
      });
    },
    flyTo(lon, lat, zoom) {
      if (map) map.flyTo({ center: [lon, lat], zoom: zoom || 4 });
    },
    /** Recenter the map on the chart's birth location without changing zoom.
        Queues if the map style isn't loaded yet — Python often calls this
        before MapLibre has finished initialising, and a bare jumpTo during
        that window is silently dropped. */
    setCenter(lat, lon) {
      const target = [Number(lon) || 0, Number(lat) || 0];
      if (!map || !mapReady) {
        if (!pendingViewState) pendingCenter = target;
      } else {
        map.jumpTo({ center: target });
      }
    },
    clear() {
      currentData = { type: 'FeatureCollection', features: [] };
      pushData();
    },
    clearEclipse() {
      currentEclipseData = { type: 'FeatureCollection', features: [] };
      pendingEclipseData = null;
      pushEclipseData({ fit: false });
    },
    setProjection,
    setZoom(z) { if (map) map.setZoom(z); },
    /** Live theme swap. Called by Python when the user changes Options →
        Colors. Repaints the loaded style in place so sources, layers, camera,
        labels and the retained canvas stay alive throughout the change. */
    setTheme(name, pageBg) {
      const nextDark = (name || '').toLowerCase() === 'dark';
      if (pageBg) URL_THEME.set('pageBg', pageBg);
      applyPageBg(DEV_SETTINGS.pageBg || pageBg);
      if (nextDark === IS_DARK) return;
      IS_DARK = nextDark;
      document.body.classList.toggle('theme-light', !IS_DARK);
      // During boot (or an explicit external style load), the shared
      // style.load handler reads the updated IS_DARK value. Once settled, all
      // theme-owned paint/layout properties can be changed without setStyle(),
      // whose teardown races consecutive daemon theme/style messages.
      if (
        !map ||
        !mapReady ||
        (typeof map.isStyleLoaded === 'function' && !map.isStyleLoaded())
      ) return;
      applyDevColors();
    },
    setDevSettings(settings) {
      DEV_SETTINGS = Object.assign({}, settings || {});
      applyDevColors();
    },
    setDisplayStyle(payload) {
      const meta = payload && payload.meta || {};
      if (meta.theme) this.setTheme(meta.theme, meta.pageBg);
      applyDisplayStyle(payload || {});
    },
    setUiLabels(labels) {
      uiLabels = Object.assign({}, uiLabels, labels || {});
      applyBirthplaceMarkerLabel();
    },
    /** Serialisable view state for Python-side per-radix persistence. */
    getState() {
      if (!map) return null;
      const c = map.getCenter();
      const proj = map.getProjection();
      return {
        zoom: map.getZoom(),
        center: { lng: c.lng, lat: c.lat },
        bearing: map.getBearing(),
        pitch: map.getPitch(),
        projection: (proj && proj.type) || 'globe',
        overlays: { parans: !!viewOptions.parans },
        legend: { collapsed: !!legendCollapsed },
      };
    },
    /** Reapply a prior getState(). Queues until the style has loaded. */
    applyState(state) {
      if (!state) return;
      applyChromeState(state);
      if (!map || !mapReady) {
        pendingViewState = Object.assign({}, state);
        pendingCenter = null;
        return;
      }
      applyViewStateNow(state);
    },
    /** Re-centre and re-fit the globe at the default computed zoom. */
    fitGlobe() {
      if (!map) return;
      map.easeTo({ center: [0, 0], zoom: globeZoomForViewport(), duration: 400 });
    },
    fitEclipse() {
      fitFeatureCollection(currentEclipseData);
    },
    /** Briefly surface a discoverability hint at the bottom of the map.
        Called from Python after the chart-editor "Map" button opens the
        panel — the goal is to teach the right-click → "Set place of birth"
        affordance. Crossfades in, holds, then crossfades out; calls
        replace previous hints rather than queueing. */
    showHint(message, holdMs) {
      const el = document.getElementById('acg-hint');
      if (!el) return;
      el.textContent = String(message || '');
      el.classList.add('on');
      if (hintHideTimer) clearTimeout(hintHideTimer);
      const hold = Math.max(300, Number(holdMs) || 1500);
      hintHideTimer = setTimeout(() => {
        el.classList.remove('on');
        hintHideTimer = null;
      }, hold);
    },
    /** Switch the right-click context menu between chart-bound actions
        and the default-location settings flow. Python flips this when
        the map panel is opened from a particular host dialog so the
        affordances on offer match what the user can actually act on. */
    setContext(mode) {
      const menu = document.getElementById('acg-menu');
      if (!menu) return;
      const next = (mode === 'default_location' || mode === 'ascensional_event_place')
        ? mode
        : 'chart';
      menu.setAttribute('data-mode', next);
    },
    getPerfState,
  };

  document.addEventListener('keydown', routeHostKeyCommand, true);

  // Daemon / iframe bridge — the React shell embeds this map in an <iframe>
  // and pushes ACG data + theme + center via postMessage. wx hosts use
  // WebView.RunScript instead and never postMessage, so this listener is
  // dormant under wx and adds no behaviour to that path.
  window.addEventListener('message', (event) => {
    const data = event && event.data;
    if (!data || typeof data !== 'object') return;
    if (typeof data.type !== 'string' || !data.type.startsWith('aries.')) return;
    const acg = window.ACG;
    if (!acg) return;
    try {
      switch (data.type) {
        case 'aries.setData':
          if (typeof acg.setData === 'function') acg.setData(data.payload);
          break;
        case 'aries.setEclipseData':
          if (typeof acg.setEclipseData === 'function') acg.setEclipseData(data.payload);
          break;
        case 'aries.setTheme':
          if (typeof acg.setTheme === 'function') acg.setTheme(data.theme, data.pageBg);
          break;
        case 'aries.setDisplayStyle':
          if (typeof acg.setDisplayStyle === 'function') acg.setDisplayStyle(data.payload);
          break;
        case 'aries.setUiLabels':
          if (typeof acg.setUiLabels === 'function') acg.setUiLabels(data.labels);
          break;
        case 'aries.setCenter':
          if (typeof acg.setCenter === 'function') acg.setCenter(data.lat, data.lon);
          break;
        case 'aries.setContext':
          if (typeof acg.setContext === 'function') acg.setContext(data.mode);
          break;
        case 'aries.applyState':
          if (typeof acg.applyState === 'function') acg.applyState(data.state);
          break;
        case 'aries.setStatePersistence':
          setViewStatePersistenceEnabled(!!data.enabled);
          break;
        case 'aries.getState':
          postViewState(data.reason || 'request', { force: true });
          break;
        case 'aries.getPerf':
          postPerfSnapshot(data.reason || 'request');
          break;
        case 'aries.getReady':
          if (mapReady) postToParent({ type: 'ready' });
          break;
      }
    } catch (err) {
      console.error('[acg-bridge] failed:', err);
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootMap);
  } else {
    bootMap();
  }
})();
</script>
</body>
</html>
