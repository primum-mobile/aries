      );
    } catch (_) {
      return false;
    }
  }

  function scheduleRuntimeOverlayReplay(attempt = 0) {
    if (!mapHostActive) return;
    if (runtimeOverlayReplayTimer) window.clearTimeout(runtimeOverlayReplayTimer);
    runtimeOverlayReplayTimer = window.setTimeout(() => {
      runtimeOverlayReplayTimer = null;
      if (replayRuntimeOverlays()) return;
      if (attempt < 24) scheduleRuntimeOverlayReplay(attempt + 1);
    }, attempt === 0 ? 0 : Math.min(250, 20 * attempt));
  }

  function adoptOnlineBasemap(style) {
    if (!style || onlineBasemapAdopted) return;
    if (!map || !mapReady) {
      pendingOnlineBasemapStyle = style;
      return;
    }
    const wasLocal = USE_LOCAL_BASEMAP;
    const wasMinimal = USE_MINIMAL_BASEMAP;
    USE_LOCAL_BASEMAP = false;
    USE_MINIMAL_BASEMAP = false;
    pendingOnlineBasemapStyle = null;
    onlineBasemapAdopted = true;
    setPerfTileSource('online');
    try {
      map.setStyle(prepareBaseStyleForTheme(style, IS_DARK), {
        diff: true,
        transformStyle: retainRuntimeOverlayStyle,
      });
      scheduleRuntimeOverlayReplay();
    } catch (_) {
      onlineBasemapAdopted = false;
      USE_LOCAL_BASEMAP = wasLocal;
      USE_MINIMAL_BASEMAP = wasMinimal;
      setPerfTileSource(wasLocal ? 'local' : 'minimal');
    }
  }

  function scheduleOnlineBasemapAdoption() {
    if (
      !mapHostActive ||
      !mapReady ||
      !pendingOnlineBasemapStyle ||
      onlineBasemapAdopted ||
      onlineBasemapAdoptionScheduled
    ) return;
    onlineBasemapAdoptionScheduled = true;
    window.setTimeout(() => {
      onlineBasemapAdoptionScheduled = false;
      adoptOnlineBasemap(pendingOnlineBasemapStyle);
    }, 0);
  }

  function initMap() {
    if (!window.maplibregl || !window.maplibregl.Map) {
      showMapUnavailable('Map renderer unavailable offline');
      return;
    }
    ensureViewOptionDefaults();
    if (window.pmtiles && maplibregl.addProtocol) {
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);
    }
    map = new maplibregl.Map({
      container: 'map',
      style: buildStyle(IS_DARK),
      center: [0, 20],
      zoom: globeZoomForViewport(),
      minZoom: -2,                        // let the sphere shrink below MapLibre's auto clamp
      maxPitch: 85,
      projection: { type: selectedProjection },
      attributionControl: { compact: true },
      pixelRatio: LIVE_MAP_PIXEL_RATIO,
      // Symbol collision fades keep MapLibre rendering after the useful
      // camera paint. Astrocartography labels should settle immediately so a
      // completed gesture has no animation tail competing with the next one.
      fadeDuration: 0,
    });
    ensurePolarOverlayCanvas();
    let fallbackStylePending = false;
    let startupFallbackTimer = window.setTimeout(() => {
      if (mapReady) return;
      if (USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP) {
        USE_LOCAL_BASEMAP = false;
        USE_MINIMAL_BASEMAP = true;
        fallbackStylePending = true;
        setPerfTileSource('minimal');
        armFallbackTimer();
        try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {
          showMapUnavailable('Map tiles unavailable');
        }
        return;
      }
      if (!USE_MINIMAL_BASEMAP) {
        switchToOfflineFallback();
        return;
      }
      showMapUnavailable('Map tiles unavailable');
    }, 8000);
    const armFallbackTimer = () => {
      window.clearTimeout(startupFallbackTimer);
      startupFallbackTimer = window.setTimeout(() => {
        if (!fallbackStylePending) return;
        if (USE_LOCAL_BASEMAP) {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          fallbackStylePending = true;
          setPerfTileSource('minimal');
          try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {
            showMapUnavailable('Map tiles unavailable');
          }
          return;
        }
        showMapUnavailable('Map tiles unavailable');
      }, 5000);
    };
    const switchToOfflineFallback = () => {
      if (!map || fallbackStylePending || USE_LOCAL_BASEMAP || USE_MINIMAL_BASEMAP) return;
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      fallbackStylePending = true;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      armFallbackTimer();
      try {
        map.setStyle(buildStyle(IS_DARK));
      } catch (_) {
        if (USE_LOCAL_BASEMAP) {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          setPerfTileSource('minimal');
          map.setStyle(buildMinimalOfflineStyle(IS_DARK));
        }
      }
    };
    // Re-fit globe zoom on container resize so the sphere keeps matching the
    // viewport. Mercator mode stays put (user may have panned).
    // Intentionally no auto zoom-reset on resize: once the user (or apply_state)
    // has set a viewport we must not clobber it. Use window.ACG.fitGlobe()
    // explicitly if you want to re-centre the sphere in the current viewport.
    map.addControl(new maplibregl.NavigationControl({
      // The compass is intentionally hidden in the product CSS. Do not mount
      // its camera listeners and per-frame DOM transform work.
      showCompass: false,
    }), 'top-left');
    map.on('style.load', () => {
      const firstStyleLoad = !mapReady;
      window.clearTimeout(startupFallbackTimer);
      fallbackStylePending = false;
      applyVectorBasemapStyle();
      ensureEclipseLayers();
      ensureAsterismLayer();
      ensureAcgLayers();
      loadPlaceLabels();
      if (map && typeof map.once === 'function') {
        map.once('idle', () => {
          schedulePlaceLabelsRender('idle');
          scheduleCityLabelsRefresh('idle');
        });
      }
      if (firstStyleLoad) {
        // Force-apply the currently selected projection at first render.
        // Some environments initialise MapLibre in an interim projection;
        // this must not overwrite a user click made while the style loads.
        try { map.setProjection({ type: selectedProjection }); } catch (_) {}
        if (selectedProjection === 'globe') {
          map.jumpTo({ zoom: globeZoomForViewport() });
        }
      }
      applyPendingCamera();
      if (pendingData) { currentData = pendingData; pendingData = null; }
      if (ACTIVE_ASTROCART_STYLE) {
        applyDisplayStyle(ACTIVE_ASTROCART_STYLE, false);
      }
      let fitPendingEclipse = false;
      if (pendingEclipseData) {
        currentEclipseData = pendingEclipseData;
        pendingEclipseData = null;
        fitPendingEclipse = true;
      }
      if (pendingAsterismData) {
        currentAsterismData = pendingAsterismData;
        pendingAsterismData = null;
      }
      pushData();
      pushAsterismData();
      pushEclipseData({ fit: fitPendingEclipse });
      mapReady = true;
      postToParent({ type: 'ready' });
      if (firstStyleLoad) {
        perfState.mapLoadMs = perfNow() - perfStartedAt;
        postPerfSnapshot('map-ready');
      }
      revealMapAfterStyledPaint();
      setStatus(`${(currentData.features || []).length} lines loaded`);
      if (firstStyleLoad) scheduleOnlineBasemapAdoption();
    });
    for (const layer of [
      'acg-lines-solid',
      'acg-lines-dashed',
      'acg-local-space-oppositions',
      'acg-aspects',
      'acg-zeniths',
    ]) {
      map.on('click', layer, onLineClick);
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    }
    for (const layer of ['eclipse-path-shadow', 'eclipse-path-fill', 'eclipse-path-limits', 'eclipse-path-center', 'eclipse-path-max']) {
      map.on('click', layer, onEclipseClick);
      map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
    }
    setAsterismHoverEnabled(true);
    map.on('mouseleave', () => hideAsterismStarPopup());
    map.on('error', (event) => {
      if (fallbackStylePending) {
        // Ignore late errors from the abandoned online style. A confirmed
        // failure from our PMTiles source falls through to the bundled-data
        // minimal style; the timer covers source-less/ambiguous failures.
        if (USE_LOCAL_BASEMAP && event && event.sourceId === 'protomaps') {
          USE_LOCAL_BASEMAP = false;
          USE_MINIMAL_BASEMAP = true;
          setPerfTileSource('minimal');
          armFallbackTimer();
          try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        }
        return;
      }
      if (USE_LOCAL_BASEMAP && event && event.sourceId === 'protomaps') {
        USE_LOCAL_BASEMAP = false;
        USE_MINIMAL_BASEMAP = true;
        fallbackStylePending = true;
        setPerfTileSource('minimal');
        armFallbackTimer();
        try { map.setStyle(buildMinimalOfflineStyle(IS_DARK)); } catch (_) {}
        return;
      }
      if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP) {
        const sourceId = String(event && event.sourceId || '');
        // Once the online style has loaded, keep it. Individual tile/glyph
        // errors and style-validation warnings must never replace the online
        // design with the deliberately sparse emergency map. Only a confirmed
        // failure from one of the online basemap sources may trigger fallback.
        if (!mapReady && ONLINE_BASEMAP_SOURCE_IDS.has(sourceId)) switchToOfflineFallback();
      }
    });
    map.on('contextmenu', onMapContextMenu);
    map.on('click', hideContextMenu);
    map.on('render', () => {
      if (ACG_PERF_MODE) recordRenderFrame();
      renderPolarOverlay();
    });
    map.on('movestart', () => {
      beginDomAcgMovement(beginMapMotion('move'));
    });
    map.on('zoomstart', () => {
      beginDomAcgMovement(beginMapMotion('zoom'));
    });
    map.on('move', () => {
      if (ACG_PERF_MODE) perfState.moveEvents += 1;
      scheduleDomAcgLabels('move');
    });
    map.on('zoom', () => {
      if (ACG_PERF_MODE) perfState.zoomEvents += 1;
      scheduleDomAcgLabels('zoom');
    });
    map.on('resize', () => {
      if (ACG_PERF_MODE) perfState.resizeEvents += 1;
      scheduleCityLabelsRefresh('resize');
      scheduleDomAcgLabels('resize');
    });
    map.on('moveend', () => {
      const motionSettled = endMapMotion('move');
      if (motionSettled) flushRetainedRuntimeOverlayScene('moveend');
      endDomAcgMovement('moveend', motionSettled);
      if (motionSettled) scheduleCityLabelsRefresh('moveend');
      scheduleViewStatePost('moveend');
    });
    map.on('zoomend', () => {
      const motionSettled = endMapMotion('zoom');
      if (motionSettled) flushRetainedRuntimeOverlayScene('zoomend');
      endDomAcgMovement('zoomend', motionSettled);
      if (motionSettled) scheduleCityLabelsRefresh('zoomend');
    });
    wireControlsOnce();
    setStatus('map ready');
  }

  function revealMapAfterStyledPaint() {
    const mapEl = document.getElementById('map');
    if (!mapEl || !mapEl.classList.contains('map-booting')) return;
    const reveal = () => {
      mapEl.classList.remove('map-booting');
      mapPresented = true;
      postToParent({ type: 'presented' });
    };
    if (map && typeof map.once === 'function') {
      let rendered = 0;
      const afterRender = () => {
        rendered += 1;
        if (rendered < 2) {
          map.once('render', afterRender);
          if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
          return;
        }
        window.requestAnimationFrame(reveal);
      };
      map.once('render', afterRender);
      if (typeof map.triggerRepaint === 'function') map.triggerRepaint();
      return;
    }
    window.requestAnimationFrame(reveal);
  }

  function hideMapUntilStyledPaint() {
    const mapEl = document.getElementById('map');
    if (mapEl) mapEl.classList.add('map-booting');
  }

  function showMapUnavailable(message) {
    setPerfTileSource('none');
    postPerfSnapshot('map-unavailable');
    const container = document.getElementById('map');
    if (container) {
      container.classList.remove('map-booting');
      container.innerHTML = `<div style="padding:14px;color:var(--chrome-dim);font-size:12px">${message}</div>`;
    }
    mapPresented = true;
    postToParent({ type: 'presented' });
    setStatus(message);
  }

  function bootMap() {
    if (URL_THEME.get('offline') === '1') {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
      USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
      setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
      setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
      initMap();
      return;
    }
    // Fetch the provider style ourselves so its light default background never
    // reaches MapLibre. buildStyle() themes this cached object before the WebGL
    // map exists, keeping the first globe frame native to the active theme.
    USE_LOCAL_BASEMAP = false;
    USE_MINIMAL_BASEMAP = false;
    onlineBasemapAdopted = true;
    pendingOnlineBasemapStyle = null;
    setPerfTileSource('online');
    setStatus('loading map…');
    loadBaseVectorStyle(8000)
      .then(() => initMap())
      .catch(() => {
        USE_LOCAL_BASEMAP = !!LOCAL_VECTOR_TILE_URL;
        USE_MINIMAL_BASEMAP = !USE_LOCAL_BASEMAP;
        onlineBasemapAdopted = false;
        setPerfTileSource(USE_LOCAL_BASEMAP ? 'local' : 'minimal');
        setStatus(USE_LOCAL_BASEMAP ? 'loading offline map…' : 'map ready');
        initMap();
      });
  }

  function ensureEclipseLayers() {
    if (!map.getSource(ECLIPSE_SOURCE_ID)) {
      map.addSource(ECLIPSE_SOURCE_ID, { type: 'geojson', data: currentMapEclipseData });
    }
    const s = currentDevSettings();
    if (!map.getLayer('eclipse-path-shadow')) {
      map.addLayer({
        id: 'eclipse-path-shadow',
        type: 'line',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_SHADOW'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
        },
        paint: {
          'line-color': s.eclipseShadowColor,
          'line-opacity': s.eclipseShadowOpacity,
          'line-blur': s.eclipseShadowBlur,
          'line-width': s.eclipseShadowWidth,
        },
      });
    }
    if (!map.getLayer('eclipse-path-fill')) {
      map.addLayer({
        id: 'eclipse-path-fill',
        type: 'fill',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_PATH'],
        paint: {
          'fill-color': s.eclipseShadowColor,
          'fill-opacity': s.eclipseFillOpacity,
        },
      });
    }
    if (!map.getLayer('eclipse-path-outline')) {
      map.addLayer({
        id: 'eclipse-path-outline',
        type: 'line',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_PATH'],
        paint: {
          'line-color': s.eclipseOutlineColor,
          'line-width': s.eclipseOutlineWidth,
          'line-opacity': s.eclipseOutlineOpacity,
        },
      });
    }
    if (!map.getLayer('eclipse-path-limits')) {
      map.addLayer({
        id: 'eclipse-path-limits',
        type: 'line',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_LIMIT'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
        },
        paint: {
          'line-color': s.eclipseOutlineColor,
          'line-width': s.eclipseLimitWidth,
          'line-opacity': s.eclipseLimitOpacity,
          'line-dasharray': [s.eclipseLimitDashOn, s.eclipseLimitDashOff],
        },
      });
    }
    if (!map.getLayer('eclipse-path-center')) {
      map.addLayer({
        id: 'eclipse-path-center',
        type: 'line',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_CENTER'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
        },
        paint: {
          'line-color': s.eclipseCenterColor,
          'line-width': s.eclipseCenterWidth,
          'line-opacity': s.eclipseCenterOpacity,
        },
      });
    }
    if (!map.getLayer('eclipse-path-max')) {
      map.addLayer({
        id: 'eclipse-path-max',
        type: 'circle',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_MAX'],
        paint: {
          'circle-color': s.eclipseCenterColor,
          'circle-radius': s.eclipseMaximumRadius,
          'circle-stroke-color': s.eclipseHaloColor,
          'circle-stroke-width': s.eclipseMaximumStrokeWidth,
        },
      });
    }
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getLayer('eclipse-path-label')) {
      map.addLayer({
        id: 'eclipse-path-label',
        type: 'symbol',
        source: ECLIPSE_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ECLIPSE_MAX'],
        layout: {
          'text-field': ['get', 'label'],
          'text-font': ['Noto Sans Regular'],
          'text-size': s.eclipseLabelSize,
          'text-letter-spacing': s.eclipseLabelSpacing,
          'text-offset': [0, 1.2],
          'text-anchor': 'top',
        },
        paint: {
          'text-color': s.eclipseCenterColor,
          'text-halo-color': s.eclipseHaloColor,
          'text-halo-width': s.eclipseLabelHaloWidth,
          'text-opacity': s.eclipseLabelOpacity,
        },
      });
    }
    raiseAcgLayers();
  }

  function acgLineColorExpression(s) {
    return [
      'case',
      ['has', 'color'], ['get', 'color'],
      ['match', ['get', 'kind'],
        'MC', s.fallbackMcColor,
        'IC', s.fallbackIcColor,
        'ASC', s.fallbackAscColor,
        'DSC', s.fallbackDscColor,
        s.fallbackUnknownColor,
      ],
    ];
  }

  function scaledPointLineMetric(baseValue, property) {
    return ['*', baseValue, ['number', ['get', property], 1]];
  }

  function acgLayerOpacityScaleExpression(settings = currentDevSettings()) {
    return [
      'match',
      ['coalesce', ['get', 'astrocart_layer'], 'natal'],
      'transit', settings.transitLayerOpacity,
      'progression', settings.progressionLayerOpacity,
      1,
    ];
  }

  function acgLayerOpacityScale(properties) {
    const settings = currentDevSettings();
    const role = normalizedAcgLayerRole(properties);
    if (role === 'transit') return settings.transitLayerOpacity;
    if (role === 'progression') return settings.progressionLayerOpacity;
    return 1;
  }

  function scaledPointLayerOpacity(baseValue, property) {
    return [
      '*',
      baseValue,
      ['number', ['get', property], 1],
      acgLayerOpacityScaleExpression(),
    ];
  }

  function localizedTechniqueLabelExpression() {
    const labels = uiLabels.techniqueLabels && typeof uiLabels.techniqueLabels === 'object'
      ? uiLabels.techniqueLabels
      : {};
    const fallback = [
      'case',
      ['==', ['get', 'astrocart_layer'], 'transit'],
      String(uiLabels.transitLayer || ''),
      ['==', ['get', 'astrocart_layer'], 'progression'],
      String(uiLabels.progressionLayer || ''),
      '',
    ];
    const expression = ['match', ['coalesce', ['get', 'astrocart_technique'], '']];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(fallback);
    return expression.length > 3 ? expression : fallback;
  }

  function acgLayerPrefixExpression() {
    const techniqueLabel = localizedTechniqueLabelExpression();
    return [
      'case',
      ['!=', techniqueLabel, ''],
      ['concat', '[', techniqueLabel, '] '],
      [
        'all',
        ['has', 'layer_label'],
        ['!=', ['get', 'layer_label'], ''],
      ],
      ['concat', '[', ['get', 'layer_label'], '] '],
      '',
    ];
  }

  function localizedPointLabelExpression(pointProperty, labelProperty) {
    const labels = uiLabels.pointLabels && typeof uiLabels.pointLabels === 'object'
      ? uiLabels.pointLabels
      : {};
    const fallback = [
      'coalesce',
      ['get', labelProperty || 'label'],
      ['get', pointProperty || 'point'],
      '',
    ];
    const expression = ['match', ['coalesce', ['get', pointProperty || 'point'], '']];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(fallback);
    return expression.length > 3 ? expression : fallback;
  }

  function localizedPointLabel(properties, pointProperty = 'point', labelProperty = 'label') {
    const p = properties || {};
    const labels = uiLabels.pointLabels && typeof uiLabels.pointLabels === 'object'
      ? uiLabels.pointLabels
      : {};
    const pointId = String(p[pointProperty] || '');
    return String(labels[pointId] || p[labelProperty] || pointId || '').trim();
  }

  function localizedAspectLabelExpression() {
    const labels = uiLabels.aspectLabels && typeof uiLabels.aspectLabels === 'object'
      ? uiLabels.aspectLabels
      : {};
    const expression = [
      'match',
      ['coalesce', ['get', 'aspect_key'], ['get', 'aspect_id'], ''],
    ];
    for (const [key, label] of Object.entries(labels)) {
      if (!key || !label) continue;
      expression.push(String(key), String(label));
    }
    expression.push(['coalesce', ['get', 'aspect_name'], String(uiLabels.aspect || ''), '']);
    return expression.length > 3
      ? expression
      : ['coalesce', ['get', 'aspect_name'], String(uiLabels.aspect || ''), ''];
  }

  function localizedAspectLabel(properties) {
    const p = properties || {};
    const labels = uiLabels.aspectLabels && typeof uiLabels.aspectLabels === 'object'
      ? uiLabels.aspectLabels
      : {};
    const key = String(p.aspect_key || p.aspect_id || '');
    return String(labels[key] || labels[String(p.aspect_id || '')] || uiLabels.aspect || '');
  }

  function acgLineLabelExpression() {
    const baseLabel = localizedPointLabelExpression('point', 'label');
    const localSpaceLabel = [
      'concat',
      baseLabel,
      ' ',
      [
        'coalesce',
        ['get', 'bearing_label'],
        ['to-string', ['get', 'source_bearing']],
        '',
      ],
    ];
    const localSpaceOppositionLabel = [
      'concat',
      localSpaceLabel,
      uiLabels.localSpaceOpposition ? ` ${uiLabels.localSpaceOpposition}` : '',
    ];
    const aspectLabel = [
      'concat',
      baseLabel,
      ' ',
      localizedAspectLabelExpression(),
      ' ',
      ['coalesce', ['get', 'target_angle'], ''],
    ];
    return [
      'concat',
      acgLayerPrefixExpression(),
      [
        'case',
        ['==', ['get', 'kind'], 'LOCAL_SPACE'],
        localSpaceLabel,
        ['==', ['get', 'kind'], 'LOCAL_SPACE_OPPOSITION'],
        localSpaceOppositionLabel,
        ['==', ['get', 'kind'], 'ASPECT'],
        aspectLabel,
        ['concat', baseLabel, ' ', ['get', 'kind']],
      ],
    ];
  }

  function acgZenithLabelExpression() {
    return [
      'concat',
      acgLayerPrefixExpression(),
      localizedPointLabelExpression('point', 'label'),
      uiLabels.zenith ? ` ${uiLabels.zenith}` : '',
    ];
  }

  function acgParanLabelExpression() {
    return [
      'concat',
      acgLayerPrefixExpression(),
      localizedPointLabelExpression('a_point', 'a_label'),
      ' ',
      ['coalesce', ['get', 'a_angle'], ''],
      ' × ',
      localizedPointLabelExpression('b_point', 'b_label'),
      ' ',
      ['coalesce', ['get', 'b_angle'], ''],
    ];
  }

  function asterismStarRadiusExpression(settings) {
    return [
      'interpolate', ['exponential', 1.35],
      ['number', ['get', 'magnitude'], 6.7],
      -1.5, settings.asterismStarRadiusMax,
      6.7, settings.asterismStarRadiusMin,
    ];
  }

  function asterismStarRadius(magnitude, settings) {
    const value = typeof magnitude === 'number' && Number.isFinite(magnitude)
      ? magnitude
      : 6.7;
    const maximum = Number(settings.asterismStarRadiusMax);
    const minimum = Number(settings.asterismStarRadiusMin);
    if (value <= -1.5) return maximum;
    if (value >= 6.7) return minimum;
    const factor = (Math.pow(1.35, value + 1.5) - 1) / (Math.pow(1.35, 8.2) - 1);
    return maximum + (minimum - maximum) * factor;
  }

  function hideAsterismStarPopup(mode = '') {
    if (mode && asterismStarPopupMode !== mode) return;
    if (asterismStarPopup) asterismStarPopup.remove();
    asterismStarPopupMode = '';
    if (map) map.getCanvas().style.cursor = '';
  }

  function showAsterismStarPopup(name, coordinate, mode) {
    if (!map || !name) {
      hideAsterismStarPopup();
      return;
    }
    if (!asterismStarPopup) {
      asterismStarPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 9,
      });
    }
    asterismStarPopupMode = mode;
    asterismStarPopup
      .setLngLat(coordinate)
      .setText(name)
      .addTo(map);
    map.getCanvas().style.cursor = 'pointer';
  }

  function onAsterismStarEnter() {
    if (map) map.getCanvas().style.cursor = 'pointer';
  }

  function onAsterismStarLeave() {
    hideAsterismStarPopup('native');
  }

  function setAsterismHoverEnabled(enabled) {
    if (!map || asterismHoverEnabled === enabled) return;
    const action = enabled ? 'on' : 'off';
    map[action]('mousemove', 'acg-asterism-star-hit', onAsterismStarMove);
    map[action]('mouseenter', 'acg-asterism-star-hit', onAsterismStarEnter);
    map[action]('mouseleave', 'acg-asterism-star-hit', onAsterismStarLeave);
    map[action]('mousemove', onPolarAsterismStarMove);
    asterismHoverEnabled = enabled;
    if (!enabled) {
      hideAsterismStarPopup();
      map.getCanvas().style.cursor = '';
    }
  }

  function beginMapMotion(phase) {
    const burstStarted = activeMapMotionPhases.size === 0;
    activeMapMotionPhases.add(phase);
    if (burstStarted) {
      if (ACG_PERF_MODE) perfLastRenderAt = perfNow();
      setAsterismHoverEnabled(false);
    }
    return burstStarted;
  }

  function endMapMotion(phase) {
    const phaseEnded = activeMapMotionPhases.delete(phase);
    const burstSettled = phaseEnded && activeMapMotionPhases.size === 0;
    if (burstSettled) {
      if (ACG_PERF_MODE) perfLastRenderAt = 0;
      setAsterismHoverEnabled(true);
    }
    return burstSettled;
  }

  function onAsterismStarMove(event) {
    const feature = event.features && event.features[0];
    const name = String(feature && feature.properties && feature.properties.name || '').trim();
    showAsterismStarPopup(name, event.lngLat, 'native');
  }

  function onPolarAsterismStarMove(event) {
    if (
      !map || !mapHostActive || selectedProjection !== 'globe' ||
      activeMapMotionPhases.size > 0 ||
      !viewOptions.asterisms || !event || !event.point
    ) {
      hideAsterismStarPopup('polar');
      return;
    }
    let nearest = null;
    let nearestDistanceSquared = 64;
    for (const target of polarAsterismStarHitTargets) {
      const dx = Number(event.point.x) - target.point.x;
      const dy = Number(event.point.y) - target.point.y;
      const distanceSquared = dx * dx + dy * dy;
      if (distanceSquared <= nearestDistanceSquared) {
        nearest = target;
        nearestDistanceSquared = distanceSquared;
      }
    }
    if (!nearest) {
      hideAsterismStarPopup('polar');
      return;
    }
    const name = String(nearest.properties.name || '').trim();
    if (!name) {
      hideAsterismStarPopup('polar');
      return;
    }
    showAsterismStarPopup(name, nearest.coordinate, 'polar');
  }

  function referenceBehavior() {
    return ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.behavior || {};
  }

  function normalizedAcgLayerRole(properties) {
    const role = String(properties && properties.astrocart_layer || '').trim().toLowerCase();
    return role || 'natal';
  }

  function normalizedAcgTechnique(properties) {
    const technique = String(properties && properties.astrocart_technique || '').trim().toLowerCase();
    return technique || 'natal';
  }

  function normalizedVisibilitySelection(value) {
    if (value == null) return null;
    const raw = Array.isArray(value)
      ? value
      : (typeof value === 'object'
        ? Object.entries(value).filter((entry) => !!entry[1]).map((entry) => entry[0])
        : [value]);
    return [...new Set(raw.map((item) => String(item).trim().toLowerCase()).filter(Boolean))];
  }

  function visibilitySelectionMatches(selection, values) {
    if (selection == null) return true;
    const normalized = values
      .map((value) => String(value == null ? '' : value).trim().toLowerCase())
      .filter(Boolean);
    return normalized.some((value) => selection.includes(value));
  }

  function isAcgLayerRoleVisible(properties, options = viewOptions) {
    const role = normalizedAcgLayerRole(properties);
    if (role === 'transit') return !!options.layers.transit;
    if (role === 'progression') return !!options.layers.progression;
    if (role === 'natal' || role === 'current') return !!options.layers.natal;
    return false;
  }

  function acgSelectionFilter(propertyNames, selection, fallback = '') {
    if (selection == null) return null;
    if (!selection.length) return ['==', ['get', propertyNames[0]], '__aries_hidden_selection__'];
    const candidates = propertyNames.map((propertyName) => [
      'match',
      ['downcase', ['to-string', ['coalesce', ['get', propertyName], fallback]]],
      selection,
      true,
      false,
    ]);
    return candidates.length === 1 ? candidates[0] : ['any', ...candidates];
  }

  function acgAttributeVisibilityFilter(options = viewOptions) {
    const filters = [];
    for (const filter of [
      acgSelectionFilter(['point', 'a_point', 'b_point'], options.filters.points),
      acgSelectionFilter(['kind'], options.filters.kinds),
      acgSelectionFilter(
        ['astrocart_technique'],
        options.filters.techniques,
        'natal',
      ),
    ]) {
      if (filter) filters.push(filter);
    }
    const aspectFilter = acgSelectionFilter(
      ['aspect_id', 'aspect_key', 'aspect_name', 'aspect_angle'],
      options.filters.aspects,
    );
    if (aspectFilter) {
      filters.push([
        'any',
        ['!=', ['get', 'kind'], 'ASPECT'],
        aspectFilter,
      ]);
    }
    if (!filters.length) return null;
    return ['all', ...filters];
  }

  function acgLayerRoleFilter(options = viewOptions) {
    const filters = [];
    if (options.layers.natal) {
      filters.push([
        'any',
        ['!', ['has', 'astrocart_layer']],
        ['==', ['get', 'astrocart_layer'], ''],
        ['==', ['get', 'astrocart_layer'], 'natal'],
        ['==', ['get', 'astrocart_layer'], 'current'],
      ]);
    }
    if (options.layers.transit) {
      filters.push(['==', ['get', 'astrocart_layer'], 'transit']);
    }
    if (options.layers.progression) {
      filters.push(['==', ['get', 'astrocart_layer'], 'progression']);
    }
    if (!filters.length) return ['==', ['get', 'astrocart_layer'], '__aries_hidden_layer__'];
    if (filters.length === 1) return filters[0];
    return ['any', ...filters];
  }

  function acgKindFilter(geometryType, kinds, options = viewOptions) {
    const kindFilter = kinds.length
      ? ['match', ['get', 'kind'], kinds, true, false]
      : ['==', ['get', 'kind'], '__aries_hidden_kind__'];
    const filters = [
      'all',
      ['==', ['geometry-type'], geometryType],
      kindFilter,
      acgLayerRoleFilter(options),
    ];
    const attributeFilter = acgAttributeVisibilityFilter(options);
    if (attributeFilter) filters.push(attributeFilter);
    return filters;
  }

  function ascendantOverlayFilter(baseFilter) {
    if (referenceBehavior().showAscCircle) return baseFilter;
    return [
      'all',
      baseFilter,
      ['!=', ['get', 'point'], NATAL_ASC_POINT_ID],
    ];
  }

  function acgCasingFilter(options = viewOptions) {
    const kinds = ['MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE'];
    if (options.localSpaceOppositions) kinds.push('LOCAL_SPACE_OPPOSITION');
    if (options.aspects) kinds.push('ASPECT');
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgSolidFilter(options = viewOptions) {
    return ascendantOverlayFilter(
      acgKindFilter('LineString', ['MC', 'ASC', 'LOCAL_SPACE'], options),
    );
  }

  function acgDashedFilter(options = viewOptions) {
    return ascendantOverlayFilter(
      acgKindFilter('LineString', ['IC', 'DSC'], options),
    );
  }

  function acgLocalSpaceOppositionFilter(options = viewOptions) {
    const kinds = options.localSpaceOppositions ? ['LOCAL_SPACE_OPPOSITION'] : [];
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgAspectFilter(options = viewOptions) {
    const kinds = options.aspects ? ['ASPECT'] : [];
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function acgParanFilter(options = viewOptions) {
    return acgKindFilter('LineString', ['PARAN'], options);
  }

  function acgZenithFilter(options = viewOptions) {
    const kinds = options.zeniths ? ['ZENITH'] : [];
    return acgKindFilter('Point', kinds, options);
  }

  function acgLabelFilter(options = viewOptions) {
    const kinds = ['MC', 'IC', 'ASC', 'DSC', 'LOCAL_SPACE'];
    if (options.localSpaceOppositions) kinds.push('LOCAL_SPACE_OPPOSITION');
    if (options.aspects) kinds.push('ASPECT');
    return ascendantOverlayFilter(acgKindFilter('LineString', kinds, options));
  }

  function isAcgPropertiesVisible(props, options = viewOptions) {
    if (!isAcgLayerRoleVisible(props, options)) return false;
    if (!visibilitySelectionMatches(
      options.filters.points,
      [props.point, props.a_point, props.b_point],
    )) return false;
    if (!visibilitySelectionMatches(options.filters.kinds, [props.kind])) return false;
    if (
      props.kind === 'ASPECT' &&
      !visibilitySelectionMatches(
        options.filters.aspects,
        [props.aspect_id, props.aspect_key, props.aspect_name, props.aspect_angle],
      )
    ) return false;
    if (!visibilitySelectionMatches(
      options.filters.techniques,
      [normalizedAcgTechnique(props)],
    )) return false;
    if (props.point === NATAL_ASC_POINT_ID && !referenceBehavior().showAscCircle) return false;
    if (props.kind === 'LOCAL_SPACE_OPPOSITION') return !!options.localSpaceOppositions;
    if (props.kind === 'ASPECT') return !!options.aspects;
    if (props.kind === 'ZENITH') return !!options.zeniths;
    return true;
  }

  function isAcgFeatureVisible(feature, options = viewOptions) {
    const props = feature && feature.properties || {};
    return isAcgPropertiesVisible(props, options);
  }

  function syncAcgLineVisibility() {
    if (!map) return;
    for (const [id, filter] of [
      ['acg-casing', acgCasingFilter()],
      ['acg-lines-solid', acgSolidFilter()],
      ['acg-lines-dashed', acgDashedFilter()],
      ['acg-local-space-oppositions', acgLocalSpaceOppositionFilter()],
      ['acg-aspects', acgAspectFilter()],
      ['acg-parans', acgParanFilter()],
      ['acg-zeniths', acgZenithFilter()],
      ['acg-labels', acgLabelFilter()],
      ['acg-zenith-labels', acgZenithFilter()],
    ]) {
      if (map.getLayer(id)) map.setFilter(id, filter);
    }
    for (const [id, visible] of [
      ['acg-local-space-oppositions', viewOptions.localSpaceOppositions],
      ['acg-aspects', viewOptions.aspects],
      ['acg-zeniths', viewOptions.zeniths],
      ['acg-zenith-labels', viewOptions.zeniths && currentDevSettings().labelsOn],
    ]) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
    }
  }

  function zodiacReferenceColor(sign, settings) {
    const style = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
      ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${sign}`];
    return style && style.color || settings.referenceZodiacGridColor;
  }

  function houseReferenceColor(house, settings) {
    if (house === 1 || house === 7) return settings.referenceAscColor;
    if (house === 4 || house === 10) return settings.referenceMcColor;
    return settings.referenceHouseGridColor;
  }

  function zodiacGridColorExpression(settings) {
    const expression = ['match', ['number', ['get', 'sign'], -1]];
    for (let sign = 0; sign < 12; sign += 1) {
      expression.push(sign, zodiacReferenceColor(sign, settings));
    }
    expression.push(settings.referenceZodiacGridColor);
    return expression;
  }

  function houseGridColorExpression(settings) {
    return [
      'match', ['number', ['get', 'house'], -1],
      1, settings.referenceAscColor,
      7, settings.referenceAscColor,
      4, settings.referenceMcColor,
      10, settings.referenceMcColor,
      settings.referenceHouseGridColor,
    ];
  }

  function houseGridOpacityExpression(settings) {
    return [
      'case',
      ['boolean', ['get', 'angle'], false],
      Math.min(1, settings.referenceGridLineOpacity * 1.45),
      settings.referenceGridLineOpacity,
    ];
  }

  function clearReferenceSignMarkers() {
    for (const marker of referenceSignMarkers) marker.remove();
    referenceSignMarkers = [];
  }

  function ensureReferenceSignFont(size) {
    if (referenceSignFontReady) return true;
    if (!referenceSignFontPromise) {
      referenceSignFontPromise = document.fonts.load(`${Math.max(12, size)}px 'Morinus'`, 'a')
        .then(() => {
          referenceSignFontReady = true;
          syncReferenceLabelMarkers();
        })
        .catch((error) => console.error('[acg-reference-font]', error));
    }
    return false;
  }

  function syncReferenceLabelMarkers() {
    clearReferenceSignMarkers();
    if (!map) return;
    const behavior = referenceBehavior();
    const s = currentDevSettings();
    if (!ensureReferenceSignFont(Math.max(s.referenceSignSize, s.referencePoleSignSize))) return;
    for (const feature of currentAsterismData.features || []) {
      const props = feature && feature.properties || {};
      const geometry = feature && feature.geometry || {};
      const coordinates = geometry.coordinates;
      const isEclipticSign = props.kind === 'REFERENCE_ZODIAC_SIGN' && !!behavior.showEcliptic;
      const isPoleSign = props.kind === 'REFERENCE_ZODIAC_POLE_SIGN' && !!behavior.showZodiacLines;
      const isHouseNumber = props.kind === 'REFERENCE_HOUSE_POLE_LABEL' && !!behavior.showHouseLines;
      if (
        !(isEclipticSign || isPoleSign || isHouseNumber) ||
        geometry.type !== 'Point' ||
        !Array.isArray(coordinates) ||
        coordinates.length < 2 ||
        !Number.isFinite(coordinates[0]) ||
        !Number.isFinite(coordinates[1])
      ) continue;
      const element = document.createElement('span');
      let halo = s.referenceSignHaloWidth;
      if (isHouseNumber) {
        element.className = 'acg-reference-house-number';
        element.textContent = String(props.label || props.house || '');
        element.style.fontSize = `${s.referencePoleHouseSize}px`;
        element.style.color = houseReferenceColor(Number(props.house), s);
        element.style.opacity = String(s.referencePoleLabelOpacity);
        halo = s.referencePoleLabelHaloWidth;
      } else {
        const signStyle = ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.points &&
          ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${props.sign}`];
        const glyph = signStyle && signStyle.glyphMorinus || props.glyph;
        if (!glyph) continue;
        element.className = isPoleSign ? 'acg-reference-pole-sign' : 'acg-reference-sign';
        element.textContent = String(glyph);
        element.style.fontSize = `${isPoleSign ? s.referencePoleSignSize : s.referenceSignSize}px`;
        element.style.color = zodiacReferenceColor(Number(props.sign), s);
        element.style.opacity = String(isPoleSign ? s.referencePoleLabelOpacity : s.referenceSignOpacity);
        halo = isPoleSign ? s.referencePoleLabelHaloWidth : s.referenceSignHaloWidth;
      }
      halo = Math.max(0.5, Number(halo) || 0.5);
      element.style.textShadow = `0 0 ${halo}px ${s.labelHalo}, 0 0 ${halo * 3}px ${s.labelHalo}`;
      const visibleOpacity = element.style.opacity || '1';
      // A newly attached DOM marker is painted before MapLibre's first globe
      // occlusion pass. Start transparent so far-side replacements cannot flash
      // through the sphere while a house-system refresh rebuilds this payload.
      element.style.opacity = '0';
      const marker = new maplibregl.Marker({
        element,
        anchor: 'center',
        opacity: visibleOpacity,
        opacityWhenCovered: '0',
      })
        .setLngLat(coordinates)
        .addTo(map);
      // Force the first occlusion decision synchronously after attachment;
      // otherwise MapLibre defers it until its next marker update.
      marker.setOpacity(visibleOpacity, '0');
      referenceSignMarkers.push(marker);
    }
  }

  function syncReferenceVisibility() {
    const behavior = referenceBehavior();
    const visibility = {
      'acg-reference-house-lines': !!behavior.showHouseLines,
      'acg-reference-zodiac-lines': !!behavior.showZodiacLines,
      'acg-reference-ecliptic': !!behavior.showEcliptic,
      'acg-reference-zodiac-ticks': !!behavior.showEcliptic,
      'acg-reference-equator': !!behavior.showEquator,
      'acg-reference-asc': !!behavior.showAscCircle,
      'acg-reference-mc': !!behavior.showMcCircle,
    };
    for (const [id, visible] of Object.entries(visibility)) {
      if (map && map.getLayer(id)) {
        map.setLayoutProperty(id, 'visibility', visible ? 'visible' : 'none');
      }
    }
    syncAcgLineVisibility();
    syncReferenceLabelMarkers();
  }

  function ensureAsterismLayer() {
    if (!map.getSource(ASTERISM_SOURCE_ID)) {
      map.addSource(ASTERISM_SOURCE_ID, { type: 'geojson', data: currentMapAsterismData });
    }
    const s = currentDevSettings();
    const visibility = viewOptions.asterisms ? 'visible' : 'none';
    const behavior = referenceBehavior();
    const addReferenceLine = (
      id, kind, color, visible, dash, widthScale = 1.0,
      baseWidth = s.referenceLineWidth, opacity = s.referenceLineOpacity,
    ) => {
      if (map.getLayer(id)) return;
      const paint = {
        'line-color': color,
        'line-width': baseWidth * widthScale,
        'line-opacity': opacity,
      };
      if (dash) paint['line-dasharray'] = dash;
      map.addLayer({
        id,
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], kind],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility: visible ? 'visible' : 'none',
        },
        paint,
      });
    };
    // Establish the simple angle circles first. A malformed optional grid
    // expression must never prevent the independently enabled ASC/DSC horizon
    // or MC/IC meridian from being created during a style replay.
    addReferenceLine(
      'acg-reference-ecliptic', 'REFERENCE_ECLIPTIC',
      s.referenceEclipticColor, !!behavior.showEcliptic, null, 1.25,
    );
    addReferenceLine(
      'acg-reference-zodiac-ticks', 'REFERENCE_ZODIAC_TICK',
      s.referenceEclipticColor, !!behavior.showEcliptic, null, 0.8,
    );
    addReferenceLine(
      'acg-reference-equator', 'REFERENCE_EQUATOR',
      s.referenceEquatorColor, !!behavior.showEquator, [2, 2],
    );
    addReferenceLine(
      'acg-reference-asc', 'REFERENCE_ASC',
      s.referenceAscColor, !!behavior.showAscCircle,
    );
    addReferenceLine(
      'acg-reference-mc', 'REFERENCE_MC',
      s.referenceMcColor, !!behavior.showMcCircle,
    );
    addReferenceLine(
      'acg-reference-house-lines', 'REFERENCE_HOUSE_LINE',
      houseGridColorExpression(s), !!behavior.showHouseLines,
      null, 1.0, s.referenceGridLineWidth, houseGridOpacityExpression(s),
    );
    addReferenceLine(
      'acg-reference-zodiac-lines', 'REFERENCE_ZODIAC_LINE',
      zodiacGridColorExpression(s), !!behavior.showZodiacLines,
      null, 1.0, s.referenceGridLineWidth, s.referenceGridLineOpacity,
    );
    if (!map.getLayer('acg-asterism-shadow')) {
      map.addLayer({
        id: 'acg-asterism-shadow',
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility,
        },
        paint: {
          'line-color': s.asterismShadowColor,
          'line-width': s.asterismLineWidth + (s.asterismShadowSpread * 2),
          'line-opacity': s.asterismShadowOpacity,
          'line-blur': s.asterismShadowBlur,
        },
      });
    }
    if (!map.getLayer('acg-asterisms')) {
      map.addLayer({
        id: 'acg-asterisms',
        type: 'line',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM'],
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          visibility,
        },
        paint: {
          'line-color': s.asterismHighlightColor,
          'line-width': s.asterismLineWidth,
          'line-opacity': s.asterismLineOpacity,
        },
      });
    }
    if (!map.getLayer('acg-asterism-star-shadow')) {
      map.addLayer({
        id: 'acg-asterism-star-shadow',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': s.asterismShadowColor,
          'circle-radius': ['+', asterismStarRadiusExpression(s), s.asterismShadowSpread],
          'circle-opacity': s.asterismShadowOpacity,
          'circle-blur': s.asterismShadowBlur,
        },
      });
    }
    if (!map.getLayer('acg-asterism-stars')) {
      map.addLayer({
        id: 'acg-asterism-stars',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': s.asterismHighlightColor,
          'circle-radius': asterismStarRadiusExpression(s),
          'circle-opacity': s.asterismStarOpacity,
          'circle-stroke-color': s.asterismShadowColor,
          'circle-stroke-width': s.asterismShadowSpread,
          'circle-stroke-opacity': s.asterismStarOpacity,
        },
      });
    }
    if (!map.getLayer('acg-asterism-star-hit')) {
      map.addLayer({
        id: 'acg-asterism-star-hit',
        type: 'circle',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_STAR'],
        layout: { visibility },
        paint: {
          'circle-color': 'rgba(0,0,0,0)',
          'circle-radius': 8,
        },
      });
    }
    if (!map.getLayer('acg-asterism-labels')) {
      map.addLayer({
        id: 'acg-asterism-labels',
        type: 'symbol',
        source: ASTERISM_SOURCE_ID,
        filter: ['==', ['get', 'kind'], 'ASTERISM_LABEL'],
        layout: {
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Regular'],
          'text-size': s.asterismLabelSize,
          'text-letter-spacing': s.asterismLabelSpacing,
          'text-anchor': 'center',
          'text-padding': 2,
          'symbol-sort-key': ['get', 'rank'],
          visibility,
        },
        paint: {
          'text-color': s.asterismHighlightColor,
          'text-halo-color': s.asterismShadowColor,
          'text-halo-width': s.asterismLabelHaloWidth,
          'text-halo-blur': s.asterismShadowBlur,
          'text-opacity': s.asterismLabelOpacity,
        },
      });
    }
  }

  function ensureAcgLayers() {
    if (!map.getSource(ACG_SOURCE_ID)) {
      map.addSource(ACG_SOURCE_ID, { type: 'geojson', data: currentMapData });
    }
    // Keep online line labels on the parallel source used by HEAD. Attaching a
    // line-placed symbol layer to the shared source can blank Liberty's lines.
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getSource(ACG_LABEL_SOURCE_ID)) {
      map.addSource(ACG_LABEL_SOURCE_ID, { type: 'geojson', data: currentMapData });
    }
    // Thin neutral outline so colored lines stay readable without looking heavy.
    // Filter excludes parans — they have their own (off-by-default) style.
    const t = currentThemeTokens();
    const s = currentDevSettings();
    const colorExpr = acgLineColorExpression(s);
    if (!map.getLayer('acg-casing')) {
      map.addLayer({
        id: 'acg-casing',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgCasingFilter(),
        paint: {

        },
      });
    }
    if (!map.getLayer('acg-lines-solid')) {
      map.addLayer({

        source: ACG_SOURCE_ID,

        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(s.solidWidth, 'line_width_scale'),
          'line-opacity': scaledPointLayerOpacity(s.solidOpacity, 'line_opacity'),

    if (!map.getLayer('acg-lines-dashed')) {
      map.addLayer({
        id: 'acg-lines-dashed',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgDashedFilter(),
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(s.dashedWidth, 'line_width_scale'),
          'line-opacity': scaledPointLayerOpacity(s.dashedOpacity, 'line_opacity'),
          'line-dasharray': [s.dashedOn, s.dashedOff],
        },
      });
    }
    if (!map.getLayer('acg-local-space-oppositions')) {
      map.addLayer({
        id: 'acg-local-space-oppositions',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgLocalSpaceOppositionFilter(),
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          'visibility': viewOptions.localSpaceOppositions ? 'visible' : 'none',
        },
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(
            s.dashedWidth * s.localSpaceOppositionWidthScale,
            'line_width_scale'
          ),
          'line-opacity': scaledPointLayerOpacity(
            s.dashedOpacity * s.localSpaceOppositionOpacityScale,
            'line_opacity'
          ),
          'line-dasharray': [
            s.dashedOn * s.localSpaceOppositionDashOnScale,
            s.dashedOff * s.localSpaceOppositionDashOffScale,
          ],
        },
      });
    }
    if (!map.getLayer('acg-aspects')) {
      map.addLayer({
        id: 'acg-aspects',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgAspectFilter(),
        layout: {
          'line-cap': 'round',
          'line-join': 'round',
          'visibility': viewOptions.aspects ? 'visible' : 'none',
        },
        paint: {
          'line-color': colorExpr,
          'line-width': scaledPointLineMetric(
            s.solidWidth * s.aspectLineWidthScale,
            'line_width_scale'
          ),
          'line-opacity': scaledPointLayerOpacity(
            s.solidOpacity * s.aspectLineOpacityScale,
            'line_opacity'
          ),
          'line-dasharray': [s.aspectLineDashOn, s.aspectLineDashOff],
        },
      });
    }
    if (!map.getLayer('acg-parans')) {
      map.addLayer({
        id: 'acg-parans',
        type: 'line',
        source: ACG_SOURCE_ID,
        filter: acgParanFilter(),
        layout: {
          'visibility': viewOptions.parans ? 'visible' : 'none',
        },
        paint: {
          'line-color': t.paranColor,
          'line-width': s.paranWidth,
          'line-opacity': scaledPointLayerOpacity(s.paranOpacity, 'line_opacity'),
          'line-dasharray': [s.paranDashOn, s.paranDashOff],
        },
      });
    }
    if (!map.getLayer('acg-zeniths')) {
      map.addLayer({
        id: 'acg-zeniths',
        type: 'circle',
        source: ACG_SOURCE_ID,
        filter: acgZenithFilter(),
        layout: {
          'visibility': viewOptions.zeniths ? 'visible' : 'none',
        },
        paint: {
          'circle-color': colorExpr,
          'circle-radius': Math.max(
            s.zenithRadiusMin,
            s.solidWidth * s.zenithRadiusWidthScale
          ),
          'circle-opacity': scaledPointLayerOpacity(s.solidOpacity, 'line_opacity'),
          'circle-stroke-color': t.casing,
          'circle-stroke-width': Math.max(s.zenithStrokeWidthMin, s.casingWidth),
          'circle-stroke-opacity': scaledPointLayerOpacity(s.casingOpacity, 'line_opacity'),
        },
      });
    }
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getLayer('acg-labels')) {
      map.addLayer({
        id: 'acg-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgLabelFilter(),
        layout: {
          'symbol-placement': 'line',
          'text-font': ['Noto Sans Regular'],
          'text-field': acgLineLabelExpression(),
          'text-size': s.labelSize,
          'text-letter-spacing': s.labelSpacing,
          'text-keep-upright': true,
          'visibility': s.labelsOn ? 'visible' : 'none',

          'text-halo-color': t.labelHalo,

        },
      });
    }
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getLayer('acg-zenith-labels')) {
      map.addLayer({
        id: 'acg-zenith-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgZenithFilter(),
        layout: {
          'text-field': acgZenithLabelExpression(),
          'text-font': ['Noto Sans Regular'],
          'text-size': s.labelSize,
          'text-letter-spacing': s.labelSpacing,
          'text-anchor': 'left',
          'text-offset': [0.8, 0],

        },
        paint: {

          'text-halo-color': t.labelHalo,

        },
      });
    }
    if (!USE_LOCAL_BASEMAP && !USE_MINIMAL_BASEMAP && !map.getLayer('acg-paran-labels')) {
      map.addLayer({
        id: 'acg-paran-labels',
        type: 'symbol',
        source: ACG_LABEL_SOURCE_ID,
        filter: acgParanFilter(),
        layout: {
          'symbol-placement': 'line-center',
          'text-font': ['Noto Sans Regular'],
          'text-field': acgParanLabelExpression(),
          'text-size': s.paranLabelSize,

        },
        paint: {

          'text-halo-color': t.paranHalo,
          'text-halo-width': s.paranLabelHaloOn ? s.paranLabelHaloWidth : 0.0,
          'text-opacity': scaledPointLayerOpacity(s.paranLabelOpacity, 'line_opacity'),
        },
      });
    }
    raiseAcgLayers();
  }

  function birthplaceCoordinates(data) {
    const meta = data && data.meta || {};
    const origin = meta.origin || {};
    const lon = Number(origin.lon != null ? origin.lon : meta.lon);
    const lat = Number(origin.lat != null ? origin.lat : meta.lat);
    if (!Number.isFinite(lon) || !Number.isFinite(lat) || lat < -90 || lat > 90) return null;
    return [lon, lat];
  }

  function applyBirthplaceMarkerLabel() {
    if (!birthplaceMarkerElement) return;
    const label = String(uiLabels.birthplaceMarker || '');
    if (label) {
      birthplaceMarkerElement.setAttribute('aria-label', label);
      birthplaceMarkerElement.setAttribute('title', label);
    } else {
      birthplaceMarkerElement.removeAttribute('aria-label');
      birthplaceMarkerElement.removeAttribute('title');
    }
  }

  function updateBirthplaceDragPosition(event) {
    if (!map || !birthplaceMarker || !event) return;
    const rect = map.getContainer().getBoundingClientRect();
    const point = [event.clientX - rect.left, event.clientY - rect.top];
    try { birthplaceMarker.setLngLat(map.unproject(point)); } catch (_) {}
  }

  function finishBirthplaceDrag(event, commit) {
    const state = birthplaceDrag;
    if (!state) return;
    birthplaceDrag = null;
    if (state.timer) window.clearTimeout(state.timer);
    if (commit && state.dragging) {
      state.moved = state.moved || Math.hypot(
        event.clientX - state.startX,
        event.clientY - state.startY,
      ) > 1;
      updateBirthplaceDragPosition(event);
    }
    if (birthplaceMarkerElement) birthplaceMarkerElement.classList.remove('dragging');
    if (state.dragPanWasEnabled && map && map.dragPan) {
      try { map.dragPan.enable(); } catch (_) {}
    }
    if (birthplaceMarkerElement && state.pointerId != null) {
      try {
        if (birthplaceMarkerElement.hasPointerCapture(state.pointerId)) {
          birthplaceMarkerElement.releasePointerCapture(state.pointerId);
        }
      } catch (_) {}
    }
    if (commit && state.dragging && state.moved && birthplaceMarker) {
      const lngLat = birthplaceMarker.getLngLat();
      sendHereRequest('set_pob', lngLat, '');
    }
  }

  function wireBirthplaceMarker(element) {
    element.addEventListener('pointerdown', (event) => {
      if (event.button != null && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      hideContextMenu();
      if (birthplaceDrag) finishBirthplaceDrag(event, false);
      const state = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        dragging: false,
        moved: false,
        dragPanWasEnabled: false,
        timer: null,
      };
      birthplaceDrag = state;
      try { element.setPointerCapture(event.pointerId); } catch (_) {}
      state.timer = window.setTimeout(() => {
        if (birthplaceDrag !== state) return;
        state.dragging = true;
        state.dragPanWasEnabled = !!(map && map.dragPan && map.dragPan.isEnabled());
        if (state.dragPanWasEnabled) {
          try { map.dragPan.disable(); } catch (_) {}
        }
        element.classList.add('dragging');
        updateBirthplaceDragPosition(event);
      }, BIRTHPLACE_LONG_PRESS_MS);
    });
    element.addEventListener('pointermove', (event) => {
      const state = birthplaceDrag;
      if (!state || state.pointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      if (!state.dragging) {
        const distance = Math.hypot(event.clientX - state.startX, event.clientY - state.startY);
        if (distance > BIRTHPLACE_PRESS_MOVE_TOLERANCE_PX && state.timer) {
          window.clearTimeout(state.timer);
          state.timer = null;
        }
        return;
      }
      state.moved = true;
      updateBirthplaceDragPosition(event);
    });
    element.addEventListener('pointerup', (event) => {
      event.preventDefault();
      event.stopPropagation();
      finishBirthplaceDrag(event, true);
    });
    element.addEventListener('pointercancel', (event) => finishBirthplaceDrag(event, false));
    for (const type of ['click', 'dblclick', 'contextmenu']) {
      element.addEventListener(type, (event) => {
        event.preventDefault();
        event.stopPropagation();
      });
    }
  }

  function syncBirthplaceMarker() {
    const coordinates = birthplaceCoordinates(currentData);
    if (!coordinates || !map || !window.maplibregl || !window.maplibregl.Marker) {
      if (birthplaceMarker) {
        try { birthplaceMarker.remove(); } catch (_) {}
      }
      birthplaceMarker = null;
      birthplaceMarkerElement = null;
      return;
    }
    if (!birthplaceMarker) {
      const element = document.createElement('div');
      element.className = 'acg-birthplace-marker';
      const glyph = document.createElement('span');
      glyph.className = 'acg-birthplace-marker-glyph';
      glyph.textContent = '*';
      element.appendChild(glyph);
      element.setAttribute('role', 'img');
      wireBirthplaceMarker(element);
      birthplaceMarkerElement = element;
      applyBirthplaceMarkerLabel();
      birthplaceMarker = new maplibregl.Marker({ element, anchor: 'center' })
        .setLngLat(coordinates)
        .addTo(map);
      return;
    }
    birthplaceMarker.setLngLat(coordinates);
  }

  function runtimeOverlaySceneDeferred() {
    return !mapHostActive || isDomLabelMovementActive();
  }

  function deferRuntimeOverlayScene(parts, options = {}) {
    const next = parts || {};
    if (next.data) retainedDataDirty = true;
    if (next.asterism) retainedAsterismDirty = true;
    if (next.eclipse) {
      retainedEclipseDirty = true;
      // The latest eclipse intent owns whether its eventual coherent swap
      // should reframe. Hidden maps intentionally preserve their prior camera.
      retainedEclipseFitPending = mapHostActive && !!options.fit;
    }
    if (ACG_PERF_MODE && isDomLabelMovementActive()) {
      perfState.runtimeSceneDeferredPushes += 1;
    }
    return false;
  }

  function applyRuntimeOverlayScene(parts, options = {}) {
    const next = parts || {};
    if (!next.data && !next.asterism && !next.eclipse) return false;
    rebuildPolarOverlayPaths();

    if (map && typeof map.isStyleLoaded === 'function' && map.isStyleLoaded()) {
      if (next.data) ensureAcgLayers();
      if (next.asterism) ensureAsterismLayer();
      if (next.eclipse) ensureEclipseLayers();
    }

    if (next.asterism) {
      polarAsterismStarHitTargets = [];
      hideAsterismStarPopup('polar');
    }

    if (next.data) {
      const source = map && map.getSource && map.getSource(ACG_SOURCE_ID);
      const labelSource = map && map.getSource && map.getSource(ACG_LABEL_SOURCE_ID);
      if (source) source.setData(currentMapData);
      if (labelSource) labelSource.setData(currentMapData);
    }
    if (next.asterism) {
      const source = map && map.getSource && map.getSource(ASTERISM_SOURCE_ID);
      if (source) source.setData(currentMapAsterismData);
    }
    if (next.eclipse) {
      const source = map && map.getSource && map.getSource(ECLIPSE_SOURCE_ID);
      if (source) source.setData(currentMapEclipseData);
    }

    if (next.data) {
      syncBirthplaceMarker();
      updateLegend();
    }
    if (next.asterism) {
      syncReferenceVisibility();
      if (map && (
        !map.getLayer('acg-reference-asc') ||
        !map.getLayer('acg-asterisms')
      )) scheduleRuntimeOverlayReplay();
    }
    if (next.eclipse && options.fit) fitFeatureCollection(currentEclipseData);
    if (next.data || next.eclipse) {
      scheduleDomAcgLabels(options.reason || 'scene-data');
    }
    if (map && typeof map.triggerRepaint === 'function') map.triggerRepaint();
    return true;
  }

  function flushRetainedRuntimeOverlayScene(reason) {
    if (runtimeOverlaySceneDeferred()) return false;
    const parts = {
      data: retainedDataDirty,
      asterism: retainedAsterismDirty,
      eclipse: retainedEclipseDirty,
    };
    if (!parts.data && !parts.asterism && !parts.eclipse) return false;
    const fitEclipse = parts.eclipse && retainedEclipseFitPending;
    retainedDataDirty = false;
    retainedAsterismDirty = false;
    retainedEclipseDirty = false;
    retainedEclipseFitPending = false;
    if (parts.data && ACTIVE_ASTROCART_STYLE) {
      applyDisplayStyle(ACTIVE_ASTROCART_STYLE, false);
    }
    const applied = applyRuntimeOverlayScene(parts, {
      fit: fitEclipse,
      reason: reason || 'scene-flush',
    });
    if (!applied) return false;
    if (ACG_PERF_MODE) perfState.runtimeSceneCoherentFlushes += 1;
    if (parts.data) {
      setStatus(`${(currentData.features || []).length} lines loaded`);
    }
    if (parts.eclipse) {
      const count = (currentEclipseData.features || []).length;
      if (count) setStatus(`${count} eclipse path features loaded`);
    }
    postPerfSnapshot(reason || 'scene-flush');
    return true;
  }

  function pushData() {
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene({ data: true });
    }
    retainedDataDirty = false;
    return applyRuntimeOverlayScene({ data: true }, { reason: 'data' });
  }

  function pushAsterismData() {
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene({ asterism: true });
    }
    retainedAsterismDirty = false;
    return applyRuntimeOverlayScene({ asterism: true }, { reason: 'asterism-data' });
  }

  function refreshPolarProjectionData() {
    const allSources = { data: true, asterism: true, eclipse: true };
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene(allSources, { fit: false });
    }
    return applyRuntimeOverlayScene(allSources, {
      fit: false,
      reason: 'projection-data',
    });
  }

  function applyDisplayStyleToData(data, payload) {
    const pointStyles = payload && payload.points || {};
    for (const feature of data && data.features || []) {
      const props = feature && feature.properties || {};
      if (props.point && pointStyles[props.point]) {
        const style = pointStyles[props.point];
        if (style.label) props.label = style.label;
        if (style.color) props.color = style.color;
        else delete props.color;
        if (style.glyphMorinus != null) props.glyph_morinus = style.glyphMorinus;
        props.line_width_scale = style.lineWidthScale;
        props.line_opacity = style.lineOpacity;
      }
      if (props.kind === 'PARAN') {
        const a = pointStyles[props.a_point] || {};
        const b = pointStyles[props.b_point] || {};
        if (a.glyphMorinus != null) props.a_glyph_morinus = a.glyphMorinus;
        if (b.glyphMorinus != null) props.b_glyph_morinus = b.glyphMorinus;
        if (a.label || b.label) {
          props.label = `${a.label || props.a_point || ''} ${props.a_angle || ''} × ${b.label || props.b_point || ''} ${props.b_angle || ''}`.trim();
        }
      }
    }
    return data;
  }

  function applyDisplayStyle(payload, shouldPush = true) {
    applyDisplayStyleToData(currentData, payload);
    if (runtimeOverlaySceneDeferred()) {
      deferRuntimeOverlayScene({ data: true });
      return;
    }
    syncReferenceVisibility();
    if (shouldPush) pushData();
  }

  function pushEclipseData(options = {}) {
    if (runtimeOverlaySceneDeferred()) {
      return deferRuntimeOverlayScene({ eclipse: true }, options);
    }
    retainedEclipseDirty = false;
    retainedEclipseFitPending = false;
    return applyRuntimeOverlayScene(
      { eclipse: true },
      { fit: !!options.fit, reason: 'eclipse-data' },
    );
  }

  function applyDevColors() {
    const t = currentThemeTokens();
    const s = currentDevSettings();
    applyPageBg(
      ACTIVE_ASTROCART_STYLE && ACTIVE_ASTROCART_STYLE.chrome.pageBg ||
      DEV_SETTINGS.pageBg ||
      URL_THEME.get('pageBg')
    );
    if (!map) return;
    applyVectorBasemapStyle();
    for (const [id, color, width, opacity] of [
      ['acg-reference-house-lines', houseGridColorExpression(s), s.referenceGridLineWidth, houseGridOpacityExpression(s)],
      ['acg-reference-zodiac-lines', zodiacGridColorExpression(s), s.referenceGridLineWidth, s.referenceGridLineOpacity],
      ['acg-reference-ecliptic', s.referenceEclipticColor, s.referenceLineWidth * 1.25, s.referenceLineOpacity],
      ['acg-reference-zodiac-ticks', s.referenceEclipticColor, s.referenceLineWidth * 0.8, s.referenceLineOpacity],
      ['acg-reference-equator', s.referenceEquatorColor, s.referenceLineWidth, s.referenceLineOpacity],
      ['acg-reference-asc', s.referenceAscColor, s.referenceLineWidth, s.referenceLineOpacity],
      ['acg-reference-mc', s.referenceMcColor, s.referenceLineWidth, s.referenceLineOpacity],
    ]) {
      if (!map.getLayer(id)) continue;
      map.setPaintProperty(id, 'line-color', color);
      map.setPaintProperty(id, 'line-width', width);
      map.setPaintProperty(id, 'line-opacity', opacity);
    }
    syncReferenceVisibility();
    if (map.getLayer('acg-casing')) {
      map.setPaintProperty('acg-casing', 'line-color', t.casing);
      map.setPaintProperty('acg-casing', 'line-width', scaledPointLineMetric(s.casingWidth, 'line_width_scale'));
      map.setPaintProperty('acg-casing', 'line-opacity', scaledPointLayerOpacity(s.casingOpacity, 'line_opacity'));
    }
    if (map.getLayer('acg-lines-solid')) {
      map.setPaintProperty('acg-lines-solid', 'line-color', acgLineColorExpression(s));
      map.setPaintProperty('acg-lines-solid', 'line-width', scaledPointLineMetric(s.solidWidth, 'line_width_scale'));
      map.setPaintProperty('acg-lines-solid', 'line-opacity', scaledPointLayerOpacity(s.solidOpacity, 'line_opacity'));
    }
    if (map.getLayer('acg-lines-dashed')) {
      map.setPaintProperty('acg-lines-dashed', 'line-color', acgLineColorExpression(s));
      map.setPaintProperty('acg-lines-dashed', 'line-width', scaledPointLineMetric(s.dashedWidth, 'line_width_scale'));
      map.setPaintProperty('acg-lines-dashed', 'line-opacity', scaledPointLayerOpacity(s.dashedOpacity, 'line_opacity'));
      map.setPaintProperty('acg-lines-dashed', 'line-dasharray', [s.dashedOn, s.dashedOff]);
    }
    if (map.getLayer('acg-local-space-oppositions')) {
      map.setPaintProperty('acg-local-space-oppositions', 'line-color', acgLineColorExpression(s));
      map.setPaintProperty('acg-local-space-oppositions', 'line-width', scaledPointLineMetric(
        s.dashedWidth * s.localSpaceOppositionWidthScale,
        'line_width_scale'
      ));
      map.setPaintProperty('acg-local-space-oppositions', 'line-opacity', scaledPointLayerOpacity(
        s.dashedOpacity * s.localSpaceOppositionOpacityScale,
        'line_opacity'
      ));
      map.setPaintProperty('acg-local-space-oppositions', 'line-dasharray', [
        s.dashedOn * s.localSpaceOppositionDashOnScale,
        s.dashedOff * s.localSpaceOppositionDashOffScale,
      ]);
    }
    if (map.getLayer('acg-aspects')) {
      map.setPaintProperty('acg-aspects', 'line-color', acgLineColorExpression(s));
      map.setPaintProperty('acg-aspects', 'line-width', scaledPointLineMetric(
        s.solidWidth * s.aspectLineWidthScale,
        'line_width_scale'
      ));
      map.setPaintProperty('acg-aspects', 'line-opacity', scaledPointLayerOpacity(
        s.solidOpacity * s.aspectLineOpacityScale,
        'line_opacity'
      ));
      map.setPaintProperty('acg-aspects', 'line-dasharray', [
        s.aspectLineDashOn,
        s.aspectLineDashOff,
      ]);
    }
    if (map.getLayer('acg-parans')) {
      map.setPaintProperty('acg-parans', 'line-color', t.paranColor);
      map.setPaintProperty('acg-parans', 'line-width', s.paranWidth);
      map.setPaintProperty('acg-parans', 'line-opacity', scaledPointLayerOpacity(s.paranOpacity, 'line_opacity'));
      map.setPaintProperty('acg-parans', 'line-dasharray', [s.paranDashOn, s.paranDashOff]);
    }
    if (map.getLayer('acg-zeniths')) {
      map.setPaintProperty('acg-zeniths', 'circle-color', acgLineColorExpression(s));
      map.setPaintProperty('acg-zeniths', 'circle-radius', Math.max(
        s.zenithRadiusMin,
        s.solidWidth * s.zenithRadiusWidthScale
      ));
      map.setPaintProperty('acg-zeniths', 'circle-opacity', scaledPointLayerOpacity(s.solidOpacity, 'line_opacity'));
      map.setPaintProperty('acg-zeniths', 'circle-stroke-color', t.casing);
      map.setPaintProperty('acg-zeniths', 'circle-stroke-width', Math.max(
        s.zenithStrokeWidthMin,
        s.casingWidth
      ));
      map.setPaintProperty('acg-zeniths', 'circle-stroke-opacity', scaledPointLayerOpacity(s.casingOpacity, 'line_opacity'));
    }

  function updateLegend() {
    if (!mapHostActive) return;
    const rows = document.getElementById('legend-rows');
    if (!rows) return;
    const t = currentThemeTokens();
    const seen = new Map();
    let hasParan = false;
    let hasLocalSpace = false;
    let hasAcgAngles = false;
    let hasLocalSpaceOpposition = false;
    let hasAspect = false;
    let hasZenith = false;
    for (const f of currentData.features || []) {
      if (!isAcgFeatureVisible(f)) continue;
      if (f.properties.kind === 'PARAN') { hasParan = true; continue; }
      if (f.properties.kind === 'LOCAL_SPACE') hasLocalSpace = true;
      if (f.properties.kind === 'LOCAL_SPACE_OPPOSITION') hasLocalSpaceOpposition = true;
      if (f.properties.kind === 'ASPECT') hasAspect = true;
      if (f.properties.kind === 'ZENITH') hasZenith = true;
      if (['MC', 'IC', 'ASC', 'DSC'].includes(f.properties.kind)) hasAcgAngles = true;
      const pt = f.properties.point;
      if (!seen.has(pt)) {
        seen.set(pt, {
          label: f.properties.label || pt,
          color: f.properties.color || t.labelColor,
          glyph: f.properties.glyph_morinus || '',
        });
      }
    }
    rows.innerHTML = '';
    for (const [, info] of seen) {
      const row = document.createElement('div');
      row.className = 'row';
      const glyph = info.glyph
        ? `<span class="glyph" style="color:${info.color}">${info.glyph}</span>`
        : `<span class="glyph"></span>`;
      row.innerHTML = `${glyph}<span class="sw" style="background:${info.color}"></span><span>${info.label}</span>`;
      rows.appendChild(row);
    }
    const acgKey = document.getElementById('legend-acg-key');
    if (acgKey) acgKey.style.display = hasAcgAngles ? '' : 'none';
    const localRow = document.getElementById('legend-local-space-row');
    if (localRow) localRow.style.display = hasLocalSpace ? '' : 'none';
    const paranRow = document.getElementById('legend-paran-row');
    if (paranRow) paranRow.style.display = hasParan ? '' : 'none';
    for (const [id, present, label] of [
      ['legend-local-space-opposition-row', hasLocalSpaceOpposition, uiLabels.localSpaceOpposition],
      ['legend-aspect-row', hasAspect, uiLabels.aspect],
      ['legend-zenith-row', hasZenith, uiLabels.zenith],
    ]) {
      const row = document.getElementById(id);
      const text = String(label || '').trim();
      if (!row) continue;
      const labelElement = row.querySelector('.localized-kind-label');
      if (labelElement) labelElement.textContent = text;
      row.style.display = present && text ? '' : 'none';
    }
  }

  function normalizePlaceFeature(f) {
    const c = f && f.geometry && f.geometry.coordinates || [];
    const p = f && f.properties || {};
    return {
      lon: Number(c[0]),
      lat: Number(c[1]),
      name: p.name || p.ascii || '',
      ascii: p.ascii || '',
      country: p.country || '',
      population: Number(p.population || 0),
      level: Number(p.level == null ? 4 : p.level),
      feature: p.feature || '',
    };
  }

  function shouldRenderPlaceOverlay() {
    if (PLACE_LABELS_DISABLED) return false;
    if (PLACE_LABELS_AUTO) return !!(USE_LOCAL_BASEMAP || USE_MINIMAL_BASEMAP);
    return true;
  }

  function shouldUseDynamicCityLabels() {
    return (
      PLACE_LABELS_CITY500 &&
      shouldRenderPlaceOverlay() &&
      !!CITY_LABELS_URL &&
      /^https?:$/.test(location.protocol)
    );
  }

  function loadPlaceLabels(options) {
    const opts = options || {};
    if (PLACE_LABELS_DISABLED) {
      schedulePlaceLabelsRender('disabled');
      return;
    }
    if (shouldUseDynamicCityLabels() && !opts.forceStatic) {
      scheduleCityLabelsRefresh(opts.reason || 'load');
      return;
    }
    if (PLACE_LABELS_AUTO && !shouldRenderPlaceOverlay() && !opts.forceStatic) {
      schedulePlaceLabelsRender('provider-labels');
      return;
    }
    loadStaticPlaceLabels(opts);
  }

  function setPlaceLabelDataset(rows, source) {
    placeLabelData = Array.isArray(rows) ? rows : [];
    placeLabelSource = source || 'unknown';
    perfState.placeLabelSource = placeLabelSource;
    perfState.placeLabelLastCount = placeLabelData.length;
    schedulePlaceLabelsRender('dataset');
  }

  function loadStaticPlaceLabels(options) {
    const opts = options || {};
    if (PLACE_LABELS_DISABLED || !window.fetch) return;
    if (opts.useForOverlay) staticOverlayRequested = true;
    if (placesLoaded) {
      if (staticOverlayRequested || !shouldUseDynamicCityLabels()) {
        staticOverlayRequested = false;
        setPlaceLabelDataset(placesData, 'static');
      }
      refreshSearchResults();
      return;
    }
    if (placesLoading) return;
    placesLoading = true;
    fetch(PLACES_URL, { cache: 'force-cache' })
      .then((r) => {
        if (!r || !r.ok) throw new Error(`static places failed: ${r ? r.status : 'no response'}`);
        return r.json();
      })
      .then((data) => {
        placesData = (data && data.features || [])
          .map(normalizePlaceFeature)
          .filter((p) => Number.isFinite(p.lon) && Number.isFinite(p.lat) && p.name);
        placesLoaded = true;
        placesLoading = false;
        if (staticOverlayRequested || !shouldUseDynamicCityLabels()) {
          staticOverlayRequested = false;
          setPlaceLabelDataset(placesData, 'static');
        }
        refreshSearchResults();
      })
      .catch(() => {
        placesLoading = false;
        placesLoaded = false;
        staticOverlayRequested = false;
      });
  }

  function cityLabelBudget(zoom) {
    if (zoom < 1.7) return 60;
    if (zoom < 2.3) return 110;
    if (zoom < 3.0) return 180;
    if (zoom < 4.0) return 260;
    return 420;
  }

  function cityLabelsEndpointUrl() {
    if (!map || !map.getBounds) return null;
    let b;
    try {
      b = map.getBounds();
    } catch (_) {
      return null;
    }
    if (!b) return null;
    const zoom = map.getZoom ? map.getZoom() : 0;
    const params = new URLSearchParams({
      west: String(b.getWest()),
      south: String(b.getSouth()),
      east: String(b.getEast()),
      north: String(b.getNorth()),
      zoom: String(zoom),
      limit: String(cityLabelBudget(zoom)),
    });
    const sep = CITY_LABELS_URL.indexOf('?') === -1 ? '?' : '&';
    return `${CITY_LABELS_URL}${sep}${params.toString()}`;
  }

  function scheduleCityLabelsRefresh(reason) {
    if (!mapHostActive || !shouldUseDynamicCityLabels()) return;
    if (cityLabelsTimer) window.clearTimeout(cityLabelsTimer);
    cityLabelsTimer = window.setTimeout(() => {
      cityLabelsTimer = null;
      refreshDynamicCityLabels(reason || 'refresh');
    }, 60);
  }

  function refreshDynamicCityLabels(reason) {
    if (!shouldUseDynamicCityLabels() || !window.fetch) return;
    const url = cityLabelsEndpointUrl();
    if (!url) return;
    if (url === cityLabelsRequestKey && (cityLabelsController || placeLabelSource === 'dynamic')) return;
    if (cityLabelsController) {
      try { cityLabelsController.abort(); } catch (_) {}
      perfState.placeLabelAborts += 1;
    }
    cityLabelsRequestKey = url;
    const controller = window.AbortController ? new AbortController() : null;
    cityLabelsController = controller;
    const started = perfNow();
    perfState.placeLabelFetches += 1;
    const headers = DAEMON_TOKEN ? { 'X-Aries-Token': DAEMON_TOKEN } : undefined;
    fetch(url, {
      cache: 'no-store',
      headers,
      signal: controller ? controller.signal : undefined,
    })
      .then((r) => {
        if (!r || !r.ok) throw new Error(`city labels failed: ${r ? r.status : 'no response'}`);
        return r.json();
      })
      .then((data) => {
        if (controller && controller.signal.aborted) return;
        if (!data || !data.meta || data.meta.available !== true || !Array.isArray(data.features)) {
          throw new Error('city labels unavailable');
        }
        const rows = data.features
          .map(normalizePlaceFeature)
          .filter((p) => Number.isFinite(p.lon) && Number.isFinite(p.lat) && p.name);
        perfState.placeLabelLastFetchMs = perfNow() - started;
        staticOverlayRequested = false;
        setPlaceLabelDataset(rows, 'dynamic');
