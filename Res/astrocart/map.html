<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morinus Astrocartography</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1d21">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preload" href="../Morinus.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Bundled Morinus font — loaded from Res/Morinus.ttf via a relative URL. */
  @font-face {
    font-family: 'Morinus';
    src: url('../Morinus.ttf') format('truetype');
    font-display: block;
  }
  html {
    background:#1a1d21;
    color-scheme:dark;
  }
  /* Dark theme (Midnight / Nocturne Mono) — the boot default so embedded
     webviews and iframes never expose a light browser canvas while the host
     theme is still loading. */
  :root {
    --page-bg:     #1a1d21;
    --titlebar-safe-top: 0px;
    --chrome-bg:   rgba(29,30,33,0.88);
    --chrome-bg-thin: rgba(29,30,33,0.84);
    --chrome-border:  rgba(255,255,255,0.10);
    --chrome-rule:    rgba(255,255,255,0.08);
    --chrome-text:    #e2e3e6;
    --chrome-dim:     #b0b3b8;
    --chrome-soft:    #c4c6ca;
    --btn-active-bg:  rgba(255,255,255,0.12);
    --btn-hover-bg:   rgba(255,255,255,0.05);
    --btn-active-fg:  #ffffff;
    --key-line:       #d0d2d6;
    --key-paran:      #e59246;
    --popup-bg:       #23262c;
    --menu-bg:        rgba(37,39,44,0.88);
    --menu-border:    rgba(255,255,255,0.14);
    --menu-shadow:    rgba(0,0,0,0.45);
    --menu-hover-bg:  #0a84ff;
    --menu-hover-fg:  #ffffff;
    --chrome-font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --chrome-font-symbols: 'Morinus', serif;
    --chrome-control-size: 28px;
    --chrome-panel-radius: 6px;
    --chrome-font-size: 11px;
    --chrome-small-font-size: 10px;
    --chrome-inset: 8px;
    --chrome-gap: 4px;
    --chrome-padding-x: 8px;
    --chrome-padding-y: 6px;
  }
  /* Light theme (Daylight / Paper Mono / Classic Morinus) — explicit opt-in. */
  body.theme-light {
    --page-bg:     #d9dde1;
    --chrome-bg:   rgba(255,255,255,0.88);
    --chrome-bg-thin: rgba(255,255,255,0.84);
    --chrome-border:  rgba(0,0,0,0.12);
    --chrome-rule:    rgba(0,0,0,0.08);
    --chrome-text:    #2d3136;
    --chrome-dim:     #43484e;
    --chrome-soft:    #34383d;
    --btn-active-bg:  rgba(0,0,0,0.09);
    --btn-hover-bg:   rgba(0,0,0,0.04);
    --btn-active-fg:  #1a1d21;
    --key-line:       #2d3136;
    --key-paran:      #b35800;
    --popup-bg:       #ffffff;
    --menu-bg:        rgba(246,246,246,0.88);
    --menu-border:    rgba(0,0,0,0.18);
    --menu-shadow:    rgba(0,0,0,0.24);
    --menu-hover-bg:  #0a84ff;
    --menu-hover-fg:  #ffffff;
    color-scheme:light;
  }
  html, body, #map { margin:0; padding:0; width:100%; height:100%; background:var(--page-bg); }
  body { font-family:var(--chrome-font-ui); color:var(--chrome-text); }
  body { -webkit-user-select:none; user-select:none; }
  input, textarea, [contenteditable="true"] { -webkit-user-select:text; user-select:text; }
  .maplibregl-map,
  .maplibregl-canvas-container,
  .maplibregl-canvas {
    background:var(--page-bg) !important;
  }
  #map.map-booting .maplibregl-canvas,
  #map.map-booting .maplibregl-control-container {
    opacity:0;
    visibility:hidden;
  }
  #polar-line-overlay {
    position:absolute; inset:0; pointer-events:none;
    width:100%; height:100%;
  }
  #map.map-booting #polar-line-overlay {
    opacity:0;
    visibility:hidden;
  }
  .maplibregl-ctrl-top-left { top:var(--titlebar-safe-top); }
  .maplibregl-ctrl-group {
    background:var(--chrome-bg);
    border:1px solid var(--chrome-border);
    box-shadow:none;
    overflow:hidden;
  }
  .maplibregl-ctrl-group button {
    width:var(--chrome-control-size); height:var(--chrome-control-size);
    background:transparent;
  }
  .maplibregl-ctrl-group button + button {
    border-top:1px solid var(--chrome-rule);
  }
  .maplibregl-ctrl-group button:hover:not(:disabled) {
    background:var(--btn-hover-bg);
  }
  .maplibregl-ctrl-compass { display:none; }
  body:not(.theme-light) .maplibregl-ctrl button .maplibregl-ctrl-icon {
    filter:invert(1);
    opacity:0.88;
  }
  .maplibregl-ctrl-attrib,
  .maplibregl-ctrl-attrib.maplibregl-compact {
    background:var(--chrome-bg-thin);
    color:var(--chrome-dim);
    border:1px solid var(--chrome-border);
    box-shadow:none;
  }
  .maplibregl-ctrl-attrib a {
    color:var(--chrome-text);
  }
  .maplibregl-ctrl-attrib-button {
    background-color:transparent;
    background-image:none !important;
  }
  .maplibregl-ctrl-attrib-button:hover {
    background-color:var(--btn-hover-bg);
  }
  .maplibregl-ctrl-attrib-button::before {
    content:"i";
    display:block;
    width:18px; height:18px;
    margin:auto;
    border:2px solid var(--chrome-text);
    border-radius:50%;
    color:var(--chrome-text);
    font:700 14px/18px var(--chrome-font-ui);
    text-align:center;
  }
  #legend {
    position:absolute; top:calc(var(--titlebar-safe-top) + var(--chrome-inset)); right:var(--chrome-inset);
    z-index:7;
    background:var(--chrome-bg);
    border-radius:var(--chrome-panel-radius); font-size:var(--chrome-font-size);
    max-width:210px; line-height:1.4; pointer-events:auto;
    border:1px solid var(--chrome-border);
    color:var(--chrome-text);
    overflow:hidden;
  }
  #legend-toggle {
    width:100%; display:flex; align-items:center; gap:var(--chrome-inset);
    border:0; background:transparent; color:var(--chrome-soft);
    height:calc(var(--chrome-control-size) - 2px);
    padding:0 var(--chrome-padding-x); cursor:pointer;
    border-radius:var(--chrome-panel-radius);
    font:inherit; font-size:var(--chrome-font-size); line-height:16px;
  }
  #legend-toggle:hover { background:var(--btn-hover-bg); }
  #legend-toggle .legend-state {
    margin-left:auto; color:var(--chrome-dim); font-size:12px; line-height:1;
  }
  #legend-body { padding:0 var(--chrome-padding-x) var(--chrome-padding-y); }
  #legend.collapsed { max-width:none; }
  #legend.collapsed #legend-body { display:none; }
  #legend h4 { margin:0 0 var(--chrome-padding-y) 0; font-size:var(--chrome-small-font-size); font-weight:600; color:var(--chrome-soft); opacity:0.75; text-transform:uppercase; letter-spacing:0.08em; }
  #legend section + section { margin-top:var(--chrome-inset); padding-top:var(--chrome-inset); border-top:1px solid var(--chrome-rule); }
  #legend .row { display:flex; align-items:center; gap:var(--chrome-padding-y); }
  #legend .sw { width:18px; height:2px; flex-shrink:0; }
  #legend .glyph { font-family:var(--chrome-font-symbols); font-size:calc(var(--chrome-font-size) + 3px); width:16px; text-align:center; display:inline-block; }
  #legend .kind-row { display:flex; align-items:center; gap:var(--chrome-padding-y); color:var(--chrome-dim); font-size:var(--chrome-small-font-size); }
  #legend .kind-row .sw { width:24px; }
  #legend .kind-row .ks { border-top:1.8px solid var(--key-line); width:24px; height:0; }
  #legend .kind-row .kd { border-top:1.8px dashed var(--key-line); width:24px; height:0; }
  #legend .kind-row .kp { border-top:1.2px dashed var(--key-paran); width:24px; height:0; }
  #status {
    position:absolute; bottom:var(--chrome-inset); left:var(--chrome-inset);
    background:var(--chrome-bg-thin);
    padding:var(--chrome-gap) var(--chrome-padding-x);
    border-radius:var(--chrome-panel-radius); font-size:var(--chrome-small-font-size); color:var(--chrome-dim);
    border:1px solid var(--chrome-border);
  }
  .maplibregl-popup-content {
    background:var(--popup-bg) !important; color:var(--chrome-text) !important;
    border:1px solid var(--chrome-border);
    font-size:var(--chrome-font-size);
    padding:var(--chrome-padding-y) var(--chrome-padding-x);
    border-radius:var(--chrome-panel-radius);
  }
  .maplibregl-popup-tip { border-top-color:var(--popup-bg) !important; }
  #top-controls {
    position:absolute;
    top:calc(var(--titlebar-safe-top) + var(--chrome-inset));
    left:calc(
      var(--chrome-control-size) + var(--chrome-control-size) +
      var(--chrome-control-size) + var(--chrome-gap)
    );
    z-index:7; display:flex; align-items:flex-start; gap:var(--chrome-gap);
  }
  #proj, #overlays {
    background:var(--chrome-bg);
    border:1px solid var(--chrome-border);
    border-radius:var(--chrome-panel-radius);
    padding:max(0px, calc(var(--chrome-padding-y) - 4px));
    font-size:var(--chrome-font-size); display:flex; gap:1px;
  }
  #proj button, #overlays button {
    background:transparent; color:var(--chrome-dim); border:0;
    min-height:calc(var(--chrome-control-size) - 6px);
    padding:max(0px, calc(var(--chrome-padding-y) - 3px)) var(--chrome-padding-x);
    cursor:pointer; border-radius:calc(var(--chrome-panel-radius) / 2);
    font: inherit; line-height:16px; letter-spacing:0;
  }
  #proj button.on, #overlays button.on {
    background:var(--btn-active-bg); color:var(--btn-active-fg); font-weight:600;
  }
  #proj button:hover:not(.on), #overlays button:hover:not(.on) { background:var(--btn-hover-bg); }
  #place-search {
    position:relative; width:208px;
  }
  #ruler-control {
    flex:none; display:flex; align-items:center; justify-content:center;
    width:var(--chrome-control-size); height:var(--chrome-control-size); padding:0;
    background:var(--chrome-bg); color:var(--chrome-dim);
    border:1px solid var(--chrome-border); border-radius:var(--chrome-panel-radius);
    cursor:pointer;
  }
  #ruler-control:hover:not(:disabled) { background:var(--btn-hover-bg); }
  #ruler-control[aria-pressed="true"] { background:var(--btn-active-bg); color:var(--btn-active-fg); }
  #ruler-control:focus-visible { outline:1px solid var(--chrome-soft); outline-offset:2px; }
  #ruler-control:disabled { opacity:0.5; cursor:default; }
  #ruler-control svg { width:14px; height:14px; }
  #place-search-input {
    width:100%; box-sizing:border-box;
    height:var(--chrome-control-size); padding:0 var(--chrome-padding-x);
    background:var(--chrome-bg); color:var(--chrome-text);
    border:1px solid var(--chrome-border); border-radius:var(--chrome-panel-radius);
    font:inherit; font-size:var(--chrome-font-size);
    line-height:calc(var(--chrome-control-size) - 2px);
    outline:none; -webkit-appearance:none;
  }
  #place-search-input::placeholder {
    color:var(--chrome-dim); opacity:0.7;
  }
  #place-search-input::-webkit-search-cancel-button {
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px; margin-right:-2px; cursor:default;
    background:var(--chrome-dim); opacity:0.55;
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 3l6 6M9 3l-6 6' stroke='black' stroke-width='1.6' stroke-linecap='round'/></svg>");
    mask-repeat:no-repeat; mask-position:center;
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 3l6 6M9 3l-6 6' stroke='black' stroke-width='1.6' stroke-linecap='round'/></svg>");
    -webkit-mask-repeat:no-repeat; -webkit-mask-position:center;
  }
  #place-search-input:focus { border-color:var(--chrome-soft); }
  #place-search-results {
    display:none; margin-top:var(--chrome-gap);
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:var(--chrome-panel-radius);
    box-shadow:none;
    padding:var(--chrome-gap); max-height:300px; overflow-y:auto;
  }
  .place-search-result {
    display:flex; align-items:baseline; gap:var(--chrome-inset);
    width:100%;
    padding:max(0px, calc(var(--chrome-padding-y) - 1px)) var(--chrome-padding-x);
    border:0; background:transparent;
    color:inherit; text-align:left; border-radius:var(--chrome-panel-radius);
    font:inherit; font-size:calc(var(--chrome-font-size) + 1px); line-height:1.25;
    cursor:default;
  }
  .place-search-result:hover,
  .place-search-result.active {
    background:var(--menu-hover-bg); color:var(--menu-hover-fg);
  }
  .place-search-result .name {
    flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .place-search-result .name .secondary {
    display:block; font-size:var(--chrome-small-font-size); opacity:0.55;
    line-height:1.2; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .place-search-result:hover .name .secondary,
  .place-search-result.active .name .secondary { opacity:0.85; }
  .place-search-result .country {
    flex:0 0 auto; font-size:var(--chrome-small-font-size); opacity:0.6; letter-spacing:0.04em;
  }
  .place-search-result:hover .country,
  .place-search-result.active .country { opacity:0.85; }
  .place-search-section {
    padding:6px 9px 3px;
    font-size:9px; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--chrome-dim); opacity:0.62;
  }
  .place-search-section.divider {
    border-top:1px solid var(--menu-border);
    margin-top:4px; padding-top:7px;
  }
  .place-search-loading {
    display:flex; align-items:center; gap:var(--chrome-padding-y);
    padding:var(--chrome-padding-y) var(--chrome-padding-x);
    color:var(--chrome-dim); font-size:var(--chrome-font-size);
  }
  .place-search-loading::before {
    content:''; display:inline-block;
    width:9px; height:9px; border-radius:50%;
    border:1.5px solid currentColor; border-top-color:transparent;
    animation:place-search-spin 0.8s linear infinite;
  }
  @keyframes place-search-spin { to { transform: rotate(360deg); } }
  .place-search-empty {
    padding:var(--chrome-padding-y) var(--chrome-padding-x);
    color:var(--chrome-dim); font-size:var(--chrome-font-size);
  }
  #acg-menu {
    position:absolute; z-index:8; min-width:190px; display:none;
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:var(--chrome-panel-radius);
    box-shadow:none;
    padding:max(0px, calc(var(--chrome-padding-y) - 1px));
    font-size:calc(var(--chrome-font-size) + 3px);
  }
  #acg-menu button {
    width:100%; display:block; border:0; background:transparent;
    color:inherit; text-align:left; border-radius:var(--chrome-panel-radius);
    padding:var(--chrome-padding-y)
      calc(var(--chrome-padding-x) + var(--chrome-padding-x) + var(--chrome-gap))
      var(--chrome-padding-y)
      calc(var(--chrome-padding-x) + var(--chrome-gap));
    font:inherit; line-height:1.25;
    cursor:default;
  }
  #acg-menu button:hover {
    background:var(--menu-hover-bg); color:var(--menu-hover-fg);
  }
  #acg-menu hr {
    margin:4px 6px; border:0; border-top:1px solid var(--menu-border); opacity:0.55;
  }
  /* Context-aware menu visibility — items marked data-context="X" only
     show when window.ACG.setContext('X') is active. Default mode is
     'chart'; setting a focused host mode surfaces only the matching
     location-pick action and hides chart-bound items that don't make sense in
     that flow. */
  #acg-menu[data-mode="chart"] [data-context]:not([data-context~="chart"]) { display:none; }
  #acg-menu[data-mode="chart"] hr[data-context~="default_location"] { display:none; }
  #acg-menu[data-mode="chart"] hr[data-context~="ascensional_event_place"] { display:none; }
  #acg-menu[data-mode="default_location"] [data-context]:not([data-context~="default_location"]) { display:none; }
  #acg-menu[data-mode="default_location"] hr[data-context~="chart"] { display:none; }
  #acg-menu[data-mode="default_location"] hr[data-context~="ascensional_event_place"] { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] [data-context]:not([data-context~="ascensional_event_place"]) { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] hr[data-context~="chart"] { display:none; }
  #acg-menu[data-mode="ascensional_event_place"] hr[data-context~="default_location"] { display:none; }
  #acg-hint {
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    background:var(--menu-bg); color:var(--chrome-text);
    border:1px solid var(--menu-border); border-radius:var(--chrome-panel-radius);
    box-shadow:none;
    padding:var(--chrome-inset) calc(var(--chrome-padding-x) + var(--chrome-padding-y));
    font-size:calc(var(--chrome-font-size) + 1.5px); letter-spacing:0.01em;
    pointer-events:none; opacity:0; transition:opacity 220ms ease-in-out;
    z-index:12;
  }
  #acg-hint.on { opacity:0.94; }
  .acg-birthplace-marker {
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .acg-birthplace-marker-glyph {
    color:var(--chrome-text);
    font:700 15px/16px var(--chrome-font-ui);
    text-shadow:0 0 2px var(--popup-bg), 0 0 5px var(--popup-bg);
    transform-origin:50% 60%;
    transition:transform 90ms ease, color 90ms ease;
  }
  .acg-birthplace-marker.dragging {
    cursor:grabbing;
  }
  .acg-birthplace-marker.dragging .acg-birthplace-marker-glyph {
    color:#0a84ff;
    transform:translateY(-3px) scale(1.2);
  }
  .acg-reference-sign {
    width:1.45em;
    height:1.45em;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:var(--chrome-font-symbols);
    font-style:normal;
    font-weight:400;
    line-height:1;
    z-index:4;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .acg-reference-pole-sign,
  .acg-reference-house-number {
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1;
    z-index:4;
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .acg-reference-pole-sign {
    width:1.35em;
    height:1.35em;
    font-family:var(--chrome-font-symbols);
    font-style:normal;
    font-weight:400;
  }
  .acg-reference-house-number {
    width:1.55em;
    height:1.25em;
    font-family:var(--chrome-font-ui);
    font-weight:600;
  }
  .acg-ruler-overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; overflow:hidden; }
  .acg-ruler-overlay path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .acg-ruler-halo { stroke:var(--aries-accent-foreground, var(--chrome-text)); stroke-width:2.5; }
  .acg-ruler-line { stroke:var(--aries-accent, var(--key-line)); stroke-width:1.5; stroke-dasharray:6 4; }
  .acg-ruler-foot, .acg-ruler-handle { stroke:var(--aries-accent-foreground, var(--chrome-text)); stroke-width:1.25; fill:var(--aries-accent, var(--key-line)); }
  .acg-ruler-handle { fill:var(--popup-bg); stroke:var(--aries-accent, var(--key-line)); }
  .acg-ruler-label, .acg-ruler-hint { position:absolute; pointer-events:none; z-index:6; padding:var(--chrome-padding-y) var(--chrome-padding-x); background:var(--chrome-bg); color:var(--chrome-text); border:1px solid var(--chrome-border); border-radius:var(--chrome-panel-radius); font:var(--chrome-font-size) var(--chrome-font-ui); font-variant-numeric:tabular-nums; }
  .acg-ruler-label { transform:translate(-50%, calc(-100% - 10px)); white-space:nowrap; }
  .acg-ruler-hint { bottom:52px; left:50%; transform:translateX(-50%); max-width:70%; text-align:center; }
  .acg-ruler-hover-paran .maplibregl-canvas,
  .acg-ruler-explicit .maplibregl-canvas,
  .acg-ruler-gesture .maplibregl-canvas { cursor:crosshair !important; }
  #acg-menu button[data-action="ruler"] { display:flex; align-items:center; gap:var(--chrome-padding-x); }
  #acg-menu button[data-action="ruler"]::after { content:''; width:0.6em; height:0.3em; margin-left:auto; border-left:1.5px solid transparent; border-bottom:1.5px solid transparent; transform:rotate(-45deg); }
  #acg-menu button[data-action="ruler"][aria-checked="true"]::after { border-color:currentColor; }
</style>
</head>
<body>
<div id="map" class="map-booting"></div>
<div id="acg-menu" data-mode="chart">
  <button data-action="relocation" data-context="chart">Relocation chart</button>
  <button data-action="solar_return" data-context="chart">Solar revolution here</button>
  <button data-action="transit" data-context="chart">Transit here</button>
  <hr data-context="chart">
  <button data-action="set_pob" data-context="chart">Set place of birth</button>
  <hr data-context="chart">

  const OFFLINE_PLACES_SOURCE_ID = 'offline-places';
  const OFFLINE_WORLD_SOURCE_ID = 'offline-world';
  const OFFLINE_WORLD_URL = 'natural-earth-admin0-110m.geojson';
  const ACG_PERF_MODE = ['1', 'true', 'on'].includes(
    (URL_THEME.get('perf') || '').trim().toLowerCase()
  );
  // The interactive globe is fill-rate sensitive on Retina displays. Keep
  // enough backing resolution for crisp line work while avoiding the 2x
  // canvas cost; exact print capture owns its independent high-resolution map.
  const LIVE_MAP_PIXEL_RATIO = Math.min(
    1.25,
    Math.max(1, Number(window.devicePixelRatio) || 1)
  );
  const perfStartedAt = (window.performance && performance.now) ? performance.now() : Date.now();
  const perfState = {
    enabled: ACG_PERF_MODE,
    hasLocalTiles: !!LOCAL_VECTOR_TILE_URL,
    forceLocalTiles: URL_THEME.get('offline') === '1',
    tileSource: 'none',
    mapLoadMs: null,
    moveEvents: 0,
    zoomEvents: 0,
    resizeEvents: 0,
    renderFrames: 0,
    longFrames: 0,
    lastFrameMs: 0,
    maxFrameMs: 0,
    frameSamples: [],
    runtimeSceneDeferredPushes: 0,
    runtimeSceneCoherentFlushes: 0,
    polarOverlayPathCount: 0,
    polarOverlayDraws: 0,
    polarOverlayLastMs: 0,
    polarOverlayMaxMs: 0,
    printCaptureCount: 0,
    printCaptureLastMs: 0,
    printCaptureLastBytes: 0,
  };
  let perfLastRenderAt = 0;
  document.body.classList.toggle('theme-light', !IS_DARK);
  applyPageBg(URL_THEME.get('pageBg'));
  applyTitlebarSafeTop(URL_THEME.get('titlebarSafeTop'));

  // OpenFreeMap Liberty is a public vector basemap with OpenMapTiles-style
  // layers and no API key. We keep the source remote, but restyle it locally
  // so Morinus can control ocean/land/border/place-label colors directly.
  const BASE_VECTOR_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
  const PRINT_BASEMAP_ATTRIBUTION =
    'OpenFreeMap © OpenMapTiles · Data © OpenStreetMap contributors · https://www.openstreetmap.org/copyright';
  const PRINT_LOCAL_ATTRIBUTION =
    'OpenMapTiles · Data © OpenStreetMap contributors · https://www.openstreetmap.org/copyright';
  const PRINT_ATLAS_OVERLAY_HALO = 'rgba(255,255,255,0.94)';
  const PRINT_ATLAS_LABEL_COLOR = '#202327';
  const PRINT_ATLAS_PAGE_TIMEOUT_MS = 10000;
  const PRINT_ATLAS_PNG_DATA_URL_PREFIX = 'data:image/png;base64,';
  const PRINT_ATLAS_MAX_PAGE_URL_CHARS = 32000000;
  const PRINT_ATLAS_MAX_PAGE_BYTES = 24000000;
  const PRINT_ATLAS_MAX_TOTAL_BYTES = 128000000;
  const PRINT_ATLAS_LOGICAL_WIDTH = 1200;
  const PRINT_ATLAS_LOGICAL_HEIGHT = 780;
  const PRINT_ATLAS_PREFERRED_DETAIL_ZOOM = 2.5;
  const PRINT_ATLAS_OVERLAP = 0.10;
  const PRINT_ATLAS_SOUTH = -60;
  const PRINT_ATLAS_NORTH = 75;
  let BASE_VECTOR_STYLE = null;
  const HIDE_LAYER_IDS = new Set([
    'natural_earth',
    'label_other',
    'label_state',
    'poi_transit',
    'airport',
    'road_one_way_arrow',
    'road_one_way_arrow_opposite',
    'highway-name-path',
    'highway-name-minor',
    'highway-name-major',
    'highway-shield-non-us',
    'highway-shield-us-interstate',
    'road_shield_us',
    'road_area_pattern',
    'building',
    'building-3d',
  ]);
  const HIDE_LAYER_PREFIXES = [
    'park',
    'landuse_',
    'landcover_',
    'aeroway_',
    'tunnel_',
    'road_',
    'bridge_',
  ];
  const WATER_LINE_LAYER_IDS = ['waterway_tunnel', 'waterway_river', 'waterway_other'];
  const WATER_LABEL_LAYER_IDS = ['waterway_line_label', 'water_name_point_label', 'water_name_line_label'];
  const HOSPITAL_POI_LAYER_IDS = ['poi_r20', 'poi_r7', 'poi_r1'];
  const HOSPITAL_FILL_LAYER_IDS = ['landuse_hospital'];
  const BORDER_LAYER_IDS = ['boundary_2', 'boundary_3', 'boundary_disputed'];
  const PARK_LAYER_IDS = ['park', 'park_outline'];
  const RESIDENTIAL_LAYER_IDS = ['landuse_residential'];
  const COUNTRY_LABEL_LAYER_IDS = ['label_country_1', 'label_country_2', 'label_country_3'];
  const CITY_LABEL_LAYER_IDS = ['label_city', 'label_city_capital'];
  const MINOR_PLACE_LABEL_LAYER_IDS = ['label_town', 'label_village'];
  const PLACE_LABEL_LAYER_IDS = [...CITY_LABEL_LAYER_IDS, ...MINOR_PLACE_LABEL_LAYER_IDS];
  const SUBTLE_ROAD_LAYER_IDS = [
    'road_trunk_primary',
    'road_secondary_tertiary',
    'road_street',
    'road_minor',
    'road_link',
    'road_service_track',
    'bridge_trunk_primary',
    'bridge_secondary_tertiary',
    'bridge_street',
    'bridge_link',
    'bridge_service_track',
    'tunnel_trunk_primary',
    'tunnel_secondary_tertiary',
    'tunnel_street',
    'tunnel_minor',
    'tunnel_link',
  ];
  const STREET_NAME_LAYER_IDS = ['highway-name-major', 'highway-name-minor'];
  // OpenMapTiles provides name_en; the Protomaps archive spells it name:en.
  const SIMPLE_PLACE_NAME = ['coalesce', ['get', 'name_en'], ['get', 'name:en'], ['get', 'name']];

  // The offline place layers reuse the provider layer ids, so
  // applyVectorBasemapStyle(), the context menu, and label settings treat
  // them exactly like the online labels. City tiers follow the curated
  // places.geojson hierarchy: level first, population second.
  function offlinePlaceSources() {
    if (PLACE_LABELS_DISABLED) return {};
    return {
      [OFFLINE_PLACES_SOURCE_ID]: {
        type: 'geojson',
        data: new URL(PLACES_URL, location.href).href,
      },
    };
  }

  function offlinePlaceLabelLayers(hasCountries) {
    if (PLACE_LABELS_DISABLED) return [];
    const minor = ['all', ['>=', ['get', 'level'], 3], ['<', ['get', 'population'], 1500000]];
    const visibleAtZoom = [
      'any',
      ['<=', ['get', 'level'], ['step', ['zoom'], 0, 2, 1, 3, 2, 4, 3, 5, 4]],
      ['>=', ['get', 'population'], ['step', ['zoom'], 4000000, 2, 1000000, 3, 250000, 4, 100000, 5, 0]],
    ];
    const cityLayout = {
      'text-field': SIMPLE_PLACE_NAME,
      'text-font': ['Noto Sans Regular'],
      'symbol-sort-key': ['-', ['*', ['get', 'level'], 100000000], ['get', 'population']],
    };
    const layers = [
      { id: 'label_town', type: 'symbol', source: OFFLINE_PLACES_SOURCE_ID,
        filter: ['all', minor, visibleAtZoom], layout: cityLayout },
      { id: 'label_city', type: 'symbol', source: OFFLINE_PLACES_SOURCE_ID,
        filter: ['all', ['!', minor], visibleAtZoom], layout: cityLayout },
    ];
    if (hasCountries) {
      layers.push({
        id: 'label_country_1', type: 'symbol', source: 'protomaps', 'source-layer': 'places',
        filter: ['==', ['get', 'kind'], 'country'],
        layout: {
          'text-field': SIMPLE_PLACE_NAME,
          'text-font': ['Noto Sans Bold'],
          'symbol-sort-key': ['get', 'sort_key'],
        },
      });
    }
    return layers;
  }

  function buildLocalPmtilesStyle(tilesUrl, isDark) {
    const s = resolvedDevSettings(isDark);
    return {
      version: 8,
      projection: { type: selectedProjection },
      sky: skyStyle(isDark),
      glyphs: LOCAL_GLYPHS_URL,
      sources: {
        protomaps: {
          type: 'vector',
          url: `pmtiles://${tilesUrl}`,
          attribution: '© OpenStreetMap contributors',
        },
        ...offlinePlaceSources(),
      },
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': s.landColor } },
        { id: 'earth', type: 'fill', source: 'protomaps', 'source-layer': 'earth',
          paint: { 'fill-color': s.landColor } },
        { id: 'water', type: 'fill', source: 'protomaps', 'source-layer': 'water',
          paint: { 'fill-color': s.oceanColor } },
        { id: 'boundaries-country', type: 'line', source: 'protomaps', 'source-layer': 'boundaries',
          filter: ['==', ['get', 'kind'], 'country'],
          paint: {
            'line-color': s.borderColor,
            'line-width': s.localCountryBorderWidth,
            'line-opacity': s.localCountryBorderOpacity,
          } },
        { id: 'boundaries-region', type: 'line', source: 'protomaps', 'source-layer': 'boundaries',
          filter: ['==', ['get', 'kind'], 'region'],
          paint: {
            'line-color': s.borderColor,
            'line-width': s.localRegionBorderWidth,
            'line-opacity': s.localRegionBorderOpacity,
          } },
        ...offlinePlaceLabelLayers(true),
      ],
    };
  }

  // Without the PMTiles archive the bundled Natural Earth outlines still give
  // the globe its coastlines, land, and borders.
  function buildMinimalOfflineStyle(isDark) {
    const s = resolvedDevSettings(isDark);
    return {
      version: 8,
      projection: { type: selectedProjection },
      sky: skyStyle(isDark),
      glyphs: LOCAL_GLYPHS_URL,
      sources: {
        [OFFLINE_WORLD_SOURCE_ID]: {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        },
        ...offlinePlaceSources(),
      },
      layers: [
        { id: 'ocean', type: 'background', paint: { 'background-color': s.oceanColor } },
        { id: 'earth', type: 'fill', source: OFFLINE_WORLD_SOURCE_ID,
          paint: { 'fill-color': s.landColor } },
        { id: 'boundaries-country', type: 'line', source: OFFLINE_WORLD_SOURCE_ID,
          paint: {
            'line-color': s.borderColor,
            'line-width': s.localCountryBorderWidth,
            'line-opacity': s.localCountryBorderOpacity,
          } },
        ...offlinePlaceLabelLayers(false),
      ],
    };
  }

  function loadOfflineWorld() {
    if (!offlineWorldPromise) {
      offlineWorldPromise = fetch(OFFLINE_WORLD_URL, { cache: 'force-cache' })
        .then((response) => {
          if (!response.ok) throw new Error(`offline world failed: ${response.status}`);
          return response.json();
        })
        .then((data) => ({
          type: 'FeatureCollection',
          // Every bundled outline is a closed ring; fill each as land.
          features: (data && data.features || []).flatMap((feature) => {
            const geometry = feature && feature.geometry || {};
            const rings = geometry.type === 'MultiLineString'
              ? geometry.coordinates
              : (geometry.type === 'LineString' ? [geometry.coordinates] : []);
            return (rings || []).map((ring) => ({
              type: 'Feature',
              properties: {},
              geometry: { type: 'Polygon', coordinates: [ring] },
            }));
          }),
        }))
        .catch((error) => {
          offlineWorldPromise = null;
          throw error;
        });
    }
    return offlineWorldPromise;
  }

  function syncOfflineWorld() {
    if (!map || !map.getSource(OFFLINE_WORLD_SOURCE_ID)) return;
    loadOfflineWorld()
      .then((data) => {
        const source = map && map.getSource(OFFLINE_WORLD_SOURCE_ID);
        if (source) source.setData(data);
      })
      .catch(() => {});
  }

  function buildStyle(_isDark) {
    if (USE_MINIMAL_BASEMAP) return buildMinimalOfflineStyle(_isDark);
    if (USE_LOCAL_BASEMAP && LOCAL_VECTOR_TILE_URL) return buildLocalPmtilesStyle(LOCAL_VECTOR_TILE_URL, _isDark);
    return BASE_VECTOR_STYLE ? prepareBaseStyleForTheme(BASE_VECTOR_STYLE, _isDark) : BASE_VECTOR_STYLE_URL;
  }

  function skyStyle(isDark) {
    const s = resolvedDevSettings(isDark);
    return {
      'sky-color': s.pageBg,
      'horizon-color': s.pageBg,
      'fog-color': s.pageBg,
      'fog-ground-blend': 0,
      'horizon-fog-blend': 0,
      'sky-horizon-blend': 0,
      'atmosphere-blend': 0,
    };
  }

  function prepareBaseStyleForTheme(style, isDark) {
    const s = resolvedDevSettings(isDark);
    const next = JSON.parse(JSON.stringify(style));
    next.projection = { type: selectedProjection };
    next.sky = skyStyle(isDark);
    next.light = Object.assign({ anchor: 'map', position: [1.5, 90, 80] }, next.light || {});
    for (const layer of next.layers || []) {
      const layerId = String(layer && layer.id || '');
      if (HIDE_LAYER_IDS.has(layerId) || hasHiddenPrefix(layerId)) {
        layer.layout = Object.assign({}, layer.layout || {}, { visibility: 'none' });
      }
      if (layer && layer.type === 'background') {
        layer.paint = Object.assign({}, layer.paint || {}, { 'background-color': s.landColor });
      }
      if (layer && layer.id === 'natural_earth') {
        layer.layout = Object.assign({}, layer.layout || {}, { visibility: 'none' });
      }
    }
    return next;
  }

  function loadBaseVectorStyle(timeoutMs) {
    if (BASE_VECTOR_STYLE) return Promise.resolve(BASE_VECTOR_STYLE);
    if (!window.fetch) return Promise.reject(new Error('fetch unavailable'));
    const controller = window.AbortController ? new AbortController() : null;
    let timedOut = false;
    const timeout = timeoutMs > 0 ? window.setTimeout(() => {
      timedOut = true;
      if (controller) controller.abort();
    }, timeoutMs) : null;
    return fetch(BASE_VECTOR_STYLE_URL, {
      cache: 'default',
      signal: controller ? controller.signal : undefined,
    })
      .then((response) => {
        if (!response.ok) throw new Error(`style fetch failed: ${response.status}`);
        return response.json();
      })
      .then((style) => {
        BASE_VECTOR_STYLE = style;
        return style;
      })
      .catch((error) => {
        if (timedOut) throw new Error('style fetch timed out');
        throw error;
      })
      .finally(() => {
        if (timeout != null) window.clearTimeout(timeout);
      });
  }

  function printCaptureAbortError() {
    const error = new Error('print atlas capture aborted');
    error.name = 'AbortError';
    return error;
  }

  function throwIfPrintCaptureAborted(signal) {
    if (signal && signal.aborted) throw printCaptureAbortError();
  }

  const atlasGrayscaleCache = new Map();
  const atlasColorCanvas = document.createElement('canvas');
  atlasColorCanvas.width = 1;
  atlasColorCanvas.height = 1;
  const atlasColorContext = atlasColorCanvas.getContext('2d', {
    alpha: true,
    willReadFrequently: true,
  });

  function grayscaleAtlasColor(value) {
    if (typeof value !== 'string' || !value) return value;
    const cacheKey = `${IS_DARK ? 'print-light' : 'desaturate'}:${value}`;
    if (atlasGrayscaleCache.has(cacheKey)) {
      return atlasGrayscaleCache.get(cacheKey);
    }
    if (
      !atlasColorContext ||
      !window.CSS ||
      typeof CSS.supports !== 'function' ||
      !CSS.supports('color', value)
    ) {
      atlasGrayscaleCache.set(cacheKey, value);
      return value;
    }
    atlasColorContext.clearRect(0, 0, 1, 1);
    atlasColorContext.fillStyle = value;
    atlasColorContext.fillRect(0, 0, 1, 1);
    const rgba = atlasColorContext.getImageData(0, 0, 1, 1).data;
    const luminance = Math.round(
      rgba[0] * 0.2126 +
      rgba[1] * 0.7152 +
      rgba[2] * 0.0722
    );
    const gray = IS_DARK
      ? Math.round(246 - luminance * 0.72)
      : luminance;
    const converted = `rgba(${gray},${gray},${gray},${rgba[3] / 255})`;
    atlasGrayscaleCache.set(cacheKey, converted);
    return converted;
  }

  function grayscaleAtlasColorValue(value) {
    if (Array.isArray(value)) {
      return value.map((entry) => grayscaleAtlasColorValue(entry));
    }
    return grayscaleAtlasColor(value);
  }

  function grayscaleAtlasObjectColors(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) return value;
    const next = {};
    for (const [key, entry] of Object.entries(value)) {
      if (key.includes('color') || key.endsWith('-gradient')) {
        next[key] = grayscaleAtlasColorValue(entry);
      }
      else if (entry && typeof entry === 'object' && !Array.isArray(entry)) {
        next[key] = grayscaleAtlasObjectColors(entry);
      } else {
        next[key] = entry;
      }
    }
    return next;
  }

  function isColoredAtlasOverlayLayer(layer) {
    if (!layer) return false;
    return [
      ACG_SOURCE_ID,
      ACG_LABEL_SOURCE_ID,
      ACG_CHIP_SOURCE_ID,
      ECLIPSE_SOURCE_ID,
      ASTERISM_SOURCE_ID,
    ].includes(String(layer.source || ''));
  }

  function applyPrintAtlasOverlayContrast(style) {
    const layerById = new Map(
      (style.layers || []).map((layer) => [String(layer && layer.id || ''), layer]),
    );
    const casing = layerById.get('acg-casing');
    if (casing && casing.paint) {
      casing.paint['line-color'] = PRINT_ATLAS_OVERLAY_HALO;
    }
    const zeniths = layerById.get('acg-zeniths');
    if (zeniths && zeniths.paint) {
      zeniths.paint['circle-stroke-color'] = PRINT_ATLAS_OVERLAY_HALO;
    }
    const lineLabels = layerById.get('acg-labels');
    if (lineLabels && lineLabels.paint) {
      lineLabels.paint['text-color'] = PRINT_ATLAS_LABEL_COLOR;
    }
    // Inline kind glyphs are drawn in the label colours, so print names them
    // with the print colours.
    if (lineLabels && lineLabels.layout && !acgLineLabelGlyphs()) {
      lineLabels.layout['text-field'] = acgLineLabelExpression(true);
    }
    for (const layer of style.layers || []) {
      if (
        !layer ||
        !isColoredAtlasOverlayLayer(layer) ||
        !layer.paint ||
        !Object.prototype.hasOwnProperty.call(layer.paint, 'text-halo-color')
      ) continue;
      layer.paint['text-halo-color'] = PRINT_ATLAS_OVERLAY_HALO;
    }
  }

  function printAtlasVisibilityState(selection) {
    const state = JSON.parse(JSON.stringify(viewOptions));
    const source = selection && typeof selection === 'object' ? selection : null;
    if (!source) return state;
    if (Object.prototype.hasOwnProperty.call(source, 'pointIds')) {
      state.filters.points = normalizedVisibilitySelection(source.pointIds);
    }
    if (Object.prototype.hasOwnProperty.call(source, 'lineKinds')) {
      const kinds = normalizedVisibilitySelection(source.lineKinds) || [];
      state.filters.kinds = kinds;
      state.parans = kinds.includes('paran');
      state.aspects = kinds.includes('aspect');
      state.localSpaceOppositions = kinds.includes('local_space_opposition');
      state.zeniths = kinds.includes('zenith');
    }
    if (Object.prototype.hasOwnProperty.call(source, 'aspectIds')) {
      state.filters.aspects = normalizedVisibilitySelection(source.aspectIds);
    }
    if (Object.prototype.hasOwnProperty.call(source, 'layerKinds')) {
      const layers = normalizedVisibilitySelection(source.layerKinds) || [];
      for (const role of ['natal', 'transit', 'progression']) {
        state.layers[role] = layers.includes(role);
      }
    }
    if (typeof source.includeZenith === 'boolean') {
      state.zeniths = source.includeZenith;
    }
    return state;
  }

  function applyPrintAtlasVisibility(style, visibility) {
    const layerById = new Map(
      (style.layers || []).map((layer) => [String(layer && layer.id || ''), layer]),
    );
    for (const [id, filter] of [
      ['acg-casing', acgCasingFilter(visibility)],
      ['acg-lines-solid', acgSolidFilter(visibility)],
      ['acg-lines-dashed', acgDashedFilter(visibility)],
      ['acg-local-space-oppositions', acgLocalSpaceOppositionFilter(visibility)],
      ['acg-aspects', acgAspectFilter(visibility)],
      ['acg-parans', acgParanFilter(visibility)],
      ['acg-zeniths', acgZenithFilter(visibility)],
      ['acg-labels', acgLabelFilter(visibility)],
      ['acg-zenith-labels', acgZenithFilter(visibility)],
      ['acg-paran-labels', acgParanFilter(visibility)],
    ]) {
      const layer = layerById.get(id);
      if (layer) layer.filter = filter;
    }
    for (const [id, visible] of [
      ['acg-local-space-oppositions', visibility.localSpaceOppositions],
      ['acg-aspects', visibility.aspects],
      ['acg-parans', visibility.parans],
      ['acg-paran-labels', visibility.parans && currentDevSettings().paranLabelsOn],
      ['acg-zeniths', visibility.zeniths],
      ['acg-zenith-labels', visibility.zeniths && currentDevSettings().labelsOn],
      ['acg-labels', currentDevSettings().labelsOn],
    ]) {
      const layer = layerById.get(id);
      if (!layer) continue;
      layer.layout = Object.assign({}, layer.layout || {}, {
        visibility: visible ? 'visible' : 'none',
      });
    }
  }

  function definedLayoutEntries(layout) {
    return Object.fromEntries(
      Object.entries(layout).filter(([, value]) => value !== undefined),
    );
  }

  // Print chips use light cards (the copied layout names screen chips) and
  // follow the print selection; their anchors are placed per page.
  function applyPrintAtlasChips(style) {
    if (style.sources[ACG_CHIP_SOURCE_ID]) {
      style.sources[ACG_CHIP_SOURCE_ID].data = { type: 'FeatureCollection', features: [] };
    }
    const layerById = new Map(style.layers.map((layer) => [layer && layer.id, layer]));
    const glyphs = acgLineLabelGlyphs();
    for (const layer of style.layers) {
      if (!layer) continue;
      if (glyphs && ACG_CHIP_LAYER_IDS.includes(layer.id)) {
        layer.layout = definedLayoutEntries(Object.assign(
          {},
          layer.layout || {},
          acgChipLayout(layer.id, true),
        ));
      }
      const anchored = ACG_CHIP_ANCHOR_LAYERS.find(([id]) => id === layer.id);
      if (!anchored) continue;
      const twin = layerById.get(anchored[1]);
      const visible = glyphs && !!twin &&
        !(twin.layout && twin.layout.visibility === 'none');
      layer.layout = definedLayoutEntries(Object.assign(
        {},
        layer.layout || {},
        acgChipAnchorLayout(layer.id, true),
        { visibility: visible ? 'visible' : 'none' },
      ));
      if (twin && twin.filter) layer.filter = acgChipAnchorFilter(twin.filter);
    }
  }

  function snapshotPrecisePrintGeojson(geojson) {
    if (
      !geojson ||
      typeof geojson !== 'object' ||
      geojson.type !== 'FeatureCollection' ||
      !Array.isArray(geojson.features) ||
      !geojson.meta ||
      geojson.meta.precision !== 'precise'
    ) {
      throw new Error('print atlas requires precise GeoJSON');
    }
    let snapshot = null;
    try {
      snapshot = JSON.parse(JSON.stringify(geojson));
    } catch (_) {
      throw new Error('print atlas requires valid precise GeoJSON');
    }
    if (
      !snapshot ||
      snapshot.type !== 'FeatureCollection' ||
      !Array.isArray(snapshot.features) ||
      !snapshot.meta ||
      snapshot.meta.precision !== 'precise'
    ) {
      throw new Error('print atlas requires valid precise GeoJSON');
    }
    return snapshot;
  }

  function applyPrintAtlasCities(style) {
    // Provider zoom thresholds are tuned for a screen, not a regional sheet.
    // Use the same bundled city catalog and native symbol collision engine for
    // both online and offline exports; suppress duplicate provider place names.
    for (const layer of style.layers) {
      if ([...CITY_LABEL_LAYER_IDS, ...MINOR_PLACE_LABEL_LAYER_IDS].includes(layer.id)) {
        layer.layout = Object.assign({}, layer.layout || {}, { visibility: 'none' });
      }
    }
    const source = style.sources[OFFLINE_PLACES_SOURCE_ID] ? OFFLINE_PLACES_SOURCE_ID : 'print-cities';
    if (!style.sources[source]) {
      style.sources[source] = {
        type: 'geojson',
        data: new URL('places.geojson', location.href).href,
      };
    }
    const overlayIndex = style.layers.findIndex(isColoredAtlasOverlayLayer);
    style.layers.splice(overlayIndex < 0 ? style.layers.length : overlayIndex, 0, {
      id: 'print-cities', type: 'symbol', source,
      filter: ['any', ['==', ['get', 'level'], 0], ['>=', ['get', 'population'], 1000000]],
      layout: {
        'text-field': SIMPLE_PLACE_NAME,
        'text-font': ['Noto Sans Regular'],
        'text-size': 11.5,
        'text-max-width': 8,
        'text-padding': 12,
        'text-variable-anchor': ['center', 'top', 'bottom', 'left', 'right'],
        'text-radial-offset': 0.4,
        'text-allow-overlap': false,
        'text-ignore-placement': false,
        'symbol-sort-key': ['-', ['get', 'population']],
      },
      paint: {
        'text-color': PRINT_ATLAS_LABEL_COLOR,
        'text-halo-color': PRINT_ATLAS_OVERLAY_HALO,
        'text-halo-width': 1,
        'text-halo-blur': 0,
      },
    });
  }

  // A fixed paper palette keeps exports independent of the screen theme.
  // Only geography is restyled: astrology retains its semantic colours.
  function applyNauticalPrintBasemap(style) {
    const ink = '#262c30';
    const land = '#eee7cf';
    const water = '#e1f1f4';
    if (style.sky) {
      for (const key of ['sky-color', 'horizon-color', 'fog-color']) style.sky[key] = '#ffffff';
    }
    for (const layer of style.layers) {
      if (isColoredAtlasOverlayLayer(layer)) continue;
      const id = String(layer.id || '');
      const paint = layer.paint || (layer.paint = {});
      if (layer.type === 'background') {
        paint['background-color'] = id === 'ocean' ? water : land;
      } else if (layer.type === 'fill') {
        paint['fill-color'] = /water/.test(id) ? water
          : /park|landcover/.test(id) ? '#dce4cf'
          : /building/.test(id) ? '#b0aea2' : land;
        if (id === 'earth' || id === 'water') paint['fill-opacity'] = 1;
      } else if (layer.type === 'line') {
        const boundary = /boundar/.test(id);
        const region = /region|boundary_3/.test(id);
        paint['line-color'] = /water/.test(id) ? '#738f98'
          : region ? '#85877c' : boundary ? '#525850' : '#77776e';
        paint['line-opacity'] = 1;
        if (boundary) {
          paint['line-width'] = region ? 0.45 : 0.75;
          paint['line-dasharray'] = region ? [2, 2] : [5, 2];
          if (layer.source === OFFLINE_WORLD_SOURCE_ID) {
            paint['line-color'] = ink;
            delete paint['line-dasharray'];
          }
        }
      } else if (layer.type === 'symbol') {
        paint['text-color'] = /water/.test(id) ? '#426572' : ink;
        paint['text-opacity'] = 1;
        paint['text-halo-color'] = /water/.test(id) ? water : land;
        paint['text-halo-width'] = 0.8;
        paint['text-halo-blur'] = 0;
      }
    }
    // Trace the provider's actual water polygons, including islands/lakes.
    // The minimal offline map already draws its Natural Earth outlines.
    const waterLayer = style.layers.find((layer) => layer.id === 'water' && layer.type === 'fill');
    if (waterLayer) {
      const coast = {
        id: 'print-coastline', type: 'line', source: waterLayer.source,
        layout: { visibility: (waterLayer.layout || {}).visibility || 'visible' },
        paint: { 'line-color': ink, 'line-width': 0.75, 'line-opacity': 1 },
      };
      for (const key of ['source-layer', 'filter', 'minzoom', 'maxzoom']) {
        if (waterLayer[key] !== undefined) coast[key] = waterLayer[key];
      }
      style.layers.splice(style.layers.indexOf(waterLayer) + 1, 0, coast);
    }
    const coordinates = [];
    for (let lon = -180; lon < 180; lon += 15) {
      coordinates.push(Array.from({ length: 171 }, (_, i) => [lon, i - 85]));
    }
    for (let lat = -75; lat <= 75; lat += 15) {
      coordinates.push(Array.from({ length: 361 }, (_, i) => [i - 180, lat]));
    }
    style.sources['print-graticule'] = { type: 'geojson', data: {
      type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates },
    } };
    const overlayIndex = style.layers.findIndex((layer) => (
      layer.type === 'symbol' || isColoredAtlasOverlayLayer(layer)
    ));
    style.layers.splice(overlayIndex < 0 ? style.layers.length : overlayIndex, 0, {
      id: 'print-graticule', type: 'line', source: 'print-graticule',
      paint: { 'line-color': '#7d8888', 'line-width': 0.4, 'line-opacity': 0.6 },
    });
  }

  function activeStyleForPrintAtlas(selection, scene, scope = 'world') {
    if (!map || typeof map.getStyle !== 'function') {
      throw new Error('active map style unavailable');
    }
    const style = JSON.parse(JSON.stringify(map.getStyle()));
    if (!style || !Array.isArray(style.layers) || !style.sources) {
      throw new Error('active map style unavailable');
    }
    if (style.sources[ACG_SOURCE_ID]) {
      style.sources[ACG_SOURCE_ID].data = scene.mapData;
    }
    if (style.sources[ACG_LABEL_SOURCE_ID]) {
      style.sources[ACG_LABEL_SOURCE_ID].data = scene.mapData;
    }
    if (style.sources[ASTERISM_SOURCE_ID]) {
      style.sources[ASTERISM_SOURCE_ID].data = scene.mapAsterismData;
    }
    if (style.sources[ECLIPSE_SOURCE_ID]) {
      style.sources[ECLIPSE_SOURCE_ID].data = scene.mapEclipseData;
    }
    for (const layer of style.layers) {
      if (
        !layer ||
        (
          isColoredAtlasOverlayLayer(layer) &&
          !String(layer.id || '').startsWith('acg-reference-')
        )
      ) continue;
      layer.paint = grayscaleAtlasObjectColors(layer.paint || {});
      if (
        scope !== 'current' && Object.keys(layer.paint).some((key) => key.endsWith('-pattern'))
      ) {
        layer.layout = Object.assign({}, layer.layout || {}, {
          visibility: 'none',
        });
        continue;
      }
      if (scope !== 'current' && layer.type === 'symbol' && layer.layout && layer.layout['icon-image']) {
        layer.paint['icon-opacity'] = 0;
      }
      if (layer.type === 'raster') {
        layer.paint['raster-saturation'] = -1;
      }
    }
    if (style.sky) style.sky = grayscaleAtlasObjectColors(style.sky);
    if (style.light) style.light = grayscaleAtlasObjectColors(style.light);
    if (style.fog) style.fog = grayscaleAtlasObjectColors(style.fog);
    applyNauticalPrintBasemap(style);
    applyPrintAtlasOverlayContrast(style);
    applyPrintAtlasVisibility(style, printAtlasVisibilityState(selection));
    applyPrintAtlasChips(style);
    if (scope !== 'current') applyPrintAtlasCities(style);
    return style;
  }

  function encodePrintCanvas(canvasElement, signal) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        if (signal) signal.removeEventListener('abort', onAbort);
        callback(value);
      };
      const onAbort = () => finish(reject, printCaptureAbortError());
      if (signal && signal.aborted) {
        onAbort();
        return;
      }
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
      canvasElement.toBlob((blob) => {
        if (settled || (signal && signal.aborted)) return;
        if (!blob) {
          finish(reject, new Error('print map encoding failed'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => finish(
          reject,
          new Error('print atlas encoding failed'),
        );
        reader.onload = () => finish(resolve, String(reader.result || ''));
        reader.readAsDataURL(blob);
      }, 'image/png');
    });
  }

  function printAtlasDataUrlBytes(dataUrl) {
    if (
      typeof dataUrl !== 'string' ||
      !dataUrl.startsWith(PRINT_ATLAS_PNG_DATA_URL_PREFIX) ||
      dataUrl.length > PRINT_ATLAS_MAX_PAGE_URL_CHARS
    ) {
      throw new Error('print atlas page is outside the size limit');
    }
    const encodedLength = dataUrl.length - PRINT_ATLAS_PNG_DATA_URL_PREFIX.length;
    const padding = dataUrl.endsWith('==') ? 2 : (dataUrl.endsWith('=') ? 1 : 0);
    if (encodedLength < 4 || encodedLength % 4 !== 0) {
      throw new Error('print atlas encoding failed');
    }
    const bytes = encodedLength / 4 * 3 - padding;
    if (bytes < 1 || bytes > PRINT_ATLAS_MAX_PAGE_BYTES) {
      throw new Error('print atlas page is outside the size limit');
    }
    return bytes;
  }

  function normalizedAtlasLongitude(longitude) {
    const wrapped = ((Number(longitude) + 180) % 360 + 360) % 360 - 180;
    return Math.abs(wrapped + 180) < 1e-9 ? -180 : wrapped;
  }

  function renderPrintAtlasPolarOverlay(printMap, visibility, scene) {
    const overlayCanvas = document.createElement('canvas');
    const tokens = Object.assign({}, currentThemeTokens(), {
      casing: PRINT_ATLAS_OVERLAY_HALO,
      labelColor: PRINT_ATLAS_LABEL_COLOR,
      labelHalo: PRINT_ATLAS_OVERLAY_HALO,
    });
    return renderPolarOverlay(printMap, {
      canvas: overlayCanvas,
      visibility,
      settings: currentDevSettings(),
      tokens,
      behavior: referenceBehavior(),
      referenceColorTransform: grayscaleAtlasColor,
      updateHitTargets: false,
      paths: scene.polarPaths,
      points: scene.polarPoints,
      polygons: scene.polarPolygons,
    });
  }

  function printAtlasProjectedPoint(printMap, coordinate) {
    if (
      !printMap ||
      !Array.isArray(coordinate) ||
      coordinate.length < 2 ||
      !Number.isFinite(Number(coordinate[0])) ||
      !Number.isFinite(Number(coordinate[1]))
    ) return null;
    const projection = printMap.getProjection && printMap.getProjection();
    if (
      projection &&
      projection.type === 'globe' &&
      !isPolarCoordinateVisible(coordinate, printMap.getCenter(), printMap)
    ) return null;
    try {
      const point = printMap.project(coordinate);
      const width = Number(printMap.transform && printMap.transform.width) || 0;
      const height = Number(printMap.transform && printMap.transform.height) || 0;
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y) ||
        point.x < 0 ||
        point.y < 0 ||
        (width && point.x > width) ||
        (height && point.y > height)
      ) return null;
      return point;
    } catch (_) {
      return null;
    }
  }

  function drawPrintAtlasReferenceLabels(context, printMap, scene) {
    const behavior = referenceBehavior();
    const settings = currentDevSettings();
    for (const feature of scene.asterismData.features || []) {
      const properties = feature && feature.properties || {};
      const geometry = feature && feature.geometry || {};
      const coordinate = geometry.coordinates;
      const isEclipticSign =
        properties.kind === 'REFERENCE_ZODIAC_SIGN' &&
        !!behavior.showEcliptic;
      const isPoleSign =
        properties.kind === 'REFERENCE_ZODIAC_POLE_SIGN' &&
        !!behavior.showZodiacLines;
      const isHouseNumber =
        properties.kind === 'REFERENCE_HOUSE_POLE_LABEL' &&
        !!behavior.showHouseLines;
      if (
        geometry.type !== 'Point' ||
        !(isEclipticSign || isPoleSign || isHouseNumber)
      ) continue;
      const point = printAtlasProjectedPoint(printMap, coordinate);
      if (!point) continue;
      let text = '';
      let size = settings.referenceSignSize;
      let opacity = settings.referenceSignOpacity;
      let haloWidth = settings.referenceSignHaloWidth;
      let color = settings.referenceZodiacGridColor;
      let font = "'Morinus', serif";
      if (isHouseNumber) {
        text = String(properties.label || properties.house || '');
        size = settings.referencePoleHouseSize;
        opacity = settings.referencePoleLabelOpacity;
        haloWidth = settings.referencePoleLabelHaloWidth;
        color = houseReferenceColor(Number(properties.house), settings);
        font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      } else {
        const signStyle =
          ACTIVE_ASTROCART_STYLE &&
          ACTIVE_ASTROCART_STYLE.points &&
          ACTIVE_ASTROCART_STYLE.points[`zodiac_sign_${properties.sign}`];
        text = String(
          signStyle && signStyle.glyphMorinus || properties.glyph || '',
        );
        if (isPoleSign) {
          size = settings.referencePoleSignSize;
          opacity = settings.referencePoleLabelOpacity;
          haloWidth = settings.referencePoleLabelHaloWidth;
        }
        color = zodiacReferenceColor(Number(properties.sign), settings);
      }
      if (!text) continue;
      context.save();
      context.globalAlpha = Math.max(0, Math.min(1, Number(opacity) || 0));
      context.font = `${isHouseNumber ? '600 ' : ''}${size}px ${font}`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineJoin = 'round';
      context.strokeStyle = PRINT_ATLAS_OVERLAY_HALO;
      context.lineWidth = Math.max(1, (Number(haloWidth) || 0) * 2);
      context.strokeText(text, point.x, point.y);
      context.fillStyle = grayscaleAtlasColor(color);
      context.fillText(text, point.x, point.y);
      context.restore();
    }
  }

  function drawPrintAtlasBirthplaceMarker(context, printMap, scene) {
    const coordinate = birthplaceCoordinates(scene.data);
    const point = printAtlasProjectedPoint(printMap, coordinate);
    if (!point) return;
    context.save();
    context.font =
      "700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.lineJoin = 'round';
    context.strokeStyle = PRINT_ATLAS_OVERLAY_HALO;
    context.lineWidth = 3;
    context.strokeText('*', point.x, point.y);
    context.fillStyle = PRINT_ATLAS_LABEL_COLOR;
    context.fillText('*', point.x, point.y);
    context.restore();
  }

  function renderPrintAtlasSupplementOverlay(printMap, visibility, scene) {
    const projection = printMap.getProjection && printMap.getProjection();
    let overlayCanvas = null;
    if (projection && projection.type === 'globe') {
      overlayCanvas = renderPrintAtlasPolarOverlay(
        printMap,
        visibility,
        scene,
      );
    } else {
      overlayCanvas = document.createElement('canvas');
      if (!preparePolarOverlayCanvas(printMap, overlayCanvas)) return null;
    }
    const context = overlayCanvas && overlayCanvas.getContext('2d');
    if (!context) return overlayCanvas;
    drawPrintAtlasReferenceLabels(context, printMap, scene);
    drawPrintAtlasBirthplaceMarker(context, printMap, scene);
    return overlayCanvas;
  }

  function compositePrintAtlasCanvas(baseCanvas, overlayCanvas) {
    if (!overlayCanvas) return baseCanvas;
    const composite = document.createElement('canvas');
    composite.width = baseCanvas.width;
    composite.height = baseCanvas.height;
    const context = composite.getContext('2d', { alpha: false });
    if (!context) throw new Error('print atlas compositor unavailable');
    context.drawImage(baseCanvas, 0, 0);
    context.drawImage(
      overlayCanvas,
      0,
      0,
      baseCanvas.width,
      baseCanvas.height,
    );
    return composite;
  }

  function printAtlasRegionalGrid(originLongitude, originLatitude) {
    // Use MapLibre's own projected coordinates: equal latitude increments are
    // not equal page heights in Mercator. The default band covers inhabited
    // continents without spending pages on exaggerated polar areas.
    const mercator = maplibregl.MercatorCoordinate;
    const south = Math.max(-85, Math.min(PRINT_ATLAS_SOUTH, originLatitude - 2));
    const north = Math.min(85, Math.max(PRINT_ATLAS_NORTH, originLatitude + 2));
    const northY = mercator.fromLngLat([0, north]).y;
    const southY = mercator.fromLngLat([0, south]).y;
    const originY = mercator.fromLngLat([0, Math.max(-85, Math.min(85, originLatitude))]).y;
    const preferredWorldSize = 512 * 2 ** PRINT_ATLAS_PREFERRED_DETAIL_ZOOM;
    const rowCount = Math.ceil(
      (southY - northY) * preferredWorldSize / PRINT_ATLAS_LOGICAL_HEIGHT,
    );
    // Fit the band exactly, allowing ten percent overlap between rows. This
    // slightly relaxes the preferred scale rather than adding a near-empty row.
    const sheetHeight = (southY - northY) /
      (rowCount - (rowCount - 1) * PRINT_ATLAS_OVERLAP);
    const worldSize = PRINT_ATLAS_LOGICAL_HEIGHT / sheetHeight;
    const columnCount = Math.ceil(
      worldSize / (PRINT_ATLAS_LOGICAL_WIDTH * (1 - PRINT_ATLAS_OVERLAP)),
    );
    const zoom = Math.log2(worldSize / 512);
    const rows = Array.from({ length: rowCount }, (_, row) => ({
      row,
      y: northY + sheetHeight / 2 + row * sheetHeight * (1 - PRINT_ATLAS_OVERLAP),
    })).sort((a, b) => Math.abs(a.y - originY) - Math.abs(b.y - originY));
    const cells = [];
    for (let column = 0; column < columnCount; column += 1) {
      const longitude = normalizedAtlasLongitude(originLongitude - column * 360 / columnCount);
      for (const { row, y } of rows) {
        cells.push({
          center: [longitude, new mercator(0, y).toLngLat().lat],
          zoom,
          sheetId: `${String.fromCharCode(65 + column)}${row + 1}`,
          grid: { column, row, columns: columnCount, rows: rowCount },
        });
      }
    }
    return cells;
  }

  function printAtlasPageSpecs(pageFormat, data, scope = 'world') {
    const targetWidth = String(pageFormat || '').toUpperCase() === 'A3'
      ? 4096
      : 3508;
    const targetHeight = Math.round(
      targetWidth * PRINT_ATLAS_LOGICAL_HEIGHT / PRINT_ATLAS_LOGICAL_WIDTH,
    );
    const currentCenter = map.getCenter();
    const birthplace = birthplaceCoordinates(data);
    const originLongitude = normalizedAtlasLongitude(birthplace ? birthplace[0] : currentCenter.lng);
    const originLatitude = birthplace ? birthplace[1] : currentCenter.lat;
    const currentProjection = map.getProjection();
    const liveWidth = Math.max(
      1,
      Number(map.transform && map.transform.width) ||
      Number(map.getCanvas() && map.getCanvas().clientWidth) ||
      PRINT_ATLAS_LOGICAL_WIDTH,
    );
    const liveHeight = Math.max(
      1,
      Number(map.transform && map.transform.height) ||
      Number(map.getCanvas() && map.getCanvas().clientHeight) ||
      PRINT_ATLAS_LOGICAL_HEIGHT,
    );
    if (scope === 'current') {
      const resolutionScale = targetWidth / Math.max(liveWidth, liveHeight);
      return [{
        role: 'overview',
        projection: (currentProjection && currentProjection.type) || selectedProjection || 'globe',
        center: [normalizedAtlasLongitude(currentCenter.lng), currentCenter.lat],
        zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch(),
        logicalWidth: liveWidth, logicalHeight: liveHeight,
        targetWidth: Math.round(liveWidth * resolutionScale),
        targetHeight: Math.round(liveHeight * resolutionScale),
        containsAstrology: true,
      }];
    }
    const overviewScale = Math.min(
      PRINT_ATLAS_LOGICAL_WIDTH / liveWidth,
      PRINT_ATLAS_LOGICAL_HEIGHT / liveHeight,
    );
    const pages = [{
      role: 'overview',
      projection: (
        currentProjection && currentProjection.type
      ) || selectedProjection || 'globe',
      center: [
        originLongitude,
        Math.max(-90, Math.min(90, originLatitude)),
      ],
      zoom: Math.max(
        -2,
        Math.min(
          30,
          map.getZoom() + Math.log2(Math.max(0.01, overviewScale)),
        ),
      ),
      bearing: map.getBearing(),
      pitch: map.getPitch(),
      targetWidth,
      targetHeight,
      containsAstrology: true,
    }];
    for (const cell of printAtlasRegionalGrid(originLongitude, originLatitude)) {
      pages.push({
        role: 'detail',
        title: '',
        projection: 'mercator',
        bearing: 0,
        pitch: 0,
        targetWidth,
        targetHeight,
        containsAstrology: true,
        ...cell,
      });
    }
    return pages;
  }

  function atlasDistanceKm(a, b) {
    const radians = Math.PI / 180;
    const lat1 = Number(a.lat) * radians;
    const lat2 = Number(b.lat) * radians;
    const deltaLat = (Number(b.lat) - Number(a.lat)) * radians;
    const deltaLon = (Number(b.lng) - Number(a.lng)) * radians;
    const sinLat = Math.sin(deltaLat / 2);
    const sinLon = Math.sin(deltaLon / 2);
    const haversine = (
      sinLat * sinLat +
      Math.cos(lat1) * Math.cos(lat2) * sinLon * sinLon
    );
    return 6371.0088 * 2 * Math.atan2(
      Math.sqrt(haversine),
      Math.sqrt(Math.max(0, 1 - haversine)),
    );
  }

  function printAtlasPageMetadata(printMap, page) {
    const bounds = printMap.getBounds();
    const logicalWidth = printMap.transform.width;
    const centerY = printMap.transform.height / 2;
    const scaleStart = printMap.unproject([
      logicalWidth * 0.4,
      centerY,
    ]);
    const scaleEnd = printMap.unproject([
      logicalWidth * 0.6,
      centerY,
    ]);
    return {
      bounds: [
        [normalizedAtlasLongitude(bounds.getWest()), bounds.getSouth()],
        [normalizedAtlasLongitude(bounds.getEast()), bounds.getNorth()],
      ],
      scaleKm: atlasDistanceKm(scaleStart, scaleEnd),
      neighbors: page.grid ? {
        north: page.grid.row > 0
          ? `${String.fromCharCode(65 + page.grid.column)}${page.grid.row}`
          : null,
        east: `${String.fromCharCode(
          65 + (page.grid.column + page.grid.columns - 1) % page.grid.columns,
        )}${page.grid.row + 1}`,
        south: page.grid.row + 1 < page.grid.rows
          ? `${String.fromCharCode(65 + page.grid.column)}${page.grid.row + 2}`
          : null,
        west: `${String.fromCharCode(
          65 + (page.grid.column + 1) % page.grid.columns,
        )}${page.grid.row + 1}`,
      } : undefined,
    };
  }

  function waitForPrintAtlasIdle(printMap, signal) {
    return new Promise((resolve, reject) => {
      let settled = false;
      let timeout = null;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        if (timeout != null) window.clearTimeout(timeout);
        if (signal) signal.removeEventListener('abort', onAbort);
        printMap.off('idle', onIdle);
        callback(value);
      };
      const onAbort = () => finish(reject, printCaptureAbortError());
      const onIdle = () => finish(resolve);
      if (signal && signal.aborted) {
        onAbort();
        return;
      }
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
      printMap.once('idle', onIdle);
      timeout = window.setTimeout(
        () => finish(reject, new Error('print atlas page timed out')),
        PRINT_ATLAS_PAGE_TIMEOUT_MS,
      );
      printMap.triggerRepaint();
    });
  }

  function waitForPrintAtlasLoad(printMap, signal) {
    return new Promise((resolve, reject) => {
      let settled = false;
      let timeout = null;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        if (timeout != null) window.clearTimeout(timeout);
        if (signal) signal.removeEventListener('abort', onAbort);
        printMap.off('load', onLoad);
        callback(value);
      };
      const onAbort = () => finish(reject, printCaptureAbortError());
      const onLoad = () => finish(resolve);
      if (signal && signal.aborted) {
        onAbort();
        return;
      }
      if (signal) signal.addEventListener('abort', onAbort, { once: true });
      printMap.once('load', onLoad);
      timeout = window.setTimeout(
        () => finish(reject, new Error('print atlas style timed out')),
        PRINT_ATLAS_PAGE_TIMEOUT_MS,
      );
    });
  }

  async function capturePrintAtlas(pageFormat, selection, geojson, signal, scope = 'world') {
    if (!window.maplibregl || !map || !mapReady) {
      throw new Error('active map renderer unavailable');
    }
    throwIfPrintCaptureAborted(signal);
    const preciseData = snapshotPrecisePrintGeojson(geojson);
    if (ACTIVE_ASTROCART_STYLE) {
      applyDisplayStyleToData(preciseData, ACTIVE_ASTROCART_STYLE);
    }
    const startedAt = performance.now();
    const pageSpecs = printAtlasPageSpecs(pageFormat, preciseData, scope);
    const printScene = buildRuntimeOverlayScene(
      preciseData,
      currentAsterismData,
      currentEclipseData,
      pageSpecs[0].projection,
    );
    const targetWidth = pageSpecs[0].targetWidth;
    const targetHeight = pageSpecs[0].targetHeight;
    const logicalWidth = pageSpecs[0].logicalWidth || PRINT_ATLAS_LOGICAL_WIDTH;
    const logicalHeight = pageSpecs[0].logicalHeight || PRINT_ATLAS_LOGICAL_HEIGHT;
    const pixelRatio = targetWidth / logicalWidth;
    const printVisibility = printAtlasVisibilityState(selection);
    const activeStyle = activeStyleForPrintAtlas(selection, printScene, scope);
    const host = document.createElement('div');
    host.setAttribute('aria-hidden', 'true');
    Object.assign(host.style, {
      position: 'fixed',
      left: '-10000px',
      top: '0',
      width: `${logicalWidth}px`,
      height: `${logicalHeight}px`,
      pointerEvents: 'none',
      zIndex: '-1',
    });
    document.body.appendChild(host);
    let printMap = null;
    try {
      const firstPage = pageSpecs[0];
      printMap = new maplibregl.Map({
        container: host,
        style: activeStyle,
        center: firstPage.center,
        zoom: firstPage.zoom,
        bearing: firstPage.bearing,
        pitch: firstPage.pitch,
        minZoom: -2,
        projection: { type: firstPage.projection },
        interactive: false,
        attributionControl: false,
        renderWorldCopies: true,
        fadeDuration: 0,
        pixelRatio,
        antialias: true,
        preserveDrawingBuffer: true,
        canvasContextAttributes: {
          antialias: true,
          preserveDrawingBuffer: true,
        },
      });
      printMap.on('styleimagemissing', (event) => {
        provideAcgChipImage(printMap, event && event.id, pixelRatio);
        provideAcgInlineGlyphImage(printMap, event && event.id, pixelRatio);
      });
      await waitForPrintAtlasLoad(printMap, signal);
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      const pages = [];
      let atlasBytes = 0;
      for (const page of pageSpecs) {
        throwIfPrintCaptureAborted(signal);
        printMap.setProjection({ type: page.projection });
        printMap.jumpTo({
          center: page.center,
          zoom: page.zoom,
          bearing: page.bearing,
          pitch: page.pitch,
        });
        const chipSource = printMap.getSource(ACG_CHIP_SOURCE_ID);
        if (chipSource && acgLineLabelGlyphs()) {
          chipSource.setData({
            type: 'FeatureCollection',
            features: computeAcgChipAnchors(printMap, printScene.mapData, {
              print: true,
              shown: acgChipShownPredicate(
                printVisibility,
                printMap.getLayoutProperty('acg-chip-labels', 'visibility') !== 'none',
                printMap.getLayoutProperty('acg-chip-paran-labels', 'visibility') !== 'none',
              ),
            }),
          });
        }
        await waitForPrintAtlasIdle(printMap, signal);
        await new Promise((resolve) => window.requestAnimationFrame(() => {
          window.requestAnimationFrame(resolve);
        }));
        const canvas = printMap.getCanvas();
        if (!canvas.width || !canvas.height) {
          throw new Error('print atlas canvas is empty');
        }
        throwIfPrintCaptureAborted(signal);
        const renderedProjection = printMap.getProjection();
        const polarOverlayCanvas = renderPrintAtlasSupplementOverlay(
          printMap,
          printVisibility,
          printScene,
        );
        const captureCanvas = compositePrintAtlasCanvas(
          canvas,
          polarOverlayCanvas,
        );
        const captureWidth = captureCanvas.width;
        const captureHeight = captureCanvas.height;
        let dataUrl = '';
        try {
          dataUrl = await encodePrintCanvas(captureCanvas, signal);
          atlasBytes += printAtlasDataUrlBytes(dataUrl);
        } finally {
          if (polarOverlayCanvas) {
            polarOverlayCanvas.width = 1;
            polarOverlayCanvas.height = 1;
          }
          if (captureCanvas !== canvas) {
            captureCanvas.width = 1;
            captureCanvas.height = 1;
          }
        }
        if (atlasBytes > PRINT_ATLAS_MAX_TOTAL_BYTES) {
          throw new Error('print atlas is outside the total size limit');
        }
        const metadata = printAtlasPageMetadata(printMap, page);
        const renderedCenter = printMap.getCenter();
        pages.push({
          dataUrl,
          width: captureWidth,
          height: captureHeight,
          role: page.role,
          ...(page.sheetId ? { sheetId: page.sheetId } : {}),
          ...(page.title ? { title: page.title } : {}),
          projection: (
            renderedProjection && renderedProjection.type
          ) || page.projection,
          center: [
            normalizedAtlasLongitude(renderedCenter.lng),
            Math.max(-90, Math.min(90, renderedCenter.lat)),
          ],
          zoom: printMap.getZoom(),
          bearing: printMap.getBearing(),
          pitch: printMap.getPitch(),
          containsAstrology: true,
          ...metadata,
        });
      }
      const attribution = USE_LOCAL_BASEMAP
        ? PRINT_LOCAL_ATTRIBUTION
        : PRINT_BASEMAP_ATTRIBUTION;
      const result = {
        pages,
        attribution,
      };
      perfState.printCaptureCount += 1;
      perfState.printCaptureLastMs = performance.now() - startedAt;
      perfState.printCaptureLastBytes = pages.reduce((total, page) => (
        total + Math.floor(
          (page.dataUrl.length - page.dataUrl.indexOf(',') - 1) * 0.75,
        )
      ), 0);
      postPerfSnapshot('print-atlas');
      return result;
    } finally {
      if (printMap) {
        try { printMap.remove(); } catch (_) {}
      }
      host.remove();
    }
  }

    if (coords.length >= 2 && typeof coords[0] === 'number' && typeof coords[1] === 'number') {
      visitor(coords);

  function minimalWrappedLongitudeBounds(longitudes) {
    const values = (Array.isArray(longitudes) ? longitudes : [])
      .map((value) => ((Number(value) % 360) + 360) % 360)
      .filter(Number.isFinite)
      .sort((a, b) => a - b);
    if (!values.length) return null;
    if (values.length === 1) {
      const lon = values[0] > 180 ? values[0] - 360 : values[0];
      return [lon, lon];
    }
    let largestGap = -1;
    let gapIndex = 0;
    for (let index = 0; index < values.length; index += 1) {
      const next = index + 1 < values.length ? values[index + 1] : values[0] + 360;
      const gap = next - values[index];
      if (gap > largestGap) {
        largestGap = gap;
        gapIndex = index;
      }
    }
    const startIndex = (gapIndex + 1) % values.length;
    let west = values[startIndex];
    let east = values[gapIndex];
    if (east < west) east += 360;
    if (west > 180) {
      west -= 360;
      east -= 360;
    }
    return [west, east];
  }

  function fitFeatureCollection(geojson) {
    if (!map || !geojson || !(geojson.features || []).length) return;
    const longitudes = [];
    let minLat = Infinity, maxLat = -Infinity;
    let focus = null;
    for (const feature of geojson.features || []) {
      if (!feature.geometry) continue;
      const properties = feature.properties || {};
      if (
        properties.kind === 'ECLIPSE_MAX' &&
        feature.geometry.type === 'Point' &&
        Array.isArray(feature.geometry.coordinates)
      ) {
        const lon = Number(feature.geometry.coordinates[0]);
        const lat = Number(feature.geometry.coordinates[1]);
        if (Number.isFinite(lon) && Number.isFinite(lat)) focus = [lon, lat];
      }
      forEachGeojsonCoord(feature.geometry.coordinates, (coord) => {
        const lon = Number(coord[0]);
        const lat = Number(coord[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
        longitudes.push(lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
    }
    const longitudeBounds = minimalWrappedLongitudeBounds(longitudes);
    if (!longitudeBounds || !Number.isFinite(minLat)) return;
    const [minLon, maxLon] = longitudeBounds;
    if ((maxLon - minLon) > 300) {
      map.easeTo({
        center: focus || [((minLon + maxLon + 540) % 360) - 180, (minLat + maxLat) / 2],
        zoom: globeZoomForViewport(),
        duration: 400,
      });
      return;
    }
    try {
      const bounds = [[minLon, minLat], [maxLon, maxLat]];
      const fitOptions = {
        padding: 72,
        maxZoom: 4.5,
      };
      const camera = typeof map.cameraForBounds === 'function'
        ? map.cameraForBounds(bounds, fitOptions)
        : null;
      if (focus && camera && Number.isFinite(camera.zoom)) {
        map.easeTo({ center: focus, zoom: camera.zoom, duration: 500 });
      } else {
        map.fitBounds(bounds, { ...fitOptions, duration: 500 });
      }
    } catch (_) {}
  }

  function perfNow() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function percentile(values, p) {
    if (!values.length) return 0;
    const sorted = values.slice().sort((a, b) => a - b);
    const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
    return sorted[index];
  }

  function setPerfTileSource(source) {
    perfState.tileSource = source;
  }

  function recordRenderFrame() {
    if (!ACG_PERF_MODE) return;
    const now = perfNow();
    // MapLibre renders on demand. An interval between two otherwise idle
    // render callbacks is not a dropped frame, so only sample cadence while a
    // continuous move/zoom burst is active.
    if (activeMapMotionPhases.size === 0) {
      perfLastRenderAt = 0;
      perfState.renderFrames += 1;
      return;
    }
    if (perfLastRenderAt > 0) {
      const delta = now - perfLastRenderAt;
      perfState.lastFrameMs = delta;
      perfState.maxFrameMs = Math.max(perfState.maxFrameMs, delta);
      if (delta > 34) perfState.longFrames += 1;
      perfState.frameSamples.push(delta);
      if (perfState.frameSamples.length > 240) perfState.frameSamples.shift();
    }
    perfLastRenderAt = now;
    perfState.renderFrames += 1;
  }

  function getPerfState() {
    const frames = perfState.frameSamples;
    const frameTotal = frames.reduce((acc, value) => acc + value, 0);
    const avgFrameMs = frames.length ? frameTotal / frames.length : 0;
    return {
      enabled: perfState.enabled,
      hasLocalTiles: perfState.hasLocalTiles,
      forceLocalTiles: perfState.forceLocalTiles,
      tileSource: perfState.tileSource,
      mapLoadMs: perfState.mapLoadMs,
      moveEvents: perfState.moveEvents,
      zoomEvents: perfState.zoomEvents,
      resizeEvents: perfState.resizeEvents,
      renderFrames: perfState.renderFrames,
      longFrames: perfState.longFrames,
      lastFrameMs: perfState.lastFrameMs,
      avgFrameMs,
      p95FrameMs: percentile(frames, 95),
      maxFrameMs: perfState.maxFrameMs,
      runtimeSceneDeferredPushes: perfState.runtimeSceneDeferredPushes,
      runtimeSceneCoherentFlushes: perfState.runtimeSceneCoherentFlushes,
      polarOverlayPathCount: perfState.polarOverlayPathCount,
      polarOverlayDraws: perfState.polarOverlayDraws,
      polarOverlayLastMs: perfState.polarOverlayLastMs,

      elapsedMs: perfNow() - perfStartedAt,
