[package]
name = "aries"
version = "0.1.0"
description = "Aries — astrology desktop app (Tauri shell)"
authors = ["Max Lange"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/primum-mobile/aries"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aries_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[profile.release]
codegen-units = 1
lto = true
overflow-checks = true
panic = "abort"
strip = "symbols"

[lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
ed25519-dalek = "=2.1.1"
getrandom = "0.2"
keyring = { version = "3.6.3", default-features = false }
log = "0.4"
# Blocking HTTP client used for the local startup menu fetch and the remote
# license/update contract. The latter requires rustls-backed HTTPS.
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
tauri = { version = "2.11.2", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.52.3", features = ["io-util", "net", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSCell", "NSColor", "NSColorSampler", "NSColorSpace", "NSControl", "NSView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSString", "NSUserDefaults"] }
security-framework = "=3.0.1"
security-framework-sys = "=2.12.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
