[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aries"
version = "1.0.0b1"
description = "Aries - prerelease traditional astrology program"
readme = "README.md"
authors = [
  {name = "Max Lange", email = "contact@maxlange.cc"},
]
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "wxPython>=4.2.0",
  "numpy>=2.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
geo = [
  "timezonefinder>=6.0",
]
opt = [
]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.0",
  "setuptools>=61",
  "wheel",
  "fonttools>=4.0",
  "brotli>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["aries/astrology/transit_fast/tests"]
pythonpath = ["SWEP/src"]
